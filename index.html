<!DOCTYPE html> 
<html lang="bn">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width,initial-scale=1">  
<meta name="theme-color" content="#183e70">  
<title>SHREE ERP — Business Management</title>  
<style>  
:root{--navy:#183e70;--blue:#245a96;--light:#eaf1fa;--line:#9eafc5;--bg:#cbd5e2}  
*{box-sizing:border-box}  
body{margin:0;background:var(--bg);font:12px Tahoma,Arial,sans-serif;color:#172b45}  
button,input,select,textarea{font:inherit}  
button{cursor:pointer}  
button:focus,input:focus,select:focus,textarea:focus{outline:2px solid #2469c8;outline-offset:1px}  
.app{width:100%;max-width:1920px;margin:auto;background:#e9eef5;min-height:100vh;border:1px solid #526b89}  
.titlebar{background:linear-gradient(#426da3,#183e70);color:#fff;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}  
.brand{font-weight:bold;font-size:18px;letter-spacing:.6px}.brand small{display:block;font-size:10px;font-weight:normal;margin-top:3px}  
.title-actions,.toolbar,.form-actions{display:flex;gap:5px;flex-wrap:wrap}  
.btn{border:1px solid #8b9db3;background:linear-gradient(#fff,#dbe5f1);padding:6px 10px;color:#16395f;border-radius:2px;font-weight:bold}  
.btn:hover{background:linear-gradient(#fff3cc,#f7d77c)}  
.btn.primary{background:linear-gradient(#467db8,#1d4c80);color:white;border-color:#173c67}  
.btn.danger{color:#a00000}.btn.small{padding:4px 7px}  
.menubar{display:flex;flex-wrap:wrap;background:#dce6f2;border-bottom:1px solid #8098b6}  
.menubar button{border:0;border-right:1px solid #c1cedd;background:transparent;padding:9px 10px;color:#17385f}  
.menubar button:hover,.menubar button.active{background:white;font-weight:bold}  
.toolbar{padding:7px;background:#edf2f8;border-bottom:1px solid #a9b8ca}  
.workspace{display:grid;grid-template-columns:205px minmax(0,1fr) 205px;gap:8px;padding:8px;min-height:70vh;align-items:start}  
.panel{border:1px solid #9eafc5;background:#f7f9fc;min-width:0}  
.panel-title{padding:8px;background:linear-gradient(#edf4fc,#cbd9e9);border-bottom:1px solid #9eafc5;font-weight:bold;color:#193f6d}  
.side-link{display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-bottom:1px solid #e0e6ed;background:#f8faff;color:#203d60}  
.side-link:hover,.side-link.active{background:#d9e8f9;color:#123e76;font-weight:bold}  
.center{min-width:0}.statusline{background:#e4ebf4;border-top:1px solid #9eafc5;padding:7px 10px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}  
.view-head{padding:10px;background:#e3ebf6;border:1px solid #9eafc5;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}  
h2{font-size:16px;margin:0;color:#183e70}h3{font-size:13px;margin:0 0 10px;color:#183e70}  
.banner{padding:18px;background:linear-gradient(115deg,#173b69,#3979b8);color:white;border:1px solid #12345c;margin-bottom:8px}  
.banner h2{color:white;font-size:22px;margin-bottom:7px}.banner p{margin:0;line-height:1.6}  
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:8px}  
.stat{border:1px solid #a6b7ca;background:white;padding:12px 9px}.stat .label{color:#586b82;margin-bottom:7px}  
.stat strong{font-size:19px;color:#1c4779}.stat:nth-child(2){background:#eef7e9}.stat:nth-child(3){background:#fff5dc}.stat:nth-child(4){background:#e8f2ff}  
.card{background:white;border:1px solid #a6b7ca;padding:12px;margin-bottom:8px}  
.quickgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.quickgrid button{min-height:39px}  
.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}  
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field label{font-weight:bold;color:#304a68}  
.field input,.field select,.field textarea,.searchbox{width:100%;padding:7px;border:1px solid #9eafc5;background:white;border-radius:0;min-width:0}  
.field input,.field select{min-height:30px}.field textarea{min-height:65px;resize:vertical}  
.table-wrap{overflow:auto;border:1px solid #a5b4c6;background:white;max-width:100%}  
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}  
th{background:linear-gradient(#eaf1fa,#cbd9e9);color:#173b67;text-align:left;font-weight:bold}  
th,td{border:1px solid #c4cfdd;padding:7px 8px}  
tbody tr:nth-child(even){background:#f0f5fb}tbody tr:hover{background:#fff1c9}  
.empty{text-align:center;color:#66788c;padding:25px}.notice{padding:9px;border:1px solid #a4b7cb;background:#edf4fc;margin-bottom:8px;line-height:1.5}  
.right-box{padding:8px;border-bottom:1px solid #e0e6ed}.right-box button{width:100%;margin-bottom:5px;text-align:left}  
.muted{color:#6a7c91}.total-box{background:#edf3fa;border:1px solid #a5b4c6;padding:10px;text-align:right;font-weight:bold}  
.hidden{display:none!important}.bill-grid{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:8px}  
.bill-type{background:#d5e3f4;border:1px solid #9eafc5;padding:9px 12px;margin-bottom:8px;color:#173b67}  
.bill-item-box{border:1px solid #9eafc5;background:#f3f6fa;padding:12px;margin:10px 0}  
.warning{color:#a11;font-weight:bold}.success{color:#17602b;font-weight:bold}  
.modal-bg{position:fixed;inset:0;background:#0008;z-index:999;display:flex;align-items:center;justify-content:center;padding:12px}  
.modal{box-shadow:0 10px 40px #0005;max-width:100%;overflow:auto;max-height:90vh}  /* MARG-inspired compact SALE ENTRY */
.sale-window{border:1px solid #6f88a6;background:#dfe8f3;margin-bottom:9px;box-shadow:inset 0 0 0 1px #fff}
.sale-title{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:linear-gradient(#4676aa,#183e70);color:white;padding:8px 10px;font-weight:bold}
.sale-title strong{font-size:14px;letter-spacing:.3px}
.sale-title span{font-size:11px}
.sale-strip{display:flex;gap:5px;flex-wrap:wrap;background:#d5e1ef;border-bottom:1px solid #9eafc5;padding:6px}
.sale-strip span{padding:4px 7px;border:1px solid #a7b7c9;background:#f8fbff;font-weight:bold;color:#183e70}
.sale-section-title{background:linear-gradient(#eef4fb,#cbd9e9);border-bottom:1px solid #a8b8ca;padding:7px 9px;font-weight:bold;color:#183e70}
.sale-details{padding:10px;background:#f8faff;border-bottom:1px solid #a8b8ca}
.sale-details .formgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.sale-details .field label{font-size:11px}
.sale-details .field input,.sale-details .field select{padding:5px 6px;min-height:28px}
.sale-details .field input[readonly]{background:#edf1f6;color:#53677d}
.sale-entry-grid{padding:9px;background:#e8eef6}
.sale-entry-grid .bill-grid{grid-template-columns:repeat(6,minmax(85px,1fr));gap:6px}
.sale-entry-grid .field label{font-size:11px}
.sale-entry-grid .field input{min-height:29px;padding:5px 6px}
.sale-entry-grid .field input[readonly]{background:#edf1f6}
.sale-actions{display:flex;gap:5px;flex-wrap:wrap;padding:7px 9px;background:#d5e1ef;border-top:1px solid #a8b8ca}
.sale-actions .btn{padding:6px 11px}
.sale-register{background:white;border:1px solid #a6b7ca;padding:10px;margin-bottom:8px}
.sale-register .view-head{margin-bottom:7px}
.sale-grid-wrap{overflow:auto;border:1px solid #91a5bd;background:white}
.sale-grid-wrap table{min-width:940px}
.sale-grid-wrap th,.sale-grid-wrap td{padding:6px 7px}
.sale-grid-wrap input{width:100%;min-width:55px;border:1px solid #9eafc5;padding:5px}
.sale-totals{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,330px);gap:10px;align-items:start;margin-top:8px}
.sale-info{border:1px solid #a6b7ca;background:#f6f9fd;padding:9px;line-height:1.8}
.sale-total-panel{border:1px solid #91a5bd;background:#edf3fa;padding:10px;text-align:right;font-weight:bold;line-height:1.9}
.sale-total-panel .net{font-size:18px;border-top:1px solid #9eafc5;margin-top:5px;padding-top:5px;color:#183e70}
.sale-shortcuts{font-size:11px;background:#e1eaf5;border:1px solid #b1c0d1;padding:7px 9px;color:#405875;line-height:1.7}
.sale-shortcuts b{color:#183e70}
@media(max-width:1250px){.workspace{grid-template-columns:175px minmax(0,1fr)}.right-panel{display:none}.bill-grid{grid-template-columns:repeat(3,minmax(110px,1fr))}.sale-entry-grid .bill-grid{grid-template-columns:repeat(3,minmax(95px,1fr))}}
@media(max-width:850px){.workspace{grid-template-columns:minmax(0,1fr)}.left-panel{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.quickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.bill-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sale-details .formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.sale-totals{grid-template-columns:minmax(0,1fr)}}
@media(max-width:480px){.bill-grid,.formgrid{grid-template-columns:minmax(0,1fr)}.titlebar{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.banner{padding:12px}.banner h2{font-size:19px}.sale-entry-grid .bill-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sale-details .formgrid{grid-template-columns:minmax(0,1fr)}.sale-title{align-items:flex-start;flex-direction:column}.sale-grid-wrap table{min-width:850px}}
@media print{body{background:white}.titlebar,.menubar,.toolbar,.left-panel,.right-panel,.statusline,.view-head .btn,.form-actions,.no-print,.sale-actions,.sale-strip,.sale-shortcuts{display:none!important}.workspace{display:block;padding:0}.app{border:0}.card{break-inside:avoid}}
</style>

</head>  
<body>  
<div class="app">  
<header class="titlebar">  
 <div class="brand">▦ SHREE ERP <small>BUSINESS MANAGEMENT SYSTEM</small></div>  
 <div class="title-actions"><button class="btn" onclick="go('company')">Company</button><button class="btn" onclick="go('settings')">Settings</button></div>  
</header>  
<nav class="menubar">  
 <button data-view="dashboard" onclick="go('dashboard')">Dashboard</button>  
 <button data-view="items" onclick="go('items')">Masters</button>  
 <button data-view="retail" onclick="go('retail')">Retail Billing</button>  
 <button data-view="wholesale" onclick="go('wholesale')">Wholesale Billing</button>  
 <button data-view="receipt" onclick="go('receipt')">Accounts</button>  
 <button data-view="reports" onclick="go('reports')">Final Reports</button>  
 <button data-view="gst" onclick="go('gst')">GST</button>  
 <button data-view="stock" onclick="go('stock')">Stocks</button>  
 <button data-view="daily" onclick="go('daily')">Daily Reports</button>  
 <button data-view="ledger" onclick="go('ledger')">Ledger</button>  
</nav>  
<div class="toolbar">  
 <button class="btn primary" onclick="go('retail')">＋ Retail Bill (F4)</button>  
 <button class="btn primary" onclick="go('wholesale')">＋ Wholesale Bill</button>  
 <button class="btn" onclick="go('purchase')">＋ Purchase</button>  
 <button class="btn" onclick="go('items')">Item Master</button>  
 <button class="btn" onclick="go('parties')">Party Master</button>  
 <button class="btn" onclick="go('stock')">Stock / Expiry</button>  
 <button class="btn" onclick="go('ledger')">Ledger</button>  
 <button class="btn" onclick="backup()">⇩ Backup</button>  
</div>  
<div class="workspace">  
<aside class="panel left-panel">  
 <div class="panel-title">☷ Navigation</div>  
 <button class="side-link" data-side="dashboard" onclick="go('dashboard')">⌂ Dashboard</button>  
 <div class="panel-title">MASTERS</div>  
 <button class="side-link" data-side="items" onclick="go('items')">▤ Item Master</button>  
 <button class="side-link" data-side="parties" onclick="go('parties')">♙ Party Master</button>  
 <button class="side-link" data-side="company" onclick="go('company')">▣ Company</button>  
 <div class="panel-title">TRANSACTIONS</div>  
 <button class="side-link" data-side="retail" onclick="go('retail')">₹ Retail Sales</button>  
 <button class="side-link" data-side="wholesale" onclick="go('wholesale')">▦ Wholesale Sales</button>  
 <button class="side-link" data-side="purchase" onclick="go('purchase')">＋ Purchase</button>  
 <button class="side-link" data-side="receipt" onclick="go('receipt')">↓ Receipt</button>  
 <button class="side-link" data-side="payment" onclick="go('payment')">↑ Payment</button>  
 <div class="panel-title">REPORT CENTRE</div>  
 <button class="side-link" data-side="stock" onclick="go('stock')">▤ Stock Summary</button>  
 <button class="side-link" data-side="expiry" onclick="go('expiry')">⌛ Batch / Expiry</button>  
 <button class="side-link" data-side="ledger" onclick="go('ledger')">▥ Party Ledger</button>  
 <button class="side-link" data-side="reports" onclick="go('reports')">▥ Final Reports</button>  
 <button class="side-link" data-side="daily" onclick="go('daily')">▧ Daily Reports</button>  
 <button class="side-link" data-side="gst" onclick="go('gst')">▦ GST Reports</button>  
</aside>  
<main class="center" id="main"></main>  
<aside class="panel right-panel">  
 <div class="panel-title">⚡ Quick Access</div>  
 <div class="right-box"><h3>Transactions</h3>  
 <button class="btn" onclick="go('retail')">New Retail Sale (F4)</button>  
 <button class="btn" onclick="go('wholesale')">New Wholesale Sale</button>  
 <button class="btn" onclick="go('purchase')">New Purchase</button>  
 <button class="btn" onclick="go('receipt')">Receive Payment</button>  
 <button class="btn" onclick="go('payment')">Make Payment</button></div>  
 <div class="right-box"><h3>Masters & Reports</h3>  
 <button class="btn" onclick="go('items')">Item Master</button>  
 <button class="btn" onclick="go('parties')">Party Master</button>  
 <button class="btn" onclick="go('ledger')">Party Ledger</button>  
 <button class="btn" onclick="go('expiry')">Batch / Expiry</button></div>  
 <div class="right-box"><h3>Data Tools</h3>  
 <button class="btn" onclick="backup()">Export Backup</button>  
 <button class="btn" onclick="$('restoreFile').click()">Import Backup</button>  
 <input type="file" id="restoreFile" accept=".json,application/json" hidden onchange="restoreBackup(event)">  
 <p class="muted">Data is saved in this browser.</p></div>  
</aside>  
</div>  
<div class="statusline"><span id="statusCompany">Company: My Business</span><span id="statusText">Ready</span><span id="statusDate"></span><span>F2 Party · F3 Rename · F4 Retail · Esc Home</span></div>  
</div>  
<div id="modalRoot"></div>  
<script>  
"use strict";  
const KEY="shree_erp_purple_v2";  
const $=id=>document.getElementById(id);  
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));  
const money=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});  
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);  
const today=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};  
const num=v=>Number.isFinite(Number(v))?Number(v):0;  
const cleanQty=v=>Math.max(0,num(v));  
const blank=()=>({company:{name:"My Business",address:"",phone:"",gstin:""},items:[],parties:[],bills:[],receipts:[],payments:[],purchases:[],batches:[]});  function normalizeDB(s){
const d=blank();
if(s&&typeof s==="object"){d.company={...d.company,...(s.company||{})};["items","parties","bills","receipts","payments","purchases","batches"].forEach(k=>d[k]=Array.isArray(s[k])?s[k]:[])}
d.items=d.items.filter(x=>x&&typeof x==="object").map(x=>({...x,id:String(x.id||uid()),qty:cleanQty(x.qty)}));
d.parties=d.parties.filter(Boolean).map(x=>({...x,id:String(x.id||uid())}));
["bills","receipts","payments","purchases"].forEach(k=>d[k]=d[k].filter(Boolean).map(x=>({...x,id:String(x.id||uid())})));
d.batches=d.batches.filter(Boolean).map(x=>({...x,id:String(x.id||uid()),itemId:String(x.itemId||""),batch:String(x.batch||"NO BATCH"),expiry:String(x.expiry||""),qty:cleanQty(x.qty),rate:cleanQty(x.rate),mrp:cleanQty(x.mrp)}));
if(!d.batches.length)d.items.forEach(i=>{if(i.qty>0)d.batches.push({id:uid(),itemId:i.id,batch:"OPENING",expiry:"",qty:i.qty,rate:cleanQty(i.purchaseRate),mrp:cleanQty(i.mrp||i.rate),opening:true})});
d.items.forEach(i=>{let sum=d.batches.filter(b=>b.itemId===i.id).reduce((s,b)=>s+cleanQty(b.qty),0);if(i.qty>sum+0.000001)d.batches.push({id:uid(),itemId:i.id,batch:"OPENING ADJUSTMENT",expiry:"",qty:i.qty-sum,rate:cleanQty(i.purchaseRate),mrp:cleanQty(i.mrp||i.rate),opening:true});i.qty=d.batches.filter(b=>b.itemId===i.id).reduce((s,b)=>s+cleanQty(b.qty),0)});
return d;
}
function load(){try{let r=localStorage.getItem(KEY);return r?normalizeDB(JSON.parse(r)):blank()}catch(e){return blank()}}
let db=load(),view="dashboard",editId=null,draftLines=[],ledgerParty="";
function reconcileItem(id){let i=db.items.find(x=>x.id===id);if(i)i.qty=db.batches.filter(b=>b.itemId===id).reduce((s,b)=>s+cleanQty(b.qty),0)}
function reconcileAll(){db.items.forEach(i=>reconcileItem(i.id))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));$("statusText").textContent="Saved successfully"}catch(e){$("statusText").textContent="Save failed";alert("Storage-এ জায়গা নেই। আগে Backup নাও।")}updateStatus()}
function updateStatus(){$("statusCompany").textContent="Company: "+(db.company.name||"My Business");$("statusDate").textContent=new Date().toLocaleDateString("en-IN")}
function go(v){view=v;editId=null;draftLines=[];document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));document.querySelectorAll("[data-side]").forEach(b=>b.classList.toggle("active",b.dataset.side===v));render();window.scrollTo({top:0,behavior:"smooth"})}
function head(t,s=""){return <div class="view-head"><div><h2>${esc(t)}</h2><div class="muted">${esc(s)}</div></div><button class="btn" onclick="go('dashboard')">⌂ Home</button></div>}
function stat(l,v){return <div class="stat"><div class="label">${esc(l)}</div><strong>${v}</strong></div>}
function table(h,r,empty="No records found"){return <div class="table-wrap"><table><thead><tr>${h.map(x=><th>${x}</th>).join("")}</tr></thead><tbody>${r||<tr><td class="empty" colspan="${h.length}">${empty}</td></tr>}</tbody></table></div>}
function render(){
updateStatus();let m=$("main");
if(view==="dashboard")m.innerHTML=dashboard();
else if(view==="items")m.innerHTML=itemsPage();
else if(view==="parties")m.innerHTML=partiesPage();
else if(view==="company")m.innerHTML=companyPage();
else if(view==="settings")m.innerHTML=settingsPage();
else if(["retail","wholesale","purchase"].includes(view))m.innerHTML=transactionPage(view);
else if(["receipt","payment"].includes(view))m.innerHTML=accountPage(view);
else if(view==="stock")m.innerHTML=stockPage();
else if(view==="expiry")m.innerHTML=expiryPage();
else if(view==="ledger")m.innerHTML=ledgerPage();
else if(["reports","daily","gst","links"].includes(view))m.innerHTML=reportsPage(view);
else m.innerHTML=dashboard();
}
function dashboard(){
let todaySales=db.bills.filter(b=>b.date===today()).reduce((s,b)=>s+num(b.total),0),sales=db.bills.reduce((s,b)=>s+num(b.total),0),purchases=db.purchases.reduce((s,b)=>s+num(b.total),0),stock=db.items.reduce((s,i)=>s+num(i.qty),0);
let recent=[...db.bills.map(x=>({...x,kind:x.kind==="wholesale"?"Wholesale":"Retail"})),...db.purchases.map(x=>({...x,kind:"Purchase"}))].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,8);
return ${head("Business Dashboard","SHREE ERP · Desktop Edition")}<div class="banner"><h2>Welcome to SHREE ERP</h2><p>Business Management System<br>Masters · Retail Billing · Wholesale Billing · Batch Stock · Accounts · Reports</p></div><div class="stats">${stat("Today's Sales",money(todaySales))}${stat("Total Sales",money(sales))}${stat("Total Purchase",money(purchases))}${stat("Items / Stock",db.items.length+" / "+stock)}</div><div class="card"><h3>Quick Transactions</h3><div class="quickgrid"><button class="btn primary" onclick="go('retail')">Retail Bill (F4)</button><button class="btn primary" onclick="go('wholesale')">Wholesale Bill</button><button class="btn" onclick="go('purchase')">Purchase Entry</button><button class="btn" onclick="go('receipt')">Receipt Entry</button><button class="btn" onclick="go('payment')">Payment Entry</button><button class="btn" onclick="go('items')">Item Master</button><button class="btn" onclick="go('parties')">Party Master (F2)</button><button class="btn" onclick="go('stock')">Stock Summary</button><button class="btn" onclick="go('ledger')">Party Ledger</button><button class="btn" onclick="go('expiry')">Expiry Alerts</button><button class="btn" onclick="go('reports')">Final Reports</button><button class="btn" onclick="backup()">Backup</button></div></div><div class="card"><h3>Recent Transactions</h3>${table(["Date","Type","Voucher No.","Party","Amount"],recent.map(x=><tr><td>${esc(x.date)}</td><td>${esc(x.kind)}</td><td>${esc(x.no)}</td><td>${esc(x.party)}</td><td>${money(x.total)}</td></tr>).join(""),"No transactions yet")}</div><div class="notice">Keyboard: F2 Party · F3 Rename Party · F4 Retail Billing · Esc Dashboard · Enter Next Field</div>;
}

/* ITEM MASTER */
function itemsPage(){
let q=($("itemSearch")?.value||"").toLowerCase(),list=db.items.filter(x=>[x.name,x.code,x.barcode,x.company,x.type].some(v=>String(v||"").toLowerCase().includes(q)));

function searchBillItem(){
let el=$("lineSearch"),raw=el?.value.trim().toLowerCase();if(!raw){if($("lineItem"))$("lineItem").value="";return}
let fields=i=>[i.name,i.code,i.barcode,i.id].map(v=>String(v||"").toLowerCase()).filter(Boolean);
let exact=db.items.filter(i=>fields(i).some(v=>v===raw));
let matches=exact.length?exact:db.items.filter(i=>fields(i).some(v=>v.startsWith(raw)));
if(!matches.length)matches=db.items.filter(i=>fields(i).some(v=>v.includes(raw)));
if(matches.length!==1){$("lineItem").value="";return}
$("lineItem").value=matches[0].id;fillLineRate();
}
function currentItem(){return db.items.find(i=>i.id===$("lineItem")?.value)}

function fillLineRate(){
let i=currentItem();if(!i)return;
$("lineSearch").value=i.barcode||i.code||i.name;$("linePack").value=i.unit||"PCS";
$("lineRate").value=view==="purchase"?(i.purchaseRate||i.rate||0):(i.rate||0);
if($("lineMrp"))$("lineMrp").value=i.mrp||i.rate||0;
let bs=itemBatches(i.id);$("batchHints").innerHTML=bs.map(b=><option value="${esc(b.batch)}"></option>).join("");
let typed=$("lineBatch").value.trim(),b=bs.find(x=>x.batch.toLowerCase()===typed.toLowerCase())||bs[0];
if(b){$("lineBatch").value=b.batch||"";$("lineExpiry").value=b.expiry||"";$("lineStock").value=cleanQty(b.qty)}
else{$("lineBatch").value="";$("lineExpiry").value="";$("lineStock").value=view==="purchase"?cleanQty(i.qty):0}
calcLinePreview();
}
function selectBillBatch(){

function calcLinePreview(){

let q=cleanQty($("lineQty").value),r=cleanQty($("lineRate").value),d=Math.min(100,cleanQty($("lineDist")?.value)),disc=cleanQty($("lineDiscount").value),g=Math.min(100,cleanQty($("lineGst").value));
let gross=qr*(1-d/100),base=Math.max(0,gross-disc),tax=baseg/100;$("linePreview").value=money(base+tax);
}

["lineItem","lineSearch","linePack","lineBatch","lineExpiry","lineFree","lineRate","lineMrp","lineMbp","lineDist","lineDiscount","lineGst"].forEach(id=>{if($(id))$(id).value=["lineFree","lineRate","lineMrp","lineMbp","lineDist","lineDiscount","lineGst"].includes(id)?"0":""});

function addBillLine(kind){

let q=num($("lineQty").value),free=num($("lineFree")?.value),r=num($("lineRate").value),dist=num($("lineDist")?.value),disc=num($("lineDiscount").value),gst=num($("lineGst").value);
if(q<=0||r<0||free<0||dist<0||dist>100||disc<0||gst<0||gst>100)return alert("Qty, Rate, Discount বা GST পরীক্ষা করো।");
let gross=qr*(1-dist/100);if(disc>gross+0.000001)return alert("Line discount, line-এর gross amount-এর চেয়ে বেশি হতে পারবে না।");
let batch=null,typed=$("lineBatch").value.trim(),expiry=$("lineExpiry").value;
if(kind!=="purchase"){
let bs=itemBatches(i.id);batch=typed?bs.find(b=>String(b.batch).toLowerCase()===typed.toLowerCase()):bs[0];
if(!batch)return alert("এই পণ্যের available batch নেই। Purchase Entry-তে stock যোগ করো।");
if(batch.expiry&&daysToExpiry(batch.expiry)<0)return alert("মেয়াদোত্তীর্ণ Batch বিক্রি করা যাবে না।");
if(expiry&&batch.expiry&&expiry!==batch.expiry)return alert("Batch-এর expiry date মিলছে না।");
let already=draftLines.filter(l=>l.batchId===batch.id).reduce((s,l)=>s+l.qty+l.free,0);
if(cleanQty(batch.qty)<already+q+(kind==="retail"?0:free))return alert("Batch stock পর্যাপ্ত নেই। Available: "+cleanQty(batch.qty));
expiry=batch.expiry||expiry;
}else if(!typed)return alert("Purchase-এর জন্য Batch লিখো। না থাকলে NO BATCH লিখতে পারো।");
let base=Math.max(0,gross-disc),tax=basegst/100;
draftLines.push({id:uid(),itemId:i.id,item:i.name,pack:$("linePack").value.trim()||i.unit||"PCS",batchId:batch?.id||"",batch:typed||(batch?.batch)||"NO BATCH",expiry,qty:q,free:kind==="retail"?0:free,rate:r,dist,discount:disc,gst,tax,mrp:num($("lineMrp")?.value)||i.mrp||i.rate||0,mbp:num($("lineMbp")?.value),amount:base+tax});
renderDraftLinesIntoPage();clearLineForm();updateBillTotal();
}
function renderDraftLines(){
if(!draftLines.length)return <div class="empty">উপরের Item Entry থেকে পণ্য যোগ করো।</div>;
return <div class="sale-grid-wrap"><table><thead><tr>${["#","Product","Pack","Batch","Expiry","Qty","Free","Rate","Dist %","Discount","GST","Amount","Action"].map(x=><th>${x}</th>).join("")}</tr></thead><tbody>${draftLines.map((x,n)=><tr><td>${n+1}</td><td>${esc(x.item)}</td><td>${esc(x.pack)}</td><td>${esc(x.batch||"—")}</td><td>${esc(x.expiry||"—")}</td><td>${x.qty}</td><td>${x.free}</td><td>${money(x.rate)}</td><td>${x.dist||0}%</td><td>${money(x.discount)}</td><td>${x.gst}%</td><td><b>${money(x.amount)}</b></td><td><button class="btn danger small" type="button" onclick="removeBillLine('${x.id}')">Remove</button></td></tr>).join("")}</tbody></table></div>;

function renderDraftLinesIntoPage(){if($("draftLineTable"))$("draftLineTable").innerHTML=renderDraftLines()}
function removeBillLine(id){draftLines=draftLines.filter(x=>x.id!==id);renderDraftLinesIntoPage();updateBillTotal()}
function getLineTotals(){
let subtotal=draftLines.reduce((s,x)=>s+Math.max(0,x.qtyx.rate*(1-x.dist/100)-x.discount),0),gst=draftLines.reduce((s,x)=>s+x.tax,0),discount=cleanQty($("tBillDiscount")?.value),round=num($("tRound")?.value);
return{subtotal,gst,billDiscount:discount,round,total:Math.max(0,subtotal+gst-discount+round)};
}
function updateBillTotal(){
if(!$("tTotal"))return;let t=getLineTotals();$("tSubtotal").textContent=money(t.subtotal);$("tGstTotal").textContent=money(t.gst);$("tDiscountShow").textContent=money(t.billDiscount);$("tRoundShow").textContent=money(t.round);$("tTotal").textContent=money(t.total);
let s=$("saleSummary");if(s)s.textContent=Items: ${draftLines.length} · Total Qty: ${draftLines.reduce((a,l)=>a+l.qty,0)} · GST: ${money(t.gst)} · Net: ${money(t.total)};
}
function showPartyInfo(){let p=db.parties.find(x=>x.name===$("tParty")?.value);if($("tAddress"))$("tAddress").value=p?.address||"";if($("tMobile"))$("tMobile").value=p?.phone||"";if($("tGstin"))$("tGstin").value=p?.gstin||""}
function normalizedBatchName(v){return String(v||"").trim()||"NO BATCH"}
function findOrCreateBatch(l){
let name=normalizedBatchName(l.batch),expiry=String(l.expiry||"");
let b=db.batches.find(x=>x.itemId===l.itemId&&normalizedBatchName(x.batch).toLowerCase()===name.toLowerCase()&&String(x.expiry||"")===expiry);
if(!b){b={id:uid(),itemId:l.itemId,batch:name,expiry,qty:0,rate:cleanQty(l.rate),mrp:cleanQty(l.mrp)};db.batches.push(b)}

function saveTransaction(e,kind){
e.preventDefault();if(!draftLines.length)return alert("Bill-এ অন্তত একটি পণ্য যোগ করো।");
let purchase=kind==="purchase",key=purchase?"purchases":"bills",no=$("tNo").value.trim();
if(!no)return alert("Voucher number লিখো।");if(db[key].some(x=>String(x.no||"").toLowerCase()===no.toLowerCase()))return alert("এই voucher number আগে আছে।");

if(!purchase){
let required={};for(let l of draftLines){if(!l.batchId)return alert("Sales line-এ batch নির্বাচন করো।");required[l.batchId]=(required[l.batchId]||0)+l.qty+(kind==="retail"?0:l.free)}

}
let t=getLineTotals();if(t.billDiscount>t.subtotal+t.gst+.000001)return alert("Bill discount মোট বিলের চেয়ে বেশি।");
if(purchase)draftLines.forEach(l=>{let b=findOrCreateBatch(l);l.batchId=b.id;l.batch=normalizedBatchName(l.batch)});
let x={id:uid(),no,date:$("tDate").value,party:$("tParty").value||"Cash / Walk-in",kind,lines:draftLines.map(l=>({...l})),subtotal:t.subtotal,gstTotal:t.gst,discount:t.billDiscount,roundOff:t.round,total:t.total,address:$("tAddress")?.value||"",phone:$("tMobile")?.value||"",gstin:$("tGstin")?.value||"",doctor:$("tDoctor")?.value||"",regNo:$("tReg")?.value||"",patientId:$("tPatientId")?.value||"",reference:$("tReference")?.value||"",note:$("tNote")?.value||"",createdAt:new Date().toISOString()};
x.item=draftLines.map(l=>l.item).join(", ");x.qty=draftLines.reduce((s,l)=>s+l.qty,0);x.itemId=draftLines.length===1?draftLines[0].itemId:"";x.rate=draftLines.length===1?draftLines[0].rate:0;
if(purchase){draftLines.forEach(l=>{let b=db.batches.find(z=>z.id===l.batchId);if(b){b.qty=cleanQty(b.qty)+l.qty+l.free;b.rate=cleanQty(l.rate);b.mrp=cleanQty(l.mrp||b.mrp)}})}
else{let req={};draftLines.forEach(l=>req[l.batchId]=(req[l.batchId]||0)+l.qty+(kind==="retail"?0:l.free));Object.entries(req).forEach(([id,q])=>{let b=db.batches.find(x=>x.id===id);b.qty=cleanQty(b.qty-q)})}
reconcileAll();db[key].push(x);save();let printCopy={...x,company:{...db.company}};draftLines=[];render();

/* DELETE / BACKUP / RESTORE /
function recordLines(x){if(Array.isArray(x.lines))return x.lines;if(x.itemId)return [{itemId:x.itemId,batchId:"",batch:"",expiry:"",qty:num(x.qty),free:0,rate:num(x.rate)}];return []}
function resolveLineBatch(l){return db.batches.find(b=>l.batchId&&b.id===l.batchId)||db.batches.find(b=>b.itemId===l.itemId&&normalizedBatchName(b.batch).toLowerCase()===normalizedBatchName(l.batch).toLowerCase()&&String(b.expiry||"")===String(l.expiry||""))}
function deleteRecord(key,id){
let x=db[key]?.find(r=>r.id===id);if(!x)return;
if(key==="parties"){let name=x.name,used=["bills","purchases","receipts","payments"].some(k=>db[k].some(r=>r.party===name));if(used)return alert("এই Party-এর transaction history আছে। History নষ্ট না করতে Party delete করা হয়নি।")}
if(!confirm("এই record delete করবে?"))return;
if(key==="bills"||key==="purchases"){
let purchase=key==="purchases",lines=recordLines(x);
if(purchase){for(let l of lines){let b=resolveLineBatch(l),q=num(l.qty)+num(l.free);if(!b||b.qty+0.000001<q)return alert("Purchase-এর stock ইতিমধ্যে বিক্রি/ব্যবহৃত হয়েছে অথবা batch পাওয়া যাচ্ছে না। নিরাপদে delete করা হয়নি।")}}
if(!lines.length&&x.itemId)return alert("পুরোনো voucher-এর stock তথ্য অসম্পূর্ণ; delete করা হয়নি।");
lines.forEach(l=>{let q=num(l.qty)+(purchase?num(l.free):0),b=resolveLineBatch(l);if(purchase){if(b)b.qty=cleanQty(b.qty-q)}else{if(!b){b={id:uid(),itemId:l.itemId,batch:normalizedBatchName(l.batch||"RESTORED"),expiry:l.expiry||"",qty:0,rate:num(l.rate),opening:true};db.batches.push(b)}b.qty=cleanQty(b.qty+q)}});reconcileAll();
}
if(key==="items"){if(db.bills.some(b=>recordLines(b).some(l=>l.itemId===id))||db.purchases.some(b=>recordLines(b).some(l=>l.itemId===id)))return alert("এই item-এর voucher history আছে। আগে history/stock যাচাই করো।");db.batches=db.batches.filter(b=>b.itemId!==id)}
db[key]=db[key].filter(r=>r.id!==id);save();render();
}
function backup(){
try{let blob=new Blob([JSON.stringify({format:"SHREE-ERP",version:2,exportedAt:new Date().toISOString(),data:db},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="SHREE-ERP-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);$("statusText").textContent="Backup download requested"}catch(e){alert("Backup তৈরি করা যায়নি।")}
}
function restoreBackup(e){
let f=e.target.files?.[0];if(!f)return;if(f.size>251024*1024){alert("File 25 MB-এর বেশি।");e.target.value="";return}
let r=new FileReader();r.onload=()=>{try{let z=JSON.parse(r.result),s=z.data&&typeof z.data==="object"?z.data:z;if(!s||!Array.isArray(s.items)||!Array.isArray(s.parties))throw Error();for(let k of ["items","parties","bills","receipts","payments","purchases","batches"])if(s[k]!==undefined&&!Array.isArray(s[k]))throw Error();let next=normalizeDB(s);if(!confirm("বর্তমান data replace হবে। আগে backup নিয়েছ?"))return;localStorage.setItem(KEY,JSON.stringify(next));db=next;draftLines=[];ledgerParty="";go("dashboard");alert("Backup imported.")}catch(err){alert("Backup invalid অথবা import করা যায়নি। Current data পরিবর্তন করা হয়নি।")}finally{e.target.value=""}};r.onerror=()=>{alert("File পড়া যায়নি।");e.target.value=""};r.readAsText(f);
}
function clearData(){if(!confirm("সব ERP data মুছতে চাও?"))return;if(!confirm("শেষবার নিশ্চিত করো। Backup নিয়েছ?"))return;db=blank();save();go("dashboard")}

function printObject(x){
let c=x.company||db.company||{},account=x.amount!==undefined,body="";
if(account)body=<tr><td>Party / Account</td><td>${esc(x.party)}</td></tr><tr><td>Mode</td><td>${esc(x.mode||"")}</td></tr><tr><td>Narration</td><td>${esc(x.note||"")}</td></tr><tr><th>Amount</th><th>${money(x.amount)}</th></tr>;
else{let ls=Array.isArray(x.lines)?x.lines:[{item:x.item,qty:x.qty,rate:x.rate,amount:x.total}];body=<tr><td colspan="8"><b>Party:</b> ${esc(x.party)} · ${esc(x.phone||"")}<br>${esc(x.address||"")}</td></tr>;if(x.doctor)body+=<tr><td colspan="8"><b>Doctor:</b> ${esc(x.doctor)} &nbsp; <b>Reg No:</b> ${esc(x.regNo||"")}</td></tr>;body+=<tr><th>Item</th><th>Pack</th><th>Batch</th><th>Expiry</th><th>Qty</th><th>Rate</th><th>GST</th><th>Amount</th></tr>;body+=ls.map(l=><tr><td>${esc(l.item)}</td><td>${esc(l.pack||"")}</td><td>${esc(l.batch||"—")}</td><td>${esc(l.expiry||"—")}</td><td>${esc(l.qty)}${num(l.free)>0?" + "+esc(l.free)+" free":""}</td><td>${money(l.rate)}</td><td>${esc(l.gst||0)}%</td><td>${money(l.amount??num(l.qty)*num(l.rate))}</td></tr>).join("");body+=<tr><td colspan="7" class="right">Taxable Subtotal</td><td>${money(x.subtotal??x.total)}</td></tr><tr><td colspan="7" class="right">GST</td><td>${money(x.gstTotal||0)}</td></tr><tr><td colspan="7" class="right">Bill Discount</td><td>${money(x.discount)}</td></tr><tr><td colspan="7" class="right">Round Off</td><td>${money(x.roundOff||0)}</td></tr><tr><th colspan="7" class="right">Net Total</th><th>${money(x.total)}</th></tr>}
let title=x.kind==="purchase"?"PURCHASE VOUCHER":x.kind==="wholesale"?"WHOLESALE INVOICE":account?"ACCOUNT VOUCHER":"RETAIL INVOICE",w=window.open("","_blank","width=900,height=750");if(!w)return alert("Print window blocked; browser pop-up allow করো।");
w.document.write(<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font:12px Arial;padding:20px;color:#222;max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;border-bottom:2px solid #183e70;padding-bottom:12px}h1{color:#183e70;margin:0 0 5px;font-size:23px}h2{font-size:17px;margin-top:18px}.muted{color:#555;line-height:1.5}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{border:1px solid #7c8794;padding:8px;text-align:left}th{background:#eaf1fa}.right{text-align:right}.signature{margin-top:50px;display:flex;justify-content:space-between}@page{size:A4;margin:12mm}@media print{body{padding:0}.no-print{display:none}}</style></head><body><div class="top"><div><h1>${esc(c.name||"SHREE ERP")}</h1><div class="muted">${esc(c.address||"")}<br>${esc(c.phone||"")} ${c.gstin?"· GSTIN: "+esc(c.gstin):""}</div></div><div><b>SHREE ERP</b><br>Business Management</div></div><h2>${title}</h2><p><b>Voucher:</b> ${esc(x.no||"")} &nbsp; <b>Date:</b> ${esc(x.date||"")}</p><table>${body}</table><p>${esc(x.note||"")}</p><div class="signature"><span>Customer Signature __________________</span><span>Authorised Signature __________________</span></div><p class="muted">Computer-generated document. Verify details before accounting or tax filing.</p><button class="no-print" onclick="window.print()">Print</button><script>window.onload=()=>window.print()<\/script></body></html>);w.document.close();
}

/* PARTY PICKER / QUICK ADD */
function openPartyPicker(){
if(!["retail","wholesale","purchase"].includes(view)){go("parties");return}
let allowed=view==="purchase"?["Supplier","Both"]:["Customer","Both"];
$("modalRoot").innerHTML=<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="background:#edf2f8;border:1px solid #58708e;width:min(560px,100%);max-height:90vh;overflow:auto"><div style="padding:10px;background:#183e70;color:white">F2 · Select / Add Party <button class="btn" onclick="closeModal()">✕</button></div><div style="padding:15px"><div class="field"><label>Party</label><select id="pickerParty"><option value="">Cash / Walk-in</option>${db.parties.filter(p=>allowed.includes(p.type)).map(p=><option value="${esc(p.name)}">${esc(p.name)} · ${esc(p.phone||"")}</option>).join("")}</select></div><div class="form-actions"><button class="btn primary" onclick="chooseParty()">Select Party</button><button class="btn" onclick="showQuickParty()">＋ New Party</button></div></div></div></div>;$("pickerParty").focus();
}
function closeModal(){$("modalRoot").innerHTML=""}
function chooseParty(){if($("tParty")){$("tParty").value=$("pickerParty").value;showPartyInfo()}closeModal()}
function showQuickParty(){
$("modalRoot").innerHTML=<div class="modal-bg"><div class="modal" style="background:#edf2f8;width:min(560px,100%);max-height:90vh;overflow:auto"><div style="padding:10px;background:#183e70;color:white">New Customer / Party <button class="btn" onclick="closeModal()">✕</button></div><div style="padding:15px"><div class="field"><label>Name *</label><input id="qName"></div><div class="field"><label>Mobile</label><input id="qPhone"></div><div class="field"><label>Address</label><input id="qAddress"></div><div class="field"><label>GSTIN</label><input id="qGstin"></div><div class="field"><label>DL No.</label><input id="qDl"></div><div class="form-actions"><button class="btn primary" onclick="saveQuickParty()">Save & Select</button><button class="btn" onclick="openPartyPicker()">Back</button></div></div></div></div>;$("qName").focus();
}
function saveQuickParty(){
let name=$("qName").value.trim();if(!name)return alert("Party name লিখো।");
let p=db.parties.find(x=>x.name.toLowerCase()===name.toLowerCase());
if(!p){p={id:uid(),name,type:view==="purchase"?"Supplier":"Customer",phone:$("qPhone").value.trim(),address:$("qAddress").value.trim(),gstin:$("qGstin").value.trim(),dlNo:$("qDl").value.trim(),balance:0};db.parties.push(p);save()}
if($("tParty")){let s=$("tParty");if(![...s.options].some(o=>o.value===p.name)){let op=document.createElement("option");op.value=p.name;op.textContent=p.name;s.appendChild(op)}s.value=p.name;showPartyInfo()}
closeModal();
}
function renameCustomer(){
let current=$("tParty")?.value||$("aParty")?.value||"";
if(!current||current==="Cash Account"||current==="Cash / Walk-in")current=prompt("যে Party-এর নাম বদলাবে, বর্তমান নাম লিখো:");
if(!current)return;let p=db.parties.find(x=>x.name===current);if(!p)return alert("Party Master-এ নামটি পাওয়া যায়নি।");
let next=prompt("নতুন নাম লিখো:",p.name);if(!next||!next.trim())return;next=next.trim();
if(db.parties.some(x=>x.id!==p.id&&x.name.toLowerCase()===next.toLowerCase()))return alert("এই নাম আগে থেকেই আছে।");
let old=p.name;p.name=next;["bills","purchases","receipts","payments"].forEach(k=>db[k].forEach(x=>{if(x.party===old)x.party=next}));save();render();alert("Party name updated.");
}

/* KEYBOARD */
document.addEventListener("keydown",e=>{
if(e.key==="Escape"){if($("modalRoot").innerHTML){closeModal();e.preventDefault();return}if(view!=="dashboard"){go("dashboard");e.preventDefault()}return}
if(e.key==="F2"){e.preventDefault();openPartyPicker();return}
if(e.key==="F3"){e.preventDefault();renameCustomer();return}
if(e.key==="F4"){e.preventDefault();go("retail");return}
if(e.key==="F1"&&["retail","wholesale"].includes(view)){e.preventDefault();if($("tDoctor"))$("tDoctor").focus();else alert("Doctor field Retail Billing-এ আছে।");return}
if(e.key==="Enter"&&!e.ctrlKey&&!e.altKey&&!e.shiftKey){
let t=e.target;if(t.closest(".modal-bg"))return;
if(!t.matches("input,select,textarea")||t.matches("[type=submit],[type=button],[readonly]")||t.tagName==="TEXTAREA")return;
let f=t.closest("form");if(!f)return;
if(t.id==="lineSearch"){searchBillItem();if(currentItem()){e.preventDefault();fillLineRate();$("linePack").focus();return}}
let a=[...f.querySelectorAll("input:not([type=hidden]):not([type=button]):not([type=submit]):not([readonly]),select,textarea")].filter(x=>!x.disabled&&x.offsetParent!==null),i=a.indexOf(t);
if(i>=0){e.preventDefault();if(i<a.length-1)a[i+1].focus();else if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event("submit",{cancelable:true,bubbles:true}))}
}
});
render();updateStatus();
</script>
