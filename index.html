
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#321064">
<title>SHREE ERP | Business Management</title>
<style>
:root{
 --purple:#321064;--deep:#210742;--mid:#5423a0;--accent:#8150d8;
 --bg:#dce2ed;--panel:#fff;--line:#a9b5c7;--text:#202b3c;
 --muted:#637086;--green:#16804a;--red:#bd283b;--gold:#fff0c5;
 --shadow:0 2px 7px #1d12351c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font:12px "Segoe UI",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{height:48px;background:linear-gradient(100deg,var(--deep),var(--purple),var(--mid));
 color:white;display:flex;align-items:center;gap:12px;padding:5px 12px;
 box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
.logo{font-weight:900;font-size:21px;letter-spacing:1px}
.logo small{display:block;font-size:9px;font-weight:500;letter-spacing:2px}
.top-info{margin-left:auto;text-align:right;font-size:11px}
.top-info strong{display:block;font-size:12px}
.menu-strip{display:flex;gap:2px;background:#f6f2fc;border-bottom:1px solid var(--line);
 padding:4px 7px;overflow-x:auto;white-space:nowrap}
.menu-strip button{border:1px solid transparent;background:transparent;
 padding:6px 11px;color:var(--deep);font-weight:650;border-radius:3px}
.menu-strip button:hover,.menu-strip button.active{background:#e5d8fa;border-color:#b49bdc}
.app{display:grid;grid-template-columns:205px minmax(0,1fr) 205px;gap:7px;
 padding:7px;max-width:1800px;margin:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;
 box-shadow:var(--shadow);min-width:0;overflow:hidden}
.panel-title{background:linear-gradient(90deg,#eee5fc,#f8f5ff);
 color:var(--deep);font-weight:800;padding:8px 9px;border-bottom:1px solid #c9b9e4}
.panel-body{padding:9px}
.side-link{display:flex;width:100%;text-align:left;align-items:center;gap:8px;
 padding:8px;border:0;border-bottom:1px solid #eef0f5;background:white;color:#273247}
.side-link:hover{background:#f1e8ff;color:var(--deep)}
.side-link .symbol{width:21px;text-align:center;font-size:15px}
.section-label{color:#6a4b91;font-size:10px;font-weight:900;margin:10px 0 5px;
 text-transform:uppercase;letter-spacing:.6px}
.workspace{min-width:0;display:flex;flex-direction:column;gap:7px}
.page-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
 padding:9px 11px;background:white;border:1px solid var(--line)}
.page-head h1{font-size:17px;color:var(--deep);margin:0}
.page-head .subtitle{color:var(--muted);font-size:11px}
.page-head .spacer{flex:1}
.banner{background:linear-gradient(110deg,#210742,#5423a0,#8150d8);color:white;
 padding:18px;border-radius:4px;display:flex;justify-content:space-between;
 align-items:center;gap:12px;min-height:110px}
.banner h2{font-size:24px;margin:0 0 5px;letter-spacing:.6px}
.banner p{margin:0;color:#e6d9ff}
.banner .fy{border:1px solid #ffffff66;padding:9px;border-radius:3px;
 text-align:center;min-width:100px}
.banner .fy strong{display:block;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.stat{padding:11px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--accent)}
.stat .label{color:var(--muted);font-size:11px}
.stat strong{display:block;font-size:20px;margin:5px 0;color:var(--deep)}
.stat small{color:var(--muted)}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.quick{border:1px solid #c8b8e0;background:#fbf9ff;padding:11px 5px;
 text-align:center;color:var(--deep);border-radius:3px;font-weight:700;min-height:67px}
.quick:hover{background:#ede2ff;border-color:var(--accent)}
.quick span{display:block;font-size:20px;margin-bottom:5px}
.grid-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.btn{border:1px solid #b8c2d0;background:#f6f7fa;color:#263247;
 padding:7px 10px;border-radius:3px;font-weight:650}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--purple);color:white;border-color:var(--deep)}
.btn.accent{background:var(--accent);color:white;border-color:var(--mid)}
.btn.success{background:#e3f5eb;color:#11683b;border-color:#91c9a8}
.btn.danger{background:#fff0f0;color:#a51d2d;border-color:#e5a4ac}
.btn.small{padding:4px 7px;font-size:11px}
.btn-row{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.field{min-width:0}
.field label{display:block;margin-bottom:4px;font-weight:700;color:#38455b}
.field input,.field select,.field textarea,.search{
 width:100%;min-width:0;padding:7px 8px;border:1px solid #aeb9c9;
 border-radius:2px;background:white;color:#202b3c;outline:none}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus{
 border-color:var(--accent);box-shadow:0 0 0 2px #8150d820}
.field input[readonly]{background:#f1f3f7}
.form-section{padding:9px;border:1px solid #d4dbe5;background:#fff;margin-bottom:7px}
.form-section h3{margin:0 0 9px;color:var(--deep);font-size:12px;
 border-bottom:1px solid #e2d8f2;padding-bottom:6px}
.table-wrap{overflow:auto;width:100%;border:1px solid #d5dce6;background:white}
table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}
th{background:#ece5f8;color:var(--deep);font-weight:800}
th,td{padding:7px 8px;border:1px solid #d8dee8;text-align:left}
tbody tr:nth-child(even){background:#f8f9fc}
tbody tr:hover{background:#f0e9fc}
.num{text-align:right}
.empty{text-align:center;color:#718096;padding:22px}
.total-bar{display:flex;justify-content:space-between;gap:10px;align-items:center;
 background:#f2ebfc;border:1px solid #c7b3e7;padding:10px;margin-top:7px}
.total-bar strong{font-size:20px;color:var(--deep)}
.statusbar{position:sticky;bottom:0;background:#f4effb;border-top:1px solid #c7b7df;
 padding:6px 10px;display:flex;gap:10px;justify-content:space-between;z-index:10;
 color:var(--deep);font-size:11px}
.hidden{display:none!important}
.notice{padding:9px;background:#fff8e7;border:1px solid #ead6a2;margin-bottom:8px}
.chip{display:inline-block;background:#eee5fc;color:var(--deep);padding:4px 7px;
 border-radius:2px;font-size:10px;font-weight:800}
.footer-note{color:var(--muted);font-size:10px;padding:7px}
@media(max-width:1050px){
 .app{grid-template-columns:180px minmax(0,1fr)}
 .right-side{display:none}
 .form-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:700px){
 .app{display:flex;flex-direction:column;padding:5px;gap:5px}
 .left-side{display:none}
 .right-side{display:block}
 .topbar{height:44px;padding:4px 8px}
 .logo{font-size:18px}
 .top-info{font-size:10px}
 .top-info strong{font-size:11px}
 .banner{padding:13px;min-height:95px}
 .banner h2{font-size:20px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .grid-two{grid-template-columns:1fr}
 .page-head h1{font-size:15px}
 .statusbar{font-size:10px}
}
@media(max-width:380px){
 .form-grid{grid-template-columns:1fr}
 .banner .fy{min-width:80px;padding:6px}
 .banner h2{font-size:17px}
 .field input,.field select{padding:8px 6px}
}
@media print{
 .topbar,.menu-strip,.left-side,.right-side,.statusbar,.no-print{display:none!important}
 .app{display:block;padding:0}
 .workspace{display:block}
 body{background:white;font-size:11px}
 .panel{box-shadow:none;border:0}
}
</style>
</head>
<body>
<header class="topbar">
 <div class="logo">SHREE ERP<small>SMART BUSINESS MANAGEMENT</small></div>
 <div class="top-info"><strong id="companyTop">SHREE BUSINESS</strong><span id="dateTop"></span></div>
</header>

<nav class="menu-strip no-print" id="menuStrip">
 <button onclick="go('dashboard')">Dashboard</button>
 <button onclick="go('items')">Masters</button>
 <button onclick="go('retail')">Transactions</button>
 <button onclick="go('accounts')">Accounts</button>
 <button onclick="go('reports')">Final Reports</button>
 <button onclick="go('gst')">GST</button>
 <button onclick="go('stock')">Stocks</button>
 <button onclick="go('daily')">Daily Reports</button>
 <button onclick="go('links')">Links</button>
 <button onclick="go('settings')">Settings</button>
</nav>

<div class="app">
 <aside class="panel left-side">
  <div class="panel-title">REPORT CENTRE</div>
  <div class="panel-body">
   <div class="section-label">Most Viewed</div>
   <button class="side-link" onclick="go('retail')"><span class="symbol">▤</span>Retail: Bill</button>
   <button class="side-link" onclick="go('wholesale')"><span class="symbol">▤</span>Wholesale</button>
   <button class="side-link" onclick="go('gst')"><span class="symbol">▦</span>GSTR 1</button>
   <button class="side-link" onclick="go('daily')"><span class="symbol">▤</span>Party / Item Wise Sale</button>
   <button class="side-link" onclick="go('gst')"><span class="symbol">▦</span>GSTR 3B</button>
   <button class="side-link" onclick="go('accounts')"><span class="symbol">₹</span>Wallet / Receipt</button>
   <button class="side-link" onclick="go('reports')"><span class="symbol">▥</span>Sale Book</button>
   <button class="side-link" onclick="go('stock')"><span class="symbol">▧</span>Stock Valuation</button>
   <div class="section-label">Recently Viewed</div>
   <button class="side-link" onclick="go('purchases')">Purchase Register</button>
   <button class="side-link" onclick="go('accounts')">Creditors / Ledgers</button>
   <button class="side-link" onclick="go('parties')">Party Master</button>
   <button class="side-link" onclick="go('items')">Item Master</button>
   <button class="side-link" onclick="go('reports')">Reports</button>
  </div>
 </aside>

 <main class="workspace" id="workspace"></main>

 <aside class="panel right-side">
  <div class="panel-title">QUICK ACCESS</div>
  <div class="panel-body">
   <button class="side-link" onclick="go('retail')"><span class="symbol">🧾</span>Bill - Retail (F4)</button>
   <button class="side-link" onclick="go('wholesale')"><span class="symbol">📦</span>Bill - Wholesale</button>
   <button class="side-link" onclick="go('purchases')"><span class="symbol">🛒</span>Purchase</button>
   <button class="side-link" onclick="go('parties')"><span class="symbol">👥</span>Party Master</button>
   <button class="side-link" onclick="go('items')"><span class="symbol">▦</span>Item Master</button>
   <button class="side-link" onclick="go('accounts')"><span class="symbol">₹</span>Receipt / Payment</button>
   <button class="side-link" onclick="go('stock')"><span class="symbol">▧</span>Stock</button>
   <button class="side-link" onclick="go('reports')"><span class="symbol">▤</span>Reports</button>
   <div class="section-label">Keyboard Shortcuts</div>
   <p>F1 – Doctor / Help</p>
   <p>F2 – Customer / Party</p>
   <p>F3 – Rename Customer</p>
   <p>F4 – Retail Bill</p>
   <p>Enter – Next field / Submit</p>
   <p>Esc – Back to Dashboard</p>
  </div>
 </aside>
</div>

<footer class="statusbar">
 <span id="status">Ready</span>
 <span id="statusRight">SHREE ERP • Local Database</span>
</footer>

<script>
"use strict";

/* Keep this key unchanged to preserve the existing SHREE ERP data. */
const KEY="shree_erp_purple_v2";
let db,view="dashboard",previousView="dashboard",editItemId=null,editPartyId=null;
let billLines=[],accountType="receipt",itemReturnDraft=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{
 const d=new Date(),off=d.getTimezoneOffset();
 return new Date(d.getTime()-off*60000).toISOString().slice(0,10);
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=id=>Number($(id)?.value)||0;
const val=id=>$(id)?.value?.trim()||"";
const setStatus=t=>{if($("status"))$("status").textContent=t;};

function blank(){
 return {
  company:{name:"SHREE BUSINESS",address:"",phone:"",gstin:"",financialYear:"2026-2027"},
  items:[],parties:[],bills:[],receipts:[],payments:[],purchases:[],expenses:[]
 };
}
function load(){
 let d;
 try{d=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){d=null;}
 if(!d||typeof d!=="object")d=blank();
 const base=blank();
 db={...base,...d,company:{...base.company,...(d.company||{})}};
 ["items","parties","bills","receipts","payments","purchases","expenses"].forEach(k=>{
  if(!Array.isArray(db[k]))db[k]=[];
 });
 db.items.forEach(x=>{
  if(x.id==null)x.id=uid();
  if(x.stock==null)x.stock=0;
  if(x.rate==null)x.rate=Number(x.saleRate)||0;
  if(x.purchaseRate==null)x.purchaseRate=0;
  if(!x.unit)x.unit="PCS";
 });
 db.parties.forEach(x=>{if(x.id==null)x.id=uid();});
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(db));setStatus("Saved successfully");}
 catch(e){alert("Storage full or unavailable. Export a backup and try again.");}
 updateHeader();
}
function updateHeader(){
 $("companyTop").textContent=db.company.name||"SHREE BUSINESS";
 $("dateTop").textContent=today()+" • FY "+(db.company.financialYear||"2026-2027");
}
function go(page){
 previousView=view;view=page;editItemId=null;editPartyId=null;
 billLines=[];render();window.scrollTo(0,0);
}
function goBack(){go("dashboard");}
function head(title,subtitle="Business Management"){
 return `<div class="page-head"><div><h1>${esc(title)}</h1><div class="subtitle">${esc(subtitle)}</div></div><span class="spacer"></span><button class="btn small no-print" onclick="goBack()">← Dashboard (Esc)</button></div>`;
}
function panel(title,body){
 return `<section class="panel"><div class="panel-title">${title}</div><div class="panel-body">${body}</div></section>`;
}
function field(label,id,opts={}){
 const type=opts.type||"text",value=opts.value??"",placeholder=opts.placeholder||"";
 return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${opts.readonly?"readonly":""} ${opts.required?"required":""} ${opts.step?`step="${opts.step}"`:""} ${opts.min!=null?`min="${opts.min}"`:""}></div>`;
}
function selectField(label,id,options,value=""){
 return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?"selected":""}>${esc(o.label)}</option>`).join("")}</select></div>`;
}
function stat(label,value,note){
 return `<div class="stat"><div class="label">${label}</div><strong>${value}</strong><small>${note}</small></div>`;
}
function table(headers,rows,empty="No records found"){
 return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.join(""):`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`;
}
function itemName(id){return db.items.find(x=>String(x.id)===String(id))?.name||"Unknown item";}
function partyName(id){return db.parties.find(x=>String(x.id)===String(id))?.name||"Cash";}
function moneyTotal(b){return Number(b.total)||0;}
function allSales(){return db.bills;}
function totalSales(){return db.bills.reduce((s,b)=>s+moneyTotal(b),0);}
function totalPurchases(){return db.purchases.reduce((s,b)=>s+moneyTotal(b),0);}
function currentSales(){return db.bills.filter(b=>b.date===today()).reduce((s,b)=>s+moneyTotal(b),0);}
function render(){
 updateHeader();
 const w=$("workspace");
 if(view==="dashboard")w.innerHTML=dashboardPage();
 else if(view==="items")w.innerHTML=itemsPage();
 else if(view==="parties")w.innerHTML=partiesPage();
 else if(["retail","wholesale","purchases"].includes(view))w.innerHTML=billingPage(view);
 else if(view==="accounts")w.innerHTML=accountsPage();
 else if(view==="stock")w.innerHTML=stockPage();
 else if(view==="reports")w.innerHTML=reportsPage();
 else if(view==="daily")w.innerHTML=dailyPage();
 else if(view==="gst")w.innerHTML=gstPage();
 else if(view==="settings")w.innerHTML=settingsPage();
 else if(view==="links")w.innerHTML=linksPage();
 else w.innerHTML=dashboardPage();
 attachLiveHandlers();
}
function dashboardPage(){
 const billsToday=db.bills.filter(b=>b.date===today());
 const countToday=billsToday.length;
 const parties=db.parties.length;
 return `${head("Dashboard","SHREE ERP Business Overview")}
 <div class="banner"><div><h2>SHREE ERP BUSINESS</h2><p>Smart Business Management • Billing • Stock • Accounts</p></div><div class="fy"><span>FINANCIAL YEAR</span><strong>${esc(db.company.financialYear||"2026-2027")}</strong></div></div>
 <div class="stats">
 ${stat("Today's Sales","₹"+money(currentSales()),"Sales total today")}
 ${stat("Bills Created",countToday,"Today's bills")}
 ${stat("Stock Items",db.items.length,"Items in master")}
 ${stat("Parties",parties,"Customers and suppliers")}
 </div>
 ${panel("QUICK TRANSACTIONS",`<div class="quick-grid">
 <button class="quick" onclick="go('retail')"><span>🧾</span>Bill - Retail</button>
 <button class="quick" onclick="go('wholesale')"><span>📦</span>Bill - Wholesale</button>
 <button class="quick" onclick="go('accounts')"><span>₹</span>Receipt</button>
 <button class="quick" onclick="openPayment()"><span>💳</span>Payment</button>
 <button class="quick" onclick="go('purchases')"><span>🛒</span>Purchase</button>
 <button class="quick" onclick="go('parties')"><span>👥</span>Party Master</button>
 <button class="quick" onclick="go('items')"><span>▦</span>Item Master</button>
 <button class="quick" onclick="go('reports')"><span>▤</span>Reports</button>
 </div>`)}
 <div class="grid-two">
 ${panel("RECENT SALES",table(["Date","Bill No","Party","Type","Amount"],db.bills.slice().reverse().slice(0,6).map(b=>`<tr><td>${esc(b.date)}</td><td>${esc(b.billNo)}</td><td>${esc(b.partyName||partyName(b.partyId))}</td><td>${esc(b.kind||"Retail")}</td><td class="num">₹${money(b.total)}</td></tr>`)))}
 ${panel("LOW STOCK ALERT",table(["Item","Stock","Unit"],db.items.filter(i=>Number(i.stock)<=5).slice(0,8).map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.stock)}</td><td>${esc(i.unit)}</td></tr>`),"No low stock items"))}
 </div>
 <div class="footer-note">Keyboard: F1 Doctor/Help • F2 Customer • F3 Rename • F4 Retail Bill • Esc Dashboard</div>`;
}

function itemsPage(){
 const rows=db.items.map(i=>`<tr><td>${esc(i.code||"")}</td><td>${esc(i.name)}</td><td>${esc(i.company||"")}</td><td>${esc(i.unit||"PCS")}</td><td class="num">${money(i.rate)}</td><td class="num">${money(i.purchaseRate)}</td><td class="num">${Number(i.stock)||0}</td><td><button class="btn small" onclick="editItem('${i.id}')">Edit</button> <button class="btn small danger" onclick="deleteItem('${i.id}')">Delete</button></td></tr>`);
 const item=db.items.find(i=>String(i.id)===String(editItemId))||{};
 return `${head("Item Master","Masters / Item & Stock")}
 ${panel(editItemId?"EDIT ITEM":"ADD NEW ITEM",`<form id="itemForm" onsubmit="saveItem(event)">
 <div class="form-grid">
 ${field("Item Code","iCode",{value:item.code||""})}
 ${field("Item Name *","iName",{value:item.name||"",required:true})}
 ${field("Company / Brand","iCompany",{value:item.company||""})}
 ${selectField("Type","iType",[{value:"Goods",label:"Goods"},{value:"Service",label:"Service"}],item.type||"Goods")}
 ${field("Unit / Pack","iUnit",{value:item.unit||"PCS"})}
 ${field("Sale Rate","iRate",{type:"number",step:"0.01",min:0,value:item.rate??item.saleRate??0})}
 ${field("Purchase Rate","iPurchase",{type:"number",step:"0.01",min:0,value:item.purchaseRate||0})}
 ${field("Opening / Current Stock","iStock",{type:"number",step:"0.001",value:item.stock||0})}
 </div><div class="btn-row"><button class="btn primary" type="submit">${editItemId?"Update Item":"Save Item"}</button><button class="btn" type="button" onclick="cancelItemEdit()">Clear</button></div>
 </form>`)}
 ${panel("ITEM REGISTER",`<input class="search" id="itemSearch" placeholder="Search code, item or company..." oninput="filterTable('itemSearch','itemTable')">
 <div id="itemTable">${table(["Code","Item Name","Company","Unit","Sale Rate","Purchase Rate","Stock","Action"],rows)}</div>`)}
 `;
}
function saveItem(e){
 e.preventDefault();const name=val("iName");if(!name)return alert("Enter item name");
 const obj={id:editItemId||uid(),code:val("iCode"),name,company:val("iCompany"),type:val("iType"),unit:val("iUnit")||"PCS",rate:num("iRate"),purchaseRate:num("iPurchase"),stock:num("iStock")};
 if(editItemId){const ix=db.items.findIndex(i=>String(i.id)===String(editItemId));if(ix>=0)db.items[ix]={...db.items[ix],...obj};}
 else db.items.push(obj);
 save();editItemId=null;render();setStatus("Item saved");
}
function editItem(id){editItemId=id;view="items";render();}
function cancelItemEdit(){editItemId=null;render();}
function deleteItem(id){
 const i=db.items.find(x=>String(x.id)===String(id));if(!i)return;
 if(!confirm("Delete item "+i.name+"?"))return;
 db.items=db.items.filter(x=>String(x.id)!==String(id));save();render();
}
function filterTable(inputId,tableId){
 const q=($(inputId)?.value||"").toLowerCase();
 const t=$(tableId);if(!t)return;
 t.querySelectorAll("tbody tr").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"":"none");

function addBillLine(){
 const id=val("lineItem");
 const item=db.items.find(i=>String(i.id)===String(id));
 if(!item)return alert("Select a product first.");
 const qty=num("lineQty"),free=num("lineFree"),rate=num("lineRate"),discount=num("lineDiscount"),gst=num("lineGST");
 if(qty<=0)return alert("Quantity must be greater than zero.");
 if(rate<0)return alert("Rate cannot be negative.");
 const gross=qty*rate;
 const discountAmount=view==="wholesale"?gross*(discount/100):gross*(discount/100);
 const taxable=Math.max(0,gross-discountAmount);
 const tax=taxable*gst/100;
 billLines.push({itemId:item.id,name:item.name,pack:val("linePack")||item.unit||"PCS",
 batch:val("lineBatch"),expiry:val("lineExpiry"),qty,free,rate,discount,gst,
 mrp:num("lineMRP"),amount:taxable+tax,taxAmount:tax,discountAmount});
 render();
 setStatus("Item added to voucher");
}
function removeBillLine(i){billLines.splice(i,1);render();}
function calculateBillTotal(){
 const subtotal=billLines.reduce((s,l)=>s+(Number(l.amount)||0),0);
 return Math.max(0,subtotal-num("tBillDiscount"))+num("tRound");
}
function updateBillTotal(){
 if($("subTotal"))$("subTotal").textContent=money(billLines.reduce((s,l)=>s+l.amount,0));
 if($("netTotal"))$("netTotal").textContent=money(calculateBillTotal());
}

function saveBill(kind){
 const isPurchase=kind==="purchases";
 if(!billLines.length)return alert("Add at least one item.");
 const billNo=val("tBillNo");if(!billNo)return alert("Enter voucher number.");
 const list=isPurchase?db.purchases:db.bills;
 if(list.some(b=>b.billNo===billNo))return alert("Voucher number already exists.");
 const partyNameValue=val("tParty")||"Cash";
 const total=calculateBillTotal();
 const b={id:uid(),billNo,date:val("tDate")||today(),kind:isPurchase?"Purchase":kind==="wholesale"?"Wholesale":"Retail",
 partyName:partyNameValue,partyId:db.parties.find(p=>p.name===partyNameValue)?.id||"",
 phone:val("tPhone"),address:val("tAddress"),gstin:val("tGSTIN"),doctor:val("tDoctor"),regNo:val("tRegNo"),
 challan:val("tChallan"),dlNo:val("tDLNo"),remarks:val("tRemarks"),
 lines:billLines.map(l=>({...l})),subtotal:billLines.reduce((s,l)=>s+l.amount,0),
 discount:num("tBillDiscount"),round:num("tRound"),paid:num("tPaid"),total,createdAt:new Date().toISOString()};
 for(const l of billLines){
  const item=db.items.find(i=>String(i.id)===String(l.itemId));
  if(!item)continue;
  if(!isPurchase&&Number(item.stock)<l.qty+l.free){
   if(!confirm(`${item.name} stock is ${item.stock}. Continue selling anyway?`))return;
  }
 }
 list.push(b);
 billLines.forEach(l=>{
  const item=db.items.find(i=>String(i.id)===String(l.itemId));if(!item)return;
  item.stock=(Number(item.stock)||0)+(isPurchase?(l.qty+l.free):-(l.qty+l.free));
 });
 if(!isPurchase&&b.paid>0){
  db.receipts.push({id:uid(),date:b.date,voucherNo:"RC-"+b.billNo,partyName:b.partyName,amount:Math.min(b.paid,b.total),note:"Bill payment"});
 }
 save();alert(`${isPurchase?"Purchase":"Bill"} saved successfully. Voucher: ${billNo}`);
 billLines=[];go(isPurchase?"purchases":kind);
}
function deleteVoucher(kind,id){
 const isPurchase=kind==="purchases",list=isPurchase?db.purchases:db.bills;
 const b=list.find(x=>String(x.id)===String(id));if(!b)return;
 if(!confirm("Delete voucher "+b.billNo+"? Stock will be adjusted."))return;
 (b.lines||[]).forEach(l=>{
  const item=db.items.find(i=>String(i.id)===String(l.itemId));if(!item)return;
  item.stock=(Number(item.stock)||0)+(isPurchase?-(Number(l.qty||0)+Number(l.free||0)):(Number(l.qty||0)+Number(l.free||0)));
 });
 if(isPurchase)db.purchases=db.purchases.filter(x=>String(x.id)!==String(id));
 else db.bills=db.bills.filter(x=>String(x.id)!==String(id));
 save();render();
}

 win.document.close();

function saveCompany(e){
 e.preventDefault();db.company={...db.company,name:val("cName"),address:val("cAddress"),phone:val("cPhone"),gstin:val("cGSTIN"),financialYear:val("cFY")||"2026-2027"};
 save();render();setStatus("Company settings saved");
}
function backup(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download="SHREE-ERP-Backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href);
 setStatus("Backup downloaded");
}
function restoreBackup(e){
 const file=e.target.files?.[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const parsed=JSON.parse(reader.result);
   if(!parsed||typeof parsed!=="object"||!Array.isArray(parsed.items)||!Array.isArray(parsed.parties))throw new Error("Invalid backup");
   if(!confirm("Restore this backup and replace the current local data? Download a backup first if needed."))return;
   const base=blank();db={...base,...parsed,company:{...base.company,...(parsed.company||{})}};
   ["items","parties","bills","receipts","payments","purchases","expenses"].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[];});
   save();go("dashboard");alert("Backup restored.");
  }catch(err){alert("Could not restore this file. Please select a valid SHREE ERP JSON backup.");}
 };
 reader.readAsText(file);
}

function exportCSV(){
 const rows=[["Date","Bill No","Type","Party","GSTIN","Total"]];
 db.bills.forEach(b=>rows.push([b.date,b.billNo,b.kind,b.partyName,b.gstin,b.total]));
 const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="SHREE-ERP-Sales.csv";a.click();URL.revokeObjectURL(a.href);
}

document.addEventListener("keydown",e=>{
 const tag=document.activeElement?.tagName?.toLowerCase();
 const typing=["input","textarea","select"].includes(tag);
 if(e.key==="Escape"){e.preventDefault();go("dashboard");return;}
 if(e.key==="F4"){e.preventDefault();go("retail");return;}
 if(e.key==="F2"){
  e.preventDefault();
  if(["retail","wholesale","purchases"].includes(view)){
   if($("tParty")){$("tParty").focus();$("tParty").click();}
   else go("parties");
  }else go("parties");
  return;
 }
 if(e.key==="F3"){e.preventDefault();renameCustomer();return;}
 if(e.key==="F1"){
  e.preventDefault();
  if($("tDoctor"))$("tDoctor").focus();
  else alert("SHREE ERP Help: F2 Customer, F3 Rename Customer, F4 Retail Bill, Esc Dashboard.");
  return;
 }
 if(e.key==="Enter"&&typing){
  const form=document.activeElement.closest("form");
  if(form&&tag==="input"){
   const els=[...form.querySelectorAll("input:not([readonly]),select,button[type=submit]")].filter(x=>!x.disabled&&x.offsetParent!==null);
   const i=els.indexOf(document.activeElement);
   if(i>=0&&i<els.length-1){e.preventDefault();els[i+1].focus();}
  }
 }
});
load();render();updateHeader();setStatus("Ready • Local database loaded");
