
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f21a1">
<title>SHREE ERP — Business Management</title>
<style>
:root{--p:#5424a8;--p2:#7644d7;--bg:#f3f4fa;--card:#fff;--ink:#25233a;--muted:#73758a;--line:#e4e5ef;--green:#138754;--red:#d74755}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px;background:var(--p);color:white;font-weight:700}
button.secondary{background:#efebfa;color:var(--p)}
button.success{background:var(--green)}
button.danger{background:var(--red)}
button.small{padding:6px 9px;font-size:12px}
.top{background:linear-gradient(120deg,#381476,#7741ce);color:white;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:22px;font-weight:900;letter-spacing:1px}
.brand small{display:block;font-size:11px;letter-spacing:2px;opacity:.8;margin-top:4px}
.top input{max-width:380px;flex:1;min-width:160px;border:0}
.layout{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:calc(100vh - 70px)}
aside{background:#fff;border-right:1px solid var(--line);padding:12px;overflow:auto}
.navtitle{font-size:11px;color:#9290a7;font-weight:800;padding:14px 10px 7px}
.nav{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:3px 0;background:white;color:#55516c;font-weight:600}
.nav:hover,.nav.active{background:#eee7fc;color:var(--p)}
main{padding:20px;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:24px;margin:0 0 5px}h2{font-size:17px;margin:0 0 14px}
.sub{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 3px 12px #29205208;min-width:0}
.metric{font-size:25px;font-weight:900;margin-top:9px;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:700;color:#66637c;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid #dfe0eb;border-radius:8px;padding:10px;background:white;color:#29263d;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #d7c7fb;border-color:var(--p)}
.field{margin-bottom:12px}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.formgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tablewrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:9px;background:white}
table{border-collapse:collapse;width:100%;min-width:700px;font-size:13px}
th{background:#f2effa;color:#50406f;text-align:left;white-space:nowrap}
th,td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{min-width:85px;padding:8px}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eee7fc;color:var(--p);font-size:11px;font-weight:800}
.empty{text-align:center;padding:30px;color:var(--muted)}
.billhead{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.billparty{display:grid;grid-template-columns:2fr 2fr;gap:10px;margin-top:12px}
.billparty .third{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.billbottom{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-top:16px}
.totals{min-width:220px;max-width:350px;width:100%;background:#f8f6ff;border-radius:10px;padding:14px}
.totalrow{display:flex;justify-content:space-between;padding:6px 0}
.grand{font-size:22px;font-weight:900;color:var(--p);border-top:1px solid #ddd2f5;margin-top:6px;padding-top:12px}
.hint{background:#fff8dc;border:1px solid #f3e2a4;border-radius:8px;padding:10px;color:#6f5814;font-size:12px;margin-bottom:14px}
footer{text-align:center;color:#9995ac;font-size:11px;padding:25px}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#17112799;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}
.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:white;border-radius:14px;padding:20px}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.toast{position:fixed;bottom:20px;right:20px;background:#26203b;color:white;padding:13px 18px;border-radius:9px;z-index:40;box-shadow:0 5px 20px #0002}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;gap:5px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:7px}aside .navtitle{display:none}.nav{white-space:nowrap;width:auto;flex-shrink:0;margin:0}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:12px}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.brand{font-size:18px}.cards{gap:8px}.card{padding:12px}.metric{font-size:21px}.billhead{grid-template-columns:1fr 1fr}.billhead .field:last-child{grid-column:1/-1}.billparty{grid-template-columns:1fr}.formgrid,.formgrid.two{grid-template-columns:1fr 1fr}h1{font-size:21px}.top{padding:12px}}
@media print{aside,.top,.pagehead,.actions,.noprint,footer{display:none!important}.layout{display:block}main{padding:0}.panel,.card{box-shadow:none;border:0}body{background:white}.tablewrap{overflow:visible}table{min-width:0;font-size:11px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">SHREE ERP <small>SMART BUSINESS MANAGEMENT</small></div>
  <input id="globalSearch" placeholder="Search product, customer, bill..." oninput="globalSearch(this.value)">
  <button class="secondary" onclick="showPage('settings')">⚙ Settings</button>
</header>
<div class="layout">
<aside>
<div class="navtitle">WORKSPACE</div>
<button class="nav active" data-page="dashboard" onclick="showPage('dashboard')">▦ Dashboard</button>
<div class="navtitle">MASTERS</div>
<button class="nav" data-page="items" onclick="showPage('items')">📦 Product Master</button>
<button class="nav" data-page="parties" onclick="showPage('parties')">👥 Customer / Party</button>
<div class="navtitle">TRANSACTIONS</div>
<button class="nav" data-page="retail" onclick="showPage('retail')">🧾 Retail Billing</button>
<button class="nav" data-page="wholesale" onclick="showPage('wholesale')">🏢 Wholesale Billing</button>
<button class="nav" data-page="purchase" onclick="showPage('purchase')">🛒 Purchase Entry</button>
<button class="nav" data-page="receipt" onclick="showPage('receipt')">💰 Receipt Entry</button>
<button class="nav" data-page="payment" onclick="showPage('payment')">💸 Payment Entry</button>
<div class="navtitle">INVENTORY & REPORTS</div>
<button class="nav" data-page="stock" onclick="showPage('stock')">▤ Stock</button>
<button class="nav" data-page="reports" onclick="showPage('reports')">📊 Reports & Ledger</button>
<button class="nav" data-page="settings" onclick="showPage('settings')">⚙ Settings / Backup</button>
</aside>
<main id="main"></main>
</div>
<footer>SHREE ERP • Central Product & Party Master • Local data is stored in this browser</footer>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modalbox" id="modalbox"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";
const KEY="shree_erp_purple_v2";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const blank=()=>({company:{name:"SHREE ERP",address:"",phone:"",gstin:""},items:[],parties:[],bills:[],receipts:[],payments:[],purchases:[]});
function loadDB(){
 let d;try{d=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){d=null}
 if(!d||typeof d!=="object")d=blank();
 const defaults=blank();for(const k of Object.keys(defaults))if(d[k]===undefined)d[k]=defaults[k];
 for(const i of d.items){i.id=i.id||uid();i.name=i.name||"";i.code=i.code||"";i.pack=i.pack||i.unit||"PCS";i.batch=i.batch||"";i.rate=Number(i.rate??i.saleRate??0);i.tax=Number(i.tax??i.gst??0);i.stock=Number(i.stock??i.openingStock??0);i.unit=i.unit||i.pack||"PCS"}
 for(const p of d.parties){p.id=p.id||uid();p.name=p.name||"";p.type=p.type||"Customer";p.mobile=p.mobile||"";p.address=p.address||"";p.gstin=p.gstin||"";p.dl=p.dl||""}
 return d
}
let db=loadDB(),page="dashboard",billKind="retail",billLines=[],editingItemId=null,editingPartyId=null,selectedPartyId="",toastTimer;
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){notify("Storage full. Export backup first.");return false}}
function notify(s){$("toast").textContent=s;$("toast").classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),2600)}
function showPage(p){page=p;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
function pageHead(title,sub,buttons=""){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub||""}</div></div><div class="actions">${buttons}</div></div>`}
function empty(s){return `<div class="empty">${s}</div>`}
function itemOptions(selected=""){return `<option value="">Select product...</option>`+db.items.map(i=>`<option value="${esc(i.id)}" ${i.id===selected?"selected":""}>${esc(i.name)}${i.code?" · "+esc(i.code):""}</option>`).join("")}
function partyOptions(selected="",types=["Customer","Both"]){return `<option value="">Walk-in / Select party...</option>`+db.parties.filter(p=>types.includes(p.type)||p.type==="Both"||p.type==="Customer"&&types.includes("Customer")).map(p=>`<option value="${esc(p.id)}" ${p.id===selected?"selected":""}>${esc(p.name)}${p.mobile?" · "+esc(p.mobile):""}</option>`).join("")}
function render(){
 if(page==="dashboard")return dashboard();
 if(page==="items")return itemsPage();
 if(page==="parties")return partiesPage();
 if(page==="retail"||page==="wholesale")return billingPage(page);
 if(page==="purchase")return purchasePage();
 if(page==="receipt"||page==="payment")return moneyPage(page);
 if(page==="stock")return stockPage();
 if(page==="reports")return reportsPage();
 if(page==="settings")return settingsPage();
}
function dashboard(){
 const sales=db.bills.reduce((s,b)=>s+Number(b.total||0),0),purchases=db.purchases.reduce((s,b)=>s+Number(b.total||0),0);
 $("main").innerHTML=pageHead("Dashboard","Welcome to SHREE ERP — your business at a glance")+
 `<div class="cards">
 <div class="card"><div class="sub">Total Products</div><div class="metric">${db.items.length}</div></div>
 <div class="card"><div class="sub">Total Parties</div><div class="metric">${db.parties.length}</div></div>
 <div class="card"><div class="sub">Total Sales</div><div class="metric">${money(sales)}</div></div>
 <div class="card"><div class="sub">Purchase Total</div><div class="metric">${money(purchases)}</div></div></div>
 <div class="grid2"><div class="panel"><h2>Quick Access</h2><div class="actions">
 <button onclick="showPage('retail')">+ Retail Bill</button><button onclick="showPage('wholesale')">+ Wholesale Bill</button>
 <button class="secondary" onclick="openItemForm()">+ Product</button><button class="secondary" onclick="openPartyForm()">+ Customer</button></div>
 <p class="sub">F2 adds a product in a billing screen. F3 edits the selected product. Customer Master has its own F2/F3 actions.</p></div>
 <div class="panel"><h2>Stock Alert</h2>${db.items.filter(i=>Number(i.stock)<=5).slice(0,8).map(i=>`<p>${esc(i.name)} <span class="badge">${Number(i.stock)} ${esc(i.pack||"PCS")}</span></p>`).join("")||empty("No low-stock products.")}</div></div>`;
}
function itemsPage(){
 $("main").innerHTML=pageHead("Product Master","Central master: products are shared across bills, purchase and stock",`<button onclick="openItemForm()">+ Add Product (F2)</button>`)+
 `<div class="panel"><div class="field"><input id="itemSearch" placeholder="Search product / code / batch..." oninput="filterTable('itemTable',this.value)"></div>
 <div class="tablewrap"><table id="itemTable"><thead><tr><th>Product</th><th>Code</th><th>Pack</th><th>Batch</th><th>Sale Rate</th><th>Tax %</th><th>Stock</th><th>Action</th></tr></thead><tbody>
 ${db.items.map(i=>`<tr data-search="${esc([i.name,i.code,i.pack,i.batch].join(" ").toLowerCase())}"><td><b>${esc(i.name)}</b></td><td>${esc(i.code)}</td><td>${esc(i.pack||i.unit)}</td><td>${esc(i.batch)}</td><td>${money(i.rate)}</td><td>${Number(i.tax)}%</td><td>${Number(i.stock)}</td><td><button class="small secondary" onclick="openItemForm('${i.id}')">Edit (F3)</button> <button class="small danger" onclick="deleteItem('${i.id}')">Delete</button></td></tr>`).join("")}
 </tbody></table></div>${db.items.length?"":empty("No products yet. Add your first product.")}</div>`;
}
function openItemForm(id=""){
 editingItemId=id||null;const i=db.items.find(x=>x.id===id)||{name:"",code:"",pack:"PCS",batch:"",rate:0,tax:0,stock:0,unit:"PCS",company:"",description:""};
 openModal(`<div class="modalhead"><h2>${id?"Edit Product":"New Product Entry"}</h2><button class="secondary" onclick="closeModal()">✕</button></div>
 <form onsubmit="saveItem(event)"><div class="formgrid two">
 <div class="field"><label>Product Name *</label><input name="name" required value="${esc(i.name)}" autofocus></div>
 <div class="field"><label>Product Code / SKU</label><input name="code" value="${esc(i.code)}"></div>
 <div class="field"><label>Pack / Unit</label><input name="pack" value="${esc(i.pack||i.unit||"PCS")}" placeholder="1x10 / PCS / BOX"></div>
 <div class="field"><label>Batch</label><input name="batch" value="${esc(i.batch)}"></div>
 <div class="field"><label>Sale Rate (₹) *</label><input name="rate" type="number" step="0.01" min="0" required value="${Number(i.rate||0)}"></div>
 <div class="field"><label>Tax / GST %</label><input name="tax" type="number" step="0.01" min="0" max="100" value="${Number(i.tax||0)}"></div>
 <div class="field"><label>Opening / Current Stock</label><input name="stock" type="number" step="0.01" value="${Number(i.stock||0)}"></div>
 <div class="field"><label>Company / Brand</label><input name="company" value="${esc(i.company)}"></div>
 <div class="field"><label>Unit (legacy)</label><input name="unit" value="${esc(i.unit||i.pack||"PCS")}"></div>
 </div><div class="field"><label>Description</label><textarea name="description">${esc(i.description||"")}</textarea></div>
 <div class="actions"><button type="submit">Save Product</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`);
}
function saveItem(e){
 e.preventDefault();const f=new FormData(e.target),old=db.items.find(i=>i.id===editingItemId);
 const obj={id:old?.id||uid(),name:String(f.get("name")).trim(),code:String(f.get("code")||"").trim(),pack:String(f.get("pack")||"PCS").trim(),batch:String(f.get("batch")||"").trim(),rate:Number(f.get("rate")||0),tax:Number(f.get("tax")||0),stock:Number(f.get("stock")||0),company:String(f.get("company")||""),unit:String(f.get("unit")||f.get("pack")||"PCS"),description:String(f.get("description")||"")};
 if(old)Object.assign(old,obj);else db.items.push(obj);
 saveDB();closeModal();notify(old?"Product updated":"Product added to Central Master");render();
}
function deleteItem(id){if(!confirm("Delete this product from Product Master? Existing bills will remain."))return;db.items=db.items.filter(i=>i.id!==id);saveDB();render();notify("Product deleted")}
function partiesPage(){
 $("main").innerHTML=pageHead("Customer / Party Master","One central list for retail, wholesale, receipt, payment and ledger",`<button onclick="openPartyForm()">+ Add Party (F2)</button>`)+
 `<div class="panel"><div class="field"><input placeholder="Search name / mobile / address..." oninput="filterTable('partyTable',this.value)"></div><div class="tablewrap"><table id="partyTable"><thead><tr><th>Name</th><th>Type</th><th>Mobile</th><th>Address</th><th>GSTIN</th><th>Drug Licence / Reg No</th><th>Action</th></tr></thead><tbody>
 ${db.parties.map(p=>`<tr data-search="${esc([p.name,p.type,p.mobile,p.address,p.gstin,p.dl].join(" ").toLowerCase())}"><td><b>${esc(p.name)}</b></td><td>${esc(p.type)}</td><td>${esc(p.mobile)}</td><td>${esc(p.address)}</td><td>${esc(p.gstin)}</td><td>${esc(p.dl)}</td><td><button class="small secondary" onclick="openPartyForm('${p.id}')">Edit (F3)</button> <button class="small danger" onclick="deleteParty('${p.id}')">Delete</button></td></tr>`).join("")}</tbody></table></div>${db.parties.length?"":empty("No parties yet. Add a customer or supplier.")}</div>`;
}
function openPartyForm(id=""){
 editingPartyId=id||null;const p=db.parties.find(x=>x.id===id)||{name:"",type:"Customer",mobile:"",address:"",gstin:"",dl:"",contact:"",opening:0};
 openModal(`<div class="modalhead"><h2>${id?"Edit / Rename Party":"New Customer / Party Entry"}</h2><button class="secondary" onclick="closeModal()">✕</button></div>
 <form onsubmit="saveParty(event)"><div class="formgrid two">
 <div class="field"><label>Name *</label><input name="name" required value="${esc(p.name)}" autofocus></div>
 <div class="field"><label>Party Type</label><select name="type"><option ${p.type==="Customer"?"selected":""}>Customer</option><option ${p.type==="Supplier"?"selected":""}>Supplier</option><option ${p.type==="Both"?"selected":""}>Both</option></select></div>
 <div class="field"><label>Mobile</label><input name="mobile" value="${esc(p.mobile)}"></div>
 <div class="field"><label>GSTIN</label><input name="gstin" value="${esc(p.gstin)}"></div>
 <div class="field"><label>Drug Licence / Reg No</label><input name="dl" value="${esc(p.dl)}"></div>
 <div class="field"><label>Contact Person</label><input name="contact" value="${esc(p.contact)}"></div>
 </div><div class="field"><label>Address</label><textarea name="address">${esc(p.address)}</textarea></div>
 <div class="field"><label>Opening Balance (₹)</label><input name="opening" type="number" step=".01" value="${Number(p.opening||0)}"></div>
 <div class="actions"><button type="submit">Save Party</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`);
}
function saveParty(e){
 e.preventDefault();const f=new FormData(e.target),old=db.parties.find(p=>p.id===editingPartyId);
 const obj={id:old?.id||uid(),name:String(f.get("name")).trim(),type:String(f.get("type")),mobile:String(f.get("mobile")||""),gstin:String(f.get("gstin")||""),dl:String(f.get("dl")||""),contact:String(f.get("contact")||""),address:String(f.get("address")||""),opening:Number(f.get("opening")||0)};
 if(old)Object.assign(old,obj);else db.parties.push(obj);
 saveDB();closeModal();notify(old?"Party updated everywhere":"Party added to Central Master");render();
}
function deleteParty(id){if(!confirm("Delete this party? Existing transaction history will remain."))return;db.parties=db.parties.filter(p=>p.id!==id);saveDB();render()}
function billingPage(kind){
 billKind=kind;const retail=kind==="retail";if(!billLines.length)billLines=[newLine()];
 const title=retail?"Retail Billing":"Wholesale Billing";
 $("main").innerHTML=pageHead(title,"Multi-product bill • Central Product and Party Master",`<button class="secondary" onclick="openPartyForm()">+ Customer (F2)</button><button class="secondary" onclick="openItemForm()">+ Product (F2)</button><button class="secondary" onclick="editSelectedLineProduct()">Edit Product (F3)</button>`)+
 `<div class="hint">Keyboard: F2 = New Product on billing screen · F3 = Edit selected product · Select a customer from the central Party Master. Use the buttons if your phone keyboard has no F-keys.</div>
 <form id="billForm" onsubmit="saveBill(event)">
 <div class="panel"><div class="billhead">
 <div class="field"><label>Bill No</label><input id="billNo" value="${nextBillNo(kind)}" readonly></div>
 <div class="field"><label>Bill Type</label><select id="billMode"><option>Cash</option><option>Credit</option></select></div>
 <div class="field"><label>Date</label><input id="billDate" type="date" value="${today()}" required></div></div>
 <div class="billparty"><div class="field"><label>Customer / Party</label><select id="billParty" onchange="fillParty(this.value)">${partyOptions("",["Customer","Both"])}</select><input id="billAddress" placeholder="Address" style="margin-top:7px"></div>
 <div class="third"><div class="field"><label>Mobile</label><input id="billMobile" placeholder="Mobile"></div><div class="field"><label>Reg No / DL</label><input id="billReg" placeholder="Registration No"></div></div></div>
 <div class="actions" style="margin-top:10px"><button type="button" onclick="addBillLine()">+ Add Product Line</button><button type="button" class="secondary" onclick="openItemForm()">F2 New Product</button><button type="button" class="secondary" onclick="editSelectedLineProduct()">F3 Edit Selected</button></div>
 <div class="tablewrap"><table><thead><tr><th>Product</th><th>Pack</th><th>Batch</th><th>Qty</th><th>Rate</th><th>Tax %</th><th>Amount</th><th class="noprint">×</th></tr></thead><tbody id="billRows"></tbody></table></div>
 <div class="billbottom"><div style="flex:1;min-width:220px"><div class="field"><label>Notes</label><textarea id="billNotes" placeholder="Notes / remarks"></textarea></div><label>Payment Received (₹)</label><input id="billPaid" type="number" min="0" step=".01" value="0" oninput="calcBill()"></div>
 <div class="totals"><div class="totalrow"><span>Subtotal</span><b id="subtotalView">₹0.00</b></div><div class="totalrow"><span>GST / Tax</span><b id="taxView">₹0.00</b></div><div class="totalrow grand"><span>Total</span><span id="grandView">₹0.00</span></div><div class="totalrow"><span>Due</span><b id="dueView">₹0.00</b></div></div></div>
 <div class="actions" style="margin-top:18px"><button type="submit" class="success">Save Bill</button><button type="button" class="secondary" onclick="printCurrentBill()">Print Bill</button><button type="button" class="secondary" onclick="showPage('reports')">View Reports</button></div>
 </div></form>
 <div class="panel" style="margin-top:16px"><h2>Recent ${retail?"Retail":"Wholesale"} Bills</h2>${billTable(db.bills.filter(b=>b.kind===kind).slice().reverse().slice(0,8))}</div>`;
 drawBillLines();calcBill();
}
function newLine(){return {key:uid(),itemId:"",qty:1,rate:0,tax:0,pack:"",batch:""}}
function nextBillNo(kind){let n=db.bills.filter(b=>b.kind===kind).length+1;return (kind==="retail"?"RB-":"WB-")+String(n).padStart(5,"0")}
function addBillLine(){billLines.push(newLine());drawBillLines();calcBill()}
function drawBillLines(){
 const body=$("billRows");if(!body)return;
 body.innerHTML=billLines.map((l,idx)=>`<tr>
 <td><select data-key="${l.key}" data-field="itemId" onchange="lineChange('${l.key}','itemId',this.value)">${itemOptions(l.itemId)}</select></td>
 <td><input value="${esc(l.pack)}" onchange="lineChange('${l.key}','pack',this.value)" aria-label="Pack"></td>
 <td><input value="${esc(l.batch)}" onchange="lineChange('${l.key}','batch',this.value)" aria-label="Batch"></td>
 <td><input type="number" min=".01" step=".01" value="${Number(l.qty||1)}" onchange="lineChange('${l.key}','qty',this.value)" aria-label="Quantity"></td>
 <td><input type="number" min="0" step=".01" value="${Number(l.rate||0)}" onchange="lineChange('${l.key}','rate',this.value)" aria-label="Rate"></td>
 <td><input type="number" min="0" max="100" step=".01" value="${Number(l.tax||0)}" onchange="lineChange('${l.key}','tax',this.value)" aria-label="Tax"></td>
 <td id="amount-${l.key}">${money(lineAmount(l))}</td><td class="noprint"><button type="button" class="small danger" onclick="removeBillLine('${l.key}')">×</button></td></tr>`).join("");
}
function lineChange(key,field,value){
 const l=billLines.find(x=>x.key===key);if(!l)return;
 if(field==="itemId"){
  l.itemId=value;const i=db.items.find(x=>x.id===value);if(i){l.rate=Number(i.rate||0);l.tax=Number(i.tax||0);l.pack=i.pack||i.unit||"";l.batch=i.batch||""}
  drawBillLines();
 }else if(["qty","rate","tax"].includes(field))l[field]=Number(value||0);else l[field]=value;
 calcBill();
}
function removeBillLine(key){if(billLines.length===1){billLines=[newLine()]}else billLines=billLines.filter(l=>l.key!==key);drawBillLines();calcBill()}
function lineSubtotal(l){return Math.max(0,Number(l.qty)||0)*Math.max(0,Number(l.rate)||0)}
function lineTax(l){return lineSubtotal(l)*Math.max(0,Number(l.tax)||0)/100}
function lineAmount(l){return lineSubtotal(l)+lineTax(l)}
function calcBill(){
 let sub=0,tax=0;for(const l of billLines){sub+=lineSubtotal(l);tax+=lineTax(l);const a=$("amount-"+l.key);if(a)a.textContent=money(lineAmount(l))}
 const total=sub+tax,paid=Math.max(0,Number($("billPaid")?.value||0));
 if($("subtotalView"))$("subtotalView").textContent=money(sub);
 if($("taxView"))$("taxView").textContent=money(tax);
 if($("grandView"))$("grandView").textContent=money(total);
 if($("dueView"))$("dueView").textContent=money(Math.max(0,total-paid));
 return {sub,tax,total,paid,due:Math.max(0,total-paid)}
}
function fillParty(id){
 selectedPartyId=id;const p=db.parties.find(x=>x.id===id);
 if($("billAddress"))$("billAddress").value=p?.address||"";
 if($("billMobile"))$("billMobile").value=p?.mobile||"";
 if($("billReg"))$("billReg").value=p?.dl||p?.gstin||"";
}
function editSelectedLineProduct(){
 const active=document.activeElement;let key=active?.closest("tr")?.querySelector("select")?.dataset.key;
 let l=billLines.find(x=>x.key===key)||billLines.find(x=>x.itemId);
 if(!l||!l.itemId){notify("আগে একটি Product নির্বাচন করো");return}
 openItemForm(l.itemId);
}
function saveBill(e){
 e.preventDefault();const lines=billLines.filter(l=>l.itemId&&Number(l.qty)>0);
 if(!lines.length){notify("কমপক্ষে একটি Product এবং Qty দিতে হবে");return}
 const demand={};for(const l of lines)demand[l.itemId]=(demand[l.itemId]||0)+Number(l.qty);
 for(const [id,q] of Object.entries(demand)){const i=db.items.find(x=>x.id===id);if(!i){notify("একটি Product আর পাওয়া যাচ্ছে না");return}if(Number(i.stock)<q){if(!confirm(`${i.name}: stock ${i.stock}, bill quantity ${q}. Continue anyway?`))return}}
 const totals=calcBill(),kind=page,party=db.parties.find(p=>p.id===$("billParty").value);
 const details=lines.map(l=>{const i=db.items.find(x=>x.id===l.itemId);return {itemId:i.id,item:i.name,code:i.code||"",pack:l.pack||i.pack||i.unit||"",batch:l.batch||i.batch||"",qty:Number(l.qty),rate:Number(l.rate),tax:Number(l.tax),subtotal:lineSubtotal(l),gst:lineTax(l),total:lineAmount(l)}});
 const b={id:uid(),kind,no:$("billNo").value,date:$("billDate").value,mode:$("billMode").value,party:party?.name||$("billParty").selectedOptions[0]?.textContent||"Walk-in",partyId:party?.id||"",address:$("billAddress").value,mobile:$("billMobile").value,reg:$("billReg").value,item:details.map(x=>x.item).join(", "),itemId:details[0].itemId,qty:details.reduce((s,x)=>s+x.qty,0),rate:details[0].rate,tax:totals.tax,subtotal:totals.sub,gst:totals.tax,total:totals.total,paid:totals.paid,due:Math.max(0,totals.total-totals.paid),payment:$("billMode").value,notes:$("billNotes").value,items:details};
 for(const [id,q] of Object.entries(demand)){const i=db.items.find(x=>x.id===id);if(i)i.stock=Number(i.stock)-q}
 db.bills.push(b);
 if(b.paid>0)db.receipts.push({id:uid(),date:b.date,party:b.party,partyId:b.partyId,amount:b.paid,ref:b.no,notes:"Payment received with bill"});
 if(saveDB()){notify("Bill saved successfully");billLines=[newLine()];render()}else notify("Save failed. Export data and try again");
}
function billTable(list){
 if(!list.length)return empty("No bills found.");
 return `<div class="tablewrap"><table><thead><tr><th>Bill No</th><th>Date</th><th>Party</th><th>Products</th><th>Total</th><th>Due</th><th>Action</th></tr></thead><tbody>${list.map(b=>`<tr><td>${esc(b.no)}</td><td>${esc(b.date)}</td><td>${esc(b.party)}</td><td>${esc((b.items||[]).map(x=>x.item).join(", ")||b.item||"")}</td><td>${money(b.total)}</td><td>${money(b.due??b.total)}</td><td><button class="small secondary" onclick="printBill('${b.id}')">Print</button></td></tr>`).join("")}</tbody></table></div>`;
}
function printCurrentBill(){const no=$("billNo")?.value;const b={no,date:$("billDate")?.value,party:$("billParty")?.selectedOptions[0]?.textContent||"Walk-in",address:$("billAddress")?.value,mobile:$("billMobile")?.value,reg:$("billReg")?.value,items:billLines.filter(l=>l.itemId).map(l=>({item:db.items.find(i=>i.id===l.itemId)?.name||"",pack:l.pack,batch:l.batch,qty:l.qty,rate:l.rate,tax:l.tax,subtotal:lineSubtotal(l),gst:lineTax(l),total:lineAmount(l)})),total:calcBill().total};printBillData(b)}
function printBill(id){const b=db.bills.find(x=>x.id===id);if(b)printBillData(b)}
function printBillData(b){
 const items=b.items?.length?b.items:[{item:b.item||"",pack:"",batch:"",qty:b.qty||0,rate:b.rate||0,tax:b.gst||b.tax||0,subtotal:b.subtotal||0,gst:b.gst||0,total:b.total||0}];
 const w=window.open("","_blank");if(!w){notify("Allow popups to print bill");return}
 w.document.write(`<html><head><title>${esc(b.no)}</title><style>body{font:13px Arial;padding:20px}h2{text-align:center}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:8px;border:1px solid #aaa;text-align:left}.r{text-align:right}</style></head><body><h2>${esc(db.company.name||"SHREE ERP")}</h2><p>${esc(db.company.address||"")}</p><h3>INVOICE: ${esc(b.no)}</h3><p>Date: ${esc(b.date)} | Party: ${esc(b.party)}<br>${esc(b.address||"")}<br>Mobile: ${esc(b.mobile||"")} | Reg: ${esc(b.reg||"")}</p><table><thead><tr><th>Product</th><th>Pack</th><th>Batch</th><th>Qty</th><th>Rate</th><th>Tax %</th><th>Amount</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.item)}</td><td>${esc(i.pack)}</td><td>${esc(i.batch)}</td><td>${i.qty}</td><td>${money(i.rate)}</td><td>${i.tax}%</td><td>${money(i.total)}</td></tr>`).join("")}</tbody></table><h3 class="r">Total: ${money(b.total)}</h3><p>Thank you!</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()
}
function purchasePage(){
 $("main").innerHTML=pageHead("Purchase Entry","Purchase from suppliers updates central product stock",`<button class="secondary" onclick="openPartyForm()">+ Supplier</button><button class="secondary" onclick="openItemForm()">+ Product</button>`)+
 `<div class="panel"><form onsubmit="savePurchase(event)"><div class="formgrid"><div class="field"><label>Purchase No</label><input id="purchaseNo" value="PUR-${String(db.purchases.length+1).padStart(5,"0")}" readonly></div><div class="field"><label>Date</label><input id="purchaseDate" type="date" value="${today()}" required></div><div class="field"><label>Supplier</label><select id="purchaseParty">${partyOptions(" ",["Supplier","Both"])}</select></div></div>
 <div class="field"><label>Product *</label><select id="purchaseItem" required>${itemOptions()}</select></div><div class="formgrid"><div class="field"><label>Quantity *</label><input id="purchaseQty" type="number" min=".01" step=".01" value="1" required></div><div class="field"><label>Purchase Rate (₹)</label><input id="purchaseRate" type="number" min="0" step=".01" value="0" required></div><div class="field"><label>Tax %</label><input id="purchaseTax" type="number" min="0" max="100" step=".01" value="0"></div></div>
 <div class="field"><label>Notes</label><input id="purchaseNotes"></div><button type="submit" class="success">Save Purchase & Update Stock</button></form></div>
 <div class="panel" style="margin-top:15px"><h2>Recent Purchases</h2>${purchaseTable(db.purchases.slice().reverse().slice(0,20))}</div>`;
 $("purchaseItem").addEventListener("change",()=>{const i=db.items.find(x=>x.id===$("purchaseItem").value);if(i){$("purchaseRate").value=i.purchaseRate??i.rate;$("purchaseTax").value=i.tax}});
}
function purchaseTable(list){if(!list.length)return empty("No purchase entries.");return `<div class="tablewrap"><table><thead><tr><th>Purchase No</th><th>Date</th><th>Supplier</th><th>Product</th><th>Qty</th><th>Total</th></tr></thead><tbody>${list.map(p=>`<tr><td>${esc(p.no)}</td><td>${esc(p.date)}</td><td>${esc(p.party)}</td><td>${esc(p.item)}</td><td>${p.qty}</td><td>${money(p.total)}</td></tr>`).join("")}</tbody></table></div>`}
function savePurchase(e){e.preventDefault();const i=db.items.find(x=>x.id===$("purchaseItem").value);if(!i)return notify("Select a product");const qty=Number($("purchaseQty").value),rate=Number($("purchaseRate").value),tax=Number($("purchaseTax").value),total=qty*rate*(1+tax/100),p=db.parties.find(x=>x.id===$("purchaseParty").value);i.stock=Number(i.stock)+qty;i.purchaseRate=rate;db.purchases.push({id:uid(),no:$("purchaseNo").value,date:$("purchaseDate").value,party:p?.name||"Supplier",partyId:p?.id||"",item:i.name,itemId:i.id,qty,rate,tax,total,notes:$("purchaseNotes").value});saveDB();notify("Purchase saved and stock updated");render()}
function stockPage(){
 $("main").innerHTML=pageHead("Stock / Inventory","Live quantity from the central product master",`<button class="secondary" onclick="exportCSV('stock')">Export CSV</button>`)+
 `<div class="panel"><div class="field"><input placeholder="Search stock..." oninput="filterTable('stockTable',this.value)"></div><div class="tablewrap"><table id="stockTable"><thead><tr><th>Product</th><th>Code</th><th>Pack</th><th>Batch</th><th>Stock</th><th>Rate</th><th>Stock Value</th></tr></thead><tbody>${db.items.map(i=>`<tr data-search="${esc([i.name,i.code,i.pack,i.batch].join(" ").toLowerCase())}"><td>${esc(i.name)}</td><td>${esc(i.code)}</td><td>${esc(i.pack)}</td><td>${esc(i.batch)}</td><td>${i.stock}</td><td>${money(i.rate)}</td><td>${money(i.stock*i.rate)}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function moneyPage(kind){
 const isR=kind==="receipt",list=isR?db.receipts:db.payments;
 $("main").innerHTML=pageHead(isR?"Receipt Entry":"Payment Entry","Central Party Master connected",`<button class="secondary" onclick="openPartyForm()">+ Party</button>`)+
 `<div class="panel"><form onsubmit="saveMoneyEntry(event,'${kind}')"><div class="formgrid"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Party</label><select name="partyId">${partyOptions("",["Customer","Supplier","Both"])}</select></div><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min=".01" step=".01" required></div></div><div class="formgrid two"><div class="field"><label>Reference</label><input name="ref" placeholder="Bill / transaction number"></div><div class="field"><label>Notes</label><input name="notes"></div></div><button type="submit" class="success">Save ${isR?"Receipt":"Payment"}</button></form></div>
 <div class="panel" style="margin-top:15px"><h2>Transaction History</h2>${moneyTable(list.slice().reverse())}</div>`;
}
function saveMoneyEntry(e,kind){e.preventDefault();const f=new FormData(e.target),p=db.parties.find(x=>x.id===f.get("partyId"));const row={id:uid(),date:f.get("date"),party:p?.name||"Walk-in",partyId:p?.id||"",amount:Number(f.get("amount")),ref:f.get("ref"),notes:f.get("notes")};db[kind==="receipt"?"receipts":"payments"].push(row);saveDB();notify("Entry saved");render()}
function moneyTable(list){if(!list.length)return empty("No transactions yet.");return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Party</th><th>Reference</th><th>Amount</th><th>Notes</th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.party)}</td><td>${esc(x.ref)}</td><td>${money(x.amount)}</td><td>${esc(x.notes)}</td></tr>`).join("")}</tbody></table></div>`}
function reportsPage(){
 const sales=db.bills.reduce((s,b)=>s+Number(b.total||0),0),received=db.receipts.reduce((s,r)=>s+Number(r.amount||0),0),paid=db.payments.reduce((s,r)=>s+Number(r.amount||0),0);
 $("main").innerHTML=pageHead("Reports & Party Ledger","Sales, purchases, receipts, payments and outstanding",`<button class="secondary" onclick="window.print()">Print Report</button><button class="secondary" onclick="exportCSV('sales')">Export Sales CSV</button>`)+
 `<div class="cards"><div class="card"><div class="sub">Total Sales</div><div class="metric">${money(sales)}</div></div><div class="card"><div class="sub">Total Purchases</div><div class="metric">${money(db.purchases.reduce((s,p)=>s+Number(p.total||0),0))}</div></div><div class="card"><div class="sub">Receipts Entered</div><div class="metric">${money(received)}</div></div><div class="card"><div class="sub">Payments Entered</div><div class="metric">${money(paid)}</div></div></div>
 <div class="panel"><h2>Sales Bills</h2>${billTable(db.bills.slice().reverse())}</div>
 <div class="panel" style="margin-top:15px"><h2>Purchase History</h2>${purchaseTable(db.purchases.slice().reverse())}</div>
 <div class="panel" style="margin-top:15px"><h2>Party Ledger / Outstanding</h2>${ledgerTable()}</div>
 <div class="grid2" style="margin-top:15px"><div class="panel"><h2>Receipt History</h2>${moneyTable(db.receipts.slice().reverse())}</div><div class="panel"><h2>Payment History</h2>${moneyTable(db.payments.slice().reverse())}</div></div>`;
}
function ledgerTable(){return `<div class="tablewrap"><table><thead><tr><th>Party</th><th>Type</th><th>Sales</th><th>Receipts</th><th>Purchases</th><th>Payments</th><th>Sales Due*</th></tr></thead><tbody>${db.parties.map(p=>{const sales=db.bills.filter(b=>b.partyId===p.id).reduce((s,b)=>s+Number(b.total||0),0),rec=db.receipts.filter(r=>r.partyId===p.id).reduce((s,r)=>s+Number(r.amount||0),0),pur=db.purchases.filter(r=>r.partyId===p.id).reduce((s,r)=>s+Number(r.total||0),0),pay=db.payments.filter(r=>r.partyId===p.id).reduce((s,r)=>s+Number(r.amount||0),0);return `<tr><td>${esc(p.name)}</td><td>${esc(p.type)}</td><td>${money(sales)}</td><td>${money(rec)}</td><td>${money(pur)}</td><td>${money(pay)}</td><td>${money(Math.max(0,sales-rec))}</td></tr>`}).join("")}</tbody></table></div><p class="sub">*Sales due is calculated from linked sales and receipt entries. Purchase due may need supplier invoice-level tracking.</p>`}
function settingsPage(){
 $("main").innerHTML=pageHead("Settings & Backup","Business details, local data export and restore")+
 `<div class="panel"><h2>Company Profile</h2><form onsubmit="saveCompany(event)"><div class="formgrid two"><div class="field"><label>Business Name</label><input name="name" value="${esc(db.company.name||"SHREE ERP")}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(db.company.phone||"")}"></div><div class="field"><label>GSTIN</label><input name="gstin" value="${esc(db.company.gstin||"")}"></div><div class="field"><label>Address</label><input name="address" value="${esc(db.company.address||"")}"></div></div><button type="submit">Save Company Profile</button></form></div>
 <div class="panel" style="margin-top:15px"><h2>Backup & Restore</h2><p class="sub">Export a backup before changing browser or device. Local browser data does not automatically sync across devices.</p><div class="actions"><button onclick="backupJSON()">Download Backup JSON</button><button class="secondary" onclick="$('restoreFile').click()">Restore Backup</button><input class="hidden" id="restoreFile" type="file" accept=".json,application/json" onchange="restoreJSON(event)"><button class="secondary" onclick="exportCSV('items')">Export Products CSV</button><button class="secondary" onclick="exportCSV('parties')">Export Parties CSV</button></div></div>
 <div class="panel" style="margin-top:15px"><h2>Data Safety</h2><p>Database key: <code>${KEY}</code></p><p class="sub">This page does not automatically erase existing data. Keep a JSON backup in a safe place.</p><button class="danger" onclick="clearDemo()">Clear all ERP data...</button></div>`;
}
function saveCompany(e){e.preventDefault();const f=new FormData(e.target);Object.assign(db.company,{name:f.get("name"),phone:f.get("phone"),gstin:f.get("gstin"),address:f.get("address")});saveDB();notify("Company profile saved");render()}
function backupJSON(){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});downloadBlob(blob,"shree-erp-backup-"+today()+".json")}
function restoreJSON(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.items)||!Array.isArray(x.parties))throw Error("Invalid backup");if(!confirm("Restore this backup? Current data will be replaced. Download a backup first if needed."))return;const defaults=blank();db={...defaults,...x};saveDB();notify("Backup restored");render()}catch(err){notify("Invalid backup file")}e.target.value=""};r.readAsText(file)}
function clearDemo(){if(!confirm("This will remove ALL SHREE ERP data in this browser. Have you downloaded a backup?"))return;if(!confirm("Final confirmation: permanently clear all local ERP records?"))return;db=blank();saveDB();showPage("dashboard");notify("ERP data cleared")}
function exportCSV(type){
 let rows=[];
 if(type==="items")rows=[["Name","Code","Pack","Batch","Rate","Tax","Stock"],...db.items.map(i=>[i.name,i.code,i.pack,i.batch,i.rate,i.tax,i.stock])];
 else if(type==="parties")rows=[["Name","Type","Mobile","Address","GSTIN","DL"],...db.parties.map(p=>[p.name,p.type,p.mobile,p.address,p.gstin,p.dl])];
 else if(type==="stock")rows=[["Product","Code","Pack","Batch","Stock","Rate"],...db.items.map(i=>[i.name,i.code,i.pack,i.batch,i.stock,i.rate])];
 else rows=[["Bill","Date","Type","Party","Products","Total","Due"],...db.bills.map(b=>[b.no,b.date,b.kind,b.party,(b.items||[]).map(x=>x.item).join("; ")||b.item,b.total,b.due])];
 const csv=rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");downloadBlob(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),`shree-erp-${type}-${today()}.csv`)
}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function globalSearch(q){q=q.toLowerCase().trim();if(!q)return;const i=db.items.find(x=>(x.name+" "+x.code+" "+x.batch).toLowerCase().includes(q));const p=db.parties.find(x=>(x.name+" "+x.mobile+" "+x.address).toLowerCase().includes(q));if(i){showPage("items");setTimeout(()=>{const el=$("itemSearch");if(el){el.value=q;filterTable("itemTable",q)}},0)}else if(p){showPage("parties");setTimeout(()=>{const el=document.querySelector("#partyTable")?.closest(".panel")?.querySelector("input");if(el){el.value=q;filterTable("partyTable",q)}},0)}}
function filterTable(id,q){const t=$(id);if(!t)return;q=q.toLowerCase();t.querySelectorAll("tbody tr").forEach(r=>r.classList.toggle("hidden",!(r.dataset.search||r.textContent.toLowerCase()).includes(q)))}
function openModal(html){$("modalbox").innerHTML=html;$("modal").classList.remove("hidden");setTimeout(()=>$("modalbox").querySelector("input,select,textarea")?.focus(),50)}
function closeModal(){$("modal").classList.add("hidden");$("modalbox").innerHTML="";editingItemId=null;editingPartyId=null;render()}
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){if(!$("modal").classList.contains("hidden")){closeModal();e.preventDefault()}return}
 if(e.key==="F2"){e.preventDefault();if(!$("modal").classList.contains("hidden"))return;if(page==="retail"||page==="wholesale")openItemForm();else if(page==="parties")openPartyForm();else if(page==="items")openItemForm();else notify("F2: Add Product or Customer from the relevant screen")}
 if(e.key==="F3"){e.preventDefault();if(!$("modal").classList.contains("hidden"))return;if(page==="retail"||page==="wholesale")editSelectedLineProduct();else if(page==="items"){const first=db.items[0];if(first)openItemForm(first.id);else notify("No product to edit")}else if(page==="parties"){const first=db.parties[0];if(first)openPartyForm(first.id);else notify("No party to edit")}}
 if(e.key==="Enter"&&!e.shiftKey&&!e.ctrlKey&&e.target.matches("input,select")&&e.target.type!=="submit"&&!e.target.closest("#billRows")){const form=e.target.closest("form");if(form){const fields=[...form.querySelectorAll("input:not([type=hidden]):not([readonly]),select,textarea,button[type=submit]")].filter(x=>!x.disabled);const idx=fields.indexOf(e.target);if(idx>=0&&idx<fields.length-1){e.preventDefault();fields[idx+1].focus()}}}
});
render();
</script>
</body>
</html>
