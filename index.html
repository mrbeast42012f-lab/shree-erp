<script>
"use strict";
const KEY="shree_erp_purple_v2";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const cleanQty=v=>Math.max(0,num(v));
const blank=()=>({company:{name:"My Business",address:"",phone:"",gstin:""},items:[],parties:[],bills:[],receipts:[],payments:[],purchases:[],batches:[],godowns:[{id:"main",name:"Main Godown"}],transfers:[],adjustments:[],orders:[],returns:[],journals:[],employees:[],auditLog:[]});

function normalizeDB(source){
 const b=blank();
 if(source&&typeof source==="object"&&!Array.isArray(source)){
  b.company={...b.company,...(source.company&&typeof source.company==="object"?source.company:{})};
  ["items","parties","bills","receipts","payments","purchases","batches","godowns","transfers","adjustments","orders","returns","journals","employees","auditLog"].forEach(k=>b[k]=Array.isArray(source[k])?source[k]:[]);
 }
 b.items=b.items.filter(x=>x&&typeof x==="object").map(x=>({...x,id:String(x.id||uid()),qty:cleanQty(x.qty)}));
 b.parties=b.parties.filter(x=>x&&typeof x==="object").map(x=>({...x,id:String(x.id||uid())}));
 ["bills","receipts","payments","purchases"].forEach(k=>b[k]=b[k].filter(x=>x&&typeof x==="object").map(x=>({...x,id:String(x.id||uid())})));
 b.batches=b.batches.filter(x=>x&&typeof x==="object").map(x=>({...x,id:String(x.id||uid()),itemId:String(x.itemId||""),batch:String(x.batch||"NO BATCH"),expiry:String(x.expiry||""),qty:cleanQty(x.qty),rate:cleanQty(x.rate),mrp:cleanQty(x.mrp)}));
 if(!b.batches.length){
  b.items.forEach(i=>{if(i.qty>0)b.batches.push({id:uid(),itemId:i.id,batch:"OPENING",expiry:"",qty:i.qty,rate:cleanQty(i.purchaseRate),mrp:cleanQty(i.mrp||i.rate),opening:true})});
 }else{
  b.items.forEach(i=>{
   let sum=b.batches.filter(x=>x.itemId===i.id).reduce((s,x)=>s+cleanQty(x.qty),0);
   if(i.qty>sum+0.000001){
    b.batches.push({id:uid(),itemId:i.id,batch:"OPENING ADJUSTMENT",expiry:"",qty:i.qty-sum,rate:cleanQty(i.purchaseRate),mrp:cleanQty(i.mrp||i.rate),opening:true});
    sum=i.qty;
   }
   i.qty=sum;
  });
 }
 return b;
}
function load(){try{const raw=localStorage.getItem(KEY);return raw?normalizeDB(JSON.parse(raw)):blank()}catch(e){return blank()}}
let db=load(),view="dashboard",editId=null,draftLines=[],ledgerParty="",navHistory=[];
function reconcileItem(itemId){const item=db.items.find(i=>i.id===itemId);if(item)item.qty=db.batches.filter(b=>b.itemId===itemId).reduce((s,b)=>s+cleanQty(b.qty),0)}
function reconcileAll(){db.items.forEach(i=>reconcileItem(i.id))}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(db));$("statusText").textContent="Saved successfully"}
 catch(e){$("statusText").textContent="Save failed";alert("Browser storage-এ জায়গা নেই বা storage বন্ধ। আগে Backup ডাউনলোড করো।")}
 updateStatus();
}
function updateStatus(){$("statusCompany").textContent="Company: "+(db.company.name||"My Business");$("statusDate").textContent=new Date().toLocaleDateString("en-IN")}
function go(v,back=false){
 if(v===view)return;
 if(!back&&view)navHistory.push(view);
 view=v;editId=null;draftLines=[];
 document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
 document.querySelectorAll("[data-side]").forEach(b=>b.classList.toggle("active",b.dataset.side===v));
 render();window.scrollTo({top:0,behavior:"smooth"});
}
function goBack(){
 if(navHistory.length){const previous=navHistory.pop();go(previous,true)}
 else if(view!=="dashboard")go("dashboard");
}
function head(title,sub=""){return `<div class="view-head"><div><h2>${esc(title)}</h2>${sub?`<div class="muted" style="margin-top:4px">${esc(sub)}</div>`:""}</div><div><button class="btn" onclick="goBack()">← Back</button> <button class="btn" onclick="go('dashboard')">⌂ Home</button></div></div>`}
function stat(label,value){return `<div class="stat"><div class="label">${esc(label)}</div><strong>${value}</strong></div>`}
function table(headers,rows,empty="No records found"){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${headers.length}">${empty}</td></tr>`}</tbody></table></div>`}
function render(){
 document.body.classList.toggle("dashboard-mode",view==="dashboard");
 updateStatus();const root=$("main");
 if(view==="dashboard")root.innerHTML=dashboard();
 else if(view==="items")root.innerHTML=itemsPage();
 else if(view==="parties")root.innerHTML=partiesPage();
 else if(view==="company")root.innerHTML=companyPage();
 else if(view==="settings")root.innerHTML=settingsPage();
 else if(["retail","wholesale","purchase"].includes(view))root.innerHTML=transactionPage(view);
 else if(["receipt","payment"].includes(view))root.innerHTML=accountPage(view);
 else if(view==="stock")root.innerHTML=stockPage();
 else if(view==="expiry")root.innerHTML=expiryPage();
 else if(view==="ledger")root.innerHTML=ledgerPage();
 else if(["reports","daily","gst","links"].includes(view))root.innerHTML=reportsPage(view);
 else if(view.startsWith("menu_"))root.innerHTML=menuPage(view.slice(5));
 else root.innerHTML=dashboard();
}
function dashboard(){
 const sales=db.bills.reduce((s,b)=>s+num(b.total),0),purchases=db.purchases.reduce((s,b)=>s+num(b.total),0),stock=db.items.reduce((s,i)=>s+num(i.qty),0);
 const todaySales=db.bills.filter(b=>b.date===today()).reduce((s,b)=>s+num(b.total),0);
 const expiring=db.batches.filter(b=>b.expiry&&num(b.qty)>0&&daysToExpiry(b.expiry)>=0&&daysToExpiry(b.expiry)<=60).length;
 const recent=[...db.bills.map(x=>({...x,kind:x.kind==="wholesale"?"Wholesale":"Retail"})),...db.purchases.map(x=>({...x,kind:"Purchase"}))].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,5);
 const reports=[['Wholesale : Bill','retail'],['GSTR 1','gst'],['Wholesale','wholesale'],['Party / Item Wise Sale','reports'],['GSTR 3B','gst'],['Wholesale C/Note','reports'],['Wallet','receipt'],['Message','links'],['ERP-to-Distributor','links']];
 const recentReports=[['Sale Book','reports'],['Retail C/Note','reports'],['Stock Valuation','stock'],['Purchase Register','reports'],['Creditors Ledgers','ledger'],['Wholesale D/Note','reports'],['Receive Orders','links']];
 const right=[['Bill-Retail (F4)','retail'],['Bill-Wholesale','wholesale'],['S/R Expiry','expiry'],['P/R Expiry','expiry'],['Receipt','receipt'],['Payment','payment'],['Cash & Bank Book','ledger'],['Ledger A/c','ledger'],['Outstanding','ledger'],['Stock Status','stock'],['Stock & Sales Analysis','reports'],['Re-Order','stock'],['Sales Book','reports'],['Dispatch Summary','reports'],['Bill Tagging','reports'],['Daily Analysis (MIS)','daily'],["Today's Gross Profit",'reports'],['Exit / Home','dashboard']];
 const btn=(label,target,primary=false)=>`<button class="btn ${primary?'primary':''}" onclick="go('${target}')">${label}</button>`;
 return `<div class="dash-head">${[['My Menu','dashboard'],['Masters','items'],['Transactions','retail'],['Accounts','receipt'],['Digital','links'],['Books','reports'],['Final Reports','reports'],['GST','gst'],['e-Way','gst'],['Stocks','stock'],['Daily Reports','daily'],['Reports','reports'],['Hot Keys','links'],['Links','links'],['Exit','dashboard']].map(x=>btn(x[0],x[1])).join('')}</div>
 <div class="dash-head">${[['Wallet','receipt'],['Marketplace','links'],['Message','links'],['Ticket','links'],['SHREE HELP','links'],['Sessions','settings'],['Community','links'],['Dashboard','dashboard'],['Search Items','items']].map(x=>btn(x[0],x[1])).join('')}</div>
 <div class="dash-layout">
  <section class="dash-panel"><div class="dash-panel-title">Most Viewed Reports</div>${reports.map(x=>`<button class="dash-report" onclick="go('${x[1]}')">› ${x[0]}</button>`).join('')}<div class="dash-panel-title">Recently Viewed Reports</div>${recentReports.map(x=>`<button class="dash-report" onclick="go('${x[1]}')">› ${x[0]}</button>`).join('')}<button class="dash-report" onclick="go('items')">› Item Master</button><button class="dash-report" onclick="go('parties')">› Party Master</button></section>
  <section class="dash-panel"><div class="dash-promo"><div class="dash-logo">▦ SHREE ERP</div><div class="dash-subtitle">THE BUSINESS BACKBONE · BUSINESS MANAGEMENT</div><div style="font-size:12px;margin-top:15px;color:#34536f">Billing · Inventory · Accounts · GST · Reports</div><div style="font-size:11px;margin-top:7px;color:#647b90">Financial Year: 2026–2027</div></div><div class="dash-panel-title">Quick Transactions</div><div class="dash-shortcuts">${btn('BILL - RETAIL (F4)','retail',true)}${btn('BILL - WHOLESALE','wholesale',true)}${btn('PURCHASE ENTRY','purchase')}${btn('CHALLAN / ORDERS','links')}${btn('RECEIPT VOUCHER','receipt')}${btn('PAYMENT VOUCHER','payment')}${btn('PARTY MASTER (F2)','parties')}${btn('ITEM MASTER (Ctrl+I)','items')}${btn('STOCK SUMMARY','stock')}${btn('FINAL REPORTS','reports')}${btn('COMPANY DETAILS','company')}${btn('BACKUP / RESTORE','settings')}</div><div class="dash-panel-title">Recent Transactions</div>${table(['Date','Type','Bill No.','Party','Amount'],recent.map(x=>`<tr><td>${esc(x.date||'')}</td><td>${esc(x.kind)}</td><td>${esc(x.no||'')}</td><td>${esc(x.party||'')}</td><td>${money(x.total)}</td></tr>`).join(''),'No transactions yet')}</section>
  <section class="dash-panel dash-right"><div class="dash-panel-title">Quick Entry / Reports</div>${right.map(x=>`<button class="btn" onclick="go('${x[1]}')">› ${x[0]}</button>`).join('')}</section>
 </div>
 <div class="dash-bottom"><span><b>${esc(db.company.name||'SHREE ERP BUSINESS')}</b> · ${esc(db.company.address||'Company details in Settings')}</span><span>FY: 01-Apr-2026 — 31-Mar-2027</span><span>Date: ${new Date().toLocaleDateString('en-IN')} · ${new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span><span>Today Sales: <b>${money(todaySales)}</b> · Purchases: ${money(purchases)} · Stock Items: ${db.items.length} (${stock} qty)</span></div>
 <div class="dash-footlinks">${btn('F1 Company','company')}${btn('Ctrl+I Item','items')}${btn('F2 Party','parties')}${btn('F4 Retail Bill','retail')}${btn('F10 Calendar','daily')}${btn('Reports','reports')}${btn('Backup','settings')}</div>
 <div class="notice" style="margin-top:5px">Keyboard: Enter = next field · Esc = back/home · F1 = Doctor/Help where available · F2 = Party · F3 = Rename Party · F4 = Retail Bill</div>`;
}

/* ITEM MASTER: item creation/editing never adjusts stock */
function itemsPage(){
 const q=($("itemSearch")?.value||"").toLowerCase();
 const list=db.items.filter(x=>[x.name,x.code,x.barcode,x.company,x.type].some(v=>String(v||"").toLowerCase().includes(q)));
 const rows=list.map(x=>`<tr><td>${esc(x.code||"")}</td><td>${esc(x.barcode||"")}</td><td>${esc(x.name)}</td><td>${esc(x.type||"Others")}</td><td>${esc(x.company||"")}</td><td>${esc(x.unit||"PCS")}</td><td>${money(x.rate)}</td><td>${num(x.qty)}</td><td><div class="row-actions"><button class="btn" onclick="editItem('${esc(x.id)}')">Edit</button><button class="btn danger" onclick="deleteRecord('items','${esc(x.id)}')">Del</button></div></td></tr>`).join("");
 return `${head("Item Master","Product / Inventory / Barcode Master")}
 <div class="card"><h3 id="itemFormTitle">${editId?"Edit Item":"Add New Item"}</h3><form onsubmit="saveItem(event)"><input type="hidden" id="itemId" value="${esc(editId||"")}">
 <div class="formgrid">
 <div class="field"><label>Item Code</label><input id="iCode" placeholder="ITM001"></div><div class="field"><label>Barcode / Scan Code</label><input id="iBarcode" placeholder="Barcode number"></div>
 <div class="field"><label>Item Name *</label><input id="iName" required placeholder="Product name"></div>
 <div class="field"><label>Type</label><select id="iType"><option>Others</option><option>Medicine</option><option>Syrup</option><option>Tablet</option><option>Capsule</option><option>Food</option><option>General</option></select></div>
 <div class="field"><label>Company / Brand</label><input id="iCompany"></div><div class="field"><label>Unit / Pack</label><input id="iUnit" value="PCS"></div>
 <div class="field"><label>Sale Rate (₹)</label><input id="iRate" type="number" min="0" step=".01" value="0"></div>
 <div class="field"><label>Purchase Rate (₹)</label><input id="iPurchaseRate" type="number" min="0" step=".01" value="0"></div>
 <div class="field"><label>Default MRP (₹)</label><input id="iMrp" type="number" min="0" step=".01" value="0"></div>
 <div class="field"><label>Category</label><input id="iCategory" placeholder="Medicine / General"></div><div class="field"><label>Salt / Composition</label><input id="iSalt"></div><div class="field"><label>Product Group</label><input id="iGroup"></div><div class="field"><label>HSN Code</label><input id="iHsn"></div><div class="field"><label>Default Discount (%)</label><input id="iDiscount" type="number" min="0" max="100" step=".01" value="0"></div><div class="field"><label>Minimum Stock</label><input id="iMinStock" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Substitute Item</label><input id="iSubstitute"></div>
 </div><p class="notice">Stock শুধু Purchase Entry থেকে বাড়বে। বর্তমান স্টক এখানে দেখানো হয়, কিন্তু এখানে পরিবর্তন করা যায় না।</p>
 <div class="form-actions"><button class="btn primary" type="submit">Save Item</button><button class="btn" type="button" onclick="resetItemForm()">Clear</button></div></form></div>
 <div class="card"><div class="view-head"><h3>Item List (${list.length})</h3><input class="searchbox" style="max-width:240px" id="itemSearch" placeholder="Search name/code/barcode..." value="${esc(q)}" oninput="refreshItems()"></div>
 ${table(["Code","Barcode","Item Name","Type","Company","Unit","Rate","Stock","Action"],rows)}</div>`;
}
function refreshItems(){const el=$("itemSearch"),v=el?.value||"",pos=el?.selectionStart??v.length;render();if($("itemSearch")){$("itemSearch").value=v;$("itemSearch").focus();try{$("itemSearch").setSelectionRange(pos,pos)}catch(e){}}}
function saveItem(e){
 e.preventDefault();
 const id=$("itemId").value||uid(),old=db.items.find(x=>x.id===id);
 const x={...(old||{}),id,code:$("iCode").value.trim(),barcode:$("iBarcode").value.trim(),name:$("iName").value.trim(),type:$("iType").value,company:$("iCompany").value.trim(),unit:$("iUnit").value.trim()||"PCS",rate:cleanQty($("iRate").value),qty:old?cleanQty(old.qty):0,purchaseRate:cleanQty($("iPurchaseRate").value),mrp:cleanQty($("iMrp").value),category:$("iCategory").value.trim(),salt:$("iSalt").value.trim(),group:$("iGroup").value.trim(),hsn:$("iHsn").value.trim(),discount:Math.min(100,cleanQty($("iDiscount").value)),minStock:cleanQty($("iMinStock").value),substitute:$("iSubstitute").value.trim()};
 if(!x.name)return alert("Item name লিখো।");
 if(x.barcode&&db.items.some(a=>a.id!==id&&String(a.barcode||"")===x.barcode))return alert("এই barcode অন্য পণ্যে ব্যবহার হয়েছে।");
 if(old)db.items=db.items.map(a=>a.id===id?x:a);else db.items.push(x);
 reconcileItem(id);save();editId=null;render();alert("Item saved. Stock Purchase Entry থেকে যোগ করতে হবে।");
}
function editItem(id){
 const x=db.items.find(a=>a.id===id);if(!x)return;editId=id;render();
 $("itemId").value=x.id;$("iCode").value=x.code||"";$("iBarcode").value=x.barcode||"";$("iName").value=x.name||"";
 $("iType").value=x.type||"Others";$("iCompany").value=x.company||"";$("iUnit").value=x.unit||"PCS";
 $("iRate").value=x.rate||0;$("iPurchaseRate").value=x.purchaseRate||0;$("iMrp").value=x.mrp||x.rate||0;$("iCategory").value=x.category||"";$("iSalt").value=x.salt||"";$("iGroup").value=x.group||"";$("iHsn").value=x.hsn||"";$("iDiscount").value=x.discount||0;$("iMinStock").value=x.minStock||0;$("iSubstitute").value=x.substitute||"";
 $("itemFormTitle").textContent="Edit Item";$("iName").focus();window.scrollTo({top:0,behavior:"smooth"});
}

function nextVoucherNo(kind){
 const key=kind==="purchase"?"purchases":"bills";
 const prefix=kind==="purchase"?"PUR":kind==="retail"?"RS":"WS";
 const nums=db[key].map(x=>{
  const m=String(x.no||"").match(new RegExp("^"+prefix+"-(\\d+)$","i"));
  return m?Number(m[1]):0;
 });
 return prefix+"-"+String(Math.max(0,...nums)+1).padStart(6,"0");
}

function searchBillItem(kind){
 const val=($("lineSearch")?.value||"").trim().toLowerCase();

 const item=db.items.find(i=>
  [i.name,i.code,i.barcode,i.id].some(v=>
   String(v||"").trim().toLowerCase()===val
  )
 );

 if(item){
  $("lineItem").value=item.id;
  fillLineRate();
 }else{
  $("lineItem").value="";
  if($("lineStock"))$("lineStock").value="—";

  // Purchase-এ নতুন Product Name লেখা যাবে।
  if(kind==="purchase" && $("linePack") && !$("linePack").value){
   $("linePack").value="PCS";
  }
 }
}

function currentItem(){
 return db.items.find(i=>i.id===($("lineItem")?.value||""));
}

function itemBatches(id){
 return db.batches.filter(b=>b.itemId===id&&cleanQty(b.qty)>0)
  .sort((a,b)=>String(a.expiry||"9999-12").localeCompare(String(b.expiry||"9999-12")));
}

function fillLineRate(){
 const i=currentItem();
 if(!i)return;

 const purchase=!!$("lineBatch");

 $("lineSearch").value=purchase?i.name:(i.barcode||i.code||i.name);
 $("linePack").value=i.unit||"PCS";
 $("lineRate").value=purchase?(i.purchaseRate||i.rate||0):(i.rate||0);

 if(purchase){
  if($("lineBarcode"))$("lineBarcode").value=i.barcode||"";
  $("lineStock").value=cleanQty(i.qty);
  if($("lineMrp"))$("lineMrp").value=i.mrp||i.rate||0;
 }else{
  const batches=itemBatches(i.id);
  $("lineStock").value=batches.reduce((s,b)=>s+cleanQty(b.qty),0);
 }

 calcLinePreview();
}

function calcLinePreview(){
 if(!$("lineQty"))return;

 const qty=cleanQty($("lineQty").value);
 const rate=cleanQty($("lineRate").value);
 const dist=Math.max(0,Math.min(100,num($("lineDist")?.value)));
 const discount=cleanQty($("lineDiscount").value);
 const gst=Math.max(0,Math.min(100,num($("lineGst").value)));

 const base=Math.max(0,qty*rate*(1-dist/100)-discount);
 const tax=base*gst/100;

 $("linePreview").value=money(base+tax);
}

function clearLineForm(){
 ["lineItem","lineSearch","lineBarcode","linePack","lineBatch","lineExpiry","lineQty","lineFree","lineRate","lineMrp","lineDist","lineDiscount","lineGst"].forEach(id=>{
  const el=$(id);
  if(el){
   el.value=id==="lineQty"?"1":
    ["lineFree","lineRate","lineMrp","lineDist","lineDiscount","lineGst"].includes(id)?"0":"";
  }
 });

 if($("linePack")&&$("lineBatch"))$("linePack").value="PCS";
 if($("lineStock"))$("lineStock").value="—";
 if($("linePreview"))$("linePreview").value=money(0);

 $("lineSearch")?.focus();
}

function addBillLine(kind){
 let item=currentItem();
 let pendingProduct=null;

 const productName=($("lineSearch")?.value||"").trim();
 const barcode=($("lineBarcode")?.value||"").trim();
 const qty=num($("lineQty").value);
 const rate=num($("lineRate").value);
 const free=num($("lineFree")?.value);
 const dist=num($("lineDist")?.value);
 const discount=num($("lineDiscount").value);
 const gst=num($("lineGst").value);

 if(qty<=0)return alert("Quantity অবশ্যই 0-এর বেশি হতে হবে।");
 if(rate<0||free<0||discount<0||dist<0||dist>100||gst<0||gst>100){
  return alert("Quantity, Rate, Discount বা GST পরীক্ষা করো।");
 }

 let batch=null,batchName="",expiry="",mrp=0,batchId="";

 if(kind==="purchase"){
  if(!productName)return alert("Product Name লিখো।");

  batchName=$("lineBatch").value.trim();
  expiry=$("lineExpiry").value;
  mrp=num($("lineMrp").value);

  if(!batchName)return alert("Purchase-এর Batch No. লিখো。");

  // Name/Barcode দিয়ে existing item খুঁজবে।
  if(!item){
   item=db.items.find(i=>
    String(i.name||"").trim().toLowerCase()===productName.toLowerCase() ||
    (barcode&&String(i.barcode||"").trim().toLowerCase()===barcode.toLowerCase())
   );
  }

  // আগে একই draft-এ নতুন product যোগ করা থাকলে duplicate বানাবে না।
  if(!item){
   const draftMatch=draftLines.find(l=>
    l.newItem && (
     String(l.newItem.name||"").trim().toLowerCase()===productName.toLowerCase() ||
     (barcode&&String(l.newItem.barcode||"").trim().toLowerCase()===barcode.toLowerCase())
    )
   );

   if(draftMatch){
    pendingProduct={...draftMatch.newItem};
    item={...pendingProduct};
   }else{
    const id=uid();

    pendingProduct={
     id,
     name:productName,
     code:barcode,
     barcode,
     unit:($("linePack").value||"PCS").trim()||"PCS",
     purchaseRate:rate,
     rate:mrp||rate,
     mrp,
     qty:0,
     category:"General",
     gst,
     createdAt:new Date().toISOString()
    };

    item={...pendingProduct};
   }
  }

  if(!pendingProduct){
   $("lineSearch").value=item.name;
   $("linePack").value=$("linePack").value.trim()||item.unit||"PCS";
  }

 }else{
  if(!item){
   return alert("পণ্যের নাম বা barcode লিখে তালিকা থেকে সঠিক পণ্য নির্বাচন করো।");
  }

  const batches=itemBatches(item.id);

  if(!batches.length)return alert("এই পণ্যের stock নেই। আগে Purchase Entry-তে stock যোগ করো।");

  batch=batches.find(b=>cleanQty(b.qty)>=qty+free);

  if(!batch)return alert("কোনও একক batch-এ পর্যাপ্ত stock নেই। Quantity কমাও অথবা আগে stock যাচাই করো।");

  if(batch.expiry&&daysToExpiry(batch.expiry)<0){
   return alert("এই batch expired। অন্য batch-এর stock ব্যবহার করো।");
  }

  const already=draftLines
   .filter(l=>l.itemId===item.id&&l.batchId===batch.id)
   .reduce((s,l)=>s+l.qty+num(l.free),0);

  if(cleanQty(batch.qty)<already+qty+free){
   return alert("এই batch-এর stock পর্যাপ্ত নয়। Available: "+cleanQty(batch.qty));
  }

  batchName=batch.batch;
  expiry=batch.expiry||"";
  mrp=num(batch.mrp)||num(item.mrp)||num(item.rate);
  batchId=batch.id;
 }

 const base=Math.max(0,qty*rate*(1-dist/100)-discount);
 const tax=base*gst/100;

 const line={
  id:uid(),
  itemId:item.id,
  item:item.name,
  pack:$("linePack").value.trim()||item.unit||"PCS",
  batchId,
  batch:batchName,
  expiry,
  qty,
  free:kind==="retail"?0:free,
  rate,
  dist,
  discount,
  gst,
  tax,
  mrp,
  amount:base+tax
 };

 if(pendingProduct)line.newItem={...pendingProduct};

 draftLines.push(line);
 renderDraftLinesIntoPage();
 clearLineForm();
 updateBillTotal();
}

function renderDraftLines(){
 if(!draftLines.length)return `<div class="empty">এখনও কোনো পণ্য যোগ করা হয়নি। উপরের ফর্ম থেকে পণ্য যোগ করো।</div>`;

 const rows=draftLines.map((x,n)=>
  `<tr><td>${n+1}</td><td>${esc(x.item)}</td><td>${esc(x.pack||"")}</td><td>${esc(x.batch||"—")}</td><td>${esc(x.expiry||"—")}</td><td>${x.qty}</td><td>${x.free||0}</td><td>${money(x.rate)}</td><td>${x.dist||0}%</td><td>${x.gst||0}%</td><td>${money(x.amount)}</td><td><button class="btn danger small" type="button" onclick="removeBillLine('${x.id}')">Remove</button></td></tr>`
 ).join("");

 return table(["#","Product","Pack","Batch (internal)","Expiry (internal)","Qty","Free","Rate","Dist %","GST","Amount","Action"],rows);
}

function renderDraftLinesIntoPage(){
 if($("draftLineTable"))$("draftLineTable").innerHTML=renderDraftLines();
}

function removeBillLine(id){
 draftLines=draftLines.filter(x=>x.id!==id);
 renderDraftLinesIntoPage();
 updateBillTotal();
}

function getLineTotals(){
 const subtotal=draftLines.reduce((s,x)=>s+Math.max(0,num(x.qty)*num(x.rate)*(1-num(x.dist)/100)-num(x.discount)),0);
 const gst=draftLines.reduce((s,x)=>s+num(x.tax),0);
 const billDiscount=cleanQty($("tBillDiscount")?.value);
 const round=num($("tRound")?.value);

 return {
  subtotal,
  gst,
  billDiscount,
  round,
  total:Math.max(0,subtotal+gst-billDiscount+round)
 };
}

function updateBillTotal(){
 if(!$("tTotal"))return;

 const t=getLineTotals();

 $("tSubtotal").textContent=money(t.subtotal);
 $("tGstTotal").textContent=money(t.gst);
 $("tDiscountShow").textContent=money(t.billDiscount);
 $("tRoundShow").textContent=money(t.round);
 $("tTotal").textContent=money(t.total);
}

function normalizedBatchName(v){
 return String(v||"").trim()||"NO BATCH";
}

function findOrCreateBatch(line){
 const name=normalizedBatchName(line.batch);
 const expiry=String(line.expiry||"");

 let b=db.batches.find(x=>
  x.itemId===line.itemId &&
  normalizedBatchName(x.batch).toLowerCase()===name.toLowerCase() &&
  String(x.expiry||"")===expiry
 );

 if(!b){
  b={
   id:uid(),
   itemId:line.itemId,
   batch:name,
   expiry,
   qty:0,
   rate:cleanQty(line.rate),
   mrp:cleanQty(line.mrp)
  };

  db.batches.push(b);
 }

 return b;
}

function saveTransaction(e,kind){
 e.preventDefault();

 if(!draftLines.length)return alert("Bill save করার আগে অন্তত একটি পণ্য যোগ করো।");

 const purchase=kind==="purchase";
 const key=purchase?"purchases":"bills";
 const no=$("tNo").value.trim();

 if(!no)return alert("Voucher number তৈরি হয়নি। আবার নতুন voucher খুলুন。");

 if(db[key].some(x=>String(x.no||"").toLowerCase()===no.toLowerCase())){
  return alert("এই voucher number আগে থেকেই আছে। নতুন voucher খুলুন।");
 }

 // Existing item অথবা draft-এ তৈরি নতুন item—দুটিই গ্রহণযোগ্য।
 for(const line of draftLines){
  if(!db.items.some(i=>i.id===line.itemId)&&!line.newItem){
   return alert("একটি পণ্য আর পাওয়া যাচ্ছে না। Bill পরীক্ষা করো।");
  }
 }

 if(!purchase){
  const required={};

  for(const l of draftLines){
   if(!l.batchId)return alert("একটি sales line-এ batch নির্দিষ্ট নেই। Item আবার নির্বাচন করো।");
   required[l.batchId]=(required[l.batchId]||0)+num(l.qty)+num(l.free);
  }

  for(const [id,qty] of Object.entries(required)){
   const b=db.batches.find(x=>x.id===id);

   if(!b||cleanQty(b.qty)+.000001<qty){
    return alert("একটি batch-এর stock পর্যাপ্ত নেই। Bill পরীক্ষা করো।");
   }

   if(b.expiry&&daysToExpiry(b.expiry)<0){
    return alert("Expired batch বিক্রি করা যাবে না।");
   }
  }
 }

 const totals=getLineTotals();

 if(totals.billDiscount>totals.subtotal+totals.gst+.000001){
  return alert("Bill discount মোট বিলের চেয়ে বেশি হতে পারে না।");
 }

 const party=$("tParty").value||"Cash / Walk-in";

 const x={
  id:uid(),
  no,
  date:$("tDate").value,

  invoiceNo:purchase?($("tInvoiceNo")?.value.trim()||""):"",
  invoiceDate:purchase?($("tInvoiceDate")?.value||""):"",

  party,
  kind,

  // Internal draft metadata স্থায়ী Voucher-এ রাখা হবে না।
  lines:draftLines.map(l=>{
   const copy={...l};
   delete copy.newItem;
   return copy;
  }),

  subtotal:totals.subtotal,
  gstTotal:totals.gst,
  discount:totals.billDiscount,
  roundOff:totals.round,
  total:totals.total,

  address:$("tAddress")?.value||"",
  phone:$("tMobile")?.value||"",
  doctor:$("tDoctor")?.value||"",
  regNo:$("tReg")?.value||"",
  note:$("tNote")?.value||"",
  createdAt:new Date().toISOString()
 };

 x.item=draftLines.map(l=>l.item).join(", ");
 x.qty=draftLines.reduce((s,l)=>s+num(l.qty),0);
 x.itemId=draftLines.length===1?draftLines[0].itemId:"";
 x.rate=draftLines.length===1?draftLines[0].rate:0;

 if(purchase){
  // নতুন Item Master-এ একবারই যোগ হবে।
  const pendingItems=new Map();

  for(const line of draftLines){
   if(line.newItem&&!db.items.some(i=>i.id===line.itemId)){
    pendingItems.set(line.itemId,line.newItem);
   }
  }

  for(const item of pendingItems.values()){
   db.items.push({...item});
  }

  // Stock কেবল এই batch update-এই বাড়বে।
  const prepared=draftLines.map(line=>({
   line,
   b:findOrCreateBatch(line)
  }));

  prepared.forEach(({line,b})=>{
   b.qty=cleanQty(b.qty)+num(line.qty)+num(line.free);
   b.rate=cleanQty(line.rate);
   b.mrp=cleanQty(line.mrp||b.mrp||0);
  });

 }else{
  const required={};

  draftLines.forEach(l=>{
   required[l.batchId]=(required[l.batchId]||0)+num(l.qty)+num(l.free);
  });

  for(const [id,qty] of Object.entries(required)){
   const b=db.batches.find(z=>z.id===id);
   b.qty=cleanQty(b.qty-qty);
  }
 }

 reconcileAll();
 db[key].push(x);
 save();

 const copy={...x,company:{...db.company}};

 draftLines=[];
 render();

 if(confirm("Voucher saved. Invoice print করতে চাও?")){
  printObject(copy);
 }
}

function saveStockAdjustment(e){e.preventDefault();const item=db.items.find(i=>i.id===$("adjItem").value),qty=num($("adjQty").value),kind=$("adjType").value;if(!item||qty<=0)return alert("Item ও valid quantity দিন।");let batch=db.batches.find(b=>b.itemId===item.id&&String(b.batch||"")==="ADJUSTMENT");if(!batch){batch={id:uid(),itemId:item.id,batch:"ADJUSTMENT",expiry:"",qty:0,rate:num(item.purchaseRate),mrp:num(item.mrp)};db.batches.push(batch);}if(kind==="increase")batch.qty=cleanQty(batch.qty+qty);else{if(cleanQty(item.qty)<qty)return alert("বর্তমান stock-এর চেয়ে বেশি কমানো যাবে না।");let remaining=qty;for(const b of db.batches.filter(x=>x.itemId===item.id)){const take=Math.min(cleanQty(b.qty),remaining);b.qty-=take;remaining-=take;if(remaining<=0)break;}}db.adjustments.push({id:uid(),date:today(),itemId:item.id,item:item.name,type:kind,qty,note:$("adjNote").value.trim(),createdAt:new Date().toISOString()});reconcileItem(item.id);save();render();alert("Stock adjustment saved.");}
function saveStockTransfer(e){e.preventDefault();const item=db.items.find(i=>i.id===$("trItem").value),qty=num($("trQty").value);if(!item||qty<=0)return alert("Item ও valid quantity দিন।");if(cleanQty(item.qty)<qty)return alert("পর্যাপ্ত stock নেই।");const target=$("trTo").value;if($("trFrom").value==target)return alert("From ও To আলাদা Godown হতে হবে।");db.transfers.push({id:uid(),date:today(),itemId:item.id,item:item.name,qty,from:$("trFrom").value,to:target,note:$("trNote").value.trim()});save();render();alert("Transfer history saved. Existing stock totals were not changed because legacy batch data has no godown allocation.");}
function stockPage(){

 const totalQty=db.items.reduce((s,i)=>s+cleanQty(i.qty),0),value=db.batches.reduce((s,b)=>s+cleanQty(b.qty)*cleanQty(b.rate),0);
 return `${head("Stock Summary","Inventory Position · Batch-wise stock")}<div class="stats">${stat("Total Items",db.items.length)}${stat("Total Quantity",totalQty)}${stat("Stock Purchase Value",money(value))}${stat("Low / Zero Stock",db.items.filter(i=>cleanQty(i.qty)<=(num(i.minStock)||5)).length)}</div>
 <div class="card"><h3>Godown / Store Setup</h3><form onsubmit="event.preventDefault();saveGodown()"><div class="formgrid"><div class="field"><label>New Godown Name</label><input id="gName" placeholder="Main Store / Branch"></div><div class="field"><label>Existing Godowns</label><input readonly value="${esc(db.godowns.map(g=>g.name).join(' · '))}"></div></div><div class="form-actions"><button class="btn">Add Godown</button></div></form></div>

function daysToExpiry(expiry){if(!expiry)return Infinity;const parts=String(expiry).split("-").map(Number);if(parts.length<2||!parts[0]||!parts[1])return Infinity;const expiryDate=new Date(parts[0],parts[1],0,23,59,59),now=new Date();now.setHours(0,0,0,0);return Math.ceil((expiryDate-now)/(24*60*60*1000))}
function expiryPage(){
 const search=($("expirySearch")?.value||"").toLowerCase();

 const expired=list.filter(b=>daysToExpiry(b.expiry)<0).length,soon=list.filter(b=>daysToExpiry(b.expiry)>=0&&daysToExpiry(b.expiry)<=60).length;
 const rows=list.map(b=>{const days=daysToExpiry(b.expiry),status=!b.expiry?"No expiry entered":days<0?"EXPIRED":days<=30?"Expires within 30 days":days<=60?"Expires within 60 days":"OK";return `<tr><td>${esc(b.itemName)}</td><td>${esc(b.batch||"—")}</td><td>${esc(b.expiry||"—")}</td><td>${cleanQty(b.qty)}</td><td>${money(b.rate)}</td><td class="${days<0?"warning":days<=60?"warning":"success"}">${esc(status)}</td><td>${Number.isFinite(days)?days+" days":"—"}</td></tr>`}).join("");
 return `${head("Batch / Expiry Alerts","Available batches and expiry tracking")}<div class="stats">${stat("Active Batches",list.length)}${stat("Expired Batches",expired)}${stat("Expiring in 60 Days",soon)}${stat("Without Expiry",list.filter(b=>!b.expiry).length)}</div><div class="notice">Expiry alerts work when a batch has an expiry month entered. Expiry is treated as the final day of the selected month.</div><div class="card"><div class="view-head"><h3>Batch Register</h3><input id="expirySearch" class="searchbox" style="max-width:260px" placeholder="Search item / batch..." value="${esc(search)}" oninput="refreshExpiry()"></div>${table(["Item","Batch No.","Expiry Month","Available Qty","Purchase Rate","Status","Days Left"],rows)}</div>`;
}

/* DELETE / BACKUP / RESTORE */
function recordLines(x){if(Array.isArray(x.lines))return x.lines;if(x.itemId)return [{itemId:x.itemId,batchId:"",batch:"",expiry:"",qty:num(x.qty),free:0,rate:num(x.rate)}];return []}
function resolveLineBatch(line){return db.batches.find(b=>line.batchId&&b.id===line.batchId)||db.batches.find(b=>b.itemId===line.itemId&&normalizedBatchName(b.batch).toLowerCase()===normalizedBatchName(line.batch).toLowerCase()&&String(b.expiry||"")===String(line.expiry||""))}
function deleteRecord(key,id){
 const x=db[key]?.find(r=>r.id===id);if(!x)return;if(!confirm("এই record delete করবে?"))return;
 if(key==="bills"||key==="purchases"){

/* SHREE ERP — UNIVERSAL KEYBOARD NAVIGATION */
(function () {
  "use strict";

  const $ = id => document.getElementById(id);
  const ARROWS = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
  const QUICK_SELECTOR =
    ".quickgrid, .quick-actions, .quick-access, .quicklinks";

  function visible(el) {
    return !!el &&
      el.isConnected &&
      el.getClientRects().length > 0 &&
      !el.disabled &&
      el.tabIndex !== -1 &&
      !el.closest("[hidden], [aria-hidden='true'], [inert]");
  }

  function typing(el) {
    return el instanceof HTMLElement &&
      (el.matches("input, textarea") || el.isContentEditable);
  }

  function textField(el) {
    return el instanceof HTMLElement &&
      el.matches(
        'input:not([type="hidden"]):not([type="button"]):not([type="submit"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]), textarea'
      );
  }

  function modalOpen() {
    const root = $("modalRoot");
    return !!root && !!root.innerHTML.trim();
  }

  function closeOrBack() {
    if (modalOpen()) {
      if (typeof closeModal === "function") closeModal();
      return;
    }

    if (typeof view !== "undefined" && view !== "dashboard") {
      if (typeof goBack === "function") goBack();
    }
  }

  function getScope(el) {
    return el.closest(QUICK_SELECTOR) ||
      el.closest(".modal-bg") ||
      el.closest("form") ||
      el.closest("main") ||
      $("app") ||
      document.body;
  }

  function getControls(scope) {
    return [...scope.querySelectorAll(
      'input:not([type="hidden"]):not([type="button"]):not([type="submit"]):not([type="reset"]), select, textarea, button:not(:disabled), a[href], [role="button"], [tabindex="0"]'
    )].filter(el =>
      visible(el) &&
      !el.readOnly &&
      !el.matches("[aria-disabled='true']")
    );
  }

  function focusControl(el) {
    if (!el) return;
    el.focus();

    if (
      el.matches &&
      el.matches('input[type="text"], input[type="search"], input[type="tel"], input[type="email"]')
    ) {
      try { el.select(); } catch (_) {}
    }
  }

  function moveSequential(el, step) {
    const controls = getControls(getScope(el));
    const index = controls.indexOf(el);
    if (index < 0) return false;

    const next = controls[index + step];
    if (!next) return false;

    focusControl(next);
    return true;
  }

  function moveInGrid(e, el, area) {
    const buttons = [...area.querySelectorAll(
      "button:not(:disabled), a[href], [role='button']"
    )].filter(visible);

    const current = el.closest(
      "button:not(:disabled), a[href], [role='button']"
    );
    const index = buttons.indexOf(current);

    if (!buttons.length || index < 0) return false;

    const style = getComputedStyle(area);
    const columns = Math.max(
      1,
      style.gridTemplateColumns.split(" ").filter(Boolean).length
    );

    let next = index;

    if (e.key === "ArrowRight") next = Math.min(index + 1, buttons.length - 1);
    if (e.key === "ArrowLeft") next = Math.max(index - 1, 0);
    if (e.key === "ArrowDown") next = Math.min(index + columns, buttons.length - 1);
    if (e.key === "ArrowUp") next = Math.max(index - columns, 0);

    e.preventDefault();
    buttons[next].focus();
    return true;
  }

  function handleArrow(e, el) {
    if (!ARROWS.includes(e.key)) return false;

    /* Keep native caret movement inside text and multiline fields */
    if (el.isContentEditable || el.tagName === "TEXTAREA") return false;

    /* Arrow keys inside a select should control its options */
    if (el.tagName === "SELECT") return false;

    const quickArea = el.closest(QUICK_SELECTOR);
    if (
      quickArea &&
      el.closest("button:not(:disabled), a[href], [role='button']")
    ) {
      return moveInGrid(e, el, quickArea);
    }

    /* Left/right normally move the text cursor.
       At the edge, they can move between fields. */
    if (textField(el)) {
      if (e.key === "ArrowUp") {
        e.preventDefault();
        return moveSequential(el, -1);
      }

      if (e.key === "ArrowDown") {
        e.preventDefault();
        return moveSequential(el, 1);
      }

      if (
        e.key === "ArrowLeft" &&
        typeof el.selectionStart === "number" &&
        el.selectionStart === 0 &&
        el.selectionEnd === 0
      ) {
        e.preventDefault();
        return moveSequential(el, -1);
      }

      if (
        e.key === "ArrowRight" &&
        typeof el.selectionEnd === "number" &&
        el.selectionEnd === el.value.length
      ) {
        e.preventDefault();
        return moveSequential(el, 1);
      }

      return false;
    }

    /* Other fields and buttons */
    if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
      e.preventDefault();
      return moveSequential(el, -1);
    }

    if (e.key === "ArrowDown" || e.key === "ArrowRight") {
      e.preventDefault();
      return moveSequential(el, 1);
    }

    return false;
  }

  document.addEventListener("keydown", function (e) {
    const el = e.target;
    if (!(el instanceof HTMLElement)) return;

    /* Keep browser and operating-system shortcuts intact */
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    /* ESC */
    if (e.key === "Escape") {
      if (
        modalOpen() ||
        (typeof view !== "undefined" && view !== "dashboard")
      ) {
        e.preventDefault();
        closeOrBack();
      }
      return;
    }

    /* F1 — Doctor */
    if (e.key === "F1") {
      if (
        typeof view !== "undefined" &&
        ["retail", "wholesale"].includes(view)
      ) {
        const doctor = $("tDoctor");
        if (doctor) {
          e.preventDefault();
          doctor.focus();
        }
      }
      return;
    }

    /* F2 — Party picker */
    if (e.key === "F2") {
      if (typeof openPartyPicker === "function") {
        e.preventDefault();
        openPartyPicker();
      }
      return;
    }

    /* F3 — Rename customer */
    if (e.key === "F3") {
      if (typeof renameCustomer === "function") {
        e.preventDefault();
        renameCustomer();
      }
      return;
    }

    /* F4 — Retail billing */
    if (e.key === "F4") {
      if (typeof go === "function") {
        e.preventDefault();
        go("retail");
      }
      return;
    }

    /* Arrow navigation for fields, buttons, and menus */
    if (handleArrow(e, el)) return;

    /* ENTER — move through ordinary form fields */
    if (e.key === "Enter" && !e.shiftKey) {
      if (el.tagName === "TEXTAREA" || el.isContentEditable) return;

      /* Native button Enter must still click the button */
      if (el.matches("button, a[href], [role='button']")) return;

      /* Let checkboxes, radios, and file inputs keep native behavior */
      if (["checkbox", "radio", "file"].includes(el.type)) return;

      /* Let Enter select the currently highlighted dropdown option */
      if (el.tagName === "SELECT") return;

      /* Existing item lookup */
      if (
        el.id === "lineSearch" &&
        typeof db !== "undefined" &&
        db.items
      ) {
        const value = el.value.trim().toLowerCase();
        const item = db.items.find(i =>
          [i.name, i.code, i.barcode, i.id].some(v =>
            String(v || "").toLowerCase() === value
          )
        );

        if (item) {
          e.preventDefault();

          const hidden = $("lineItem");
          if (hidden) hidden.value = item.id;

          if (typeof fillLineRate === "function") fillLineRate();

          moveSequential(el, 1);
          return;
        }
      }

      if (textField(el) || el.tagName === "INPUT") {
        if (el.readOnly) return;

        e.preventDefault();

        if (!moveSequential(el, 1)) {
          const form = el.closest("form");
          const submit = form && form.querySelector(
            'button[type="submit"]:not(:disabled), input[type="submit"]:not(:disabled)'
          );

          if (submit) submit.focus();
        }
      }
      return;
    }

    /* TAB and Shift+TAB remain native */
  }, false);

  /* Visible keyboard focus */
  if (!$("shreeNavigationStyle")) {
    const style = document.createElement("style");
    style.id = "shreeNavigationStyle";
    style.textContent = `
      :focus-visible {
        outline: 2px solid #3b82c4 !important;
        outline-offset: 2px !important;
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      [role="button"]:focus-visible {
        box-shadow: 0 0 0 2px rgba(129,80,216,.25);
      }
    `;
    document.head.appendChild(style);
  }
})();

function menuTarget(label,section){
 const x=String(label).toLowerCase();
 if(/dashboard|wallet|marketplace|message|ticket|help|community|sessions|what's new|update marg|search in all/.test(x))return x.includes("dashboard")?"dashboard":"links";
 if(/item|barcode|unit master|hsn|gst rate|company-wise rack/.test(x))return "items";
 if(/party|customer|supplier|area master|route master|doctor|salesman|credit limit/.test(x))return "parties";
 if(/ledger|outstanding|cash book|bank book|all ledgers/.test(x))return "ledger";
 if(/retail|sale entry|sale return|bill modification|bill conversion|pending bills|open bill|cashier/.test(x))return "retail";
 if(/wholesale/.test(x))return "wholesale";
 if(/purchase/.test(x))return "purchase";
 if(/receipt/.test(x))return "receipt";
 if(/payment|cheque|contra|journal|debit note|credit note|single entry/.test(x))return "payment";
 if(/stock|re-order|inventory|godown|transfer|valuation/.test(x))return "stock";
 if(/expiry/.test(x))return "expiry";
 if(/gstr|gst|hsn\/sac|tax rate|json export/.test(x))return "gst";
 if(/daily|today's gross|business analysis/.test(x))return "daily";
 if(/trial balance|profit|income|expenses|balance sheet|assets|liabilities|cash flow|funds flow|ratio|report|analysis|summary|detail/.test(x))return section==="daily"?"daily":"reports";
 if(/operator|power|rights|control room|setup|password|user|change company|backup|restore|printer|calendar|calculator|financial year/.test(x))return "settings";
 return "";
}
function openMenuOption(label,section){
 const target=menuTarget(label,section);
 if(target){go(target);return;}
 const integration=/whatsapp|email|sms|cloud|google drive|onedrive|banking|e-way|transport|vehicle|distance|erp to erp|send order|receive order|direct call|google maps|pharmanxt|online purchase|subscription|qr code|delivery|challan|operator|user-wise|power|multi editing|multi deletion|my menu|rename my menu|delete my menu|add my menu|modify my menu|calendar|calculator|printer|flush memory|quit|change user|switch over/.test(label.toLowerCase());
 const reason=integration?"এই অপশনটির জন্য আলাদা API, provider credentials, permission অথবা অতিরিক্ত module দরকার। বর্তমান offline browser build-এ এটি সংযুক্ত নয়।":"এই অপশনের আলাদা entry screen এখনও তৈরি হয়নি। এটি menu reference-এ রাখা হয়েছে, কিন্তু completed feature হিসেবে দেখানো হচ্ছে না।";
 $("modalRoot").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head">${esc(label)}</div><div class="modal-body"><p><b>SHREE ERP Feature Status</b></p><p>${esc(reason)}</p><p class="muted">যে core page ইতিমধ্যে আছে, সেটি সংশ্লিষ্ট menu থেকে খোলা যাবে। API বা server সংযোগ ছাড়া external service চালানো সম্ভব নয়।</p><div class="form-actions"><button class="btn primary" onclick="closeModal()">ঠিক আছে</button><button class="btn" onclick="closeModal();go('settings')">Settings</button></div></div></div></div>`;
}
function menuPage(section){
 const data=SHREE_MENU[section];if(!data)return `${head("Menu","Menu reference")}<div class="card">Menu not found.</div>`;
 const groups=data.groups.map(([group,items])=>`<div class="card"><h3>${esc(group)}</h3><div class="quickgrid">${items.map(label=>`<button class="btn" type="button" onclick="openMenuOption(${JSON.stringify(label).replace(/"/g,"&quot;")},${JSON.stringify(section).replace(/"/g,"&quot;")})">${esc(label)}</button>`).join("")}</div></div>`).join("");
 return `${head(data.title,"Menu options based on the supplied MARG ERP 9+ reference tree")}<div class="notice">এটি SHREE ERP-এর menu navigation। অপশন দেখা মানেই MARG-এর official edition-এ থাকা বা external service connected থাকা বোঝায় না।</div>${groups}`;
}

render();
