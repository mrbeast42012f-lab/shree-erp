<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183e70">
<title>SHREE ERP | Business Management</title>
<style>
:root{--navy:#183e70;--blue:#245a96;--light:#eaf1fa;--line:#9eafc5;--bg:#cbd5e2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:12px Tahoma,Arial;color:#172b45}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1600px;margin:auto;background:#e9eef5;min-height:100vh;border:1px solid #526b89}
.titlebar{background:linear-gradient(#426da3,#183e70);color:white;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-size:18px;font-weight:bold}.brand small{display:block;font-size:10px;font-weight:normal}
.btn{border:1px solid #8b9db3;background:linear-gradient(#fff,#dbe5f1);padding:6px 10px;color:#16395f;border-radius:2px;font-weight:bold}
.btn:hover{background:#fff1c9}.btn.primary{background:linear-gradient(#467db8,#1d4c80);color:white;border-color:#173c67}.btn.danger{color:#a00000}
.menubar,.toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#dce6f2;border-bottom:1px solid #8098b6}
.menubar button{border:0;background:transparent;padding:9px;color:#17385f}.menubar button.active,.menubar button:hover{background:white;font-weight:bold}
.workspace{display:grid;grid-template-columns:190px minmax(0,1fr) 190px;gap:7px;padding:7px;min-height:75vh}
.panel{border:1px solid var(--line);background:#f7f9fc;min-width:0}
.panel-title{padding:8px;background:linear-gradient(#edf4fc,#cbd9e9);font-weight:bold;border-bottom:1px solid var(--line)}
.side-link{display:block;width:100%;text-align:left;padding:9px;border:0;border-bottom:1px solid #e0e6ed;background:#f8faff;color:#203d60}
.side-link.active,.side-link:hover{background:#d9e8f9;font-weight:bold}
.center{min-width:0}
.view-head{padding:10px;background:#e3ebf6;border:1px solid var(--line);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h2{font-size:16px;margin:0;color:var(--navy)}h3{font-size:13px;margin:0 0 10px;color:var(--navy)}
.card{background:white;border:1px solid #a6b7ca;padding:12px;margin-bottom:8px}
.banner{padding:18px;background:linear-gradient(115deg,#173b69,#3979b8);color:white;margin-bottom:8px}
.banner h2{color:white;font-size:22px;margin-bottom:7px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:8px}
.stat{border:1px solid #a6b7ca;background:white;padding:12px 9px}.stat strong{font-size:18px;color:#1c4779}
.stat .label{color:#586b82;margin-bottom:7px}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field label{font-weight:bold;color:#304a68}
.field input,.field select,.field textarea,.searchbox{width:100%;padding:7px;border:1px solid var(--line);background:white;min-width:0}
.field textarea{min-height:65px}
.form-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.table-wrap{overflow:auto;border:1px solid #a5b4c6;background:white}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th{background:linear-gradient(#eaf1fa,#cbd9e9);color:#173b67;text-align:left}
th,td{border:1px solid #c4cfdd;padding:7px 8px}
tbody tr:nth-child(even){background:#f0f5fb}
.quickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.quickgrid button{min-height:42px}
.notice{padding:9px;border:1px solid #a4b7cb;background:#edf4fc;margin-bottom:8px;line-height:1.5}
.muted{color:#6a7c91}.total-box{background:#edf3fa;border:1px solid #a5b4c6;padding:10px;text-align:right;font-weight:bold}
.statusline{background:#e4ebf4;border-top:1px solid var(--line);padding:7px 10px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.hidden{display:none!important}.warning{color:#a11;font-weight:bold}.success{color:#17602b;font-weight:bold}
.hotkey{background:white;border:1px solid var(--line);padding:3px 6px;margin:2px;font-weight:bold}
@media(max-width:1050px){.workspace{grid-template-columns:160px minmax(0,1fr)}.right-panel{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.workspace{grid-template-columns:1fr;padding:5px}.left-panel{display:none}.formgrid{grid-template-columns:repeat(2,1fr)}.quickgrid{grid-template-columns:repeat(2,1fr)}.menubar button{padding:8px}.toolbar .btn{flex:1}}
@media(max-width:380px){.formgrid{grid-template-columns:1fr}}
@media print{.titlebar,.menubar,.toolbar,.left-panel,.right-panel,.statusline,.no-print{display:none!important}.workspace{display:block}.app{border:0}}
</style>
</head>
<body>
<div class="app">
<header class="titlebar">
 <div class="brand">▦ SHREE ERP <small>BUSINESS MANAGEMENT SYSTEM · 25 MODULE EDITION</small></div>
 <div><button class="btn" onclick="go('company')">Company</button> <button class="btn" onclick="go('settings')">Settings</button></div>
</header>
<nav class="menubar" id="menubar">
 <button data-view="dashboard" onclick="go('dashboard')">Dashboard</button>
 <button data-view="items" onclick="go('items')">Masters</button>
 <button data-view="retail" onclick="go('retail')">Transactions</button>
 <button data-view="accounts" onclick="go('accounts')">Accounts</button>
 <button data-view="reports" onclick="go('reports')">Reports</button>
 <button data-view="gst" onclick="go('gst')">GST</button>
 <button data-view="stock" onclick="go('stock')">Stocks</button>
 <button data-view="modules" onclick="go('modules')">25 Modules</button>
</nav>
<div class="toolbar no-print">
 <button class="btn" onclick="go('retail')">＋ Retail Bill (F4)</button>
 <button class="btn" onclick="go('wholesale')">Wholesale</button>
 <button class="btn" onclick="go('purchase')">Purchase</button>
 <button class="btn" onclick="go('items')">Item Master</button>
 <button class="btn" onclick="go('parties')">Party Master</button>
 <button class="btn" onclick="backup()">Backup</button>
</div>
<div class="workspace">
<aside class="panel left-panel">
 <div class="panel-title">☷ Navigation</div>
 <div id="sideNav"></div>
</aside>
<main class="center" id="main"></main>
<aside class="panel right-panel">
 <div class="panel-title">⚡ Quick Access</div>
 <div style="padding:8px">
 <button class="btn" style="width:100%;margin:3px" onclick="go('retail')">New Retail Bill</button>
 <button class="btn" style="width:100%;margin:3px" onclick="go('wholesale')">Wholesale Bill</button>
 <button class="btn" style="width:100%;margin:3px" onclick="go('purchase')">Purchase Entry</button>
 <button class="btn" style="width:100%;margin:3px" onclick="go('receipt')">Receipt</button>
 <button class="btn" style="width:100%;margin:3px" onclick="go('payment')">Payment</button>
 <button class="btn" style="width:100%;margin:3px" onclick="go('stock')">Stock Register</button>
 <button class="btn" style="width:100%;margin:3px" onclick="go('expiry')">Expiry Alerts</button>
 <button class="btn" style="width:100%;margin:3px" onclick="go('ledger')">Party Ledger</button>
 <button class="btn" style="width:100%;margin:3px" onclick="backup()">Export Backup</button>
 <button class="btn" style="width:100%;margin:3px" onclick="$('restoreFile').click()">Import Backup</button>
 <input id="restoreFile" type="file" accept=".json,application/json" hidden onchange="restoreBackup(event)">
 </div>
</aside>
</div>
<div class="statusline">
 <span id="statusCompany">Company: My Business</span>
 <span id="statusText">Ready</span>
 <span id="statusDate"></span>
 <span>F1 Doctor · F2 Party · F3 Rename · F4 Retail · F6 Rate · Esc Back</span>
</div>
</div>
<script>
"use strict";
const KEY="shree_erp_purple_v2";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const qty=v=>Math.max(0,num(v));
const money=v=>"₹"+num(v).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const blank=()=>({company:{name:"My Business",address:"",phone:"",gstin:""},items:[],parties:[],bills:[],receipts:[],payments:[],purchases:[],batches:[],companies:[],godowns:[],transfers:[],orders:[],challans:[],employees:[],payroll:[],expenses:[],journals:[],banks:[],cheques:[],schemes:[],routes:[],salesmen:[],bom:[],production:[],audit:[],customFields:[],settings:{negativeStock:false,financialYear:""},approvals:[],delivery:[],quotations:[],returns:[],budgets:[],costCentres:[]});
const arrays=["items","parties","bills","receipts","payments","purchases","batches","companies","godowns","transfers","orders","challans","employees","payroll","expenses","journals","banks","cheques","schemes","routes","salesmen","bom","production","audit","customFields","approvals","delivery","quotations","returns","budgets","costCentres"];
function normalizeDB(s){
 let d=blank();
 if(s&&typeof s==="object"){d.company={...d.company,...(s.company||{})};d.settings={...d.settings,...(s.settings||{})};arrays.forEach(k=>d[k]=Array.isArray(s[k])?s[k]:[])}
 d.items=d.items.filter(Boolean).map(x=>({...x,id:String(x.id||uid()),qty:qty(x.qty)}));
 d.parties=d.parties.filter(Boolean).map(x=>({...x,id:String(x.id||uid())}));
 arrays.filter(k=>!["items","parties"].includes(k)).forEach(k=>d[k]=d[k].filter(x=>x&&typeof x==="object").map(x=>({...x,id:String(x.id||uid())})));
 d.batches=d.batches.map(b=>({...b,itemId:String(b.itemId||""),qty:qty(b.qty),rate:qty(b.rate)}));
 if(!d.batches.length)d.items.forEach(i=>{if(i.qty>0)d.batches.push({id:uid(),itemId:i.id,batch:"OPENING",expiry:"",qty:i.qty,rate:qty(i.purchaseRate),mrp:qty(i.mrp),opening:true})});
 d.items.forEach(i=>{let n=d.batches.filter(b=>b.itemId===i.id).reduce((s,b)=>s+qty(b.qty),0);if(i.qty>n+.000001)d.batches.push({id:uid(),itemId:i.id,batch:"OPENING ADJUSTMENT",qty:i.qty-n,rate:qty(i.purchaseRate),opening:true});i.qty=d.batches.filter(b=>b.itemId===i.id).reduce((s,b)=>s+qty(b.qty),0)});
 return d;
}
function load(){try{let raw=localStorage.getItem(KEY);return raw?normalizeDB(JSON.parse(raw)):blank()}catch(e){alert("পুরোনো ডেটা পড়া যায়নি। Backup ফাইল পরীক্ষা করো।");return blank()}}
let db=load(),view="dashboard",draft=[],navHistory=[],ledgerParty="";
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));$("statusText").textContent="Saved"}catch(e){$("statusText").textContent="Save failed";alert("Storage full. Backup নাও।")}updateStatus()}
function updateStatus(){$("statusCompany").textContent="Company: "+(db.company.name||"My Business");$("statusDate").textContent=new Date().toLocaleDateString("en-IN")}
function reconcile(id){let i=db.items.find(x=>x.id===id);if(i)i.qty=db.batches.filter(b=>b.itemId===id).reduce((s,b)=>s+qty(b.qty),0)}
function reconcileAll(){db.items.forEach(i=>reconcile(i.id))}
function head(t,s=""){return `<div class="view-head"><div><h2>${esc(t)}</h2><div class="muted">${esc(s)}</div></div><div><button class="btn" onclick="goBack()">← Back</button> <button class="btn" onclick="go('dashboard')">Home</button></div></div>`}
function stat(t,v){return `<div class="stat"><div class="label">${esc(t)}</div><strong>${v}</strong></div>`}
function table(h,rows,empty="No records found"){return `<div class="table-wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${h.length}" style="text-align:center;padding:20px">${empty}</td></tr>`}</tbody></table></div>`}
const nav=[["Dashboard","dashboard"],["Item Master","items"],["Party Master","parties"],["Company","company"],["Retail Sale","retail"],["Wholesale Sale","wholesale"],["Purchase","purchase"],["Receipt","receipt"],["Payment","payment"],["Stock Summary","stock"],["Batch / Expiry","expiry"],["Party Ledger","ledger"],["Godown","godowns"],["Stock Transfer","transfers"],["Orders / Challan","orders"],["Expenses","expenses"],["Journal","journals"],["Bank / Cheque","banks"],["Employees / Payroll","employees"],["Manufacturing","production"],["Delivery / KOT","delivery"],["Salesman / Route","routes"],["Schemes / Rates","schemes"],["Final Reports","reports"],["GST Reports","gst"],["25 Modules","modules"],["Settings / Backup","settings"]];
function go(v,back=false){if(v===view)return;if(!back&&view)navHistory.push(view);view=v;draft=[];render();window.scrollTo(0,0)}
function goBack(){if(navHistory.length)go(navHistory.pop(),true);else go("dashboard")}
function render(){
 $("sideNav").innerHTML=nav.map(([n,k])=>`<button class="side-link ${view===k?"active":""}" onclick="go('${k}')">${esc(n)}</button>`).join("");
 document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x.dataset.view===view));
 updateStatus();let root=$("main");
 const pages={dashboard,items:itemsPage,parties:partiesPage,company:companyPage,settings:settingsPage,retail:()=>transactionPage("retail"),wholesale:()=>transactionPage("wholesale"),purchase:()=>transactionPage("purchase"),receipt:()=>accountPage("receipt"),payment:()=>accountPage("payment"),stock:stockPage,expiry:expiryPage,ledger:ledgerPage,reports:()=>reportsPage("reports"),gst:()=>reportsPage("gst"),modules:modulesPage,godowns:()=>genericPage("godowns","Godown / Store Master"),transfers:()=>genericPage("transfers","Godown Transfer"),orders:()=>genericPage("orders","Orders / Challan"),expenses:()=>genericPage("expenses","Expense Register"),journals:()=>genericPage("journals","Journal / Contra"),banks:()=>genericPage("banks","Bank / Cheque Register"),employees:()=>genericPage("employees","Employee / Payroll"),production:()=>genericPage("production","Manufacturing / BOM"),delivery:()=>genericPage("delivery","Delivery / KOT"),routes:()=>genericPage("routes","Salesman / Route"),schemes:()=>genericPage("schemes","Schemes / Special Rates")};
 root.innerHTML=(pages[view]||dashboard)();
}
function dashboard(){
 let sales=db.bills.reduce((s,x)=>s+num(x.total),0),purchase=db.purchases.reduce((s,x)=>s+num(x.total),0),todaySales=db.bills.filter(x=>x.date===today()).reduce((s,x)=>s+num(x.total),0);
 let stock=db.items.reduce((s,x)=>s+qty(x.qty),0);
 let recent=[...db.bills,...db.purchases].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,10);
 return `${head("Business Dashboard","SHREE ERP · Classic Edition")}
 <div class="banner"><h2>Welcome to SHREE ERP</h2>Business Management System · Masters · Billing · Inventory · Accounts · GST · Reports</div>
 <div class="stats">${stat("Today's Sales",money(todaySales))}${stat("Total Sales",money(sales))}${stat("Total Purchase",money(purchase))}${stat("Stock Quantity",stock)}</div>
 <div class="card"><h3>Quick Transactions</h3><div class="quickgrid">${[["Retail Bill","retail"],["Wholesale","wholesale"],["Purchase","purchase"],["Receipt","receipt"],["Payment","payment"],["Item Master","items"],["Party Master","parties"],["Stock","stock"],["Reports","reports"]].map(x=>`<button class="btn" onclick="go('${x[1]}')">${x[0]}</button>`).join("")}</div></div>
 <div class="card"><h3>Recent Transactions</h3>${table(["Date","Voucher","Party","Type","Amount"],recent.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.no)}</td><td>${esc(x.party)}</td><td>${esc(x.kind||"Purchase")}</td><td>${money(x.total)}</td></tr>`).join(""))}</div>`;
}
function itemsPage(){
 let rows=db.items.map(i=>`<tr><td>${esc(i.code||"")}</td><td>${esc(i.barcode||"")}</td><td>${esc(i.name)}</td><td>${esc(i.unit||"PCS")}</td><td>${qty(i.qty)}</td><td>${money(i.purchaseRate)}</td><td>${money(i.rate)}</td><td><button class="btn" onclick="editItem('${i.id}')">Edit</button> <button class="btn danger" onclick="delItem('${i.id}')">Del</button></td></tr>`).join("");
 return `${head("Item Master","Product · Barcode · Unit · Purchase / Sale Rate")}<div class="card"><form onsubmit="saveItem(event)"><input type="hidden" id="iId"><div class="formgrid">
 <div class="field"><label>Item Name *</label><input id="iName" required></div><div class="field"><label>Item Code</label><input id="iCode"></div><div class="field"><label>Barcode</label><input id="iBarcode"></div><div class="field"><label>Category</label><input id="iCategory"></div><div class="field"><label>Brand</label><input id="iBrand"></div><div class="field"><label>Unit</label><input id="iUnit" value="PCS"></div><div class="field"><label>Purchase Rate</label><input id="iPurchase" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Sale Rate</label><input id="iRate" type="number" min="0" step=".01" value="0"></div><div class="field"><label>MRP</label><input id="iMrp" type="number" min="0" step=".01" value="0"></div><div class="field"><label>HSN</label><input id="iHsn"></div><div class="field"><label>GST %</label><input id="iGst" type="number" min="0" max="100" value="0"></div><div class="field"><label>Minimum Stock</label><input id="iMin" type="number" min="0" value="0"></div></div><div class="form-actions"><button class="btn primary">Save Item</button><button class="btn" type="button" onclick="render()">Clear</button></div></form></div><div class="card"><h3>Item Register (${db.items.length})</h3>${table(["Code","Barcode","Item","Unit","Qty","Purchase","Sale","Action"],rows)}</div>`;
}
function saveItem(e){e.preventDefault();let id=$("iId").value||uid(),old=db.items.find(x=>x.id===id),name=$("iName").value.trim();if(!name)return alert("Item name required");let x={...(old||{}),id,name,code:$("iCode").value.trim(),barcode:$("iBarcode").value.trim(),category:$("iCategory").value,brand:$("iBrand").value,unit:$("iUnit").value||"PCS",purchaseRate:qty($("iPurchase").value),rate:qty($("iRate").value),mrp:qty($("iMrp").value),hsn:$("iHsn").value,gst:qty($("iGst").value),minStock:qty($("iMin").value),qty:old?qty(old.qty):0};if(db.items.some(a=>a.id!==id&&x.barcode&&a.barcode===x.barcode))return alert("Duplicate barcode");if(old)db.items=db.items.map(a=>a.id===id?x:a);else db.items.push(x);save();render()}
function editItem(id){let x=db.items.find(a=>a.id===id);if(!x)return;render();$("iId").value=x.id;["Name","Code","Barcode","Category","Brand","Unit","Purchase","Rate","Mrp","Hsn","Gst","Min"].forEach((n,j)=>{let ids=["iName","iCode","iBarcode","iCategory","iBrand","iUnit","iPurchase","iRate","iMrp","iHsn","iGst","iMin"];let keys=["name","code","barcode","category","brand","unit","purchaseRate","rate","mrp","hsn","gst","minStock"];$(ids[j]).value=x[keys[j]]??""})}
function delItem(id){if(!confirm("Delete item?"))return;if(db.batches.some(b=>b.itemId===id&&qty(b.qty)>0))return alert("Stock থাকা item delete করা যাবে না");db.items=db.items.filter(x=>x.id!==id);db.batches=db.batches.filter(x=>x.itemId!==id);save();render()}
function partiesPage(){
 let rows=db.parties.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.type)}</td><td>${esc(p.phone||"")}</td><td>${esc(p.gstin||"")}</td><td>${money(p.balance)}</td><td><button class="btn" onclick="editParty('${p.id}')">Edit</button> <button class="btn" onclick="ledgerParty='${p.id}';go('ledger')">Ledger</button> <button class="btn danger" onclick="deleteParty('${p.id}')">Del</button></td></tr>`).join("");
 return `${head("Party Master","Customer · Supplier · Both")}<div class="card"><form onsubmit="saveParty(event)"><input id="pId" type="hidden"><div class="formgrid"><div class="field"><label>Name *</label><input id="pName" required></div><div class="field"><label>Type</label><select id="pType"><option>Customer</option><option>Supplier</option><option>Both</option></select></div><div class="field"><label>Mobile</label><input id="pPhone"></div><div class="field"><label>Address</label><input id="pAddress"></div><div class="field"><label>GSTIN</label><input id="pGstin"></div><div class="field"><label>DL No.</label><input id="pDl"></div><div class="field"><label>Opening Balance</label><input id="pBalance" type="number" step=".01" value="0"></div></div><div class="form-actions"><button class="btn primary">Save Party</button></div></form></div><div class="card">${table(["Name","Type","Phone","GSTIN","Opening Balance","Action"],rows)}</div>`;
}
function saveParty(e){e.preventDefault();let id=$("pId").value||uid(),name=$("pName").value.trim();if(db.parties.some(p=>p.id!==id&&p.name.toLowerCase()===name.toLowerCase()))return alert("Party already exists");let p={id,name,type:$("pType").value,phone:$("pPhone").value,address:$("pAddress").value,gstin:$("pGstin").value,dlNo:$("pDl").value,balance:num($("pBalance").value)};let old=db.parties.find(x=>x.id===id);if(old)db.parties=db.parties.map(x=>x.id===id?p:x);else db.parties.push(p);save();render()}
function editParty(id){let p=db.parties.find(x=>x.id===id);if(!p)return;render();$("pId").value=p.id;$("pName").value=p.name;$("pType").value=p.type||"Customer";$("pPhone").value=p.phone||"";$("pAddress").value=p.address||"";$("pGstin").value=p.gstin||"";$("pDl").value=p.dlNo||"";$("pBalance").value=p.balance||0}
function deleteParty(id){if(!confirm("Delete party?"))return;db.parties=db.parties.filter(p=>p.id!==id);save();render()}
function companyPage(){return `${head("Company Information","Firm details and GSTIN")}<div class="card"><form onsubmit="saveCompany(event)"><div class="formgrid"><div class="field"><label>Company Name</label><input id="cName" required value="${esc(db.company.name)}"></div><div class="field"><label>Phone</label><input id="cPhone" value="${esc(db.company.phone)}"></div><div class="field"><label>GSTIN</label><input id="cGstin" value="${esc(db.company.gstin)}"></div><div class="field"><label>Address</label><textarea id="cAddress">${esc(db.company.address)}</textarea></div></div><button class="btn primary">Save Company</button></form></div>`}
function saveCompany(e){e.preventDefault();db.company={name:$("cName").value.trim(),phone:$("cPhone").value.trim(),gstin:$("cGstin").value.trim(),address:$("cAddress").value.trim()};save();render()}
function nextNo(kind){let key=kind==="purchase"?"purchases":"bills",prefix=kind==="purchase"?"PUR":kind==="retail"?"RS":"WS",nums=db[key].map(x=>Number(String(x.no||"").split("-")[1])||0);return prefix+"-"+String(Math.max(0,...nums)+1).padStart(6,"0")}
function transactionPage(kind){
 let purchase=kind==="purchase",key=purchase?"purchases":"bills",title=purchase?"Purchase Entry":kind==="retail"?"Retail Sale Entry":"Wholesale Sale Entry";
 let records=db[key].slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.no)}</td><td>${esc(x.party)}</td><td>${money(x.total)}</td><td><button class="btn" onclick="printVoucher('${key}','${x.id}')">Print</button> <button class="btn danger" onclick="deleteVoucher('${key}','${x.id}')">Del</button></td></tr>`).join("");
 return `${head(title,"F2 Party · F1 Doctor · F6 Rate · Batch / GST")}
 <div class="card"><form onsubmit="saveTransaction(event,'${kind}')"><div class="formgrid">
 <div class="field"><label>Voucher No.</label><input id="tNo" readonly value="${nextNo(kind)}"></div>
 <div class="field"><label>Date</label><input id="tDate" type="date" required value="${today()}"></div>
 <div class="field"><label>Party</label><select id="tParty"><option value="">Cash / Walk-in</option>${db.parties.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select></div>
 ${kind==="retail"?`<div class="field"><label>Doctor</label><input id="tDoctor"></div>`:""}
 <div class="field"><label>Mobile</label><input id="tMobile"></div><div class="field"><label>Address</label><input id="tAddress"></div>
 </div><div class="card"><h3>Item Entry</h3><div class="formgrid">
 <div class="field"><label>Item / Barcode *</label><input id="lineSearch" list="itemHints" oninput="lookupItem()" autocomplete="off"><datalist id="itemHints">${db.items.map(i=>`<option value="${esc(i.barcode||i.code||i.name)}">`).join("")}</datalist><input id="lineItem" type="hidden"></div>
 <div class="field"><label>Batch</label><select id="lineBatch"><option value="">Auto FIFO</option></select></div>
 <div class="field"><label>Qty</label><input id="lineQty" type="number" min=".01" step=".01" value="1"></div>
 <div class="field"><label>Free Qty</label><input id="lineFree" type="number" min="0" value="0"></div>
 <div class="field"><label>Rate</label><input id="lineRate" type="number" min="0" step=".01" value="0"></div>
 <div class="field"><label>Discount %</label><input id="lineDiscount" type="number" min="0" max="100" value="0"></div>
 <div class="field"><label>GST %</label><input id="lineGst" type="number" min="0" max="100" value="0"></div>
 ${purchase?`<div class="field"><label>Batch No.</label><input id="lineNewBatch"></div><div class="field"><label>Expiry Month</label><input id="lineExpiry" type="month"></div><div class="field"><label>MRP</label><input id="lineMrp" type="number" value="0"></div>`:""}
 </div><div class="form-actions"><button class="btn" type="button" onclick="addLine('${kind}')">＋ Add Item</button><button class="btn" type="button" onclick="clearLine()">Clear</button></div></div>
 <div id="draftTable">${draftTable()}</div><div class="formgrid"><div class="field"><label>Bill Discount ₹</label><input id="tDiscount" type="number" min="0" value="0" oninput="updateTotal()"></div><div class="field"><label>Notes</label><input id="tNote"></div></div>
 <div class="total-box">Net Total: <span id="tTotal">${money(0)}</span></div>
 <div class="form-actions"><button class="btn primary">Save Voucher</button><button class="btn" type="button" onclick="go('${kind}')">New</button></div></form></div>
 <div class="card"><h3>Voucher Register</h3>${table(["Date","Voucher","Party","Total","Action"],records)}</div>`;
}
function lookupItem(){let v=$("lineSearch").value.trim().toLowerCase(),i=db.items.find(x=>[x.name,x.code,x.barcode,x.id].some(z=>String(z||"").toLowerCase()===v));$("lineItem").value=i?.id||"";if(i){$("lineRate").value=i.rate||0;$("lineGst").value=i.gst||0;let bs=db.batches.filter(b=>b.itemId===i.id&&qty(b.qty)>0);$("lineBatch").innerHTML='<option value="">Auto FIFO</option>'+bs.map(b=>`<option value="${b.id}">${esc(b.batch)} · ${qty(b.qty)} · ${esc(b.expiry||"")}</option>`).join("")}}
function addLine(kind){let i=db.items.find(x=>x.id===$("lineItem").value),purchase=kind==="purchase";if(!i&&purchase){let name=$("lineSearch").value.trim();if(!name)return alert("Item name লিখো");i={id:uid(),name,unit:"PCS",qty:0,rate:num($("lineRate").value),purchaseRate:num($("lineRate").value),mrp:num($("lineMrp")?.value)};db.items.push(i)}
 if(!i)return alert("আগে Item Master-এ item তৈরি করো");
 let q=num($("lineQty").value),free=num($("lineFree").value),rate=num($("lineRate").value),disc=num($("lineDiscount").value),gst=num($("lineGst").value);
 if(q<=0||rate<0||disc<0||disc>100||gst<0||gst>100)return alert("Quantity / Rate / Discount / GST পরীক্ষা করো");
 let batchId=$("lineBatch").value,b=db.batches.find(x=>x.id===batchId);
 if(!purchase){let available=b?qty(b.qty):db.batches.filter(x=>x.itemId===i.id).reduce((s,x)=>s+qty(x.qty),0);if(!db.settings.negativeStock&&available<q+free)return alert("Stock কম। Available: "+available)}
 let base=q*rate*(1-disc/100),tax=base*gst/100;
 draft.push({itemId:i.id,item:i.name,qty:q,free,rate,discount:disc,gst,base,tax,amount:base+tax,batchId,batch:b?.batch||$("lineNewBatch")?.value||"",expiry:$("lineExpiry")?.value||"",mrp:num($("lineMrp")?.value)});
 $("lineQty").value=1;clearLine(false);$("draftTable").innerHTML=draftTable();updateTotal();
}
function clearLine(focus=true){["lineSearch","lineItem","lineRate","lineBatch","lineFree","lineDiscount","lineGst","lineNewBatch","lineExpiry","lineMrp"].forEach(id=>{if($(id))$(id).value=""});if($("lineQty"))$("lineQty").value=1;if(focus)$("lineSearch")?.focus()}
function draftTable(){return table(["Item","Batch","Qty","Free","Rate","GST","Amount","Action"],draft.map((x,n)=>`<tr><td>${esc(x.item)}</td><td>${esc(x.batch)}</td><td>${x.qty}</td><td>${x.free}</td><td>${money(x.rate)}</td><td>${x.gst}%</td><td>${money(x.amount)}</td><td><button class="btn danger" type="button" onclick="draft.splice(${n},1);$('draftTable').innerHTML=draftTable();updateTotal()">Del</button></td></tr>`).join(""))}
function updateTotal(){let s=draft.reduce((a,x)=>a+x.amount,0),d=num($("tDiscount")?.value),total=Math.max(0,s-d);if($("tTotal"))$("tTotal").textContent=money(total);return total}
function saveTransaction(e,kind){e.preventDefault();if(!draft.length)return alert("কমপক্ষে একটি item যোগ করো");let purchase=kind==="purchase",total=updateTotal(),key=purchase?"purchases":"bills",no=$("tNo").value;if(db[key].some(x=>x.no===no))return alert("Voucher duplicate");let lines=draft.map(x=>({...x}));for(let l of lines){if(purchase){let b=db.batches.find(x=>x.id===l.batchId&&x.itemId===l.itemId);if(!b){b={id:uid(),itemId:l.itemId,batch:l.batch||"NO BATCH",expiry:l.expiry,qty:0,rate:l.rate,mrp:l.mrp};db.batches.push(b)}b.qty=qty(b.qty)+l.qty+l.free;let i=db.items.find(x=>x.id===l.itemId);i.purchaseRate=l.rate;i.mrp=l.mrp||i.mrp}else{let bs=l.batchId?[db.batches.find(b=>b.id===l.batchId)].filter(Boolean):db.batches.filter(b=>b.itemId===l.itemId&&qty(b.qty)>0).sort((a,b)=>String(a.expiry||"9999-12").localeCompare(String(b.expiry||"9999-12")));let remaining=l.qty+l.free;for(let b of bs){let take=Math.min(remaining,qty(b.qty));b.qty=qty(b.qty)-take;remaining-=take;if(!remaining)break}if(remaining>0&&!db.settings.negativeStock)return alert("Stock changed; voucher not saved")}}
 let x={id:uid(),kind,no,date:$("tDate").value,party:$("tParty").value||"Cash / Walk-in",phone:$("tMobile").value,address:$("tAddress").value,doctor:$("tDoctor")?.value||"",lines,subtotal:lines.reduce((s,l)=>s+l.base,0),gstTotal:lines.reduce((s,l)=>s+l.tax,0),discount:num($("tDiscount").value),total,createdAt:new Date().toISOString(),note:$("tNote").value};db[key].push(x);reconcileAll();db.audit.push({id:uid(),date:today(),action:"SAVE "+kind,ref:no});save();draft=[];render();alert("Voucher saved")}
function accountPage(kind){let key=kind==="receipt"?"receipts":"payments";let rows=db[key].slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.no)}</td><td>${esc(x.party)}</td><td>${money(x.amount)}</td><td><button class="btn danger" onclick="deleteAccount('${key}','${x.id}')">Del</button></td></tr>`).join("");return `${head(kind==="receipt"?"Receipt Entry":"Payment Entry","Cash / Bank Register")}<div class="card"><form onsubmit="saveAccount(event,'${key}')"><div class="formgrid"><div class="field"><label>Voucher No.</label><input id="aNo" required value="${kind==="receipt"?"REC":"PAY"}-${Date.now().toString().slice(-6)}"></div><div class="field"><label>Date</label><input id="aDate" type="date" required value="${today()}"></div><div class="field"><label>Party</label><select id="aParty"><option>Cash Account</option>${db.parties.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select></div><div class="field"><label>Mode</label><select id="aMode"><option>Cash</option><option>Bank</option><option>UPI</option><option>Cheque</option></select></div><div class="field"><label>Amount</label><input id="aAmount" type="number" min=".01" step=".01" required></div><div class="field"><label>Narration</label><input id="aNote"></div></div><button class="btn primary">Save Entry</button></form></div><div class="card">${table(["Date","Voucher","Party","Amount","Action"],rows)}</div>`}
function saveAccount(e,key){e.preventDefault();let no=$("aNo").value.trim(),amount=num($("aAmount").value);if(amount<=0)return alert("Amount invalid");if(db[key].some(x=>x.no===no))return alert("Duplicate voucher");db[key].push({id:uid(),no,date:$("aDate").value,party:$("aParty").value,mode:$("aMode").value,amount,note:$("aNote").value});save();render()}
function deleteAccount(k,id){if(confirm("Delete entry?")){db[k]=db[k].filter(x=>x.id!==id);save();render()}}
function stockPage(){let rows=db.items.map(i=>`<tr><td>${esc(i.code)}</td><td>${esc(i.barcode)}</td><td>${esc(i.name)}</td><td>${esc(i.unit)}</td><td>${qty(i.qty)}</td><td>${money(i.purchaseRate)}</td><td>${money(qty(i.qty)*num(i.purchaseRate))}</td></tr>`).join("");return `${head("Stock Summary","Item-wise inventory and valuation")}<div class="stats">${stat("Items",db.items.length)}${stat("Total Qty",db.items.reduce((s,i)=>s+qty(i.qty),0))}${stat("Batches",db.batches.length)}${stat("Low Stock",db.items.filter(i=>qty(i.qty)<=qty(i.minStock)).length)}</div><div class="card">${table(["Code","Barcode","Item","Unit","Qty","Purchase Rate","Value"],rows)}</div>`}
function expiryPage(){let rows=db.batches.filter(b=>qty(b.qty)>0).map(b=>{let i=db.items.find(x=>x.id===b.itemId),d=b.expiry?Math.ceil((new Date(Number(b.expiry.slice(0,4)),Number(b.expiry.slice(5,7)),0)-new Date())/86400000):Infinity;return `<tr><td>${esc(i?.name||"Unknown")}</td><td>${esc(b.batch)}</td><td>${esc(b.expiry||"—")}</td><td>${qty(b.qty)}</td><td class="${d<0?"warning":d<=60?"warning":"success"}">${d===Infinity?"No expiry":d<0?"Expired":d+" days"}</td></tr>`}).join("");return `${head("Batch / Expiry Alerts","Batch-wise expiry monitoring")}<div class="card">${table(["Item","Batch","Expiry","Qty","Status"],rows)}</div>`}
function ledgerPage(){let p=db.parties.find(x=>x.id===ledgerParty)||db.parties[0];if(!p)return `${head("Party Ledger")}<div class="card">Party Master-এ party যোগ করো।</div>`;ledgerParty=p.id;let name=p.name,entries=[];db.bills.filter(x=>x.party===name).forEach(x=>entries.push({date:x.date,no:x.no,type:"Sale",dr:x.total,cr:0}));db.purchases.filter(x=>x.party===name).forEach(x=>entries.push({date:x.date,no:x.no,type:"Purchase",dr:0,cr:x.total}));db.receipts.filter(x=>x.party===name).forEach(x=>entries.push({date:x.date,no:x.no,type:"Receipt",dr:0,cr:x.amount}));db.payments.filter(x=>x.party===name).forEach(x=>entries.push({date:x.date,no:x.no,type:"Payment",dr:x.amount,cr:0}));entries.sort((a,b)=>String(a.date).localeCompare(String(b.date)));let bal=num(p.balance),rows=entries.map(x=>{bal+=num(x.dr)-num(x.cr);return `<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.no)}</td><td>${money(x.dr)}</td><td>${money(x.cr)}</td><td>${money(Math.abs(bal))} ${bal>=0?"Dr":"Cr"}</td></tr>`}).join("");return `${head("Party Ledger",name)}<div class="card"><select onchange="ledgerParty=this.value;render()">${db.parties.map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select> <button class="btn" onclick="window.print()">Print</button></div><div class="card">${table(["Date","Type","Voucher","Debit","Credit","Balance"],rows)}</div>`}
function reportsPage(kind){let sales=db.bills.reduce((s,x)=>s+num(x.total),0),pur=db.purchases.reduce((s,x)=>s+num(x.total),0),rec=db.receipts.reduce((s,x)=>s+num(x.amount),0),pay=db.payments.reduce((s,x)=>s+num(x.amount),0);if(kind==="gst"){let rows=db.bills.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.no)}</td><td>${esc(x.party)}</td><td>${money(x.subtotal)}</td><td>${money(x.gstTotal)}</td><td>${money(x.total)}</td></tr>`).join("");return `${head("GST Summary","Invoice-level tax totals")}<div class="notice">এই পেজটি GST summary; সরকারি GST return filing নয়।</div><div class="card">${table(["Date","Invoice","Party","Taxable","GST","Total"],rows)}</div>`}return `${head("Final Reports","Business Summary")}<div class="stats">${stat("Sales",money(sales))}${stat("Purchase",money(pur))}${stat("Receipt",money(rec))}${stat("Payment",money(pay))}</div><div class="card"><button class="btn" onclick="window.print()">Print Report</button>${table(["Metric","Value"],[["Sales",sales],["Purchase",pur],["Receipt",rec],["Payment",pay]].map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td></tr>`).join(""))}</div>`}
function genericPage(key,title){let list=db[key]||[],rows=list.map(x=>`<tr><td>${esc(x.name||x.title||x.ref||"")}</td><td>${esc(x.type||x.date||"")}</td><td>${esc(x.note||x.details||"")}</td><td><button class="btn danger" onclick="genericDelete('${key}','${x.id}')">Del</button></td></tr>`).join("");return `${head(title,"Local register")}<div class="card"><form onsubmit="genericAdd(event,'${key}')"><div class="formgrid"><div class="field"><label>Name / Reference</label><input id="gName" required></div><div class="field"><label>Type / Date</label><input id="gType"></div><div class="field"><label>Notes</label><input id="gNote"></div></div><button class="btn primary">Add Record</button></form></div><div class="card">${table(["Name","Type","Notes","Action"],rows)}</div>`}
function genericAdd(e,k){e.preventDefault();db[k].push({id:uid(),name:$("gName").value,type:$("gType").value,note:$("gNote").value,date:today()});save();render()}
function genericDelete(k,id){if(confirm("Delete?")){db[k]=db[k].filter(x=>x.id!==id);save();render()}}
function modulesPage(){let modules=["Company / Firm & Financial Year","Item / Party / Master Data","Inventory & Stock Alerts","Godown / Multi-store","Retail / Wholesale / POS Sales","Purchase / Purchase Order","Batch / Manufacturing / Expiry","Rate / Discount / Schemes","Advanced Billing / Barcode","Accounting / Ledger","GST Summary / HSN","Invoice / Label / Printing","Reports / MIS","Dashboard Analytics","User / Operator / Audit","Delivery / Dispatch / KOT","Salesman / Area / Route","Employee / Payroll","BOM / Manufacturing","Pharmacy / Expiry Records","Special Business Registers","SMS / Email Reminders","Import / Export / Integration","Custom Fields / Configuration","Backup / Restore / Recovery"];return `${head("25 ERP Modules","Module availability and integration status")}<div class="notice">Local modules work inside this browser. External services such as SMS, email, GST filing, cloud sync, multi-user login and SQL server require provider credentials, server and API integration.</div><div class="card">${table(["#","Module","Status"],modules.map((m,i)=>`<tr><td>${i+1}</td><td>${m}</td><td>${i===10?"GST summary only":i===21||i===22?"External integration required":"Local module / register"}</td></tr>`).join(""))}</div>`}
function settingsPage(){return `${head("Settings & Backup","Local browser database")}<div class="card"><p>Storage key: <b>${KEY}</b></p><p>Items ${db.items.length} · Parties ${db.parties.length} · Sales ${db.bills.length} · Purchases ${db.purchases.length} · Batches ${db.batches.length}</p><button class="btn primary" onclick="backup()">Export Backup</button> <button class="btn" onclick="$('restoreFile').click()">Restore Backup</button> <button class="btn danger" onclick="clearData()">Clear All Data</button></div><div class="card"><h3>Keyboard Shortcuts</h3>F1 Doctor · F2 Party · F3 Rename · F4 Retail · F6 Rate · Enter Next Field · Esc Back</div>`}
function backup(){let blob=new Blob([JSON.stringify({format:"SHREE-ERP",version:3,exportedAt:new Date().toISOString(),data:db},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="SHREE-ERP-backup-"+today()+".json";a.click();URL.revokeObjectURL(url)}
function restoreBackup(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),source=x.data||x,next=normalizeDB(source);if(!confirm("বর্তমান ডেটা replace হবে। Backup নিয়েছ?"))return;localStorage.setItem(KEY,JSON.stringify(next));db=next;go("dashboard");alert("Backup restored")}catch(err){alert("Invalid backup file")}finally{e.target.value=""}};r.readAsText(f)}
function clearData(){if(confirm("সব ERP data delete হবে। আগে backup নিয়েছ?")&&confirm("শেষবার নিশ্চিত করো")){db=blank();save();go("dashboard")}}
function deleteVoucher(k,id){let x=db[k].find(a=>a.id===id);if(!x||!confirm("Voucher delete করবে?"))return;let purchase=k==="purchases";(x.lines||[]).forEach(l=>{let b=db.batches.find(z=>z.id===l.batchId);if(purchase){if(b&&qty(b.qty)>=l.qty+l.free)b.qty-=l.qty+l.free;else return}else{if(!b){b={id:uid(),itemId:l.itemId,batch:l.batch||"RESTORED",qty:0,rate:l.rate};db.batches.push(b)}b.qty=qty(b.qty)+l.qty+l.free}});db[k]=db[k].filter(a=>a.id!==id);reconcileAll();save();render()}
function printVoucher(k,id){let x=db[k].find(a=>a.id===id);if(!x)return;let w=window.open("","_blank");if(!w)return alert("Popup allow করো");w.document.write(`<html><head><title>${esc(x.no)}</title><style>body{font:13px Arial;padding:25px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #888;padding:7px}h1{color:#183e70}</style></head><body><h1>${esc(db.company.name)}</h1><p>${esc(db.company.address)} · ${esc(db.company.phone)} · ${esc(db.company.gstin)}</p><h2>${esc(x.kind||"Voucher")} ${esc(x.no)}</h2><p>Date: ${esc(x.date)} · Party: ${esc(x.party)}</p><table><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${(x.lines||[]).map(l=>`<tr><td>${esc(l.item)}</td><td>${l.qty}</td><td>${money(l.rate)}</td><td>${money(l.amount)}</td></tr>`).join("")}<tr><th colspan="3">Total</th><th>${money(x.total)}</th></tr></table><script>onload=()=>print()<\/script></body></html>`);w.document.close()}
function renameCustomer(){let old=$("tParty")?.value;if(!old)old=prompt("পুরোনো party name");let p=db.parties.find(x=>x.name===old);if(!p)return alert("Party পাওয়া যায়নি");let n=prompt("নতুন নাম",p.name);if(!n||!n.trim())return;if(db.parties.some(x=>x.id!==p.id&&x.name.toLowerCase()===n.trim().toLowerCase()))return alert("নামটি আছে");p.name=n.trim();["bills","purchases","receipts","payments"].forEach(k=>db[k].forEach(x=>{if(x.party===old)x.party=p.name}));save();render()}
document.addEventListener("keydown",e=>{if(e.ctrlKey||e.altKey||e.metaKey)return;let t=e.target;if(e.key==="Escape"){goBack();return}if(e.key==="F1"){let x=$("tDoctor");if(x){e.preventDefault();x.focus()}return}if(e.key==="F2"){e.preventDefault();if(["retail","wholesale","purchase"].includes(view)){let s=$("tParty");if(s)s.focus()}else go("parties");return}if(e.key==="F3"){e.preventDefault();renameCustomer();return}if(e.key==="F4"){e.preventDefault();go("retail");return}if(e.key==="F6"){e.preventDefault();$("lineRate")?.focus();return}if(e.key==="Enter"&&t.matches("input:not([type=button]):not([type=submit]),select")){if(t.type==="date"||t.type==="checkbox")return;e.preventDefault();let f=t.closest("form"),els=[...f.querySelectorAll("input:not([type=hidden]),select,textarea,button")].filter(x=>!x.disabled&&x.offsetParent!==null),i=els.indexOf(t);if(els[i+1])els[i+1].focus()}});
render();
</script>
