<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#321064">
<title>SHREE ERP | Business Management</title>
<style>
:root{--p:#321064;--d:#210742;--m:#5423a0;--a:#8150d8;--bg:#e8eaf0;--line:#a8b4c6}
*{box-sizing:border-box}
body{margin:0;font:12px Tahoma,Arial,sans-serif;background:#cbd2df;color:#202c40}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus,input:focus,select:focus,textarea:focus{outline:2px solid #8150d8;outline-offset:1px}
.app{max-width:1900px;margin:auto;background:#edf0f6;min-height:100vh;border:1px solid #64728a}
.top{background:linear-gradient(#5423a0,#210742);color:white;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:bold;letter-spacing:1px}.logo small{display:block;font-size:10px;font-weight:normal;margin-top:4px}
nav{display:flex;flex-wrap:wrap;background:#ded8ed;border-bottom:1px solid #a99bbd}
nav button{border:0;border-right:1px solid #c3b6d6;background:transparent;padding:10px;color:#321064}
nav button:hover,nav button.active{background:#fff;font-weight:bold}
.toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:7px;background:#f6f3fa;border-bottom:1px solid #c4b8d5}
.btn{border:1px solid #a7a0b8;background:linear-gradient(white,#ded9e9);color:#321064;padding:6px 10px;border-radius:2px;font-weight:bold}
.btn:hover{background:#eee2ff}.primary{background:linear-gradient(#8150d8,#5423a0);color:white;border-color:#321064}.danger{color:#a00000}
.layout{display:grid;grid-template-columns:190px minmax(0,1fr) 190px;gap:8px;padding:8px;min-height:70vh}
.panel{border:1px solid #aaa3b8;background:#faf9fc;min-width:0}
.pt{background:linear-gradient(#eee8f7,#d7cce9);padding:8px;font-weight:bold;color:#321064;border-bottom:1px solid #b7a8ce}
.link{display:block;width:100%;padding:9px;text-align:left;border:0;border-bottom:1px solid #e7e1ee;background:#faf9fc;color:#321064}
.link:hover,.link.active{background:#e6daf7;font-weight:bold}
main{min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#e4dcef;border:1px solid #b9a9ce;padding:10px;margin-bottom:8px}
h2{font-size:16px;margin:0;color:#321064}h3{font-size:13px;margin:0 0 10px;color:#321064}
.card{padding:10px;background:white;border:1px solid #b8b1c4;margin-bottom:8px;min-width:0}
.banner{padding:18px;background:linear-gradient(110deg,#210742,#5423a0,#8150d8);color:white;margin-bottom:8px}
.banner h2{color:white;font-size:22px;margin-bottom:7px}.banner p{line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:8px}
.stat{background:white;border:1px solid #b9b2c5;padding:12px}.stat span{display:block;color:#647084;margin-bottom:8px}.stat strong{font-size:18px;color:#5423a0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field label{font-weight:bold;color:#384760}
.field input,.field select,.field textarea{width:100%;min-width:0;padding:7px;border:1px solid #aeb6c5;background:white;border-radius:0}
.field input[readonly]{background:#eceef3;color:#586579}
.form-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.tablewrap{overflow:auto;background:white;border:1px solid #b7b2c1}
table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
th{background:linear-gradient(#eee8f7,#d7cce9);color:#321064;text-align:left}
td,th{padding:7px 8px;border:1px solid #d0cbd8}
tbody tr:nth-child(even){background:#f6f3fa}tbody tr:hover{background:#fff0c9}
.empty{text-align:center;padding:25px;color:#67748a}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.quick button{min-height:38px}
.sale{border:1px solid #85749c;background:#e4dcef;margin-bottom:9px}
.salehead{padding:9px;background:linear-gradient(#5423a0,#210742);color:white;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.salehead strong{font-size:14px}
.salelabel{padding:7px 9px;background:linear-gradient(#f0eafa,#d7cce9);border-bottom:1px solid #b9a9ce;font-weight:bold;color:#321064}
.saledetails{padding:10px;background:#faf9fc;border-bottom:1px solid #c0b6cf}
.saledetails .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.saledetails .field input,.saledetails .field select{padding:6px;min-height:29px}
.billgrid{display:grid;grid-template-columns:repeat(5,minmax(90px,1fr));gap:7px;padding:9px;background:#f3eff9}
.billgrid .field input{padding:6px;min-height:29px}
.saleactions{padding:7px;display:flex;gap:5px;flex-wrap:wrap;background:#e1d8ef;border-top:1px solid #b9a9ce}
.totals{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,320px);gap:8px;margin-top:8px}
.summary,.totalbox{padding:10px;border:1px solid #b8b1c4;background:#faf9fc;line-height:1.9}
.totalbox{text-align:right;font-weight:bold}.net{font-size:18px;color:#321064;border-top:1px solid #bbb;padding-top:6px}
.shortcut{padding:8px;background:#e4dcef;border:1px solid #b9a9ce;line-height:1.7;margin-bottom:8px;color:#4e4262}
.status{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#ddd5eb;padding:8px;border-top:1px solid #b9a9ce}
.modalbg{position:fixed;inset:0;background:#0008;z-index:999;display:flex;justify-content:center;align-items:center;padding:12px}
.modal{width:min(550px,100%);background:#f5f1fa;border:1px solid #85749c;max-height:90vh;overflow:auto;padding:12px}
.hide{display:none!important}
@media(max-width:1200px){.layout{grid-template-columns:170px minmax(0,1fr)}.rightpanel{display:none}.billgrid{grid-template-columns:repeat(3,minmax(85px,1fr))}}
@media(max-width:800px){.layout{grid-template-columns:minmax(0,1fr)}.leftpanel{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.saledetails .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.billgrid{grid-template-columns:repeat(2,minmax(85px,1fr))}.totals{grid-template-columns:1fr}}
@media(max-width:480px){.grid,.saledetails .grid{grid-template-columns:1fr}.top{align-items:flex-start}.banner{padding:12px}.banner h2{font-size:19px}.billgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{.top,nav,.toolbar,.leftpanel,.rightpanel,.status,.head button,.saleactions,.shortcut{display:none!important}.layout{display:block;padding:0}.app{border:0}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="logo">▦ SHREE ERP <small>SMART BUSINESS MANAGEMENT SYSTEM</small></div>
 <div><button class="btn" onclick="go('company')">Company</button> <button class="btn" onclick="go('settings')">Settings</button></div>
</header>
<nav>
 <button data-nav="dashboard" onclick="go('dashboard')">Dashboard</button>
 <button data-nav="items" onclick="go('items')">Masters</button>
 <button data-nav="retail" onclick="go('retail')">Bill-Retail</button>
 <button data-nav="wholesale" onclick="go('wholesale')">Bill-Wholesale</button>
 <button data-nav="purchase" onclick="go('purchase')">Purchase</button>
 <button data-nav="receipt" onclick="go('receipt')">Accounts</button>
 <button data-nav="reports" onclick="go('reports')">Final Reports</button>
 <button data-nav="gst" onclick="go('gst')">GST</button>
 <button data-nav="stock" onclick="go('stock')">Stocks</button>
 <button data-nav="ledger" onclick="go('ledger')">Ledger</button>
</nav>
<div class="toolbar">
 <button class="btn primary" onclick="go('retail')">＋ Retail Bill (F4)</button>
 <button class="btn primary" onclick="go('wholesale')">＋ Wholesale Bill</button>
 <button class="btn" onclick="go('purchase')">＋ Purchase</button>
 <button class="btn" onclick="go('items')">Item Master</button>
 <button class="btn" onclick="go('parties')">Party Master</button>
 <button class="btn" onclick="go('stock')">Stock</button>
 <button class="btn" onclick="backup()">Backup</button>
</div>
<div class="layout">
<aside class="panel leftpanel">
 <div class="pt">Navigation</div>
 <button class="link" data-side="dashboard" onclick="go('dashboard')">⌂ Dashboard</button>
 <div class="pt">Masters</div>
 <button class="link" data-side="items" onclick="go('items')">Item Master</button>
 <button class="link" data-side="parties" onclick="go('parties')">Party Master</button>
 <button class="link" data-side="company" onclick="go('company')">Company</button>
 <div class="pt">Transactions</div>
 <button class="link" data-side="retail" onclick="go('retail')">Retail Sales</button>
 <button class="link" data-side="wholesale" onclick="go('wholesale')">Wholesale Sales</button>
 <button class="link" data-side="purchase" onclick="go('purchase')">Purchase Entry</button>
 <button class="link" data-side="receipt" onclick="go('receipt')">Receipt</button>
 <button class="link" data-side="payment" onclick="go('payment')">Payment</button>
 <div class="pt">Reports</div>
 <button class="link" data-side="stock" onclick="go('stock')">Stock Summary</button>
 <button class="link" data-side="expiry" onclick="go('expiry')">Batch / Expiry</button>
 <button class="link" data-side="ledger" onclick="go('ledger')">Party Ledger</button>
 <button class="link" data-side="reports" onclick="go('reports')">Final Reports</button>
 <button class="link" data-side="gst" onclick="go('gst')">GST Reports</button>
</aside>
<main id="main"></main>
<aside class="panel rightpanel">
 <div class="pt">Quick Access</div>
 <div style="padding:8px">
 <button class="btn" style="width:100%;margin-bottom:5px" onclick="go('retail')">Retail Bill (F4)</button>
 <button class="btn" style="width:100%;margin-bottom:5px" onclick="go('wholesale')">Wholesale Bill</button>
 <button class="btn" style="width:100%;margin-bottom:5px" onclick="go('purchase')">Purchase Entry</button>
 <button class="btn" style="width:100%;margin-bottom:5px" onclick="go('receipt')">Receipt Entry</button>
 <button class="btn" style="width:100%;margin-bottom:5px" onclick="go('payment')">Payment Entry</button>
 <button class="btn" style="width:100%;margin-bottom:5px" onclick="go('expiry')">Expiry Alerts</button>
 <button class="btn" style="width:100%;margin-bottom:5px" onclick="backup()">Export Backup</button>
 <button class="btn" style="width:100%" onclick="$('restoreFile').click()">Import Backup</button>
 <input id="restoreFile" type="file" accept=".json,application/json" hidden onchange="restoreBackup(event)">
 </div>
</aside>
</div>
<div class="status"><span id="companyStatus">Company: My Business</span><span id="message">Ready</span><span id="dateStatus"></span><span>F2 Party · F3 Rename · F4 Retail · Esc Back</span></div>
</div>
<div id="modal"></div>
<script>
"use strict";
const KEY="shree_erp_purple_v2";
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const n=v=>Number.isFinite(Number(v))?Number(v):0;
const qty=v=>Math.max(0,n(v));
const money=v=>"₹"+n(v).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const blank=()=>({company:{name:"My Business",address:"",phone:"",gstin:""},items:[],parties:[],bills:[],receipts:[],payments:[],purchases:[],batches:[]});
function normalize(s){
 let d=blank();if(s&&typeof s==="object"){
 d.company={...d.company,...(s.company||{})};
 ["items","parties","bills","receipts","payments","purchases","batches"].forEach(k=>d[k]=Array.isArray(s[k])?s[k]:[]);
 }
 d.items=d.items.filter(Boolean).map(x=>({...x,id:String(x.id||uid()),qty:qty(x.qty)}));
 d.parties=d.parties.filter(Boolean).map(x=>({...x,id:String(x.id||uid())}));
 ["bills","receipts","payments","purchases","batches"].forEach(k=>d[k]=d[k].filter(Boolean).map(x=>({...x,id:String(x.id||uid())})));
 d.batches=d.batches.map(b=>({...b,itemId:String(b.itemId||""),batch:String(b.batch||"NO BATCH"),expiry:String(b.expiry||""),qty:qty(b.qty)}));
 if(!d.batches.length)d.items.forEach(i=>{if(i.qty>0)d.batches.push({id:uid(),itemId:i.id,batch:"OPENING",expiry:"",qty:i.qty,rate:n(i.purchaseRate),mrp:n(i.mrp||i.rate),opening:true})});
 d.items.forEach(i=>{let total=d.batches.filter(b=>b.itemId===i.id).reduce((s,b)=>s+qty(b.qty),0);if(i.qty>total)d.batches.push({id:uid(),itemId:i.id,batch:"OPENING",expiry:"",qty:i.qty-total,rate:n(i.purchaseRate),mrp:n(i.mrp||i.rate),opening:true});i.qty=d.batches.filter(b=>b.itemId===i.id).reduce((s,b)=>s+qty(b.qty),0)});
 return d;
}
function load(){try{let s=localStorage.getItem(KEY);return s?normalize(JSON.parse(s)):blank()}catch(e){return blank()}}
let db=load(),view="dashboard",history=[],draft=[],ledgerParty="";
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));$("message").textContent="Saved"}catch(e){alert("Data save হয়নি। Backup নিয়ে storage পরীক্ষা করো।")};status()}
function status(){$("companyStatus").textContent="Company: "+(db.company.name||"My Business");$("dateStatus").textContent=new Date().toLocaleDateString("en-IN")}
function go(v){if(v!==view)history.push(view);view=v;draft=[];render();window.scrollTo(0,0)}
function back(){if($("modal").innerHTML){closeModal();return}if(history.length)view=history.pop();else view="dashboard";draft=[];render()}
function header(title,sub=""){return `<div class="head"><div><h2>${esc(title)}</h2><div>${esc(sub)}</div></div><button class="btn" onclick="back()">← Back (Esc)</button></div>`}
function table(head,rows,empty="No records found"){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${head.length}">${empty}</td></tr>`}</tbody></table></div>`}
function stat(a,b){return `<div class="stat"><span>${esc(a)}</span><strong>${b}</strong></div>`}
function render(){
 status();document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("active",x.dataset.nav===view));document.querySelectorAll("[data-side]").forEach(x=>x.classList.toggle("active",x.dataset.side===view));
 const m=$("main");
 if(view==="dashboard")m.innerHTML=dashboard();
 else if(view==="items")m.innerHTML=itemsPage();
 else if(view==="parties")m.innerHTML=partiesPage();
 else if(view==="company")m.innerHTML=companyPage();
 else if(view==="settings")m.innerHTML=settingsPage();
 else if(["retail","wholesale","purchase"].includes(view))m.innerHTML=transactionPage(view);
 else if(["receipt","payment"].includes(view))m.innerHTML=accountPage(view);
 else if(view==="stock")m.innerHTML=stockPage();
 else if(view==="expiry")m.innerHTML=expiryPage();
 else if(view==="ledger")m.innerHTML=ledgerPage();
 else if(["reports","gst"].includes(view))m.innerHTML=reportsPage(view);
 else m.innerHTML=dashboard();
}
function dashboard(){
 let sales=db.bills.filter(x=>x.date===today()).reduce((s,x)=>s+n(x.total),0);
 let totalSales=db.bills.reduce((s,x)=>s+n(x.total),0),purch=db.purchases.reduce((s,x)=>s+n(x.total),0);
 return `${header("Business Dashboard","SHREE ERP · Smart Business Management")}
 <div class="banner"><h2>SHREE ERP BUSINESS</h2><p>Business Management System · Financial Year 2026–2027<br>Retail · Wholesale · Purchase · Inventory · Accounts · Reports</p></div>
 <div class="stats">${stat("Today's Sales",money(sales))}${stat("Total Sales",money(totalSales))}${stat("Purchases",money(purch))}${stat("Stock Items",db.items.length+" / "+db.items.reduce((s,x)=>s+qty(x.qty),0))}</div>
 <div class="card"><h3>Quick Transactions</h3><div class="quick">
 ${[["Bill-Retail (F4)","retail"],["Bill-Wholesale","wholesale"],["Purchase","purchase"],["Receipt","receipt"],["Payment","payment"],["Party Master","parties"],["Item Master","items"],["Stock","stock"],["Batch / Expiry","expiry"],["Ledger","ledger"],["Reports","reports"],["Company","company"]].map(x=>`<button class="btn" onclick="go('${x[1]}')">${x[0]}</button>`).join("")}</div></div>
 <div class="card"><h3>Recent Transactions</h3>${table(["Date","Type","Voucher","Party","Total"],[...db.bills.map(x=>({...x,type:x.kind==="wholesale"?"Wholesale":"Retail"})),...db.purchases.map(x=>({...x,type:"Purchase"}))].reverse().slice(0,8).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.no)}</td><td>${esc(x.party)}</td><td>${money(x.total)}</td></tr>`).join(""))}</div>
 <div class="shortcut">Keyboard: F1 Doctor · F2 Party · F3 Rename Party · F4 Retail · Enter Next Field · Left Arrow Previous Field · Esc Back</div>`;
}
function itemsPage(){
 let search=$("itemSearch")?.value||"";
 let list=db.items.filter(x=>[x.name,x.code,x.barcode,x.company].some(v=>String(v||"").toLowerCase().includes(search.toLowerCase())));
 return `${header("Item Master","Stock is added only through Purchase Entry")}
 <div class="card"><h3>Add / Edit Item</h3><form onsubmit="saveItem(event)"><input type="hidden" id="iId"><div class="grid">
 <div class="field"><label>Item Code</label><input id="iCode"></div><div class="field"><label>Barcode</label><input id="iBarcode"></div>
 <div class="field"><label>Item Name *</label><input id="iName" required></div><div class="field"><label>Type</label><select id="iType"><option>Others</option><option>Medicine</option><option>Tablet</option><option>Syrup</option><option>Food</option><option>General</option></select></div>
 <div class="field"><label>Company / Brand</label><input id="iCompany"></div><div class="field"><label>Unit / Pack</label><input id="iUnit" value="PCS"></div>
 <div class="field"><label>Sale Rate ₹</label><input id="iRate" type="number" min="0" step=".01" value="0"></div>
 <div class="field"><label>Current Stock (Purchase থেকে)</label><input id="iQty" readonly value="0"></div>
 <div class="field"><label>Default Purchase Rate ₹</label><input id="iPurchaseRate" type="number" min="0" step=".01" value="0"></div>
 <div class="field"><label>Default MRP ₹</label><input id="iMrp" type="number" min="0" step=".01" value="0"></div></div>
 <div class="form-actions"><button class="btn primary">Save Item</button><button type="button" class="btn" onclick="render()">Clear</button></div>
 <p>Batch, Expiry, MRP ও stock quantity Purchase Entry-তে পরিচালিত হবে।</p></form></div>
 <div class="card"><div class="head"><h3>Item List (${list.length})</h3><input id="itemSearch" placeholder="Search item" value="${esc(search)}" oninput="refreshItems()"></div>
 ${table(["Code","Barcode","Item","Type","Company","Unit","Sale Rate","Stock","Action"],list.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.barcode)}</td><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td>${esc(x.company)}</td><td>${esc(x.unit)}</td><td>${money(x.rate)}</td><td>${qty(x.qty)}</td><td><button class="btn" onclick="editItem('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRecord('items','${x.id}')">Delete</button></td></tr>`).join(""))}</div>`;
}
function refreshItems(){let v=$("itemSearch").value,p=$("itemSearch").selectionStart;render();$("itemSearch").value=v;$("itemSearch").focus();try{$("itemSearch").setSelectionRange(p,p)}catch(e){}}
function saveItem(e){
 e.preventDefault();let id=$("iId").value||uid(),old=db.items.find(x=>x.id===id),name=$("iName").value.trim();if(!name)return;
 let barcode=$("iBarcode").value.trim();if(barcode&&db.items.some(x=>x.id!==id&&x.barcode===barcode))return alert("Barcode আগে থেকেই আছে।");
 let item={...(old||{}),id,code:$("iCode").value.trim(),barcode,name,type:$("iType").value,company:$("iCompany").value.trim(),unit:$("iUnit").value.trim()||"PCS",rate:qty($("iRate").value),purchaseRate:qty($("iPurchaseRate").value),mrp:qty($("iMrp").value),qty:old?qty(old.qty):0};
 if(old)db.items=db.items.map(x=>x.id===id?item:x);else db.items.push(item);save();render();alert("Item saved. Stock Purchase Entry থেকে যোগ হবে।");
}
function editItem(id){let x=db.items.find(i=>i.id===id);if(!x)return;render();$("iId").value=x.id;for(let [k,v] of Object.entries({iCode:x.code,iBarcode:x.barcode,iName:x.name,iType:x.type||"Others",iCompany:x.company,iUnit:x.unit,iRate:x.rate,iQty:x.qty,iPurchaseRate:x.purchaseRate,iMrp:x.mrp}))if($(k))$(k).value??="";for(let [k,v] of Object.entries({iCode:x.code||"",iBarcode:x.barcode||"",iName:x.name||"",iType:x.type||"Others",iCompany:x.company||"",iUnit:x.unit||"PCS",iRate:x.rate||0,iQty:x.qty||0,iPurchaseRate:x.purchaseRate||0,iMrp:x.mrp||0}))$(k).value=v;$("iName").focus()}
function partiesPage(){
 return `${header("Party Master","Customer / Supplier Details")}
 <div class="card"><h3>Add / Edit Party</h3><form onsubmit="saveParty(event)"><input type="hidden" id="pId"><div class="grid">
 <div class="field"><label>Party Name *</label><input id="pName" required></div><div class="field"><label>Type</label><select id="pType"><option>Customer</option><option>Supplier</option><option>Both</option></select></div>
 <div class="field"><label>Mobile</label><input id="pPhone"></div><div class="field"><label>Address</label><input id="pAddress"></div>
 <div class="field"><label>GSTIN</label><input id="pGstin"></div><div class="field"><label>DL No.</label><input id="pDl"></div>
 <div class="field"><label>Opening Balance ₹</label><input id="pBalance" type="number" step=".01" value="0"></div></div>

function searchItem(){
 let raw=$("lineSearch")?.value.trim().toLowerCase();if(!raw)return;
 let vals=i=>[i.name,i.code,i.barcode,i.id].map(v=>String(v||"").toLowerCase());
 let exact=db.items.filter(i=>vals(i).some(v=>v===raw)),matches=exact.length?exact:db.items.filter(i=>vals(i).some(v=>v.startsWith(raw)));
 if(!matches.length)matches=db.items.filter(i=>vals(i).some(v=>v.includes(raw)));
 if(matches.length===1){$("lineItem").value=matches[0].id;fillLine()}
}
function currentItem(){return db.items.find(i=>i.id===$("lineItem")?.value)}
function batches(id){return db.batches.filter(b=>b.itemId===id&&qty(b.qty)>0).sort((a,b)=>String(a.expiry||"9999-12").localeCompare(String(b.expiry||"9999-12")))}
function fillLine(){
 let i=currentItem();if(!i)return;$("lineSearch").value=i.barcode||i.code||i.name;$("linePack").value=i.unit||"PCS";
 $("lineRate").value=view==="purchase"?(i.purchaseRate||i.rate||0):(i.rate||0);
 if($("lineMrp"))$("lineMrp").value=i.mrp||i.rate||0;
 $("lineStock").value=view==="purchase"?qty(i.qty):batches(i.id).reduce((s,b)=>s+b.qty,0);previewLine();
}
function previewLine(){if(!$("lineQty"))return;let q=qty($("lineQty").value),r=qty($("lineRate").value),d=Math.min(100,qty($("lineDist").value)),disc=qty($("lineDiscount").value),g=Math.min(100,qty($("lineGst").value)),base=Math.max(0,q*r*(1-d/100)-disc);$("linePreview").value=money(base+base*g/100)}
function clearLine(){["lineSearch","lineItem","linePack","lineBatch","lineExpiry","lineMbp"].forEach(id=>{if($(id))$(id).value=""});["lineRate","lineMrp","lineDist","lineDiscount","lineGst","lineFree"].forEach(id=>{if($(id))$(id).value=0});$("lineQty").value=1;$("lineStock").value="—";$("linePreview").value=money(0);$("lineSearch").focus()}
function addLine(kind){
 let i=currentItem();if(!i)return alert("Product নির্বাচন করো।");
 let purchase=kind==="purchase",q=n($("lineQty").value),free=n($("lineFree")?.value),rate=n($("lineRate").value),dist=n($("lineDist").value),disc=n($("lineDiscount").value),gst=n($("lineGst").value);
 if(q<=0||rate<0||free<0||dist<0||dist>100||disc<0||gst<0||gst>100)return alert("Qty, Rate, Discount ও GST পরীক্ষা করো।");
 let gross=q*rate*(1-dist/100);if(disc>gross)return alert("Line discount বেশি হয়েছে।");
 let b=null,batch="",expiry="";
 if(purchase){batch=$("lineBatch").value.trim();expiry=$("lineExpiry").value;if(!batch)return alert("Purchase-এর জন্য Batch No. লিখো।")}
 else{
  let available=batches(i.id);b=available[0];if(!b)return alert("Stock নেই। আগে Purchase Entry করো।");
  let already=draft.filter(l=>l.batchId===b.id).reduce((s,l)=>s+l.qty+l.free,0),need=q+(kind==="retail"?0:free);
  if(qty(b.qty)<already+need)return alert("Stock পর্যাপ্ত নেই। Available: "+qty(b.qty));
  if(b.expiry&&expiryDays(b.expiry)<0)return alert("Expired batch বিক্রি করা যাবে না.");
  batch=b.batch;expiry=b.expiry||"";
 }
 let base=Math.max(0,gross-disc),tax=base*gst/100;
 draft.push({id:uid(),itemId:i.id,item:i.name,pack:$("linePack").value||i.unit||"PCS",batchId:b?.id||"",batch:batch||"NO BATCH",expiry,qty:q,free:kind==="retail"?0:free,rate,dist,discount:disc,gst,tax,mrp:n($("lineMrp")?.value)||0,mbp:n($("lineMbp")?.value),amount:base+tax});
 $("draftLines").innerHTML=draftTable();clearLine();totals();
}
function draftTable(){if(!draft.length)return `<div class="empty">এখনও কোনো Item যোগ করা হয়নি।</div>`;return `<div class="tablewrap"><table><thead><tr>${["#","Product","Pack","Batch","Expiry","Qty","Free","Rate","Disc %","GST","Amount","Action"].map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${draft.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.item)}</td><td>${esc(l.pack)}</td><td>${esc(l.batch)}</td><td>${esc(l.expiry||"—")}</td><td>${l.qty}</td><td>${l.free}</td><td>${money(l.rate)}</td><td>${l.dist}%</td><td>${l.gst}%</td><td>${money(l.amount)}</td><td><button class="btn danger" type="button" onclick="removeLine('${l.id}')">Remove</button></td></tr>`).join("")}</tbody></table></div>`}
function removeLine(id){draft=draft.filter(l=>l.id!==id);$("draftLines").innerHTML=draftTable();totals()}
function getTotals(){let sub=draft.reduce((s,l)=>s+Math.max(0,l.qty*l.rate*(1-l.dist/100)-l.discount),0),gst=draft.reduce((s,l)=>s+l.tax,0),disc=qty($("tDiscount")?.value),round=n($("tRound")?.value);return{sub,gst,disc,round,total:Math.max(0,sub+gst-disc+round)}}
function totals(){if(!$("grandTotal"))return;let t=getTotals();$("subTotal").textContent=money(t.sub);$("gstTotal").textContent=money(t.gst);$("discountTotal").textContent=money(t.disc);$("roundTotal").textContent=money(t.round);$("grandTotal").textContent=money(t.total);$("summaryText").textContent=`Items: ${draft.length} · Qty: ${draft.reduce((s,l)=>s+l.qty,0)} · GST: ${money(t.gst)} · Net: ${money(t.total)}`}
function partyInfo(){let p=db.parties.find(p=>p.name===$("tParty").value);if($("tAddress"))$("tAddress").value=p?.address||"";if($("tMobile"))$("tMobile").value=p?.phone||"";if($("tGstin"))$("tGstin").value=p?.gstin||""}
function saveTransaction(e,kind){
 e.preventDefault();if(!draft.length)return alert("অন্তত একটি item যোগ করো।");
 let purchase=kind==="purchase",key=purchase?"purchases":"bills",no=$("tNo").value;
 if(no!==nextNo(kind))return alert("Voucher number auto-generated। নতুন entry খুলে আবার চেষ্টা করো।");
 if(db[key].some(x=>x.no===no))return alert("Duplicate voucher number।");
 if(!purchase){
  let req={};for(let l of draft){if(!l.batchId)return alert("Batch stock পাওয়া যায়নি।");req[l.batchId]=(req[l.batchId]||0)+l.qty+(kind==="retail"?0:l.free)}
  for(let [id,q] of Object.entries(req)){let b=db.batches.find(x=>x.id===id);if(!b||qty(b.qty)<q)return alert("Stock পর্যাপ্ত নেই।");if(b.expiry&&expiryDays(b.expiry)<0)return alert("Expired batch বিক্রি করা যাবে না।")}
 }
 let t=getTotals();if(t.disc>t.sub+t.gst)return alert("Bill discount total-এর বেশি হতে পারে না।");
 let x={id:uid(),no,date:$("tDate").value,party:$("tParty").value||"Cash / Walk-in",kind,lines:draft.map(l=>({...l})),subtotal:t.sub,gstTotal:t.gst,discount:t.disc,roundOff:t.round,total:t.total,address:$("tAddress")?.value||"",phone:$("tMobile")?.value||"",gstin:$("tGstin")?.value||"",doctor:$("tDoctor")?.value||"",regNo:$("tReg")?.value||"",patientId:$("tPatient")?.value||"",note:$("tNote")?.value||"",createdAt:new Date().toISOString(),company:{...db.company}};
 if(purchase){
  for(let l of x.lines){let name=l.batch||"NO BATCH",b=db.batches.find(b=>b.itemId===l.itemId&&String(b.batch).toLowerCase()===name.toLowerCase()&&String(b.expiry||"")===String(l.expiry||""));if(!b){b={id:uid(),itemId:l.itemId,batch:name,expiry:l.expiry||"",qty:0,rate:l.rate,mrp:l.mrp};db.batches.push(b)}l.batchId=b.id;b.qty=qty(b.qty)+l.qty+l.free;b.rate=l.rate;b.mrp=l.mrp||b.mrp;b.expiry=l.expiry||b.expiry||""}
 }else{
  let req={};x.lines.forEach(l=>req[l.batchId]=(req[l.batchId]||0)+l.qty+(kind==="retail"?0:l.free));Object.entries(req).forEach(([id,q])=>{let b=db.batches.find(b=>b.id===id);b.qty=qty(b.qty-q)});
 }
 db.items.forEach(i=>i.qty=db.batches.filter(b=>b.itemId===i.id).reduce((s,b)=>s+qty(b.qty),0));
 db[key].push(x);save();draft=[];render();
 if(confirm("Voucher saved. Invoice print করবে?"))printObject(x);
}

 return `${header(rec?"Receipt Entry":"Payment Entry")}<div class="card"><form onsubmit="saveAccount(event,'${key}')"><div class="grid">

function expiryDays(v){if(!v)return Infinity;let a=String(v).split("-").map(Number);if(!a[0]||!a[1])return Infinity;let d=new Date(a[0],a[1],0,23,59,59);return Math.ceil((d-new Date())/86400000)}

 let ps=db.parties,p=ps.find(x=>x.id===ledgerParty)||ps[0];if(!p)return `${header("Party Ledger")}<div class="card">আগে Party Master-এ Party যোগ করো।</div>`;
 let es=[{date:"",no:"Opening",type:"Opening",dr:n(p.balance),cr:0}];
 db.bills.filter(x=>x.party===p.name).forEach(x=>es.push({date:x.date,no:x.no,type:x.kind==="wholesale"?"Wholesale":"Retail",dr:x.total,cr:0}));
 db.purchases.filter(x=>x.party===p.name).forEach(x=>es.push({date:x.date,no:x.no,type:"Purchase",dr:0,cr:x.total}));
 db.receipts.filter(x=>x.party===p.name).forEach(x=>es.push({date:x.date,no:x.no,type:"Receipt",dr:0,cr:x.amount}));
 db.payments.filter(x=>x.party===p.name).forEach(x=>es.push({date:x.date,no:x.no,type:"Payment",dr:x.amount,cr:0}));
 es.sort((a,b)=>String(a.date).localeCompare(String(b.date)));let bal=0,rows=es.map(x=>{bal+=x.dr-x.cr;return `<tr><td>${esc(x.date||"—")}</td><td>${esc(x.type)}</td><td>${esc(x.no)}</td><td>${money(x.dr)}</td><td>${money(x.cr)}</td><td>${money(Math.abs(bal))} ${bal>0?"Dr":bal<0?"Cr":""}</td></tr>`}).join("");
 return `${header("Party Ledger","Customer / Supplier Statement")}<div class="card"><div class="field"><label>Select Party</label><select onchange="ledgerParty=this.value;render()">${ps.map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div class="form-actions"><button class="btn" onclick="window.print()">Print Ledger</button></div></div><div class="card">${table(["Date","Type","Voucher","Debit","Credit","Balance"],rows)}</div>`;
}
function reportsPage(kind){
 let sales=db.bills.reduce((s,x)=>s+n(x.total),0),purch=db.purchases.reduce((s,x)=>s+n(x.total),0),gst= db.bills.reduce((s,x)=>s+n(x.gstTotal),0);
 let list=kind==="gst"?db.bills:[...db.bills.map(x=>({...x,type:x.kind==="wholesale"?"Wholesale":"Retail"})),...db.purchases.map(x=>({...x,type:"Purchase"}))].reverse();
 return `${header(kind==="gst"?"GST Reports":"Final Reports","Business Transaction Summary")}<div class="stats">${stat("Total Sales",money(sales))}${stat("Total Purchase",money(purch))}${stat("Sales GST",money(gst))}${stat("Receipts",money(db.receipts.reduce((s,x)=>s+n(x.amount),0)))}</div><div class="card"><div class="form-actions"><button class="btn" onclick="window.print()">Print Report</button></div>${table(kind==="gst"?["Date","Invoice","Party","Taxable","GST","Total"]:["Date","Type","Voucher","Party","Total"],list.map(x=>`<tr><td>${esc(x.date)}</td>${kind==="gst"?`<td>${esc(x.no)}</td><td>${esc(x.party)}</td><td>${money(x.subtotal)}</td><td>${money(x.gstTotal)}</td><td>${money(x.total)}</td>`:`<td>${esc(x.type)}</td><td>${esc(x.no)}</td><td>${esc(x.party)}</td><td>${money(x.total)}</td>`}</tr>`).join(""))}</div><div class="shortcut">GST report basic summary মাত্র; সরকারি GST return filing-এর বিকল্প নয়।</div>`;
}
function deleteRecord(key,id){
 let x=db[key]?.find(x=>x.id===id);if(!x)return;
 if(key==="parties"&&["bills","purchases","receipts","payments"].some(k=>db[k].some(r=>r.party===x.name)))return alert("এই Party-এর transaction history আছে। Delete করা হয়নি।");
 if(!confirm("এই record delete করবে?"))return;
 if(key==="bills"||key==="purchases"){
  let purchase=key==="purchases",lines=x.lines||[];
  if(!lines.length&&x.itemId)return alert("পুরোনো voucher-এর stock detail নেই; নিরাপদে delete করা হয়নি।");
  if(purchase)for(let l of lines){let b=db.batches.find(b=>b.id===l.batchId);if(!b||qty(b.qty)<l.qty+(l.free||0))return alert("এই Purchase stock ইতিমধ্যে বিক্রি হয়েছে। Delete করা হয়নি।")}
  for(let l of lines){let b=db.batches.find(b=>b.id===l.batchId);if(purchase){if(b)b.qty=qty(b.qty-l.qty-(l.free||0))}else{if(!b){b={id:uid(),itemId:l.itemId,batch:l.batch||"RESTORED",expiry:l.expiry||"",qty:0,rate:l.rate,opening:true};db.batches.push(b)}b.qty=qty(b.qty+l.qty+(purchase?(l.free||0):0))}}
  db.items.forEach(i=>i.qty=db.batches.filter(b=>b.itemId===i.id).reduce((s,b)=>s+qty(b.qty),0));
 }
 if(key==="items"){if(db.bills.some(x=>(x.lines||[]).some(l=>l.itemId===id))||db.purchases.some(x=>(x.lines||[]).some(l=>l.itemId===id)))return alert("এই Item-এর transaction history আছে।");db.batches=db.batches.filter(b=>b.itemId!==id)}
 db[key]=db[key].filter(x=>x.id!==id);save();render();
}
function backup(){let blob=new Blob([JSON.stringify({format:"SHREE-ERP",version:2,data:db},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="SHREE-ERP-backup-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restoreBackup(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let z=JSON.parse(r.result),d=normalize(z.data||z);if(!confirm("বর্তমান data replace হবে। আগে backup নিয়েছ?"))return;db=d;save();history=[];go("dashboard");alert("Backup restored")}catch(err){alert("Invalid backup file")}finally{e.target.value=""}};r.readAsText(f)}
function clearData(){if(!confirm("সব data মুছতে চাও? আগে Backup নিয়েছ?"))return;if(!confirm("শেষবার নিশ্চিত করো।"))return;db=blank();save();history=[];go("dashboard")}
function printVoucher(key,id){let x=db[key].find(x=>x.id===id);if(x)printObject({...x,company:db.company})}
function printObject(x){
 let c=x.company||db.company,lines=x.lines||[],body="";
 if(x.amount!==undefined)body=`<tr><td>Party</td><td>${esc(x.party)}</td></tr><tr><td>Mode</td><td>${esc(x.mode)}</td></tr><tr><th>Amount</th><th>${money(x.amount)}</th></tr>`;
 else body=`<tr><td colspan="7">Party: ${esc(x.party)}<br>${esc(x.address||"")} · ${esc(x.phone||"")}</td></tr><tr><th>Item</th><th>Batch</th><th>Expiry</th><th>Qty</th><th>Rate</th><th>GST</th><th>Amount</th></tr>`+lines.map(l=>`<tr><td>${esc(l.item)}</td><td>${esc(l.batch)}</td><td>${esc(l.expiry||"—")}</td><td>${l.qty}${l.free?" + "+l.free+" free":""}</td><td>${money(l.rate)}</td><td>${l.gst||0}%</td><td>${money(l.amount)}</td></tr>`).join("")+`<tr><td colspan="6" align="right">Subtotal</td><td>${money(x.subtotal)}</td></tr><tr><td colspan="6" align="right">GST</td><td>${money(x.gstTotal)}</td></tr><tr><td colspan="6" align="right">Discount</td><td>${money(x.discount)}</td></tr><tr><th colspan="6" align="right">Net Total</th><th>${money(x.total)}</th></tr>`;
 let w=window.open("","_blank","width=900,height=750");if(!w)return alert("Print popup allow করো।");
 w.document.write(`<!doctype html><html><meta charset="utf-8"><title>SHREE ERP Invoice</title><style>body{font:12px Arial;padding:20px}h1{color:#321064}table{border-collapse:collapse;width:100%;margin-top:18px}td,th{border:1px solid #888;padding:8px;text-align:left}th{background:#eee6f7}@page{size:A4;margin:12mm}</style><h1>${esc(c.name||"SHREE ERP")}</h1><p>${esc(c.address||"")}<br>${esc(c.phone||"")} ${esc(c.gstin||"")}</p><hr><h2>${x.kind==="purchase"?"PURCHASE VOUCHER":x.kind==="wholesale"?"WHOLESALE INVOICE":x.amount!==undefined?"ACCOUNT VOUCHER":"RETAIL INVOICE"}</h2><p>Voucher: ${esc(x.no)} &nbsp; Date: ${esc(x.date)}</p><table>${body}</table><p>${esc(x.note||"")}</p><br><br><p>Customer Signature __________________ &nbsp; Authorised Signature __________________</p><script>window.onload=()=>window.print()<\/script></html>`);w.document.close();
}
function openPartyPicker(){
 if(!["retail","wholesale","purchase"].includes(view)){go("parties");return}
 let supplier=view==="purchase",ps=db.parties.filter(p=>supplier?["Supplier","Both"].includes(p.type):["Customer","Both"].includes(p.type));
 $("modal").innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="pt">F2 · Select Party</div><div class="field"><label>Party</label><select id="pickParty"><option value="">Cash / Walk-in</option>${ps.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select></div><div class="form-actions"><button class="btn primary" onclick="chooseParty()">Select</button><button class="btn" onclick="quickParty()">＋ New Party</button><button class="btn" onclick="closeModal()">Close</button></div></div></div>`;
}
function closeModal(){$("modal").innerHTML=""}
function chooseParty(){if($("tParty")){$("tParty").value=$("pickParty").value;partyInfo()}closeModal()}
function quickParty(){
 $("modal").innerHTML=`<div class="modalbg"><div class="modal"><div class="pt">New Party</div><div class="grid"><div class="field"><label>Name *</label><input id="qName"></div><div class="field"><label>Mobile</label><input id="qPhone"></div><div class="field"><label>Address</label><input id="qAddress"></div><div class="field"><label>GSTIN</label><input id="qGstin"></div></div><div class="form-actions"><button class="btn primary" onclick="saveQuickParty()">Save & Select</button><button class="btn" onclick="closeModal()">Cancel</button></div></div></div>`;$("qName").focus();
}
function saveQuickParty(){let name=$("qName").value.trim();if(!name)return alert("Party name লিখো।");let p=db.parties.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!p){p={id:uid(),name,type:view==="purchase"?"Supplier":"Customer",phone:$("qPhone").value.trim(),address:$("qAddress").value.trim(),gstin:$("qGstin").value.trim(),balance:0};db.parties.push(p);save()}render();if($("tParty")){let s=$("tParty");if(![...s.options].some(o=>o.value===p.name)){let o=document.createElement("option");o.value=p.name;o.textContent=p.name;s.appendChild(o)}s.value=p.name;partyInfo()}closeModal()}
function renameParty(){
 let name=$("tParty")?.value||"";if(!name){name=prompt("যে Party-এর নাম বদলাবে, বর্তমান নাম লিখো:");if(!name)return}
 let p=db.parties.find(x=>x.name===name);if(!p)return alert("Party Master-এ নামটি পাওয়া যায়নি।");
 let next=prompt("নতুন নাম লিখো:",p.name);if(!next||!next.trim())return;next=next.trim();
 if(db.parties.some(x=>x.id!==p.id&&x.name.toLowerCase()===next.toLowerCase()))return alert("এই নাম আগে থেকেই আছে।");
 let old=p.name;p.name=next;["bills","purchases","receipts","payments"].forEach(k=>db[k].forEach(x=>{if(x.party===old)x.party=next}));save();render();
}
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){if($("modal").innerHTML){closeModal();e.preventDefault();return}if(view!=="dashboard"){back();e.preventDefault()}return}
 if(e.key==="F2"){e.preventDefault();openPartyPicker();return}
 if(e.key==="F3"){e.preventDefault();renameParty();return}
 if(e.key==="F4"){e.preventDefault();go("retail");return}
 if(e.key==="F1"&&["retail","wholesale"].includes(view)){e.preventDefault();if($("tDoctor"))$("tDoctor").focus();else alert("Doctor field Retail Entry-তে আছে।");return}
 if(e.key==="ArrowLeft"&&!e.ctrlKey&&!e.altKey&&!e.metaKey){
  let t=e.target;if(t.matches("input,select,textarea")&&t.tagName!=="SELECT"){
   let start=false;try{start=t.selectionStart===0&&t.selectionEnd===0}catch(_){start=true}
   if(start){let f=t.closest("form");if(f){let a=[...f.querySelectorAll("input:not([type=hidden]):not([type=button]):not([type=submit]):not([readonly]),select,textarea")].filter(x=>!x.disabled&&x.offsetParent!==null),i=a.indexOf(t);if(i>0){e.preventDefault();a[i-1].focus()}}}
  }return;
 }
 if(e.key==="Enter"&&!e.ctrlKey&&!e.altKey&&!e.shiftKey){
  let t=e.target;if(t.closest(".modalbg"))return;
  if(!t.matches("input,select,textarea")||t.matches("[type=submit],[type=button],[readonly]")||t.tagName==="TEXTAREA")return;
  let f=t.closest("form");if(!f)return;
  if(t.id==="lineSearch"){searchItem();if(currentItem()){e.preventDefault();fillLine();$("linePack").focus();return}}
  let a=[...f.querySelectorAll("input:not([type=hidden]):not([type=button]):not([type=submit]):not([readonly]),select,textarea")].filter(x=>!x.disabled&&x.offsetParent!==null),i=a.indexOf(t);
  if(i>=0){e.preventDefault();if(i<a.length-1)a[i+1].focus();else f.requestSubmit()}
 }
});
render();status();
</script>
