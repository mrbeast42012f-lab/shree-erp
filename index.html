
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#183e70">
<title>SHREE ERP - Business Management</title>
<style>
:root{--navy:#183e70;--blue:#245a96;--light:#eaf1fa;--line:#9eafc5;--bg:#cbd5e2;--green:#d9ead3;--yellow:#fff2cc;--red:#f4cccc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:12px Tahoma,Arial,sans-serif;color:#172b45}
button,input,select,textarea{font:inherit}button{cursor:pointer}
button:focus,input:focus,select:focus,textarea:focus{outline:2px solid #2469c8;outline-offset:1px}
.app{max-width:1600px;margin:auto;background:#e9eef5;min-height:100vh;border:1px solid #526b89}
.titlebar{background:linear-gradient(#426da3,#183e70);color:#fff;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:bold;font-size:18px;letter-spacing:.6px}.brand small{display:block;font-size:10px;font-weight:normal;margin-top:3px}
.title-actions{display:flex;gap:5px;flex-wrap:wrap}
.btn{border:1px solid #8b9db3;background:linear-gradient(#fff,#dbe5f1);padding:6px 10px;color:#16395f;border-radius:2px;font-weight:bold}
.btn:hover{background:linear-gradient(#fff3cc,#f7d77c)}
.btn.primary{background:linear-gradient(#467db8,#1d4c80);color:white;border-color:#173c67}
.btn.danger{color:#a00000}.btn.small{padding:4px 7px}
.menubar{display:flex;gap:0;flex-wrap:wrap;background:#dce6f2;border-bottom:1px solid #8098b6}
.menubar button{border:0;border-right:1px solid #c1cedd;background:transparent;padding:9px 10px;color:#17385f}
.menubar button:hover,.menubar button.active{background:#fff;font-weight:bold}
.toolbar{display:flex;gap:5px;padding:7px;background:#edf2f8;border-bottom:1px solid #a9b8ca;flex-wrap:wrap}
.workspace{display:grid;grid-template-columns:190px minmax(0,1fr) 190px;gap:7px;padding:7px;min-height:70vh}
.panel{border:1px solid #9eafc5;background:#f7f9fc;min-width:0}
.panel-title{padding:8px;background:linear-gradient(#edf4fc,#cbd9e9);border-bottom:1px solid #9eafc5;font-weight:bold;color:#193f6d}
.side-link{display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-bottom:1px solid #e0e6ed;background:#f8faff;color:#203d60}
.side-link:hover,.side-link.active{background:#d9e8f9;color:#123e76;font-weight:bold}
.side-link .ico{display:inline-block;width:23px}
.center{min-width:0}.statusline{background:#e4ebf4;border-top:1px solid #9eafc5;padding:7px 10px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.view-head{padding:10px;background:#e3ebf6;border:1px solid #9eafc5;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2{font-size:16px;margin:0;color:#183e70}h3{font-size:13px;margin:0 0 10px;color:#183e70}
.banner{padding:18px;background:linear-gradient(115deg,#173b69,#3979b8);color:white;border:1px solid #12345c;margin-bottom:8px}
.banner h2{color:white;font-size:22px;margin-bottom:7px}.banner p{margin:0;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:8px}
.stat{border:1px solid #a6b7ca;background:#fff;padding:12px 9px}.stat .label{color:#586b82;margin-bottom:7px}
.stat strong{font-size:19px;color:#1c4779}.stat:nth-child(2){background:#eef7e9}.stat:nth-child(3){background:#fff5dc}.stat:nth-child(4){background:#e8f2ff}
.card{background:#fff;border:1px solid #a6b7ca;padding:12px;margin-bottom:8px}
.quickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.quickgrid button{min-height:43px}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-weight:bold;color:#304a68}
.field input,.field select,.field textarea,.searchbox{width:100%;padding:7px;border:1px solid #9eafc5;background:#fff;border-radius:0;min-width:0}
.field textarea{min-height:65px;resize:vertical}
.form-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.table-wrap{overflow:auto;border:1px solid #a5b4c6;background:white;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th{background:linear-gradient(#eaf1fa,#cbd9e9);color:#173b67;text-align:left;font-weight:bold}
th,td{border:1px solid #c4cfdd;padding:7px 8px}
tbody tr:nth-child(even){background:#f0f5fb}tbody tr:hover{background:#fff1c9}
.empty{text-align:center;color:#66788c;padding:25px}
.row-actions{display:flex;gap:4px}.row-actions .btn{padding:4px 7px}
.notice{padding:9px;border:1px solid #a4b7cb;background:#edf4fc;margin-bottom:8px;line-height:1.5}
.right-box{padding:8px;border-bottom:1px solid #e0e6ed}.right-box button{width:100%;margin-bottom:5px;text-align:left}
.muted{color:#6a7c91}.total-box{background:#edf3fa;border:1px solid #a5b4c6;padding:10px;text-align:right;font-weight:bold}
.hidden{display:none!important}
.modal-bg{position:fixed;inset:0;background:#15273c99;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}
.modal{background:#edf2f8;border:1px solid #58708e;width:min(520px,100%);box-shadow:0 8px 35px #0004;max-height:90vh;overflow:auto}
.modal-head{padding:10px;background:linear-gradient(#426da3,#183e70);color:white;font-weight:bold;display:flex;justify-content:space-between}
.modal-body{padding:15px}.modal-body .field{margin-bottom:10px}
.bill-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bill-grid .field input,.bill-grid .field select{padding:7px}
.bill-item-box{border:1px solid #9eafc5;background:#f3f6fa;padding:10px;margin:10px 0}
.hotkey{display:inline-block;background:#fff;border:1px solid #a6b7ca;padding:3px 6px;margin:2px;font-weight:bold}
input[type=number]{text-align:left}
@media(max-width:1050px){.workspace{grid-template-columns:160px minmax(0,1fr)}.right-panel{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.bill-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.workspace{grid-template-columns:minmax(0,1fr);padding:5px}.left-panel{display:none}.brand{font-size:16px}.titlebar{align-items:flex-start}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.quickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.bill-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.menubar button{padding:9px 8px}.toolbar .btn{flex:1}.banner{padding:14px}.banner h2{font-size:19px}}
@media(max-width:380px){.formgrid,.bill-grid{grid-template-columns:1fr}.title-actions .btn{padding:5px}.stat strong{font-size:16px}}
@media print{.titlebar,.menubar,.toolbar,.left-panel,.right-panel,.statusline,.view-head .btn,.form-actions,.no-print{display:none!important}.workspace{display:block;padding:0}.app{border:0}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="app">
<header class="titlebar">
 <div class="brand">▦ SHREE ERP <small>BUSINESS MANAGEMENT SYSTEM</small></div>
 <div class="title-actions">
  <button class="btn" onclick="go('company')">Company</button>
  <button class="btn" onclick="go('settings')">Settings</button>
 </div>
</header>
<nav class="menubar" id="menubar">
 <button class="active" data-view="dashboard" onclick="go('dashboard')">Dashboard</button>
 <button data-view="items" onclick="go('items')">Masters</button>
 <button data-view="retail" onclick="go('retail')">Transactions</button>
 <button data-view="receipt" onclick="go('receipt')">Accounts</button>
 <button data-view="reports" onclick="go('reports')">Final Reports</button>
 <button data-view="gst" onclick="go('gst')">GST</button>
 <button data-view="stock" onclick="go('stock')">Stocks</button>
 <button data-view="daily" onclick="go('daily')">Daily Reports</button>
 <button data-view="links" onclick="go('links')">Links</button>
</nav>
<div class="toolbar">
 <button class="btn" onclick="go('retail')">＋ Retail Bill (F4)</button>
 <button class="btn" onclick="go('wholesale')">＋ Wholesale Bill</button>
 <button class="btn" onclick="go('purchase')">＋ Purchase</button>
 <button class="btn" onclick="go('items')">▤ Item Master</button>
 <button class="btn" onclick="go('parties')">♙ Party Master</button>
 <button class="btn" onclick="go('reports')">▥ Reports</button>
 <button class="btn" onclick="backup()">⇩ Backup</button>
</div>
<div class="workspace">
 <aside class="panel left-panel">
  <div class="panel-title">☷ Navigation</div>
  <button class="side-link active" data-side="dashboard" onclick="go('dashboard')"><span class="ico">⌂</span>Dashboard</button>
  <div class="panel-title">MASTERS</div>
  <button class="side-link" data-side="items" onclick="go('items')"><span class="ico">▤</span>Item Master</button>
  <button class="side-link" data-side="parties" onclick="go('parties')"><span class="ico">♙</span>Party Master</button>
  <button class="side-link" data-side="company" onclick="go('company')"><span class="ico">▣</span>Company</button>
  <div class="panel-title">TRANSACTIONS</div>
  <button class="side-link" data-side="retail" onclick="go('retail')"><span class="ico">₹</span>Retail Sales</button>
  <button class="side-link" data-side="wholesale" onclick="go('wholesale')"><span class="ico">▦</span>Wholesale Sales</button>
  <button class="side-link" data-side="purchase" onclick="go('purchase')"><span class="ico">＋</span>Purchase</button>
  <button class="side-link" data-side="receipt" onclick="go('receipt')"><span class="ico">↓</span>Receipt</button>
  <button class="side-link" data-side="payment" onclick="go('payment')"><span class="ico">↑</span>Payment</button>
  <div class="panel-title">REPORT CENTRE</div>
  <button class="side-link" data-side="stock" onclick="go('stock')">▤ Stock Summary</button>
  <button class="side-link" data-side="reports" onclick="go('reports')">▥ Final Reports</button>
  <button class="side-link" data-side="daily" onclick="go('daily')">▧ Daily Reports</button>
  <button class="side-link" data-side="gst" onclick="go('gst')">▦ GST Reports</button>
 </aside>
 <main class="center" id="main"></main>
 <aside class="panel right-panel">
  <div class="panel-title">⚡ Quick Access</div>
  <div class="right-box"><h3>Transactions</h3>
   <button class="btn" onclick="go('retail')">＋ New Retail Sale (F4)</button>
   <button class="btn" onclick="go('wholesale')">＋ Wholesale Sale</button>
   <button class="btn" onclick="go('purchase')">＋ New Purchase</button>
   <button class="btn" onclick="go('receipt')">↓ Receive Payment</button>
   <button class="btn" onclick="go('payment')">↑ Make Payment</button>
  </div>
  <div class="right-box"><h3>Masters</h3>
   <button class="btn" onclick="go('items')">Item Master</button>
   <button class="btn" onclick="go('parties')">Party Master</button>
  </div>
  <div class="right-box"><h3>Data Tools</h3>
   <button class="btn" onclick="backup()">Export Backup</button>
   <button class="btn" onclick="$('restoreFile').click()">Import Backup</button>
   <input type="file" id="restoreFile" accept=".json,application/json" hidden onchange="restoreBackup(event)">
   <p class="muted">Data is saved in this browser.</p>
  </div>
 </aside>
</div>
<div class="statusline">
 <span id="statusCompany">Company: My Business</span>
 <span id="statusText">Ready</span>
 <span id="statusDate"></span>
 <span>F2 Party · F3 Rename · F4 Retail · Esc Home</span>
</div>
</div>
<div id="modalRoot"></div>

<script>
"use strict";
const KEY="shree_erp_purple_v2";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const blank=()=>({company:{name:"My Business",address:"",phone:"",gstin:""},items:[],parties:[],bills:[],receipts:[],payments:[],purchases:[]});
function load(){
 try{
  const raw=localStorage.getItem(KEY);if(!raw)return blank();
  const d=JSON.parse(raw),b=blank();
  Object.keys(b).forEach(k=>{if(k==="company")b.company={...b.company,...(d.company||{})};else b[k]=Array.isArray(d[k])?d[k]:[]});
  return b;
 }catch(e){return blank()}
}
let db=load(),view="dashboard",editId=null,draftLines=[];
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(db));$("statusText").textContent="Saved successfully"}
 catch(e){alert("Storage full বা browser storage unavailable. Backup নাও।")}
 updateStatus();
}
function updateStatus(){
 $("statusCompany").textContent="Company: "+(db.company.name||"My Business");
 $("statusDate").textContent=new Date().toLocaleDateString("en-IN");
}
function go(v){
 view=v;editId=null;draftLines=[];
 document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
 document.querySelectorAll("[data-side]").forEach(b=>b.classList.toggle("active",b.dataset.side===v));
 render();window.scrollTo({top:0,behavior:"smooth"});
}
function head(title,sub=""){
 return `<div class="view-head"><div><h2>${esc(title)}</h2>${sub?`<div class="muted" style="margin-top:4px">${esc(sub)}</div>`:""}</div><div><button class="btn" onclick="go('dashboard')">⌂ Home</button></div></div>`;
}
function stat(label,value){return `<div class="stat"><div class="label">${esc(label)}</div><strong>${value}</strong></div>`}
function table(headers,rows,empty="No records found"){
 return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${headers.length}">${empty}</td></tr>`}</tbody></table></div>`;
}
function render(){
 updateStatus();const root=$("main");
 if(view==="dashboard")root.innerHTML=dashboard();
 else if(view==="items")root.innerHTML=itemsPage();
 else if(view==="parties")root.innerHTML=partiesPage();
 else if(view==="company")root.innerHTML=companyPage();
 else if(view==="settings")root.innerHTML=settingsPage();
 else if(["retail","wholesale","purchase"].includes(view))root.innerHTML=transactionPage(view);
 else if(["receipt","payment"].includes(view))root.innerHTML=accountPage(view);
 else if(view==="stock")root.innerHTML=stockPage();
 else if(["reports","daily","gst","links"].includes(view))root.innerHTML=reportsPage(view);
 else root.innerHTML=dashboard();
}
function dashboard(){
 const sales=db.bills.reduce((s,b)=>s+(Number(b.total)||0),0),purchases=db.purchases.reduce((s,b)=>s+(Number(b.total)||0),0);
 const stock=db.items.reduce((s,i)=>s+(Number(i.qty)||0),0);
 const todaySales=db.bills.filter(b=>b.date===today()).reduce((s,b)=>s+(Number(b.total)||0),0);
 const recent=[...db.bills.map(x=>({...x,kind:x.kind==="wholesale"?"Wholesale":"Sales"})),...db.purchases.map(x=>({...x,kind:"Purchase"}))].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,8);
 const rows=recent.map(x=>`<tr><td>${esc(x.date||"")}</td><td>${esc(x.kind)}</td><td>${esc(x.no||"")}</td><td>${esc(x.party||"")}</td><td>${money(x.total)}</td></tr>`).join("");
 return `${head("Business Dashboard","SHREE ERP · Classic Edition")}
 <div class="banner"><h2>Welcome to SHREE ERP</h2><p>Business Management System<br>Masters · Retail Billing · Wholesale Billing · Stock · Accounts · Reports</p></div>
 <div class="stats">${stat("Today's Sales",money(todaySales))}${stat("Total Sales",money(sales))}${stat("Total Purchase",money(purchases))}${stat("Items / Stock",db.items.length+" / "+stock)}</div>
 <div class="card"><h3>Quick Transactions</h3><div class="quickgrid">
 <button class="btn primary" onclick="go('retail')">＋ Retail Bill (F4)</button>
 <button class="btn primary" onclick="go('wholesale')">＋ Wholesale Bill</button>
 <button class="btn" onclick="go('purchase')">＋ Purchase Entry</button>
 <button class="btn" onclick="go('receipt')">↓ Receipt Entry</button>
 <button class="btn" onclick="go('payment')">↑ Payment Entry</button>
 <button class="btn" onclick="go('items')">▤ Item Master</button>
 <button class="btn" onclick="go('parties')">♙ Party Master (F2)</button>
 <button class="btn" onclick="go('stock')">▤ Stock Summary</button>
 <button class="btn" onclick="go('reports')">▥ Final Reports</button>
 </div></div>
 <div class="card"><h3>Recent Transactions</h3>${table(["Date","Type","Voucher No.","Party","Amount"],rows,"No transactions yet")}</div>
 <div class="notice">Keyboard: F2 Customer/Party · F3 Rename Customer · F4 Retail Bill · Esc Home · Enter Next Field</div>`;
}
function itemsPage(){
 const q=($("itemSearch")?.value||"").toLowerCase();
 const list=db.items.filter(x=>[x.name,x.code,x.company,x.type].some(v=>String(v||"").toLowerCase().includes(q)));
 const rows=list.map(x=>`<tr><td>${esc(x.code||"")}</td><td>${esc(x.name)}</td><td>${esc(x.type||"Others")}</td><td>${esc(x.company||"")}</td><td>${esc(x.unit||"PCS")}</td><td>${money(x.rate)}</td><td>${Number(x.qty)||0}</td><td><div class="row-actions"><button class="btn" onclick="editItem('${esc(x.id)}')">Edit</button><button class="btn danger" onclick="deleteRecord('items','${esc(x.id)}')">Del</button></div></td></tr>`).join("");
 return `${head("Item Master","Product / Inventory Master")}
 <div class="card"><h3 id="itemFormTitle">${editId?"Edit Item":"Add New Item"}</h3>
 <form onsubmit="saveItem(event)"><input type="hidden" id="itemId" value="${esc(editId||"")}">
 <div class="formgrid">
 <div class="field"><label>Item Code</label><input id="iCode" placeholder="ITM001"></div>
 <div class="field"><label>Item Name *</label><input id="iName" required placeholder="Product name"></div>
 <div class="field"><label>Type</label><select id="iType"><option>Others</option><option>Medicine</option><option>Syrup</option><option>Tablet</option><option>Capsule</option><option>Food</option><option>General</option></select></div>
 <div class="field"><label>Company / Brand</label><input id="iCompany"></div>
 <div class="field"><label>Unit / Pack</label><input id="iUnit" value="PCS"></div>
 <div class="field"><label>Sale Rate (₹)</label><input id="iRate" type="number" min="0" step=".01" value="0"></div>
 <div class="field"><label>Opening / Current Stock</label><input id="iQty" type="number" step=".01" value="0"></div>
 <div class="field"><label>Purchase Rate (₹)</label><input id="iPurchaseRate" type="number" min="0" step=".01" value="0"></div>
 </div><div class="form-actions"><button class="btn primary" type="submit">Save Item</button><button class="btn" type="button" onclick="resetItemForm()">Clear</button></div></form></div>
 <div class="card"><div class="view-head"><h3>Item List (${list.length})</h3><input class="searchbox" style="max-width:220px" id="itemSearch" placeholder="Search item..." oninput="refreshItems()"></div>
 ${table(["Code","Item Name","Type","Company","Unit","Rate","Stock","Action"],rows)}</div>`;
}
function refreshItems(){
 const el=$("itemSearch"),v=el?.value||"",pos=el?.selectionStart||0;render();
 $("itemSearch").value=v;$("itemSearch").focus();$("itemSearch").setSelectionRange(pos,pos);
}
function saveItem(e){
 e.preventDefault();const id=$("itemId").value||uid(),old=db.items.find(x=>x.id===id);
 const x={...(old||{}),id,code:$("iCode").value.trim(),name:$("iName").value.trim(),type:$("iType").value,company:$("iCompany").value.trim(),unit:$("iUnit").value.trim()||"PCS",rate:Number($("iRate").value)||0,qty:Number($("iQty").value)||0,purchaseRate:Number($("iPurchaseRate").value)||0};
 if(!x.name)return alert("Item name লিখো।");
 if(old)db.items=db.items.map(a=>a.id===id?x:a);else db.items.push(x);
 save();editId=null;render();alert("Item saved.");
}
function editItem(id){
 const x=db.items.find(a=>a.id===id);if(!x)return;render();
 $("itemId").value=x.id;$("iCode").value=x.code||"";$("iName").value=x.name||"";
 $("iType").value=x.type||"Others";$("iCompany").value=x.company||"";$("iUnit").value=x.unit||"PCS";
 $("iRate").value=x.rate||0;$("iQty").value=x.qty||0;$("iPurchaseRate").value=x.purchaseRate||0;
 $("iName").focus();window.scrollTo({top:0,behavior:"smooth"});
}
function resetItemForm(){editId=null;render()}
function partiesPage(){
 const rows=db.parties.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.type||"Customer")}</td><td>${esc(x.phone||"")}</td><td>${esc(x.address||"")}</td><td>${esc(x.gstin||"")}</td><td>${esc(x.dlNo||"")}</td><td>${money(x.balance)}</td><td><div class="row-actions"><button class="btn" onclick="editParty('${esc(x.id)}')">Edit</button><button class="btn danger" onclick="deleteRecord('parties','${esc(x.id)}')">Del</button></div></td></tr>`).join("");
 return `${head("Party Master","Customer / Supplier Account")}
 <div class="card"><h3>Add / Edit Party</h3>
 <form onsubmit="saveParty(event)"><input type="hidden" id="pId">
 <div class="formgrid"><div class="field"><label>Party Name *</label><input id="pName" required></div>
 <div class="field"><label>Party Type</label><select id="pType"><option>Customer</option><option>Supplier</option><option>Both</option></select></div>
 <div class="field"><label>Phone / Mobile</label><input id="pPhone" inputmode="tel"></div>
 <div class="field"><label>Address</label><input id="pAddress"></div>
 <div class="field"><label>GSTIN</label><input id="pGstin"></div>
 <div class="field"><label>DL No.</label><input id="pDl"></div>
 <div class="field"><label>Opening Balance (₹)</label><input id="pBalance" type="number" step=".01" value="0"></div></div>
 <div class="form-actions"><button class="btn primary">Save Party</button><button class="btn" type="button" onclick="clearPartyForm()">Clear</button></div></form></div>
 <div class="card"><h3>Party List (${db.parties.length})</h3>${table(["Party Name","Type","Phone","Address","GSTIN","DL No.","Balance","Action"],rows)}</div>`;
}
function saveParty(e){

function calcLinePreview(){
 if(!$("lineQty"))return;
 const qty=Math.max(0,Number($("lineQty").value)||0),rate=Math.max(0,Number($("lineRate").value)||0);

 const gst=Math.max(0,Number($("lineGst").value)||0);
 const base=Math.max(0,qty*rate*(1-dist/100)-discount),tax=base*gst/100;
 $("linePreview").value=money(base+tax);
}

function deleteRecord(key,id){

 if(key==="bills"||key==="purchases"){
  const direction=key==="purchases"?-1:1;
  if(Array.isArray(x.lines)){
   x.lines.forEach(line=>{const i=db.items.find(i=>i.id===line.itemId);if(i)i.qty=(Number(i.qty)||0)+direction*((Number(line.qty)||0)+(Number(line.free)||0))});
  }else if(x.itemId){
   const i=db.items.find(i=>i.id===x.itemId);if(i)i.qty=(Number(i.qty)||0)+direction*(Number(x.qty)||0);

}

function restoreBackup(e){
 const file=e.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const incoming=JSON.parse(reader.result);
   if(!incoming||typeof incoming!=="object")throw Error("Invalid");
   if(!confirm("Import করলে বর্তমান ERP data replace হবে। আগে backup নিয়েছ?"))return;
   const b=blank();b.company={...b.company,...(incoming.company||{})};
   ["items","parties","bills","receipts","payments","purchases"].forEach(k=>b[k]=Array.isArray(incoming[k])?incoming[k]:[]);
   db=b;save();go("dashboard");alert("Backup imported.");
  }catch(err){alert("Invalid JSON backup file.");}
  finally{e.target.value=""}
 };
 reader.readAsText(file);
}
function clearData(){
 if(!confirm("সত্যিই সব ERP data মুছতে চাও?"))return;
 if(!confirm("শেষবার নিশ্চিত করো। আগে backup নিয়েছ?"))return;
 db=blank();save();go("dashboard");
}
function printVoucher(key,id){const x=db[key].find(r=>r.id===id);if(!x)return;printObject({...x,company:db.company})}
function printObject(x){
 const isAccount=x.amount!==undefined;
 let body="";
 if(isAccount){
  body=`<tr><td>Party / Account</td><td>${esc(x.party)}</td></tr><tr><td>Mode</td><td>${esc(x.mode||"")}</td></tr><tr><td>Narration</td><td>${esc(x.note||"")}</td></tr><tr><th>Amount</th><th>${money(x.amount)}</th></tr>`;
 }else{
  const lines=Array.isArray(x.lines)?x.lines:[{item:x.item,qty:x.qty,rate:x.rate,discount:x.discount,amount:x.total,batch:"",expiry:"",gst:0,free:0}];
  body=`<tr><td colspan="7">Party: ${esc(x.party)} ${x.phone?" · Mobile: "+esc(x.phone):""}<br>${esc(x.address||"")}</td></tr>
  <tr><th>Item</th><th>Batch</th><th>Expiry</th><th>Qty</th><th>Rate</th><th>GST</th><th>Amount</th></tr>`+
  lines.map(l=>`<tr><td>${esc(l.item)}</td><td>${esc(l.batch||"—")}</td><td>${esc(l.expiry||"—")}</td><td>${esc(l.qty)}${Number(l.free)>0?" + "+esc(l.free)+" free":""}</td><td>${money(l.rate)}</td><td>${esc(l.gst||0)}%</td><td>${money(l.amount??(Number(l.qty)*Number(l.rate)))}</td></tr>`).join("")+
  `<tr><td colspan="6" class="right">Subtotal</td><td>${money(x.subtotal??x.total)}</td></tr><tr><td colspan="6" class="right">GST</td><td>${money(x.gstTotal||0)}</td></tr><tr><td colspan="6" class="right">Bill Discount</td><td>${money(x.discount)}</td></tr><tr><td colspan="6" class="right">Round Off</td><td>${money(x.roundOff||0)}</td></tr><tr><th colspan="6" class="right">Net Total</th><th>${money(x.total)}</th></tr>`;
 }
 const w=window.open("","_blank","width=850,height=700");
 if(!w)return alert("Print window blocked. Browser pop-up allow করো।");
 w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>SHREE ERP Voucher</title><style>body{font:13px Arial;padding:25px;color:#222}h1{margin-bottom:4px}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{border:1px solid #888;padding:8px;text-align:left}.right{text-align:right}.small{font-size:11px}</style></head><body><h1>${esc(x.company?.name||db.company.name||"SHREE ERP")}</h1><p>${esc(x.company?.address||db.company.address||"")} ${esc(x.company?.phone||db.company.phone||"")} ${esc(x.company?.gstin||db.company.gstin||"")}</p><hr><h2>${esc(x.kind==="purchase"?"Purchase Voucher":x.kind==="wholesale"?"Wholesale Invoice":isAccount?"Account Voucher":"Retail Sales Invoice")}</h2><p>Voucher: ${esc(x.no)} &nbsp; Date: ${esc(x.date)}</p>${x.doctor?`<p>Doctor: ${esc(x.doctor)} &nbsp; Reg. No.: ${esc(x.regNo||"")}</p>`:""}<table>${body}</table><p>${esc(x.note||"")}</p><p style="margin-top:50px">Authorised Signature __________________</p><script>window.onload=()=>window.print()<\/script></body></html>`);
 w.document.close();
}

/* F2 party picker and quick party creation */
function openPartyPicker(){
 if(!["retail","wholesale","purchase"].includes(view)){go("parties");return}
 const allowed=view==="purchase"?["Supplier","Both"]:["Customer","Both"];
 $("modalRoot").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><span>F2 · Select / Add Customer</span><button class="btn" onclick="closeModal()">✕</button></div><div class="modal-body">
 <div class="field"><label>Search / Select Party</label><select id="pickerParty"><option value="">Cash / Walk-in</option>${db.parties.filter(p=>allowed.includes(p.type)).map(p=>`<option value="${esc(p.name)}">${esc(p.name)} · ${esc(p.phone||"")}</option>`).join("")}</select></div>
 <div class="form-actions"><button class="btn primary" onclick="chooseParty()">Select Party</button><button class="btn" onclick="showQuickParty()">＋ New Party</button></div>
 <p class="muted">Party নির্বাচন করলে invoice-এ নাম, address ও mobile বসবে।</p>
 </div></div></div>`;
 $("pickerParty").focus();
}
function closeModal(){$("modalRoot").innerHTML=""}
function chooseParty(){
 const name=$("pickerParty").value;
 if($("tParty")){$("tParty").value=name;showPartyInfo()}
 closeModal();
}
function showQuickParty(){
 $("modalRoot").innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-head"><span>New Customer / Party</span><button class="btn" onclick="closeModal()">✕</button></div><div class="modal-body">
 <div class="field"><label>Party Name *</label><input id="qName" required></div>
 <div class="field"><label>Mobile</label><input id="qPhone" inputmode="tel"></div>
 <div class="field"><label>Address</label><input id="qAddress"></div>
 <div class="field"><label>GSTIN</label><input id="qGstin"></div>
 <div class="field"><label>DL No.</label><input id="qDl"></div>
 <div class="form-actions"><button class="btn primary" onclick="saveQuickParty()">Save & Select</button><button class="btn" onclick="openPartyPicker()">Back</button></div>
 </div></div></div>`;
 $("qName").focus();
}
function saveQuickParty(){
 const name=$("qName").value.trim();if(!name)return alert("Party name লিখো।");
 const old=db.parties.find(p=>p.name.toLowerCase()===name.toLowerCase());
 let p=old;
 if(!p){
  p={id:uid(),name,type:view==="purchase"?"Supplier":"Customer",phone:$("qPhone").value.trim(),address:$("qAddress").value.trim(),gstin:$("qGstin").value.trim(),dlNo:$("qDl").value.trim(),balance:0};
  db.parties.push(p);save();
 }
 if($("tParty")){
  const sel=$("tParty");
  if(![...sel.options].some(o=>o.value===p.name)){const op=document.createElement("option");op.value=p.name;op.textContent=p.name;sel.appendChild(op)}
  sel.value=p.name;showPartyInfo();
 }
 closeModal();
}
function renameCustomer(){
 let current=$("tParty")?.value||$("aParty")?.value||"";
 if(!current||current==="Cash Account"||current==="Cash / Walk-in")current=prompt("যে customer-এর নাম বদলাবে, বর্তমান নাম লিখো:");
 if(!current)return;
 const p=db.parties.find(x=>x.name===current);
 if(!p)return alert("এই নামে Party Master-এ customer পাওয়া যায়নি।");
 const next=prompt("নতুন customer name লিখো:",p.name);if(!next||!next.trim())return;
 const newName=next.trim();
 if(db.parties.some(x=>x.id!==p.id&&x.name.toLowerCase()===newName.toLowerCase()))return alert("এই নামের party আগে থেকেই আছে।");
 const oldName=p.name;p.name=newName;
 ["bills","purchases","receipts","payments"].forEach(k=>db[k].forEach(x=>{if(x.party===oldName)x.party=newName}));
 save();render();alert("Customer name updated.");
}

/* Keyboard controls: F2 party, F3 rename, F4 retail, Esc home, Enter next field. */
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){
  if($("modalRoot").innerHTML){closeModal();e.preventDefault();return}
  if(view!=="dashboard"){go("dashboard");e.preventDefault()}return;
 }
 if(e.key==="F2"){e.preventDefault();openPartyPicker();return}
 if(e.key==="F3"){e.preventDefault();renameCustomer();return}
 if(e.key==="F4"){e.preventDefault();go("retail");return}
 if(e.key==="F1"&&["retail","wholesale"].includes(view)){
  e.preventDefault();if($("tDoctor"))$("tDoctor").focus();return;
 }
 if(e.key==="Enter"&&!e.ctrlKey&&!e.altKey){
  const target=e.target;
  if(target.matches("input,select")&&!target.matches("[type=submit],[type=button],[readonly]")&&!target.closest(".modal-bg")===false){
   // Modal controls keep their normal Enter behavior.
   return;
  }
  if(target.matches("input,select")&&!target.matches("[type=submit],[type=button],[readonly]")&&!target.closest("textarea")){
   const form=target.closest("form");if(!form)return;
   const fields=[...form.querySelectorAll("input:not([type=hidden]):not([type=button]):not([type=submit]):not([readonly]),select,textarea")]
    .filter(el=>!el.disabled&&el.offsetParent!==null);
   const idx=fields.indexOf(target);
   if(idx>=0){e.preventDefault();if(idx<fields.length-1)fields[idx+1].focus();else if(form.requestSubmit)form.requestSubmit();else form.dispatchEvent(new Event("submit",{cancelable:true,bubbles:true}))}
  }
 }
});
render();updateStatus();
