t-size:23px}.pagehead p{margin:6px 0 0;color:var(--muted);font-size:12px}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow);min-width:0}.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:65px;height:65px;border-radius:50%;background:#f1eaff;right:-19px;top:-20px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:25px;font-weight:800;margin:10px 0 5px;overflow-wrap:anywhere}.stat .sub{font-size:11px;color:var(--muted)}.section-title{font-weight:800;font-size:15px;margin:0 0 15px}.two-col{grid-template-columns:1.2fr 1fr}.quick-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.quick{display:flex;align-items:center;gap:11px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:left;color:var(--text);width:100%}.quick:hover{border-color:#c6a7ff;background:#fbf8ff}.quick .qicon{width:39px;height:39px;display:grid;place-items:center;background:#f0e8ff;border-radius:11px;font-size:20px}.quick b{display:block}.quick small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select{max-width:100%;flex:1;min-width:130px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:12px;font-weight:700;color:#655b78}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid #ded7ec;border-radius:9px;padding:10px 11px;background:#fff;outline:none;color:var(--text);min-height:39px}.field textarea{resize:vertical;min-height:65px}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:var(--p);box-shadow:0 0 0 3px #6425d018}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.formgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.full{grid-column:1/-1}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse;min-width:680px;background:#fff}th{background:#f7f4fc;color:#6a5c81;font-size:11px;text-transform:uppercase;letter-spacing:.35px;text-align:left;white-space:nowrap}th,td{padding:11px 12px;border-bottom:1px solid #eee9f5}td{font-size:12px}tbody tr:hover{background:#fcfaff}tbody tr:last-child td{border-bottom:0}.num{text-align:right;white-space:nowrap}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#f0e9ff;color:var(--p);font-size:10px;font-weight:800}.pill.green{background:#e0f7ed;color:#08794e}.pill.red{background:#ffebee;color:#c52b46}.pill.orange{background:#fff0dc;color:#9b5900}.empty{text-align:center;padding:32px;color:var(--muted)}.muted{color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 9px;font-size:11px}.bottomline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:15px}.totals{margin-left:auto;max-width:380px;width:100%;background:#faf8ff;border:1px solid var(--line);border-radius:12px;padding:14px}.totalrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0}.totalrow.grand{border-top:1px solid #ddd3ef;margin-top:6px;padding-top:12px;font-size:18px;font-weight:800;color:var(--p)}.modalback{position:fixed;inset:0;background:#160c2d85;z-index:50;display:none;align-items:center;justify-content:center;padding:12px}.modalback.show{display:flex}.modal{width:min(760px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:17px;box-shadow:0 25px 80px #160c2d55}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}.modalhead h3{margin:0}.modalbody{padding:20px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}.notice{background:#f5efff;border:1px solid #e4d7ff;padding:12px;border-radius:10px;color:#6243a1;font-size:12px;line-height:1.6}.hidden{display:none!important}.mobilebar{display:none}.line-input{width:100%;padding:8px;border:1px solid #e3dcee;border-radius:7px;min-width:68px}.billitems table{min-width:800px}.billitems th,.billitems td{padding:7px}.billitems select{min-width:140px}.billitems input{min-width:70px}.footer{padding:20px 0;color:#968ca8;text-align:center;font-size:11px}.danger-zone{border:1px solid #ffd3da;background:#fff8f9;padding:15px;border-radius:12px}.alert{padding:12px;border-radius:9px;background:#fff2dc;color:#86500b;font-size:12px;line-height:1.5}.print-only{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none}.main{padding:15px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.formgrid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:11px 13px}.brand h1{font-size:17px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -5px 18px #24134c12}.mobilebar button{background:transparent;color:#6d617e;padding:7px 4px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}.mobilebar button span{font-size:18px}.mobilebar button.active{color:var(--p)}.main{padding-bottom:90px}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.top-actions button{padding:8px;font-size:11px}.top-actions button:nth-child(2){display:none}.brand small{font-size:9px}.brand{gap:7px}.logo{width:37px;height:37px}.pagehead h2{font-size:20px}.stat{padding:13px}.stat .value{font-size:21px}.formgrid,.formgrid.two,.formgrid.four{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick-grid{grid-template-columns:1fr 1fr}.quick{padding:10px;gap:8px}.quick .qicon{width:33px;height:33px;font-size:17px}.quick b{font-size:12px}.quick small{font-size:10px}.modalbody{padding:13px}.modalhead,.modalfoot{padding:13px}.toolbar input{min-width:100%}}
@media print{body{background:#fff}.topbar,.sidebar,.mobilebar,.no-print,.pagehead,.footer{display:none!important}.layout{display:block}.main{padding:0;max-width:none}.card,.stat{box-shadow:none;border:0;padding:0}.print-only{display:block}.tablewrap{overflow:visible}table{min-width:0}th,td{padding:7px;font-size:10px}.print-bill{display:block!important}.modalback{display:none!important}}
</style>

<body>
<header class="topbar">
 <div class="brand"><div class="logo">✦</div><div><h1>SHREE ERP</h1><small>SMART BUSINESS MANAGEMENT · v2.1</small></div></div>
 <div class="top-actions"><button onclick="navigate('dashboard')">⌂ Dashboard</button><button onclick="backupData()">⇩ Backup</button><button onclick="navigate('settings')">⚙ Settings</button></div>
</header>
<div class="layout">
 <aside class="sidebar">
  <div class="nav-label">MAIN MENU</div>
  <button class="navbtn active" data-page="dashboard" onclick="navigate('dashboard')"><span>▦</span>Dashboard</button>
  <button class="navbtn" data-page="retail" onclick="navigate('retail')"><span>🧾</span>Retail Billing</button>
  <button class="navbtn" data-page="wholesale" onclick="navigate('wholesale')"><span>🏢</span>Wholesale Billing</button>
  <button class="navbtn" data-page="purchase" onclick="navigate('purchase')"><span>🛒</span>Purchase Entry</button>
  <button class="navbtn" data-page="receipt" onclick="navigate('receipt')"><span>💵</span>Receipt Entry</button>
  <button class="navbtn" data-page="payment" onclick="navigate('payment')"><span>💳</span>Payment Entry</button>
  <div class="nav-label">MASTERS</div>
  <button class="navbtn" data-page="products" onclick="navigate('products')"><span>📦</span>Product Master</button>
  <button class="navbtn" data-page="parties" onclick="navigate('parties')"><span>👥</span>Customer / Party Master</button>
  <div class="nav-label">INVENTORY & ACCOUNTS</div>

  <button class="navbtn" data-page="ledger" onclick="navigate('ledger')"><span>📒</span>Party Ledger</button>

  <div class="nav-label">REPORT CENTRE</div>
  <button class="navbtn" data-page="sales" onclick="navigate('sales')"><span>📈</span>Sales Reports</button>
  <button class="navbtn" data-page="purchasereport" onclick="navigate('purchasereport')"><span>📊</span>Purchase Reports</button>
  <button class="navbtn" data-page="gst" onclick="navigate('gst')"><span>🧮</span>GST Summary</button>

 </aside>
 <main class="main" id="main"></main>

<nav class="mobilebar">
 <button data-page="dashboard" onclick="navigate('dashboard')"><span>▦</span>Home</button>
 <button data-page="retail" onclick="navigate('retail')"><span>🧾</span>Retail</button>
 <button data-page="wholesale" onclick="navigate('wholesale')"><span>🏢</span>Wholesale</button>
 <button data-page="products" onclick="navigate('products')"><span>📦</span>Products</button>

 <button data-page="stock" onclick="navigate('stock')"><span>▤</span>Stock</button>
</nav>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()">
 <div class="modal"><div class="modalhead"><h3 id="modalTitle">Add New</h3><button class="mutedbtn" onclick="closeModal()">✕</button></div><div class="modalbody" id="modalBody"></div><div class="modalfoot" id="modalFoot"></div></div>
</div>
<script>
"use strict";
const STORE="shree_erp_purple_v2";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let db, page="dashboard", editingBillLines=[], billKind="retail", reportFilter="", selectedPartyId="", selectedProductId="";
function blankDB(){return {company:{name:"SHREE ERP",address:"",phone:"",gstin:"",currency:"INR"},items:[],parties:[],bills:[],receipts:[],payments:[],purchases:[],settings:{lowStock:5}}}
function readDB(){
 let fresh=blankDB();
 try{
  const raw=localStorage.getItem(STORE);
  if(raw){const d=JSON.parse(raw);db={...fresh,...d,company:{...fresh.company,...(d.company||{})},settings:{...fresh.settings,...(d.settings||{})}};
   ["items","parties","bills","receipts","payments","purchases"].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
   db.items=db.items.map(x=>({...x,id:String(x.id||uid()),name:x.name||x.item||x.product||"",code:x.code||x.sku||"",pack:x.pack||x.packSize||"",batch:x.batch||"",rate:Number(x.rate??x.saleRate??x.price??0),mrp:Number(x.mrp??x.rate??x.saleRate??0),tax:Number(x.tax??x.gst??x.gstRate??0),stock:Number(x.stock??x.openingStock??x.qty??0),unit:x.unit||"PCS",companyName:x.companyName||x.company||"",description:x.description||""}));
   db.parties=db.parties.map(x=>({...x,id:String(x.id||uid()),name:x.name||x.party||x.customer||"",type:x.type||"Customer",mobile:x.mobile||x.phone||"",address:x.address||"",gstin:x.gstin||"",licence:x.licence||x.drugLicence||"",contact:x.contact||"",opening:Number(x.opening??x.openingBalance??0)}));
   return;
  }
 }catch(e){console.error("Storage read error",e)}
 db=fresh;
}
function save(){try{localStorage.setItem(STORE,JSON.stringify(db));}catch(e){alert("ডেটা সেভ হয়নি। ফোনের স্টোরেজ চেক করো।");console.error(e)}}
function init(){
 readDB();
 // Best-effort import from older, differently named SHREE ERP storage keys only when current store is empty.
 if(!db.items.length&&!db.parties.length&&!db.bills.length){
  for(let i=0;i<localStorage.length;i++){
   const k=localStorage.key(i);if(!k||k===STORE||!(/shree.*erp|erp.*shree/i.test(k)))continue;
   try{const d=JSON.parse(localStorage.getItem(k));if(d&&typeof d==="object"){
    ["items","parties","bills","receipts","payments","purchases"].forEach(a=>{if(Array.isArray(d[a])&&!db[a].length)db[a]=d[a]});
    if(d.company)db.company={...db.company,...d.company};
   }}catch(e){}
  }
 }
 save();render();document.addEventListener("keydown",keyboard);
}
function keyboard(e){
 if(e.key==="Escape"){closeModal();return}
 if(e.key==="F2"){e.preventDefault();if(page==="parties")openParty();else if(page==="retail"||page==="wholesale")openItem();else if(page==="products")openItem();return}
 if(e.key==="F3"){e.preventDefault();if(page==="parties")openParty(selectedPartyId);else if(page==="retail"||page==="wholesale"){const sel=document.querySelector(".bill-product");const id=sel?.value;if(id)openItem(id);else alert("আগে বিলের Product নির্বাচন করো।")}else if(page==="products")openItem(selectedProductId);return}
 if(e.key==="Enter"&&e.target.matches("input,select")&&!e.target.matches('[type="checkbox"],[type="submit"]')){
  const form=e.target.closest("form");if(form){const els=[...form.querySelectorAll("input:not([type=hidden]):not([disabled]),select:not([disabled]),textarea:not([disabled]),button[type=submit]")].filter(x=>x.offsetParent!==null);const i=els.indexOf(e.target);if(i>=0&&i<els.length-1){e.preventDefault();els[i+1].focus()}}
 }
}
function navigate(p){page=p;render();window.scrollTo(0,0)}
function setActive(){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function heading(title,desc,buttons=""){return `<div class="pagehead"><div><h2>${title}</h2><p>${desc||"SHREE ERP · Business Management"}</p></div><div class="actions no-print">${buttons}</div></div>`}
function card(title,content){return `<section class="card"><h3 class="section-title">${title}</h3>${content}</section>`}
function btn(label,fn,cls="primary"){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function render(){
 setActive();const m=$("main");
 const routes={dashboard:dashboardPage,products:productsPage,parties:partiesPage,retail:()=>billingPage("retail"),wholesale:()=>billingPage("wholesale"),purchase:purchasePage,receipt:()=>moneyEntryPage("receipt"),payment:()=>moneyEntryPage("payment"),stock:stockPage,ledger:ledgerPage,outstanding:outstandingPage,sales:salesPage,purchasereport:purchaseReportPage,gst:gstPage,settings:settingsPage};
 m.innerHTML=(routes[page]||dashboardPage)();
}
function sum(arr,fn){return arr.reduce((a,x)=>a+Number(fn(x)||0),0)}
function paid(b){return Number(b.paid||0)}
function due(b){return Math.max(0,Number(b.total||0)-paid(b))}
function billDate(b){return b.date||b.createdAt||today()}
function dashboardPage(){
 const sales=sum(db.bills,b=>b.total),purchases=sum(db.purchases,p=>p.total),dues=sum(db.bills,due);
 const todaySales=sum(db.bills,b=>billDate(b)===today()?b.total:0);
 const low=db.items.filter(i=>Number(i.stock)<=Number(db.settings.lowStock||5));
 const latest=[...db.bills].sort((a,b)=>billDate(b).localeCompare(billDate(a))).slice(-7).reverse();
 return heading("Business Dashboard","আপনার ব্যবসার সম্পূর্ণ হিসাব এক জায়গায়",btn("+ New Bill","navigate('retail')"))+
 `<div class="grid stats">
 <div class="stat"><div class="label">Total Sales</div><div class="value">${money(sales)}</div><div class="sub">সব সংরক্ষিত বিল</div></div>
 <div class="stat"><div class="label">Today's Sales</div><div class="value">${money(todaySales)}</div><div class="sub">${today()}</div></div>
 <div class="stat"><div class="label">Purchase Total</div><div class="value">${money(purchases)}</div><div class="sub">মোট ক্রয়</div></div>
 <div class="stat"><div class="label">Customer Outstanding</div><div class="value">${money(dues+sum(db.parties,p=>Math.max(0,p.opening)))}</div><div class="sub">বাকি আদায়</div></div></div>
 <div class="grid two-col">${card("Quick Access",`<div class="grid quick-grid">
 <button class="quick" onclick="navigate('retail')"><span class="qicon">🧾</span><span><b>Retail Billing</b><small>F2 Product · New bill</small></span></button>
 <button class="quick" onclick="navigate('wholesale')"><span class="qicon">🏢</span><span><b>Wholesale Billing</b><small>Bulk invoice</small></span></button>
 <button class="quick" onclick="openItem()"><span class="qicon">📦</span><span><b>New Product</b><small>Product Master</small></span></button>
 <button class="quick" onclick="openParty()"><span class="qicon">👥</span><span><b>New Party</b><small>Customer / Supplier</small></span></button>
 <button class="quick" onclick="navigate('purchase')"><span class="qicon">🛒</span><span><b>Purchase Entry</b><small>Stock increase</small></span></button>
 <button class="quick" onclick="navigate('outstanding')"><span class="qicon">⏳</span><span><b>Outstanding</b><small>Due collection</small></span></button>
 </div>`)}
 ${card("Stock Alert",low.length?`<div class="tablewrap"><table><thead><tr><th>Product</th><th>Code</th><th class="num">Stock</th></tr></thead><tbody>${low.slice(0,7).map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.code)}</td><td class="num"><span class="pill red">${i.stock}</span></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">⚡ Low-stock পণ্য নেই<br><small>Product Master-এ পণ্য যোগ করো</small></div>`)}</div>
 <div style="margin-top:16px">${card("Recent Bills",tableBills(latest))}</div>
 <div class="footer">SHREE ERP v2.1 · Your Business, Managed Better</div>`;
}
function tableBills(list){return `<div class="tablewrap"><table><thead><tr><th>Bill No.</th><th>Date</th><th>Type</th><th>Party</th><th class="num">Total</th><th class="num">Due</th><th>Action</th></tr></thead><tbody>${list.length?list.map(b=>`<tr><td><b>${esc(b.no||b.id)}</b></td><td>${esc(billDate(b))}</td><td><span class="pill">${esc(b.kind||"Retail")}</span></td><td>${esc(b.partyName||b.party||"Cash Customer")}</td><td class="num">${money(b.total)}</td><td class="num">${money(due(b))}</td><td><div class="actions"><button class="soft" onclick="printBill('${esc(b.id)}')">Print</button><button class="mutedbtn" onclick="showBill('${esc(b.id)}')">View</button></div></td></tr>`).join(""):`<tr><td colspan="7" class="empty">এখনও কোনও বিল নেই</td></tr>`}</tbody></table></div>`}
function productsPage(){
 const q=(window.productQuery||"").toLowerCase(),items=db.items.filter(i=>[i.name,i.code,i.companyName,i.batch].join(" ").toLowerCase().includes(q));

 // Apply received amount to oldest unpaid invoices for this party.
 if(receipt){let left=amount;db.bills.filter(b=>b.partyId===party.id&&due(b)>0).sort((a,b)=>billDate(a).localeCompare(billDate(b))).forEach(b=>{const take=Math.min(left,due(b));b.paid=paid(b)+take;left-=take});}
 else{let left=amount;db.purchases.filter(b=>b.partyId===party.id&&Number(b.total||0)>Number(b.paid||0)).sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(b=>{const take=Math.min(left,Number(b.total)-Number(b.paid||0));b.paid=Number(b.paid||0)+take;left-=take});}
 save();alert(`${receipt?"Receipt":"Payment"} saved.`);render();
}

 db.receipts.filter(x=>x.partyId===id).forEach(x=>entries.push({date:x.date,type:"Receipt",ref:x.no,debit:0,credit:Number(x.amount||0),note:x.mode||""}));
 db.purchases.filter(x=>x.partyId===id).forEach(x=>entries.push({date:x.date,type:"Purchase",ref:x.no,debit:0,credit:Number(x.total||0),note:x.item||""}));
 db.payments.filter(x=>x.partyId===id).forEach(x=>entries.push({date:x.date,type:"Payment",ref:x.no,debit:Number(x.amount||0),credit:0,note:x.mode||""}));
 entries.sort((a,b)=>a.date.localeCompare(b.date));let balance=Number(p.opening||0);
 const rows=entries.map(x=>{balance+=x.debit-x.credit;return `<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.ref)}</td><td>${esc(x.note)}</td><td class="num">${money(x.debit)}</td><td class="num">${money(x.credit)}</td><td class="num">${money(balance)}</td></tr>`}).join("");

 return heading("Settings & Backup","Company Profile, stock alert এবং local data backup")+
 `<div class="grid two-col"><section class="card"><h3 class="section-title">Company Profile</h3><form onsubmit="return false"><div class="formgrid two">

function saveSettings(){db.company={...db.company,name:val("cName")||"SHREE ERP",phone:val("cPhone"),gstin:val("cGstin"),address:val("cAddress")};db.settings.lowStock=Math.max(0,num("cLow"));save();alert("Settings saved");render()}
function backupData(){
 const data=JSON.stringify({...db,backupVersion:2.1,backupDate:new Date().toISOString()},null,2);
 const blob=new Blob([data],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="SHREE-ERP-Backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function restoreData(e){
 const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();
 reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!d||typeof d!=="object"||!Array.isArray(d.items)||!Array.isArray(d.parties))throw Error("Invalid backup");
 if(!confirm("বর্তমান ডেটার সঙ্গে Backup-এর ডেটা replace হবে। আগে বর্তমান Backup নিয়েছ?"))return;
 db={...blankDB(),...d,company:{...blankDB().company,...(d.company||{})},settings:{...blankDB().settings,...(d.settings||{})}};
 ["items","parties","bills","receipts","payments","purchases"].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});save();alert("Backup restored successfully");render();
 }catch(err){alert("Backup file সঠিক নয়। SHREE ERP JSON Backup নির্বাচন করো।")}finally{e.target.value=""}};
 reader.readAsText(file);
}

 <div class="head"><div><h1>${esc(db.company.name||"SHREE ERP")}</h1><p>${esc(db.company.address||"")}</p><p>${esc(db.company.phone||"")}${db.company.gstin?" · GSTIN: "+esc(db.company.gstin):""}</p></div><div><h2>${esc(b.kind||"Retail")} INVOICE</h2><p><b>Bill No:</b> ${esc(b.no)}</p><p><b>Date:</b> ${esc(b.date)}</p></div></div><hr>

 <table><thead><tr><th>#</th><th>Product</th><th>Pack</th><th>Batch</th><th>Qty</th><th>Rate</th><th>GST %</th><th class="num">Amount</th></tr></thead><tbody>${lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.item||l.name)}</td><td>${esc(l.pack||"")}</td><td>${esc(l.batch||"")}</td><td>${l.qty||0}</td><td>${money(l.rate)}</td><td>${l.tax||0}%</td><td class="num">${money(l.total??((l.qty||0)*(l.rate||0)*(1+(l.tax||0)/100)))}</td></tr>`).join("")}</tbody></table>
