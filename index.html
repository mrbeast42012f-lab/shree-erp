
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#35106f">
<title>SHREE ERP | Business Management</title>
<style>
:root{--p:#35106f;--p2:#5723a5;--light:#f3edff;--bg:#f6f5fa;--white:#fff;--text:#29213a;--muted:#756d82;--border:#e6e0ef;--green:#168653;--red:#d63952}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:14px Arial,"Noto Sans Bengali",sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.top{background:linear-gradient(110deg,#26084f,#5723a5);color:white;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 3px 14px #29104430}
.brand{font-size:22px;font-weight:900;letter-spacing:1px}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#e0d2ff;margin-top:4px}
.topright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border:1px solid #ffffff50;background:#ffffff15;color:white;padding:8px 11px;border-radius:8px}
.nav{display:flex;gap:5px;padding:9px 12px;background:white;border-bottom:1px solid var(--border);overflow-x:auto}
.nav button{white-space:nowrap;border:0;background:transparent;color:#55466b;padding:10px 13px;border-radius:7px;font-weight:700}
.nav button:hover,.nav button.active{background:var(--light);color:var(--p)}
main{max-width:1500px;margin:auto;padding:18px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:17px}
h1{font-size:23px;margin:0;color:var(--p)}h2{font-size:17px;margin:0 0 14px}h3{font-size:14px;margin:0 0 9px}
.sub{color:var(--muted);margin-top:5px;font-size:12px}
.btn{border:1px solid var(--border);background:white;color:var(--p);border-radius:8px;padding:10px 13px;font-weight:700}
.btn:hover{filter:brightness(.97);transform:translateY(-1px)}
.primary{background:var(--p2);color:white;border-color:var(--p2)}
.success{background:var(--green);color:white;border-color:var(--green)}
.danger{color:var(--red);border-color:#f3c5cc;background:#fff8f9}
.dark{background:#281046;color:white}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}
.card,.panel{background:white;border:1px solid var(--border);border-radius:13px;padding:17px;box-shadow:0 3px 12px #29104408;min-width:0}
.stat{color:var(--muted);font-size:12px}.statnum{font-size:27px;font-weight:900;color:var(--p);margin-top:8px}
.dashboard{display:grid;grid-template-columns:1.1fr 2fr 1fr;gap:14px}
.quickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.quick{padding:15px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;text-align:left;color:var(--p);font-weight:800}
.quick span{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:6px}
.quick:hover{background:var(--light);border-color:#bba5e6}
input,select,textarea{width:100%;border:1px solid #dcd4e8;border-radius:7px;padding:10px;background:white;outline:none;color:var(--text);min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--p2);box-shadow:0 0 0 3px #6e3bb318}
label{display:block;font-size:12px;font-weight:700;color:#5f536e;margin-bottom:6px}
.field{min-width:0}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.formgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:9px;background:white}
table{width:100%;border-collapse:collapse;min-width:650px}
th{background:#f1ebfb;color:var(--p);text-align:left;font-size:12px;white-space:nowrap}
th,td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
td input,td select{padding:8px;min-width:75px}
tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:25px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{max-width:320px}
.badge{display:inline-block;padding:4px 7px;background:var(--light);color:var(--p);border-radius:5px;font-size:11px;font-weight:700}
.billhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:14px;border-bottom:2px solid var(--p)}
.billhead h2{font-size:22px;color:var(--p);margin-bottom:5px}
.totalbox{margin-left:auto;max-width:370px;min-width:260px;border:1px solid var(--border);border-radius:10px;padding:14px;background:#fcfaff}
.totalrow{display:flex;justify-content:space-between;gap:15px;margin:8px 0}
.totalrow.final{border-top:1px solid var(--border);padding-top:12px;font-size:20px;font-weight:900;color:var(--p)}
.notice{background:#f5f0ff;color:#493078;border:1px solid #e3d7fb;border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px}
footer{text-align:center;padding:20px;color:var(--muted);font-size:11px}
.modal{display:none;position:fixed;inset:0;background:#18082dbd;z-index:50;align-items:center;justify-content:center;padding:12px}
.modal.show{display:flex}
.modalbox{background:white;border-radius:14px;width:min(850px,100%);max-height:94vh;overflow:auto;padding:20px;box-shadow:0 20px 70px #0003}
.modalhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.close{border:0;background:#f0eafa;color:var(--p);border-radius:7px;padding:8px 12px;font-weight:bold}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#251039;color:white;padding:12px 18px;border-radius:9px;z-index:100;display:none;max-width:90%;text-align:center}
.shortcuts{font-size:12px;color:var(--muted);line-height:2}
@media(max-width:900px){.dashboard{grid-template-columns:1fr 1fr}.dashboard .wide{grid-column:1/-1}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){main{padding:11px}.top{padding:12px}.brand{font-size:19px}.cards{gap:8px}.card,.panel{padding:12px}.dashboard{grid-template-columns:1fr}.dashboard .wide{grid-column:auto}.formgrid,.formgrid.two{grid-template-columns:1fr 1fr}.pagehead h1{font-size:20px}.quick{padding:12px 9px}.totalbox{max-width:none;width:100%}}
@media(max-width:360px){.formgrid,.formgrid.two{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}
@media print{.top,.nav,.no-print,footer{display:none!important}body{background:white}main{padding:0;max-width:none}.panel,.card{box-shadow:none;border:0}.tablewrap{overflow:visible}table{min-width:0;font-size:10px}th,td{padding:5px}.billhead h2{font-size:18px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">SHREE ERP<small>SMART BUSINESS MANAGEMENT</small></div>
  <div class="topright">
    <span class="pill" id="clock">17/10/2026</span>
    <button class="pill" data-go="customers">Customer Master</button>
    <button class="pill" data-go="dashboard">⌂ Dashboard</button>
  </div>
</header>
<nav class="nav no-print" id="nav">
  <button class="active" data-go="dashboard">Dashboard</button>
  <button data-go="customers">Customer Master</button>
  <button data-go="items">Item Master</button>
  <button data-go="retail">Bill Retail</button>
  <button data-go="wholesale">Bill Wholesale</button>
  <button data-go="purchases">Purchase</button>
  <button data-go="receipts">Receipt</button>
  <button data-go="payments">Payment</button>
  <button data-go="reports">Reports</button>
  <button data-action="backup">Backup</button>
</nav>
<main id="app"></main>
<footer>SHREE ERP • Browser Demo • Data saved on this device</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modalbox">
    <div class="modalhead"><h2 id="modalTitle">Entry</h2><button class="close" data-action="close-modal">✕ Close (Esc)</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY="shree_erp_complete_v3";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>Math.max(0,Number(v)||0);
const money=v=>"₹"+(Number(v)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toLocaleDateString("en-GB");
let page="dashboard",toastTimer;
let data;
function fresh(){return {company:{name:"SHREE ERP",address:"",gst:"",phone:""},customers:[],items:[],bills:[],purchases:[],receipts:[],payments:[]};}
function load(){
 try{const x=JSON.parse(localStorage.getItem(KEY)||"null");data=Object.assign(fresh(),x||{});}
 catch(e){data=fresh();}
 ["customers","items","bills","purchases","receipts","payments"].forEach(k=>{if(!Array.isArray(data[k]))data[k]=[]});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){notify("Storage পূর্ণ হয়েছে। Backup নিয়ে কিছু পুরোনো ডেটা সরাও।");return false}}
function notify(msg){const t=$("#toast");t.textContent=msg;t.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",2600)}
function id(prefix){return prefix+"-"+Date.now().toString().slice(-7)+"-"+Math.floor(Math.random()*90+10)}
function setPage(p){page=p;render();window.scrollTo(0,0)}
function modal(title,html){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=html;$("#modal").classList.add("show");setTimeout(()=>$("#modalBody input, #modalBody select, #modalBody textarea")?.focus(),80)}
function closeModal(){$("#modal").classList.remove("show")}
function field(label,name,value="",type="text",extra=""){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,name,options,value=""){return `<div class="field"><label for="${name}">${label}</label><select id="${name}" name="${name}">${options.map(o=>`<option value="${esc(o)}" ${o===value?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`}
function btn(text,action,cls="btn"){return `<button type="button" class="${cls}" data-action="${action}">${text}</button>`}
function stat(label,value){return `<div class="card"><div class="stat">${label}</div><div class="statnum">${value}</div></div>`}
function navActive(){document.querySelectorAll(".nav [data-go]").forEach(b=>b.classList.toggle("active",b.dataset.go===page))}
function render(){
 navActive();
 const app=$("#app");
 if(page==="dashboard")app.innerHTML=dashboard();
 else if(page==="customers")app.innerHTML=customersPage();
 else if(page==="items")app.innerHTML=itemsPage();
 else if(page==="retail"||page==="wholesale")app.innerHTML=billPage(page);
 else if(page==="purchases")app.innerHTML=purchasesPage();
 else if(page==="receipts"||page==="payments")app.innerHTML=moneyPage(page);
 else if(page==="reports")app.innerHTML=reportsPage();
 else app.innerHTML=dashboard();
}
function dashboard(){
 const sales=data.bills.reduce((s,b)=>s+num(b.total),0);
 const stock=data.items.reduce((s,i)=>s+num(i.stock)*num(i.rate),0);
 return `<div class="pagehead"><div><h1>Business Dashboard</h1><div class="sub">Welcome to SHREE ERP • ${today()}</div></div>${btn("＋ New Customer","new-customer","btn primary")}</div>
 <div class="cards">${stat("TOTAL CUSTOMERS",data.customers.length)}${stat("TOTAL ITEMS",data.items.length)}${stat("SALE BILLS",data.bills.length)}${stat("TOTAL SALES",money(sales))}</div>
 <div class="dashboard">
 <section class="panel"><h2>Masters</h2><div class="quickgrid">
 <button class="quick" data-go="customers">👥 Customer Master<span>F2 Entry • F3 Rename/Edit</span></button>
 <button class="quick" data-go="items">📦 Item Master<span>Products and stock</span></button>
 <button class="quick" data-go="purchases">🧾 Purchase<span>Stock inward</span></button>
 <button class="quick" data-go="reports">📊 Reports<span>Sales and stock reports</span></button>
 </div></section>
 <section class="panel wide"><h2>Sales & Transactions</h2><div class="quickgrid">
 <button class="quick" data-go="retail">🧾 BILL RETAIL<span>Sale Entry • F2 Customer • F3 Edit</span></button>
 <button class="quick" data-go="wholesale">📄 BILL WHOLESALE<span>Wholesale Sale Entry</span></button>
 <button class="quick" data-go="receipts">💰 Receipt<span>Customer payment received</span></button>
 <button class="quick" data-go="payments">💸 Payment<span>Payment entry</span></button>
 <button class="quick" data-action="backup">⬇ Backup Data<span>Export JSON backup</span></button>
 <button class="quick" data-action="company">🏢 Company Profile<span>Business details</span></button>
 </div><div class="notice" style="margin-top:14px">Keyboard: F2 = নতুন Customer, F3 = Customer edit/rename, Enter = পরের ঘর, Esc = popup বন্ধ / আগের স্ক্রিন।</div></section>
 <section class="panel"><h2>Stock Overview</h2><div class="stat">Estimated stock value</div><div class="statnum">${money(stock)}</div><hr style="border:0;border-top:1px solid var(--border);margin:16px 0"><div class="stat">Recent bills</div>${data.bills.slice(-4).reverse().map(b=>`<p><b>${esc(b.no)}</b><br><span class="sub">${esc(b.customerName)} • ${money(b.total)}</span></p>`).join("")||'<p class="sub">এখনও কোনো bill নেই।</p>'}</section>
 </div>`;
}
function customersPage(){
 return `<div class="pagehead"><div><h1>Customer / Party Master</h1><div class="sub">F2: নতুন Customer • F3: নির্বাচন করে Rename/Edit</div></div>${btn("＋ New Customer (F2)","new-customer","btn primary")}</div>
 <div class="panel"><div class="toolbar"><input id="customerSearch" placeholder="Search name, mobile, GSTIN, DL No..."><button class="btn" data-action="new-customer">＋ Add Customer</button></div><div id="customerTable">${customerTable(data.customers)}</div></div>`;
}
function customerTable(list){
 if(!list.length)return '<div class="empty">Customer পাওয়া যায়নি। F2 চাপুন অথবা Add Customer-এ ক্লিক করুন।</div>';
 return `<div class="tablewrap"><table><thead><tr><th>ID</th><th>Customer Name</th><th>Mobile</th><th>GSTIN</th><th>DL No.</th><th>Type</th><th>Actions</th></tr></thead><tbody>${list.map(c=>`<tr><td>${esc(c.id)}</td><td><b>${esc(c.name)}</b><br><small>${esc(c.address||"")}</small></td><td>${esc(c.mobile)}</td><td>${esc(c.gst)}</td><td>${esc(c.dl)}</td><td><span class="badge">${esc(c.type)}</span></td><td><button class="btn" data-action="edit-customer" data-id="${esc(c.id)}">F3 Edit</button> <button class="btn danger" data-action="delete-customer" data-id="${esc(c.id)}">Delete</button></td></tr>`).join("")}</tbody></table></div>`;
}
function customerForm(c={}){
 const isEdit=!!c.id;
 modal(isEdit?"F3 — Edit / Rename Customer":"F2 — New Customer Entry",`
 <form id="customerForm">
 <input type="hidden" name="id" value="${esc(c.id||"")}">
 <div class="formgrid">
 ${field("Customer Name *","name",c.name||"","text","required")}
 ${field("Mobile Number *","mobile",c.mobile||"","tel","required")}
 ${field("Alternate Mobile","altMobile",c.altMobile||"","tel")}
 ${field("GSTIN","gst",c.gst||"")}
 ${field("DL No. / Drug Licence","dl",c.dl||"")}
 ${field("DL Expiry Date","dlExpiry",c.dlExpiry||"","date")}
 ${field("State","state",c.state||"West Bengal")}
 ${field("PIN Code","pin",c.pin||"")}
 ${selectField("Customer Type","type",["Retail","Wholesale","Distributor","Other"],c.type||"Retail")}
 ${field("Opening Balance (₹)","opening",c.opening??"0","number",'step="0.01"')}
 ${field("Credit Limit (₹)","credit",c.credit??"0","number",'step="0.01"')}
 ${field("Doctor Name (optional)","doctor",c.doctor||"")}
 ${field("Doctor Reg. No. (optional)","doctorReg",c.doctorReg||"")}
 </div>
 <div class="field" style="margin-top:13px"><label>Full Address</label><textarea name="address" rows="2">${esc(c.address||"")}</textarea></div>
 <div class="actions"><button class="btn primary" type="submit">Save Customer (Enter)</button><button class="btn" type="button" data-action="close-modal">Cancel (Esc)</button></div>
 </form>`);
}
function itemsPage(){
 return `<div class="pagehead"><div><h1>Item Master</h1><div class="sub">Product, batch, selling rate, GST ও stock</div></div>${btn("＋ Add Item","new-item","btn primary")}</div>
 <div class="panel"><div class="toolbar"><input id="itemSearch" placeholder="Search product name, code, batch...">${btn("＋ New Item","new-item")}</div><div id="itemTable">${itemTable(data.items)}</div></div>`;
}
function itemTable(list){
 if(!list.length)return '<div class="empty">Item নেই। প্রথমে Add Item করুন।</div>';
 return `<div class="tablewrap"><table><thead><tr><th>Item</th><th>Pack</th><th>Batch</th><th>Expiry</th><th>Stock</th><th>Rate</th><th>GST %</th><th>Action</th></tr></thead><tbody>${list.map(i=>`<tr><td><b>${esc(i.name)}</b><br><small>${esc(i.code||"")}</small></td><td>${esc(i.pack)}</td><td>${esc(i.batch)}</td><td>${esc(i.expiry)}</td><td>${num(i.stock)}</td><td>${money(i.rate)}</td><td>${num(i.gst)}%</td><td><button class="btn" data-action="edit-item" data-id="${esc(i.id)}">Edit</button> <button class="btn danger" data-action="delete-item" data-id="${esc(i.id)}">Delete</button></td></tr>`).join("")}</tbody></table></div>`;
}
function itemForm(i={}){
 modal(i.id?"Edit Item":"New Item Entry",`<form id="itemForm"><input type="hidden" name="id" value="${esc(i.id||"")}"><div class="formgrid">
 ${field("Product Name *","name",i.name||"","text","required")}
 ${field("Item Code","code",i.code||"")}
 ${field("Pack","pack",i.pack||"1")}
 ${field("Batch No.","batch",i.batch||"")}
 ${field("Expiry Date","expiry",i.expiry||"","date")}
 ${field("Quantity / Stock","stock",i.stock??"0","number",'min="0" step="1"')}
 ${field("Selling Rate ₹","rate",i.rate??"0","number",'min="0" step="0.01"')}
 ${field("GST %","gst",i.gst??"0","number",'min="0" max="100" step="0.01"')}
 ${field("MRP ₹","mrp",i.mrp??"0","number",'min="0" step="0.01"')}
 </div><div class="actions"><button class="btn primary" type="submit">Save Item</button><button class="btn" type="button" data-action="close-modal">Cancel (Esc)</button></div></form>`);
}
function billPage(kind){
 const wholesale=kind==="wholesale";
 return `<div class="pagehead"><div><h1>Bill ${wholesale?"Wholesale":"Retail"} — SALE ENTRY</h1><div class="sub">Date: ${today()} • Enter = next field/row • F2 Customer Entry • F3 Customer Edit • Esc Back</div></div><div class="actions no-print">${btn("F2 New Customer","new-customer")}${btn("F3 Rename/Edit Customer","edit-selected-customer")}</div></div>
 <div class="panel" id="billPanel">
 <div class="billhead"><div><h2>SHREE ERP</h2><div class="sub">${wholesale?"WHOLESALE":"RETAIL"} SALE INVOICE</div><div class="sub" id="companyAddress">${esc(data.company.address||"")}</div></div><div style="min-width:180px">${field("Bill No.","billNo",id(wholesale?"WS":"RT"))}${field("Date","billDate",today())}</div></div>
 <div class="formgrid">
 <div class="field"><label>Customer / Party (F2 New • F3 Edit)</label><select id="billCustomer"><option value="">-- Select Customer --</option>${data.customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} — ${esc(c.mobile||"")}</option>`).join("")}</select></div>
 ${field("Mobile No.","billMobile")}
 ${field("GSTIN","billGST")}
 <div class="field"><label>Address</label><input id="billAddress"></div>
 ${field("DL No.","billDL")}
 ${field("Doctor Name","billDoctor")}
 </div>
 <div class="actions no-print">${btn("＋ New Customer (F2)","new-customer")}${btn("Edit Selected (F3)","edit-selected-customer")}</div>
 <h2 style="margin-top:22px">${wholesale?"Wholesale Product Entry":"Retail Product Entry"}</h2>
 <div class="notice">Product নির্বাচন করুন। Qty/Rate/GST পরিবর্তন করলে Amount নিজে হিসাব হবে। Enter দিয়ে ঘর বদলান।</div>
 <div class="tablewrap"><table id="billTable"><thead><tr><th>PRODUCT</th><th>PACK</th><th>BATCH</th><th>${wholesale?"QTY":"QTY"}</th>${wholesale?"<th>FREE</th>":""}<th>RATE</th>${wholesale?"<th>DIST %</th>":"<th>TAX %</th>"}<th>AMOUNT</th><th class="no-print">×</th></tr></thead><tbody id="billRows"></tbody></table></div>
 <div class="actions no-print"><button class="btn" type="button" data-action="add-row">＋ Add Product Row (Enter)</button></div>
 <div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-top:17px">
 <div style="flex:1;min-width:220px">
 ${field("Discount ₹","billDiscount","0","number",'min="0" step="0.01"')}
 <div class="field" style="margin-top:10px"><label>Remarks</label><textarea id="billRemarks" rows="2"></textarea></div>
 </div>
 <div class="totalbox"><div class="totalrow"><span>Value of Goods</span><b id="subtotal">₹0.00</b></div><div class="totalrow"><span>GST Total</span><b id="gstTotal">₹0.00</b></div><div class="totalrow"><span>Discount</span><b id="discountTotal">₹0.00</b></div><div class="totalrow final"><span>NET TOTAL</span><span id="grandTotal">₹0.00</span></div></div>
 </div>
 <div class="actions no-print"><button class="btn primary" type="button" data-action="save-bill" data-kind="${kind}">Save ${wholesale?"Wholesale":"Retail"} Bill (Ctrl+S)</button><button class="btn" type="button" data-action="print-bill">Print Bill</button><button class="btn" type="button" data-action="back">Back (Esc)</button></div>
 </div>`;
}
function addBillRow(itemId="",qty=1,free=0,rate=null,gst=null){
 const body=$("#billRows");if(!body)return;
 const selected=data.items.find(i=>i.id===itemId);
 const tr=document.createElement("tr");tr.className="billrow";
 tr.innerHTML=`<td><select class="row-item"><option value="">-- Select Item --</option>${data.items.map(i=>`<option value="${esc(i.id)}" ${i.id===itemId?"selected":""}>${esc(i.name)}</option>`).join("")}</select><small class="rowbatch"></small></td>
 <td class="pack">${esc(selected?.pack||"")}</td><td class="batch">${esc(selected?.batch||"")}</td>
 <td><input class="qty" type="number" min="0" step="1" value="${qty}"></td>
 ${page==="wholesale"?`<td><input class="free" type="number" min="0" step="1" value="${free}"></td>`:""}
 <td><input class="rate" type="number" min="0" step="0.01" value="${rate??selected?.rate??0}"></td>
 <td><input class="tax" type="number" min="0" max="100" step="0.01" value="${gst??selected?.gst??0}"></td>
 <td class="amount">₹0.00</td><td class="no-print"><button class="btn danger" type="button" data-action="remove-row">×</button></td>`;
 body.appendChild(tr);calculateBill();return tr;
}
function calculateBill(){
 const body=$("#billRows");if(!body)return;
 let subtotal=0,tax=0;
 body.querySelectorAll(".billrow").forEach(tr=>{
  const qty=num(tr.querySelector(".qty")?.value),rate=num(tr.querySelector(".rate")?.value),gst=num(tr.querySelector(".tax")?.value);
  const dist=num(tr.querySelector(".dist")?.value);
  const net=qty*rate*(1-dist/100);const taxval=net*gst/100;subtotal+=net;tax+=taxval;
  tr.querySelector(".amount").textContent=money(net+taxval);
 });
 const discount=Math.min(num($("#billDiscount")?.value),subtotal+tax);
 $("#subtotal").textContent=money(subtotal);$("#gstTotal").textContent=money(tax);$("#discountTotal").textContent=money(discount);$("#grandTotal").textContent=money(subtotal+tax-discount);
}
function fillCustomer(id){
 const c=data.customers.find(x=>x.id===id);
 ["billMobile","billGST","billAddress","billDL","billDoctor"].forEach(k=>{const el=$("#"+k);if(el)el.value=""});
 if(!c)return;
 $("#billMobile").value=c.mobile||"";$("#billGST").value=c.gst||"";$("#billAddress").value=c.address||"";$("#billDL").value=c.dl||"";$("#billDoctor").value=c.doctor||"";
}
function purchasesPage(){
 return `<div class="pagehead"><div><h1>Purchase Entry</h1><div class="sub">Stock inward demo</div></div></div><div class="panel"><div class="formgrid">${field("Purchase Bill No.","purchaseNo",id("PUR"))}<div class="field"><label>Supplier / Party</label><select id="purchaseParty"><option value="">Select Supplier</option>${data.customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select></div>${field("Date","purchaseDate",today())}</div><div class="tablewrap" style="margin-top:15px"><table><thead><tr><th>Item</th><th>Qty</th><th>Purchase Rate ₹</th><th>Amount</th><th></th></tr></thead><tbody id="purchaseRows"></tbody></table></div><div class="actions">${btn("＋ Add Item","add-purchase-row")}${btn("Save Purchase","save-purchase","btn primary")}</div><div id="purchaseTotal" style="margin-top:14px;font-weight:800">Total: ₹0.00</div></div>`;
}
function addPurchaseRow(){
 const body=$("#purchaseRows");if(!body)return;
 const tr=document.createElement("tr");tr.innerHTML=`<td><select class="purchaseItem"><option value="">Select item</option>${data.items.map(i=>`<option value="${esc(i.id)}">${esc(i.name)}</option>`).join("")}</select></td><td><input class="purchaseQty" type="number" min="0" value="1"></td><td><input class="purchaseRate" type="number" min="0" step="0.01" value="0"></td><td class="purchaseAmount">₹0.00</td><td><button class="btn danger" data-action="remove-row">×</button></td>`;body.appendChild(tr);calculatePurchase();
}
function calculatePurchase(){
 let total=0;document.querySelectorAll("#purchaseRows tr").forEach(tr=>{const amt=num(tr.querySelector(".purchaseQty").value)*num(tr.querySelector(".purchaseRate").value);tr.querySelector(".purchaseAmount").textContent=money(amt);total+=amt});
 if($("#purchaseTotal"))$("#purchaseTotal").textContent="Total: "+money(total);
}
function moneyPage(kind){
 const receipt=kind==="receipts",list=receipt?data.receipts:data.payments;
 return `<div class="pagehead"><div><h1>${receipt?"Receipt Entry":"Payment Entry"}</h1><div class="sub">${receipt?"Customer থেকে টাকা পাওয়া":"Party-কে টাকা দেওয়া"}</div></div></div><div class="panel"><form id="moneyForm"><div class="formgrid">${field("Voucher No.","voucherNo",id(receipt?"REC":"PAY"))}<div class="field"><label>Customer / Party</label><select name="customerId"><option value="">Select Party</option>${data.customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select></div>${field("Date","voucherDate",today())}${field("Amount ₹","voucherAmount","0","number",'min="0" step="0.01" required')}${selectField("Mode","voucherMode",["Cash","Bank","UPI","Cheque"],"Cash")}${field("Reference / Note","voucherNote")}</div><div class="actions"><button class="btn primary">Save ${receipt?"Receipt":"Payment"}</button></div></form></div><div class="panel" style="margin-top:14px"><h2>Recent Entries</h2>${list.length?`<div class="tablewrap"><table><thead><tr><th>Voucher</th><th>Date</th><th>Party</th><th>Mode</th><th>Amount</th></tr></thead><tbody>${list.slice().reverse().map(x=>`<tr><td>${esc(x.no)}</td><td>${esc(x.date)}</td><td>${esc(x.customerName)}</td><td>${esc(x.mode)}</td><td>${money(x.amount)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">No entries yet.</div>'}</div>`;
}
function reportsPage(){
 const sales=data.bills.reduce((s,b)=>s+num(b.total),0),purchases=data.purchases.reduce((s,p)=>s+num(p.total),0);
 return `<div class="pagehead"><div><h1>Reports</h1><div class="sub">Demo summary based on saved entries</div></div><div class="actions">${btn("Export Backup","backup")}${btn("Print","print")}</div></div><div class="cards">${stat("TOTAL SALES",money(sales))}${stat("PURCHASE TOTAL",money(purchases))}${stat("CUSTOMERS",data.customers.length)}${stat("ITEMS",data.items.length)}</div>
 <div class="panel"><h2>Sales Book</h2>${data.bills.length?`<div class="tablewrap"><table><thead><tr><th>Bill No.</th><th>Date</th><th>Type</th><th>Customer</th><th>Mobile</th><th>Total</th></tr></thead><tbody>${data.bills.slice().reverse().map(b=>`<tr><td>${esc(b.no)}</td><td>${esc(b.date)}</td><td>${esc(b.kind)}</td><td>${esc(b.customerName)}</td><td>${esc(b.mobile)}</td><td>${money(b.total)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">এখনও কোনো sale bill নেই।</div>'}</div>
 <div class="panel" style="margin-top:14px"><h2>Stock Status</h2>${itemTable(data.items)}</div>`;
}
function companyForm(){
 modal("Company Profile",`<form id="companyForm"><div class="formgrid">${field("Company Name","companyName",data.company.name)}${field("GSTIN","companyGST",data.company.gst)}${field("Phone","companyPhone",data.company.phone)}</div><div style="margin-top:12px">${field("Address","companyAddressInput",data.company.address)}</div><div class="actions"><button class="btn primary">Save Profile</button></div></form>`);
}
function saveBill(kind){
 const rows=[...document.querySelectorAll("#billRows .billrow")].map(tr=>{
  const item=data.items.find(i=>i.id===tr.querySelector(".row-item").value);
  return {itemId:item?.id||"",name:item?.name||"",pack:item?.pack||"",batch:item?.batch||"",qty:num(tr.querySelector(".qty").value),free:num(tr.querySelector(".free")?.value),rate:num(tr.querySelector(".rate").value),gst:num(tr.querySelector(".tax").value),dist:num(tr.querySelector(".dist")?.value)};
 }).filter(r=>r.itemId&&r.qty>0);
 if(!rows.length){notify("কমপক্ষে একটি valid product এবং quantity দিন।");return}
 for(const r of rows){const item=data.items.find(i=>i.id===r.itemId);if(!item){notify("Item পাওয়া যায়নি।");return}if(num(item.stock)<r.qty){if(!confirm(`${item.name}: stock ${item.stock}, sale qty ${r.qty}. Stock কম আছে। তবুও save করবেন?`))return}}
 const customer=data.customers.find(c=>c.id===$("#billCustomer").value);
 const subtotal=rows.reduce((s,r)=>s+r.qty*r.rate*(1-r.dist/100),0);
 const tax=rows.reduce((s,r)=>s+r.qty*r.rate*(1-r.dist/100)*r.gst/100,0);
 const discount=Math.min(num($("#billDiscount").value),subtotal+tax);
 const bill={id:id("B"),no:$("#billNo").value||id("BILL"),date:$("#billDate").value||today(),kind:kind==="retail"?"Retail":"Wholesale",customerId:customer?.id||"",customerName:customer?.name||"Cash Customer",mobile:$("#billMobile").value,gst:$("#billGST").value,address:$("#billAddress").value,dl:$("#billDL").value,doctor:$("#billDoctor").value,remarks:$("#billRemarks").value,rows,subtotal,tax,discount,total:subtotal+tax-discount};
 rows.forEach(r=>{const item=data.items.find(i=>i.id===r.itemId);if(item)item.stock=Math.max(0,num(item.stock)-r.qty)});
 data.bills.push(bill);save();notify("Bill saved: "+bill.no);setPage(kind);
}
function deleteRecord(key,idval,label){
 if(!confirm(`${label} delete করবেন?`))return;
 data[key]=data[key].filter(x=>x.id!==idval);save();render();notify("Deleted");
}
function exportBackup(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="shree-erp-backup-"+Date.now()+".json";a.click();URL.revokeObjectURL(url);notify("Backup download শুরু হয়েছে");
}
function startPage(p){
 if(p==="wholesale"||p==="retail"){setPage(p);setTimeout(()=>{if(!$("#billRows")?.children.length)addBillRow();$("#billRows .row-item")?.focus()},0)}
 else setPage(p);
}
function goBack(){if($("#modal").classList.contains("show")){closeModal();return}if(page!=="dashboard"){setPage("dashboard");return}notify("আপনি Dashboard-এ আছেন")}
document.addEventListener("click",e=>{
 const nav=e.target.closest("[data-go]");
 if(nav){e.preventDefault();startPage(nav.dataset.go);return}
 const b=e.target.closest("[data-action]");if(!b)return;
 const a=b.dataset.action,idval=b.dataset.id;
 if(a==="close-modal"){closeModal();return}
 if(a==="back"){goBack();return}
 if(a==="new-customer"){customerForm();return}
 if(a==="edit-selected-customer"){
  const cid=$("#billCustomer")?.value;
  if(!cid){notify("আগে Customer নির্বাচন করুন।");if(!data.customers.length)customerForm();return}
  customerForm(data.customers.find(c=>c.id===cid)||{});return
 }
 if(a==="edit-customer"){customerForm(data.customers.find(c=>c.id===idval)||{});return}
 if(a==="delete-customer"){deleteRecord("customers",idval,"Customer");return}
 if(a==="new-item"){itemForm();return}
 if(a==="edit-item"){itemForm(data.items.find(i=>i.id===idval)||{});return}
 if(a==="delete-item"){deleteRecord("items",idval,"Item");return}
 if(a==="add-row"){addBillRow();const rows=$("#billRows");rows?.lastElementChild?.querySelector(".row-item")?.focus();return}
 if(a==="remove-row"){b.closest("tr")?.remove();calculateBill();calculatePurchase();return}
 if(a==="save-bill"){saveBill(b.dataset.kind);return}
 if(a==="print-bill"){window.print();return}
 if(a==="add-purchase-row"){addPurchaseRow();return}
 if(a==="save-purchase"){savePurchase();return}
 if(a==="backup"){exportBackup();return}
 if(a==="company"){companyForm();return}
 if(a==="print"){window.print();return}
});
document.addEventListener("submit",e=>{
 e.preventDefault();const f=e.target,fd=new FormData(f);
 if(f.id==="customerForm"){
  const obj=Object.fromEntries(fd.entries());obj.id=obj.id||id("CUS");
  obj.name=obj.name.trim();obj.mobile=obj.mobile.trim();
  if(!obj.name||!obj.mobile){notify("Customer Name এবং Mobile দিন।");return}
  const duplicate=data.customers.find(c=>c.mobile===obj.mobile&&c.id!==obj.id);
  if(duplicate&&!confirm("এই mobile number অন্য Customer-এর আছে। তবুও save করবেন?"))return;
  const idx=data.customers.findIndex(c=>c.id===obj.id);
  if(idx>=0)data.customers[idx]=obj;else data.customers.push(obj);
  save();closeModal();render();notify(idx>=0?"Customer updated":"Customer saved");
  if(page==="retail"||page==="wholesale"){
   const sel=$("#billCustomer");if(sel){sel.innerHTML='<option value="">-- Select Customer --</option>'+data.customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} — ${esc(c.mobile||"")}</option>`).join("");sel.value=obj.id;fillCustomer(obj.id)}
  }
 }
 if(f.id==="itemForm"){
  const obj=Object.fromEntries(fd.entries());obj.id=obj.id||id("ITM");
  ["stock","rate","gst","mrp"].forEach(k=>obj[k]=num(obj[k]));
  if(!obj.name.trim()){notify("Product name দিন।");return}
  const idx=data.items.findIndex(i=>i.id===obj.id);if(idx>=0)data.items[idx]=obj;else data.items.push(obj);
  save();closeModal();render();notify("Item saved");
 }
 if(f.id==="moneyForm"){
  const obj=Object.fromEntries(fd.entries()),c=data.customers.find(x=>x.id===obj.customerId);
  const record={id:id("V"),no:obj.voucherNo,date:obj.voucherDate,customerName:c?.name||"Cash",mode:obj.voucherMode,amount:num(obj.voucherAmount),note:obj.voucherNote};
  const key=page==="receipts"?"receipts":"payments";data[key].push(record);save();render();notify("Entry saved");
 }
 if(f.id==="companyForm"){
  data.company={name:fd.get("companyName")||"",gst:fd.get("companyGST")||"",phone:fd.get("companyPhone")||"",address:fd.get("companyAddressInput")||""};save();closeModal();render();notify("Company profile saved");
 }
});
document.addEventListener("change",e=>{
 if(e.target.id==="billCustomer")fillCustomer(e.target.value);
 if(e.target.classList.contains("row-item")){
  const tr=e.target.closest("tr"),item=data.items.find(i=>i.id===e.target.value);
  if(item){tr.querySelector(".pack").textContent=item.pack||"";tr.querySelector(".batch").textContent=item.batch||"";tr.querySelector(".rate").value=item.rate||0;tr.querySelector(".tax").value=item.gst||0;const small=tr.querySelector(".rowbatch");small.textContent=item.expiry?"Expiry: "+item.expiry:""}
  calculateBill();
 }
});
document.addEventListener("input",e=>{
 if(e.target.closest("#billRows"))calculateBill();
 if(e.target.id==="billDiscount")calculateBill();
 if(e.target.closest("#purchaseRows"))calculatePurchase();
 if(e.target.id==="customerSearch"){
  const q=e.target.value.toLowerCase();$("#customerTable").innerHTML=customerTable(data.customers.filter(c=>[c.name,c.mobile,c.gst,c.dl,c.address].some(v=>String(v||"").toLowerCase().includes(q))));
 }
 if(e.target.id==="itemSearch"){
  const q=e.target.value.toLowerCase();$("#itemTable").innerHTML=itemTable(data.items.filter(i=>[i.name,i.code,i.batch].some(v=>String(v||"").toLowerCase().includes(q))));
 }
});
function savePurchase(){
 const rows=[...document.querySelectorAll("#purchaseRows tr")].map(tr=>({itemId:tr.querySelector(".purchaseItem").value,qty:num(tr.querySelector(".purchaseQty").value),rate:num(tr.querySelector(".purchaseRate").value)})).filter(r=>r.itemId&&r.qty>0);
 if(!rows.length){notify("কমপক্ষে একটি item যোগ করুন।");return}
 rows.forEach(r=>{const i=data.items.find(x=>x.id===r.itemId);if(i)i.stock=num(i.stock)+r.qty});
 const c=data.customers.find(x=>x.id===$("#purchaseParty").value);
 const total=rows.reduce((s,r)=>s+r.qty*r.rate,0);
 data.purchases.push({id:id("PUR"),no:$("#purchaseNo").value,date:$("#purchaseDate").value,customerName:c?.name||"Supplier",rows,total});
 save();notify("Purchase saved; stock updated");setPage("purchases");
}
document.addEventListener("keydown",e=>{
 const tag=e.target.tagName,typing=["INPUT","TEXTAREA","SELECT"].includes(tag);
 if(e.key==="Escape"){e.preventDefault();if($("#modal").classList.contains("show"))closeModal();else goBack();return}
 if(e.key==="F2"){e.preventDefault();customerForm();return}
 if(e.key==="F3"){e.preventDefault();if(page==="retail"||page==="wholesale"){const cid=$("#billCustomer")?.value;if(cid)customerForm(data.customers.find(c=>c.id===cid)||{});else if(data.customers.length){modal("F3 — Select Customer",`<div class="field"><label>Customer নির্বাচন করুন</label><select id="f3customer">${data.customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} — ${esc(c.mobile||"")}</option>`).join("")}</select></div><div class="actions"><button class="btn primary" data-action="f3-open">Edit Customer</button></div>`)}else customerForm()}else if(page==="customers"){notify("Customer-এর পাশে F3 Edit ক্লিক করুন।")}else customerForm();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"&&(page==="retail"||page==="wholesale")){e.preventDefault();saveBill(page);return}
 if(e.key==="Enter"&&typing){
  const form=e.target.closest("form");
  if(form&&e.target.tagName==="TEXTAREA")return;
  if(form&&e.target.type==="submit")return;
  if(e.target.classList.contains("row-item")){
   e.preventDefault();const tr=e.target.closest("tr");tr.querySelector(".qty").focus();return
  }
  if(e.target.classList.contains("qty")){e.preventDefault();e.target.closest("tr").querySelector(".rate").focus();return}
  if(e.target.classList.contains("rate")){e.preventDefault();e.target.closest("tr").querySelector(".tax").focus();return}
  if(e.target.classList.contains("tax")){
   e.preventDefault();const tr=e.target.closest("tr"),next=tr.nextElementSibling;
   if(next)next.querySelector(".row-item").focus();else{addBillRow();$("#billRows").lastElementChild?.querySelector(".row-item")?.focus()}return
  }
 }
});
document.addEventListener("click",e=>{
 const b=e.target.closest('[data-action="f3-open"]');if(!b)return;
 const cid=$("#f3customer")?.value;closeModal();customerForm(data.customers.find(c=>c.id===cid)||{});
});
function init(){
 load();
 $("#clock").textContent=today();
 render();
}
init();
</script>
</body>
</html>
