
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7017e8">
<title>SHREE ERP v2.1</title>

<style>
:root{
  --purple:#7017e8;
  --purple2:#4d0bb5;
  --pink:#ff3e9d;
  --bg:#f5f3fb;
  --card:#ffffff;
  --text:#251b35;
  --muted:#777187;
  --border:#e8e2f2;
  --green:#159c68;
  --red:#e7475c;
  --orange:#f39b26;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{
  background:linear-gradient(115deg,var(--purple2),var(--purple),#9d3cf4);
  color:white;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  box-shadow:0 5px 18px #5710a526;
}
.brand{display:flex;align-items:center;gap:11px}
.logo{
  height:45px;width:45px;border-radius:14px;
  background:#ffffff24;border:1px solid #ffffff55;
  display:grid;place-items:center;font-size:24px;
  font-weight:900;
}
.brand h1{margin:0;font-size:22px;letter-spacing:.5px}
.brand small{display:block;margin-top:4px;opacity:.82}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top-actions input{width:210px}
.top-actions input,.top-actions button{
  border:1px solid #ffffff45;border-radius:10px;
  padding:10px 12px;background:#ffffff18;color:white;
}
.top-actions input::placeholder{color:#eee}
.layout{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:calc(100vh - 74px)}
.sidebar{
  padding:15px 11px;background:white;border-right:1px solid var(--border);
}
.side-title{
  color:#a09aaa;font-size:11px;font-weight:bold;
  letter-spacing:1px;padding:12px 10px 7px;
}
.navbtn{
  width:100%;border:0;background:transparent;color:#534963;
  text-align:left;padding:11px 12px;border-radius:10px;
  margin:2px 0;font-weight:600;display:flex;gap:10px;align-items:center;
}
.navbtn:hover,.navbtn.active{background:#f0e6ff;color:var(--purple)}
.main{padding:20px;min-width:0}
.page-heading{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:18px;
}
.page-heading h2{margin:0;font-size:24px}
.page-heading p{margin:5px 0 0;color:var(--muted);font-size:13px}
.btn{
  border:0;border-radius:9px;padding:10px 14px;
  background:var(--purple);color:white;font-weight:bold;
}
.btn:hover{filter:brightness(.95)}
.btn.secondary{background:#eee6fa;color:var(--purple)}
.btn.success{background:var(--green)}
.btn.danger{background:var(--red)}
.btn.warning{background:var(--orange);color:#382000}
.btn.small{padding:7px 10px;font-size:12px}
.btn.light{background:#f6f2fc;color:#4e287c;border:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:15px;padding:17px;
  box-shadow:0 4px 15px #33145b06;min-width:0;
}
.stat-label{color:var(--muted);font-size:13px}
.stat-value{font-size:27px;font-weight:800;margin-top:9px;overflow-wrap:anywhere}
.stat-icon{font-size:24px;margin-bottom:10px}
.section{margin-top:18px}
.section h3{margin:0 0 13px;font-size:17px}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick{
  background:#fff;border:1px solid var(--border);border-radius:12px;
  padding:15px 10px;text-align:center;font-weight:bold;color:#4d2679;
}
.quick span{display:block;font-size:23px;margin-bottom:7px}
.two-col{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,.7fr);gap:15px}
.table-wrap{width:100%;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:600px}
th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{background:#f8f5fc;color:#675c77;font-size:12px;white-space:nowrap}
td{overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:25px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:bold;color:#5e536d}
input,select,textarea{
  width:100%;padding:10px 11px;border:1px solid #ddd5e9;
  border-radius:9px;background:#fff;color:var(--text);min-width:0;
}
input:focus,select:focus,textarea:focus{outline:2px solid #d8b9ff;border-color:var(--purple)}
textarea{min-height:75px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.toolbar input{flex:1;min-width:150px}
.badge{display:inline-block;border-radius:30px;padding:4px 8px;background:#eee5ff;color:#6a22ba;font-size:11px;font-weight:bold}
.badge.green{background:#ddf7ea;color:#087849}
.badge.red{background:#ffe5e8;color:#bb273b}
.invoice-items{min-width:900px}
.invoice-items input,.invoice-items select{padding:7px;font-size:12px;min-width:75px}
.invoice-items .product-select{min-width:160px}
.totals{margin-left:auto;width:min(100%,330px);margin-top:15px}
.total-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border)}
.total-row.final{font-size:20px;font-weight:bold;color:var(--purple);border-bottom:0}
.footer-note{color:var(--muted);font-size:12px;margin-top:14px}
.modal-backdrop{
  position:fixed;inset:0;background:#160a25a6;z-index:100;
  display:none;align-items:center;justify-content:center;padding:12px;
}
.modal-backdrop.show{display:flex}
.modal{
  background:white;width:min(760px,100%);max-height:94vh;overflow:auto;
  border-radius:17px;padding:20px;box-shadow:0 20px 60px #0003;
}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}
.modal-head h3{margin:0}
.close-btn{border:0;background:#f0e9f7;color:#4c2676;border-radius:9px;padding:8px 12px}
.notice{padding:12px;border-radius:10px;background:#f3eaff;color:#57259a;font-size:13px;margin-bottom:12px}
.mobile-menu{display:none}
hr{border:0;border-top:1px solid var(--border);margin:18px 0}
@media(max-width:1000px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two-col{grid-template-columns:1fr}
}
@media(max-width:700px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none;border-right:0;border-bottom:1px solid var(--border)}
  .sidebar.open{display:block}
  .mobile-menu{display:inline-block}
  .main{padding:13px}
  .brand h1{font-size:18px}
  .topbar{padding:12px}
  .top-actions{width:100%}
  .top-actions input{width:100%;flex:1}
  .grid{gap:9px}
  .card{padding:13px}
  .stat-value{font-size:21px}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .page-heading h2{font-size:21px}
}
@media print{
  body *{visibility:hidden!important}
  #printArea,#printArea *{visibility:visible!important}
  #printArea{position:absolute;left:0;top:0;width:100%;padding:15px;background:white}
  .no-print{display:none!important}
}
</style>
</head>

<body>
<header class="topbar">
  <div class="brand">
    <button class="mobile-menu" onclick="toggleMenu()">☰</button>
    <div class="logo">S</div>
    <div>
      <h1>SHREE ERP</h1>
      <small>Business Management System · v2.1</small>
    </div>
  </div>
  <div class="top-actions">
    <input id="globalSearch" placeholder="Search product / party..." oninput="globalSearch(this.value)">
    <button onclick="openPage('company')">🏢 Company</button>
    <button onclick="openPage('settings')">⚙ Settings</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-title">MAIN MENU</div>
    <button class="navbtn active" data-page="dashboard" onclick="openPage('dashboard')">▦ Dashboard</button>
    <button class="navbtn" data-page="items" onclick="openPage('items')">📦 Product Master</button>
    <button class="navbtn" data-page="parties" onclick="openPage('parties')">👥 Party / Customer</button>

    <div class="side-title">TRANSACTIONS</div>
    <button class="navbtn" data-page="retail" onclick="openPage('retail')">🧾 Retail Billing</button>
    <button class="navbtn" data-page="wholesale" onclick="openPage('wholesale')">🏬 Wholesale Billing</button>
    <button class="navbtn" data-page="purchase" onclick="openPage('purchase')">🛒 Purchase Entry</button>
    <button class="navbtn" data-page="receipts" onclick="openPage('receipts')">💰 Receipt</button>
    <button class="navbtn" data-page="payments" onclick="openPage('payments')">💸 Payment</button>

    <div class="side-title">ACCOUNTS & REPORTS</div>
    <button class="navbtn" data-page="stock" onclick="openPage('stock')">📊 Stock / Inventory</button>
    <button class="navbtn" data-page="ledger" onclick="openPage('ledger')">📒 Party Ledger</button>
    <button class="navbtn" data-page="outstanding" onclick="openPage('outstanding')">⏳ Outstanding</button>
    <button class="navbtn" data-page="sales" onclick="openPage('sales')">📈 Sales Reports</button>
    <button class="navbtn" data-page="purchasesReport" onclick="openPage('purchasesReport')">📉 Purchase Reports</button>
    <button class="navbtn" data-page="gst" onclick="openPage('gst')">🧮 GST Summary</button>

    <div class="side-title">SYSTEM</div>
    <button class="navbtn" data-page="company" onclick="openPage('company')">🏢 Company Profile</button>
    <button class="navbtn" data-page="settings" onclick="openPage('settings')">⚙ Settings / Backup</button>
  </aside>

  <main class="main" id="app"></main>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="backdropClose(event)">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Form</h3>
      <button class="close-btn" onclick="closeModal()">✕ Close (Esc)</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="printArea" style="display:none"></div>

<script>
"use strict";

/* Keep this key so existing SHREE ERP data can be reused. */
const STORAGE_KEY = "shree_erp_purple_v2";

function freshDB(){
  return {
    company:{name:"SHREE ERP",address:"",phone:"",gstin:"",regno:""},
    items:[],parties:[],bills:[],receipts:[],payments:[],purchases:[]
  };
}

function loadDB(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(!saved) return freshDB();
    const old=JSON.parse(saved);
    const base=freshDB();
    const db={...base,...old};
    for(const k of ["items","parties","bills","receipts","payments","purchases"]){
      if(!Array.isArray(db[k])) db[k]=[];
    }
    db.company={...base.company,...(db.company||{})};
    db.items=db.items.map(i=>({
      ...i,
      pack:i.pack||"",
      batch:i.batch||"",
      companyName:i.companyName||i.company_name||"",
      description:i.description||"",
      mrp:i.mrp??i.rate??i.saleRate??0,
      saleRate:i.saleRate??i.rate??i.mrp??0,
      purchaseRate:i.purchaseRate??0,
      tax:Number(i.tax??i.gst??0),
      stock:Number(i.stock??i.openingStock??0)
    }));
    db.parties=db.parties.map(p=>({
      ...p,
      type:p.type||"Customer",
      phone:p.phone||"",
      address:p.address||"",
      gstin:p.gstin||"",
      regno:p.regno||p.drugLicence||"",
      contact:p.contact||"",
      openingBalance:Number(p.openingBalance??p.opening_balance??0)
    }));
    return db;
  }catch(e){
    alert("পুরোনো ডেটা পড়তে সমস্যা হয়েছে। ডেটা মুছে ফেলা হয়নি। Backup থাকলে Import করো।");
    return freshDB();
  }
}

let db=loadDB();
let currentPage="dashboard";
let selectedItemId=null;
let selectedPartyId=null;
let editingBillType="retail";
let invoiceRows=[];

function saveDB(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
  }catch(e){
    alert("ডেটা সেভ করা যায়নি। ফোনের storage খালি আছে কি না দেখো।");
  }
}
function uid(prefix="ID"){
  return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
}
function money(n){return "₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(v){return Number(v)||0}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function dateToday(){return new Date().toISOString().slice(0,10)}
function dateTime(){return new Date().toLocaleString("en-IN")}
function toast(msg){alert(msg)}
function toggleMenu(){document.getElementById("sidebar").classList.toggle("open")}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("show")}
function backdropClose(e){if(e.target.id==="modalBackdrop")closeModal()}
function openModal(title,html){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=html;
  document.getElementById("modalBackdrop").classList.add("show");
  setTimeout(()=>{
    const el=document.querySelector("#modalBody input:not([type=hidden]),#modalBody select,#modalBody textarea");
    if(el)el.focus();
  },50);
}
function openPage(page){
  currentPage=page;
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  document.getElementById("sidebar").classList.remove("open");
  renderPage();
}
function pageHead(title,sub,buttons=""){
  return `<div class="page-heading"><div><h2>${title}</h2><p>${sub||""}</p></div><div class="toolbar">${buttons}</div></div>`;
}
function emptyRow(cols,msg="কোনও ডেটা পাওয়া যায়নি"){
  return `<tr><td colspan="${cols}" class="empty">${msg}</td></tr>`;
}
function itemName(id){
  const i=db.items.find(x=>x.id===id);
  return i?i.name:"Deleted / Unknown Product";
}
function partyName(id){
  const p=db.parties.find(x=>x.id===id);
  return p?p.name:"Cash / Unknown Party";
}
function itemById(id){return db.items.find(x=>x.id===id)}
function partyById(id){return db.parties.find(x=>x.id===id)}
function itemOptions(selected=""){
  return `<option value="">Select product</option>`+db.items.map(i=>
    `<option value="${esc(i.id)}" ${i.id===selected?"selected":""}>${esc(i.name)}${i.code?" · "+esc(i.code):""}</option>`
  ).join("");
}
function partyOptions(selected="",mode="all"){
  const list=db.parties.filter(p=>{
    if(mode==="supplier")return p.type==="Supplier"||p.type==="Both";
    if(mode==="customer")return p.type==="Customer"||p.type==="Both";
    return true;
  });
  return `<option value="">${mode==="supplier"?"Select supplier":"Select party / customer"}</option>`+
    list.map(p=>`<option value="${esc(p.id)}" ${p.id===selected?"selected":""}>${esc(p.name)}${p.phone?" · "+esc(p.phone):""}</option>`).join("");
}

function renderPage(){
  const app=document.getElementById("app");
  const pages={
    dashboard:renderDashboard,
    items:renderItems,
    parties:renderParties,
    retail:()=>renderBilling("retail"),
    wholesale:()=>renderBilling("wholesale"),
    purchase:renderPurchase,
    receipts:renderReceipts,
    payments:renderPayments,
    stock:renderStock,
    ledger:renderLedger,
    outstanding:renderOutstanding,
    sales:renderSales,
    purchasesReport:renderPurchaseReport,
    gst:renderGST,
    company:renderCompany,
    settings:renderSettings
  };
  app.innerHTML=(pages[currentPage]||renderDashboard)();
}
function renderDashboard(){
  const today=dateToday();
  const todayBills=db.bills.filter(b=>b.date===today);
  const sales=todayBills.reduce((s,b)=>s+num(b.total),0);
  const stockUnits=db.items.reduce((s,i)=>s+num(i.stock),0);
  const low=db.items.filter(i=>num(i.stock)<=5).length;
  const purchaseToday=db.purchases.filter(p=>p.date===today).reduce((s,p)=>s+num(p.total),0);
  return `
  ${pageHead("Dashboard","Welcome to SHREE ERP · Your business overview",
    `<button class="btn" onclick="openPage('retail')">＋ New Retail Bill</button>
     <button class="btn secondary" onclick="openPage('wholesale')">＋ Wholesale Bill</button>`)}
  <div class="grid">
    <div class="card"><div class="stat-icon">💵</div><div class="stat-label">Today's Sales</div><div class="stat-value">${money(sales)}</div></div>
    <div class="card"><div class="stat-icon">🧾</div><div class="stat-label">Today's Bills</div><div class="stat-value">${todayBills.length}</div></div>
    <div class="card"><div class="stat-icon">📦</div><div class="stat-label">Products</div><div class="stat-value">${db.items.length}</div></div>
    <div class="card"><div class="stat-icon">⚠️</div><div class="stat-label">Low Stock Products</div><div class="stat-value">${low}</div></div>
  </div>
  <div class="section card">
    <h3>⚡ Quick Access</h3>
    <div class="quick-grid">
      <button class="quick" onclick="openPage('items')"><span>📦</span>Product Master</button>
      <button class="quick" onclick="openPage('parties')"><span>👥</span>Party Master</button>
      <button class="quick" onclick="openPage('purchase')"><span>🛒</span>Purchase Entry</button>
      <button class="quick" onclick="openPage('receipts')"><span>💰</span>Receipt Entry</button>
      <button class="quick" onclick="openPage('payments')"><span>💸</span>Payment Entry</button>
      <button class="quick" onclick="openPage('stock')"><span>📊</span>Stock Report</button>
      <button class="quick" onclick="openPage('ledger')"><span>📒</span>Party Ledger</button>
      <button class="quick" onclick="openPage('settings')"><span>⚙️</span>Backup Data</button>
    </div>
  </div>
  <div class="section two-col">
    <div class="card"><h3>🧾 Recent Sales</h3><div class="table-wrap"><table><thead><tr><th>Bill No.</th><th>Date</th><th>Party</th><th>Total</th><th>Action</th></tr></thead><tbody>
    ${db.bills.slice().reverse().slice(0,7).map(b=>`<tr><td>${esc(b.no||"-")}</td><td>${esc(b.date||"-")}</td><td>${esc(partyName(b.partyId))}</td><td>${money(b.total)}</td><td><button class="btn small secondary" onclick="printBill('${esc(b.id)}')">Print</button></td></tr>`).join("")||emptyRow(5)}
    </tbody></table></div></div>
    <div class="card"><h3>📦 Low Stock Alert</h3><div class="table-wrap"><table><thead><tr><th>Product</th><th>Stock</th></tr></thead><tbody>
    ${db.items.filter(i=>num(i.stock)<=5).slice(0,8).map(i=>`<tr><td>${esc(i.name)}</td><td><span class="badge red">${num(i.stock)} ${esc(i.unit||"pcs")}</span></td></tr>`).join("")||emptyRow(2,"সব পণ্যের স্টক ঠিক আছে")}
    </tbody></table></div></div>
  </div>
  <div class="footer-note">আজকের Purchase: ${money(purchaseToday)} · ডেটা এই ব্রাউজারের LocalStorage-এ সেভ হয়। নিয়মিত Backup রাখুন।</div>`;
}

/* PRODUCT MASTER */
function renderItems(){
  return `${pageHead("Product Master","পণ্য একবার যোগ করো, সব billing ও purchase-এ ব্যবহার করো",
    `<button class="btn" onclick="itemForm()">＋ Add Product (F2)</button>`)}
  <div class="card">
    <div class="toolbar"><input id="itemSearch" placeholder="Search name / code / company / batch..." oninput="filterTable('itemSearch','itemsTable')">
    <button class="btn secondary" onclick="itemForm()">＋ Add Product</button></div>
    <div class="table-wrap"><table id="itemsTable"><thead><tr>
    <th>Product</th><th>Code</th><th>Pack</th><th>Batch</th><th>Company</th><th>Sale Rate</th><th>MRP</th><th>GST</th><th>Stock</th><th>Actions</th>
    </tr></thead><tbody>
    ${db.items.map(i=>`<tr data-search="${esc([i.name,i.code,i.pack,i.batch,i.companyName].join(" ").toLowerCase())}">
    <td><b>${esc(i.name)}</b><br><small>${esc(i.description||"")}</small></td><td>${esc(i.code||"-")}</td>
    <td>${esc(i.pack||"-")}</td><td>${esc(i.batch||"-")}</td><td>${esc(i.companyName||"-")}</td>
    <td>${money(i.saleRate)}</td><td>${money(i.mrp)}</td><td>${num(i.tax)}%</td><td>${num(i.stock)} ${esc(i.unit||"pcs")}</td>
    <td><button class="btn small secondary" onclick="itemForm('${esc(i.id)}')">Edit (F3)</button> <button class="btn small danger" onclick="deleteItem('${esc(i.id)}')">Delete</button></td>
    </tr>`).join("")||emptyRow(10,"এখনও কোনও Product যোগ করা হয়নি।")}
    </tbody></table></div>
  </div>`;
}
function itemForm(id=""){
  const i=id?itemById(id):{};
  selectedItemId=id||null;
  openModal(id?"Edit Product":"Add New Product",`
  <form id="itemForm" onsubmit="saveItem(event,'${esc(id)}')">
    <div class="form-grid">

function legacyItems(b){
  if(Array.isArray(b.items))return b.items;
  if(b.itemId)return [{itemId:b.itemId,qty:num(b.qty),rate:num(b.rate),tax:num(b.tax),amount:num(b.total),free:num(b.free),discount:num(b.discount)}];
  if(b.item)return [{itemName:b.item,qty:num(b.qty),rate:num(b.rate),tax:num(b.tax),amount:num(b.total)}];
  return [];
}
function nextBillNo(type){
  const prefix=type==="wholesale"?"WS":"RT";
  const n=db.bills.filter(b=>(b.type||"retail")===type).length+1;

}
function newBill(type){
  editingBillType=type;
  invoiceRows=[newInvoiceRow()];

  openModal(wholesale?"New Wholesale Invoice":"New Retail Invoice",`

      <div class="field"><label>Date</label><input name="date" type="date" required value="${dateToday()}"></div>
      <div class="field"><label>Customer / Party</label><select name="partyId" id="billParty" onchange="updatePartyDetails()">${partyOptions("","customer")}</select></div>
      <div class="field"><label>Payment Type</label><select name="paymentMode"><option>Cash</option><option>Credit</option><option>UPI</option><option>Card</option><option>Bank Transfer</option></select></div>
      <div class="field"><label>Customer Mobile</label><input id="billPhone" readonly></div>
      <div class="field"><label>GSTIN / Reg. No.</label><input id="billGstin" readonly></div>

    <th>Product</th><th>Pack</th><th>Batch</th><th>Qty</th>${wholesale?"<th>Free</th>":""}<th>Rate</th><th>GST %</th><th>Amount</th><th>Action</th>
    </tr></thead><tbody id="invoiceRows"></tbody></table></div>
    <div class="totals">
      <div class="total-row"><span>Subtotal</span><b id="billSubtotal">₹0.00</b></div>
      <div class="total-row"><span>GST Total</span><b id="billTax">₹0.00</b></div>
      <div class="total-row"><span>Discount (₹)</span><input style="width:110px" id="billDiscount" type="number" min="0" step="0.01" value="0" oninput="calculateBill()"></div>
      <div class="total-row final"><span>Grand Total</span><span id="billTotal">₹0.00</span></div>
    </div>
    <div class="field" style="margin-top:15px"><label>Notes</label><textarea name="notes" placeholder="Optional notes"></textarea></div>
    <div class="actions"><button class="btn success" type="submit">💾 Save Invoice</button><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button></div>

function newInvoiceRow(){return {itemId:"",qty:1,free:0,rate:0,tax:0,pack:"",batch:""}}
function addInvoiceRow(){
  invoiceRows.push(newInvoiceRow());renderInvoiceRows(editingBillType);
}
function renderInvoiceRows(type){
  const wholesale=type==="wholesale";
  const body=document.getElementById("invoiceRows");
  if(!body)return;
  body.innerHTML=invoiceRows.map((r,idx)=>`
  <tr>
    <td><select class="product-select" onchange="changeInvoiceProduct(${idx},this.value)">${itemOptions(r.itemId)}</select>
    <button type="button" class="btn small light" onclick="editInvoiceProduct(${idx})">Edit (F3)</button></td>
    <td><input value="${esc(r.pack||"")}" onchange="invoiceRows[${idx}].pack=this.value"></td>
    <td><input value="${esc(r.batch||"")}" onchange="invoiceRows[${idx}].batch=this.value"></td>
    <td><input type="number" min="0.01" step="0.01" value="${num(r.qty)||1}" onchange="changeInvoiceNumber(${idx},'qty',this.value)"></td>
    ${wholesale?`<td><input type="number" min="0" step="0.01" value="${num(r.free)}" onchange="changeInvoiceNumber(${idx},'free',this.value)"></td>`:""}
    <td><input type="number" min="0" step="0.01" value="${num(r.rate)}" onchange="changeInvoiceNumber(${idx},'rate',this.value)"></td>
    <td><input type="number" min="0" max="100" step="0.01" value="${num(r.tax)}" onchange="changeInvoiceNumber(${idx},'tax',this.value)"></td>
    <td id="rowAmount${idx}">${money(invoiceLine(r).total)}</td>
    <td><button type="button" class="btn small danger" onclick="removeInvoiceRow(${idx})">✕</button></td>
  </tr>`).join("");
  calculateBill();
}
function changeInvoiceProduct(idx,id){
  const item=itemById(id);
  invoiceRows[idx].itemId=id;
  if(item){
    invoiceRows[idx].pack=item.pack||"";
    invoiceRows[idx].batch=item.batch||"";
    invoiceRows[idx].rate=editingBillType==="wholesale"&&item.wholesaleRate?num(item.wholesaleRate):num(item.saleRate);
    invoiceRows[idx].tax=num(item.tax);
  }
  renderInvoiceRows(editingBillType);
}
function changeInvoiceNumber(idx,key,value){
  invoiceRows[idx][key]=num(value);
  calculateBill();
}
function removeInvoiceRow(idx){
  if(invoiceRows.length===1){invoiceRows[0]=newInvoiceRow();}
  else invoiceRows.splice(idx,1);
  renderInvoiceRows(editingBillType);
}
function editInvoiceProduct(idx){
  const id=invoiceRows[idx].itemId;
  if(!id){toast("আগে Product select করো।");return}
  itemForm(id);
}
function invoiceLine(r){
  const base=Math.max(0,num(r.qty))*Math.max(0,num(r.rate));
  const tax=base*Math.max(0,num(r.tax))/100;
  return {base,tax,total:base+tax};
}
function calculateBill(){
  let subtotal=0,tax=0;
  invoiceRows.forEach((r,i)=>{
    const line=invoiceLine(r);subtotal+=line.base;tax+=line.tax;
    const cell=document.getElementById("rowAmount"+i);if(cell)cell.textContent=money(line.total);
  });
  const discount=Math.max(0,num(document.getElementById("billDiscount")?.value));
  const total=Math.max(0,subtotal+tax-discount);
  const s=document.getElementById("billSubtotal"),t=document.getElementById("billTax"),g=document.getElementById("billTotal");
  if(s)s.textContent=money(subtotal);
  if(t)t.textContent=money(tax);
  if(g)g.textContent=money(total);
  return {subtotal,tax,discount,total};
}
function updatePartyDetails(){
  const id=document.getElementById("billParty")?.value;
  const p=partyById(id);
  const phone=document.getElementById("billPhone"),gst=document.getElementById("billGstin"),address=document.getElementById("billAddress");
  if(phone)phone.value=p?.phone||"";
  if(gst)gst.value=p?[p.gstin,p.regno].filter(Boolean).join(" / "):"";
  if(address)address.value=p?.address||"";
}
function saveBill(e,type){
  e.preventDefault();
  const form=e.target;const data=Object.fromEntries(new FormData(form).entries());
  const rows=invoiceRows.filter(r=>r.itemId&&num(r.qty)>0);
  if(!rows.length){toast("কমপক্ষে একটি Product select করো।");return}
  for(const r of rows){
    const item=itemById(r.itemId);
    if(!item){toast("একটি Product আর পাওয়া যাচ্ছে না।");return}
    if(num(item.stock)<num(r.qty)+num(r.free)){
      if(!confirm(item.name+"-এর stock কম। Negative stock করতে চাও?"))return;
    }
  }
  const totals=calculateBill();
  const bill={
    id:uid("BILL"),type,no:data.no.trim(),date:data.date,partyId:data.partyId||"",
    paymentMode:data.paymentMode||"Cash",notes:data.notes||"",
    items:rows.map(r=>({
      itemId:r.itemId,itemName:itemName(r.itemId),pack:r.pack,batch:r.batch,
      qty:num(r.qty),free:num(r.free),rate:num(r.rate),tax:num(r.tax),
      subtotal:invoiceLine(r).base,taxAmount:invoiceLine(r).tax,amount:invoiceLine(r).total
    })),
    subtotal:totals.subtotal,tax:totals.tax,discount:totals.discount,total:totals.total,
    createdAt:dateTime()
  };
  rows.forEach(r=>{
    const item=itemById(r.itemId);
    if(item)item.stock=num(item.stock)-num(r.qty)-num(r.free);
  });
  db.bills.push(bill);
  saveDB();closeModal();renderPage();
  toast("Invoice saved successfully.");
  printBill(bill.id);
}
function deleteBill(id){
  const b=db.bills.find(x=>x.id===id);
  if(!b||!confirm("Bill delete করবে? এই কাজটি stock-এ স্বয়ংক্রিয়ভাবে ফেরত যোগ করবে না।"))return;
  db.bills=db.bills.filter(x=>x.id!==id);saveDB();renderPage();
}

function fillPurchaseRate(){
  const i=itemById(document.getElementById("purchaseItem").value);
  if(!i)return;
  document.getElementById("purchaseRate").value=num(i.purchaseRate);
  document.getElementById("purchaseTax").value=num(i.tax);
  document.getElementById("purchaseBatch").value=i.batch||"";
  document.getElementById("purchasePack").value=i.pack||"";
  calcPurchase();
}
function calcPurchase(){
  const f=document.querySelector("#modalBody form");
  if(!f)return;
  const qty=num(f.elements.qty?.value),rate=num(f.elements.rate?.value),tax=num(f.elements.tax?.value);
  const total=qty*rate*(1+tax/100);
  const el=document.getElementById("purchaseTotal");if(el)el.value=total.toFixed(2);
}
function savePurchase(e){
  e.preventDefault();
  const data=Object.fromEntries(new FormData(e.target).entries());
  const item=itemById(data.itemId);
  if(!item){toast("Product select করো।");return}
  const qty=num(data.qty),rate=num(data.rate),tax=num(data.tax);
  const p={id:uid("PUR"),no:data.no.trim(),date:data.date,partyId:data.partyId||"",
    itemId:item.id,qty,rate,tax,batch:data.batch,pack:data.pack,
    total:qty*rate*(1+tax/100),createdAt:dateTime()};
  item.stock=num(item.stock)+qty;
  item.purchaseRate=rate;
  if(data.batch)item.batch=data.batch;
  if(data.pack)item.pack=data.pack;
  db.purchases.push(p);saveDB();closeModal();renderPage();toast("Purchase saved; stock updated.");
}
function printPurchase(id){
  const p=db.purchases.find(x=>x.id===id);if(!p)return;
  showPrint(`<h2>Purchase Entry</h2><p>Purchase No: ${esc(p.no)} | Date: ${esc(p.date)}</p><p>Supplier: ${esc(partyName(p.partyId))}</p><table><tr><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th></tr><tr><td>${esc(itemName(p.itemId))}</td><td>${num(p.qty)}</td><td>${money(p.rate)}</td><td>${money(p.total)}</td></tr></table>`);
}

function partyTransactions(partyId){
  const tx=[];
  db.bills.forEach(b=>{
    if(b.partyId===partyId)tx.push({date:b.date,type:"Sale",ref:b.no,dr:num(b.total),cr:0});
  });
  db.purchases.forEach(p=>{
    if(p.partyId===partyId)tx.push({date:p.date,type:"Purchase",ref:p.no,dr:0,cr:num(p.total)});
  });
  db.receipts.forEach(r=>{
    if(r.partyId===partyId)tx.push({date:r.date,type:"Receipt",ref:r.no,dr:0,cr:num(r.amount)});
  });
  db.payments.forEach(p=>{
    if(p.partyId===partyId)tx.push({date:p.date,type:"Payment",ref:p.no,dr:num(p.amount),cr:0});
  });
  return tx.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
}

  return `${pageHead("Party Ledger","নির্দিষ্ট Party-র sales, purchase ও cash transaction")}

function partyBalance(p){
  let balance=num(p.openingBalance);
  db.bills.filter(b=>b.partyId===p.id).forEach(b=>balance+=num(b.total));
  db.purchases.filter(x=>x.partyId===p.id).forEach(x=>balance-=num(x.total));
  db.receipts.filter(x=>x.partyId===p.id).forEach(x=>balance-=num(x.amount));
  db.payments.filter(x=>x.partyId===p.id).forEach(x=>balance+=num(x.amount));
  return balance;
}

function exportBackup(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  downloadBlob(blob,"SHREE-ERP-backup-"+dateToday()+".json");
}
function importBackup(){
  const input=document.getElementById("backupFile");
  const file=input.files[0];
  if(!file){toast("আগে JSON backup file select করো।");return}
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const incoming=JSON.parse(reader.result);
      if(!incoming||typeof incoming!=="object")throw new Error("Invalid file");
      if(!confirm("Import করলে বর্তমান data replace হবে। আগে backup রেখেছ তো?"))return;
      const base=freshDB();
      db={...base,...incoming};
      for(const k of ["items","parties","bills","receipts","payments","purchases"])if(!Array.isArray(db[k]))db[k]=[];
      db.company={...base.company,...(db.company||{})};
      saveDB();renderPage();toast("Backup imported.");
    }catch(e){toast("Invalid backup file. Data import করা হয়নি।")}
  };
  reader.readAsText(file);
}
function clearDemoData(){
  if(!confirm("সতর্কতা: সব Product, Party, Bill, Purchase, Receipt ও Payment মুছে যাবে। Backup আছে তো?"))return;
  const company=db.company;
  db=freshDB();db.company=company;saveDB();renderPage();
}
function downloadBlob(blob,name){
  const a=document.createElement("a");const url=URL.createObjectURL(blob);
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function exportCSV(type){
  let rows=[];
  if(type==="stock"){
    rows=[["Product","Code","Pack","Batch","Stock","Purchase Rate","Sale Rate","GST"],
      ...db.items.map(i=>[i.name,i.code,i.pack,i.batch,i.stock,i.purchaseRate,i.saleRate,i.tax])];
  }else if(type==="sales"){
    rows=[["Bill No","Date","Type","Party","Subtotal","GST","Total"],
      ...db.bills.map(b=>[b.no,b.date,b.type,partyName(b.partyId),b.subtotal,b.tax,b.total])];
  }else{
    rows=[["Purchase No","Date","Supplier","Product","Qty","Rate","GST","Total"],
      ...db.purchases.map(p=>[p.no,p.date,partyName(p.partyId),itemName(p.itemId),p.qty,p.rate,p.tax,p.total])];
  }
  const csv=rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
  downloadBlob(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}),"SHREE-ERP-"+type+"-"+dateToday()+".csv");
}

/* SEARCH & SHORTCUTS */
function filterTable(inputId,tableId){
  const input=document.getElementById(inputId);
  const table=document.getElementById(tableId);
  if(!input||!table)return;
  const q=input.value.toLowerCase();
  table.querySelectorAll("tbody tr").forEach(tr=>{
    tr.style.display=(tr.dataset.search||tr.innerText.toLowerCase()).includes(q)?"":"none";
  });
}
function globalSearch(value){
  const q=value.trim().toLowerCase();
  if(!q)return;
  const item=db.items.find(i=>[i.name,i.code,i.companyName,i.batch].join(" ").toLowerCase().includes(q));
  if(item){openPage("items");setTimeout(()=>{const s=document.getElementById("itemSearch");if(s){s.value=value;filterTable("itemSearch","itemsTable")}},30);return}
  const party=db.parties.find(p=>[p.name,p.phone,p.gstin].join(" ").toLowerCase().includes(q));
  if(party){openPage("parties");setTimeout(()=>{const s=document.getElementById("partySearch");if(s){s.value=value;filterTable("partySearch","partiesTable")}},30)}
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    closeModal();
    return;
  }
  const modalOpen=document.getElementById("modalBackdrop").classList.contains("show");
  if(e.key==="F2"){
    e.preventDefault();
    if(modalOpen){
      if(currentPage==="items")itemForm();
      else if(currentPage==="parties")partyForm();
      else if(currentPage==="retail"||currentPage==="wholesale")addInvoiceRow();
    }else{
      if(currentPage==="items")itemForm();
      else if(currentPage==="parties")partyForm();
      else if(currentPage==="retail"||currentPage==="wholesale")newBill(currentPage);
    }
  }
  if(e.key==="F3"){
    e.preventDefault();
    if((currentPage==="items"||currentPage==="parties")&&!modalOpen){
      const id=currentPage==="items"?selectedItemId:selectedPartyId;
      if(id){currentPage==="items"?itemForm(id):partyForm(id)}
      else toast("আগে তালিকা থেকে Edit select করো।");
    }else if(modalOpen&&(currentPage==="retail"||currentPage==="wholesale")){
      const focused=document.activeElement;
      const row=focused?.closest("tr");
      if(row){
        const idx=[...row.parentElement.children].indexOf(row);
        if(invoiceRows[idx]?.itemId)editInvoiceProduct(idx);
      }else toast("Product row-তে click করে F3 চাপো।");
    }
  }
  if(e.key==="Enter"&&modalOpen){
    const target=e.target;
    if(target.matches("input,select")&&!target.matches("button,input[type=submit],input[type=button]")){
      const form=target.closest("form");
      if(form){
        const fields=[...form.querySelectorAll("input:not([type=hidden]):not([readonly]),select,textarea,button[type=submit]")].filter(el=>!el.disabled&&el.offsetParent!==null);
        const idx=fields.indexOf(target);
        if(idx>=0&&idx<fields.length-1){e.preventDefault();fields[idx+1].focus()}
      }
    }
  }
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b)return;
  const match=b.getAttribute("onclick")||"";
  const item=match.match(/itemForm\('([^']+)'\)/);
  if(item)selectedItemId=item[1];
  const party=match.match(/partyForm\('([^']+)'\)/);
  if(party)selectedPartyId=party[1];
});

/* Start */
renderPage();
</script>
</body>
</html>
