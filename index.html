
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#6418c6">
<title>SHREE ERP | Business Management</title>
<style>
:root{
 --purple:#6418c6;--deep:#391078;--light:#f3edff;--pink:#ed42a6;
 --bg:#f4f5fa;--white:#fff;--text:#242039;--muted:#74718a;
 --border:#dcd7e9;--green:#11834b;--red:#cf3049;--orange:#f39a25;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans Bengali",sans-serif;color:var(--text);font-size:13px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{background:linear-gradient(110deg,var(--deep),var(--purple),#8b36df);color:white;padding:11px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;box-shadow:0 3px 12px #28104a30}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:#ffffff22;border:1px solid #ffffff55;display:grid;place-items:center;font-weight:900;font-size:22px}
.brand h1{margin:0;font-size:20px;letter-spacing:1px}
.brand small{display:block;margin-top:4px;color:#e6d7ff;font-size:11px}
.top-actions{display:flex;gap:7px;align-items:center}
.top-actions input{width:210px;max-width:28vw;background:#ffffff18;border:1px solid #ffffff55;color:white}
.top-actions input::placeholder{color:#eee}
.layout{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:calc(100vh - 62px)}
.sidebar{background:#fff;border-right:1px solid var(--border);padding:12px 9px}
.side-title{font-size:10px;color:#9992ae;font-weight:bold;letter-spacing:1px;padding:10px 9px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;border:0;border-radius:8px;background:transparent;text-align:left;color:#4c4561;margin:2px 0}
.nav:hover,.nav.active{background:var(--light);color:var(--purple);font-weight:bold}
.nav .ico{width:22px;text-align:center;font-size:16px}
.main{padding:17px;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.pagehead h2{margin:0;font-size:22px}
.sub{color:var(--muted);margin-top:5px;font-size:12px}
.btn{border:1px solid var(--border);background:white;color:#3e3656;padding:8px 12px;border-radius:7px;font-weight:600}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--purple);border-color:var(--purple);color:white}
.btn.green{background:var(--green);border-color:var(--green);color:white}
.btn.red{color:var(--red);border-color:#f1c8d0}
.btn.small{padding:5px 8px;font-size:11px}
.btn.orange{background:#fff4e3;color:#945600;border-color:#f3d7a7}
.panel,.stat{background:white;border:1px solid var(--border);border-radius:11px;padding:15px;margin-bottom:14px;box-shadow:0 2px 7px #28104a05}
.panel h3{margin:0 0 12px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{margin:0;position:relative;overflow:hidden}
.stat .slabel{color:var(--muted);font-size:12px}
.stat .snum{font-size:25px;font-weight:800;margin-top:9px;color:var(--deep);overflow-wrap:anywhere}
.stat .sicon{position:absolute;right:12px;top:12px;font-size:24px;opacity:.35}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11px;color:#615a74;font-weight:bold}
input,select,textarea{width:100%;min-width:0;padding:9px 10px;border:1px solid #d7d1e5;border-radius:6px;background:#fff;color:#28223a;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 2px #6418c618}
input[readonly]{background:#f5f3f9}
.formrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:11px}
.formrow.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.formrow.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tablewrap{width:100%;overflow:auto;border:1px solid var(--border);border-radius:7px}
table{width:100%;border-collapse:collapse;min-width:650px;background:white}
th,td{padding:9px 10px;border-bottom:1px solid #eeeaf5;text-align:left;white-space:nowrap}
th{background:#f1ebff;color:#4e258a;font-size:11px;position:sticky;top:0}
td{font-size:12px}
tbody tr:hover{background:#faf8ff}
.empty{text-align:center;color:#928ba2;padding:26px}
.pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#f0eaff;color:var(--purple);font-size:10px;font-weight:bold}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input{max-width:290px}
.notice{background:#f7f1ff;border:1px solid #e3d4ff;padding:10px;border-radius:7px;color:#503080;margin-bottom:12px;font-size:12px}
.bill-top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.bill-customer{display:grid;grid-template-columns:1.1fr 1.4fr;gap:10px;margin-top:10px}
.bill-customer.second{grid-template-columns:1fr 1fr}
.bill-grid{min-width:850px}
.bill-grid input,.bill-grid select{border:1px solid #dcd5e9;border-radius:3px;padding:7px 5px;min-width:65px}
.bill-grid th{background:#e7dcff}
.bill-grid td{padding:4px}
.bill-grid .product-select{min-width:180px}
.bill-grid .num{min-width:72px;text-align:right}
.bill-grid .amount-cell{font-weight:bold;text-align:right}
.bill-grid .delcell{text-align:center}
.bill-summary{display:flex;justify-content:flex-end;margin-top:12px}
.summary-box{width:330px;max-width:100%;border:1px solid var(--border);border-radius:8px;padding:12px;background:#fcfaff}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.sumrow.total{border-top:1px solid var(--border);margin-top:5px;padding-top:10px;font-size:18px;font-weight:800;color:var(--deep)}
.bill-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.modal-backdrop{display:none;position:fixed;inset:0;background:#160d2b99;z-index:100;align-items:center;justify-content:center;padding:14px}
.modal-backdrop.show{display:flex}
.modal{width:600px;max-width:100%;max-height:90vh;overflow:auto;background:white;border-radius:12px;padding:18px;box-shadow:0 15px 55px #0003}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modalhead h3{margin:0;font-size:18px}
.xbtn{border:0;background:#f0eaf8;border-radius:50%;width:31px;height:31px;font-size:18px}
.quickgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick{background:#fff;border:1px solid var(--border);padding:14px 9px;border-radius:9px;text-align:center;color:var(--text)}
.quick:hover{border-color:var(--purple);background:var(--light)}
.quick b{display:block;font-size:12px;margin-top:7px}
.quick span{font-size:23px}
.footer{color:#958da5;text-align:center;font-size:11px;padding:15px}
.hide{display:none!important}
@media(max-width:850px){
 .layout{grid-template-columns:1fr}
 .sidebar{display:flex;overflow-x:auto;gap:3px;padding:7px;border-right:0;border-bottom:1px solid var(--border);position:sticky;top:62px;z-index:10}
 .side-title{display:none}
 .nav{white-space:nowrap;width:auto;flex-shrink:0;padding:9px}
 .nav .ico{width:auto}
 .main{padding:11px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .stat .snum{font-size:21px}
 .quickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .top-actions input{width:125px}
}
@media(max-width:520px){
 .brand h1{font-size:16px}
 .brand small{font-size:9px}
 .logo{width:34px;height:34px}
 .topbar{padding:9px}
 .top-actions input{display:none}
 .formrow,.formrow.two,.formrow.four,.grid2,.grid3{grid-template-columns:1fr 1fr}
 .bill-top{grid-template-columns:1fr 1fr}
 .bill-customer,.bill-customer.second{grid-template-columns:1fr 1fr}
 .pagehead h2{font-size:19px}
 .panel{padding:11px}
}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand">
  <div class="logo">S</div>
  <div><h1>SHREE ERP</h1><small>SMART BUSINESS MANAGEMENT</small></div>
 </div>
 <div class="top-actions">
  <input id="globalSearch" placeholder="Search item / party..." oninput="globalSearch(this.value)">
  <button class="btn" onclick="backupData()">⬇ Backup</button>
 </div>
</header>
<div class="layout">
 <aside class="sidebar" id="sidebar">
  <div class="side-title">MAIN MENU</div>
  <button class="nav active" data-view="dashboard" onclick="go('dashboard',this)"><span class="ico">▦</span> Dashboard</button>
  <button class="nav" data-view="retail" onclick="go('retail',this)"><span class="ico">🧾</span> Bill-Retail</button>
  <button class="nav" data-view="wholesale" onclick="go('wholesale',this)"><span class="ico">📦</span> Bill-Wholesale</button>
  <button class="nav" data-view="receipt" onclick="go('receipt',this)"><span class="ico">💵</span> Receipt</button>
  <button class="nav" data-view="payment" onclick="go('payment',this)"><span class="ico">💳</span> Payment</button>
  <div class="side-title">MASTERS</div>
  <button class="nav" data-view="items" onclick="go('items',this)"><span class="ico">🧴</span> Item Master</button>
  <button class="nav" data-view="parties" onclick="go('parties',this)"><span class="ico">👥</span> Party Master</button>
  <button class="nav" data-view="purchase" onclick="go('purchase',this)"><span class="ico">🛒</span> Purchase / Stock In</button>
  <button class="nav" data-view="company" onclick="go('company',this)"><span class="ico">🏢</span> Company</button>
  <div class="side-title">REPORTS & SETUP</div>
  <button class="nav" data-view="reports" onclick="go('reports',this)"><span class="ico">📊</span> Report Centre</button>
  <button class="nav" data-view="settings" onclick="go('settings',this)"><span class="ico">⚙️</span> Settings</button>
 </aside>
 <main class="main" id="app"></main>
</div>
<div class="footer">SHREE ERP • Local demo edition • Data stored in this browser</div>

<div class="modal-backdrop" id="partyModal">
 <div class="modal">
  <div class="modalhead"><h3 id="partyModalTitle">New Customer</h3><button class="xbtn" onclick="closePartyModal()">×</button></div>
  <form id="partyForm">
   <input type="hidden" id="partyEditId">
   <div class="formrow two">
    <div class="field"><label>Party Name *</label><input id="pmName" required></div>
    <div class="field"><label>Party Type</label><select id="pmType"><option>Customer</option><option>Supplier</option><option>Both</option></select></div>
   </div>
   <div class="formrow two">
    <div class="field"><label>Mobile No</label><input id="pmMobile" inputmode="tel"></div>
    <div class="field"><label>GSTIN / Reg No</label><input id="pmGstin"></div>
   </div>
   <div class="formrow two">
    <div class="field"><label>Contact Person</label><input id="pmContact"></div>
    <div class="field"><label>Drug Licence / Reg No</label><input id="pmDrug"></div>
   </div>
   <div class="field"><label>Address</label><textarea id="pmAddress" rows="2"></textarea></div>
   <div class="bill-buttons"><button class="btn primary" type="submit">Save Party</button><button class="btn" type="button" onclick="closePartyModal()">Cancel (Esc)</button></div>
  </form>
 </div>
</div>

<div class="modal-backdrop" id="itemModal">
 <div class="modal">
  <div class="modalhead"><h3 id="itemModalTitle">Add Item</h3><button class="xbtn" onclick="closeItemModal()">×</button></div>
  <form id="itemForm">
   <input type="hidden" id="itemEditId">
   <div class="formrow two">
    <div class="field"><label>Product Name *</label><input id="imName" required></div>
    <div class="field"><label>Item Code</label><input id="imCode"></div>
   </div>
   <div class="formrow two">
    <div class="field"><label>Pack</label><input id="imPack" placeholder="যেমন 10 Tab / 100ml"></div>
    <div class="field"><label>Batch No</label><input id="imBatch" placeholder="Batch number"></div>
   </div>
   <div class="formrow four">
    <div class="field"><label>Sale Rate / MRP ₹</label><input id="imRate" type="number" min="0" step=".01" value="0"></div>
    <div class="field"><label>Purchase Rate ₹</label><input id="imPurchaseRate" type="number" min="0" step=".01" value="0"></div>
    <div class="field"><label>GST %</label><input id="imTax" type="number" min="0" step=".01" value="0"></div>
    <div class="field"><label>Opening Stock</label><input id="imStock" type="number" step=".001" value="0"></div>
   </div>
   <div class="formrow two">
    <div class="field"><label>Unit</label><select id="imUnit"><option>PCS</option><option>BOX</option><option>STRIP</option><option>BOTTLE</option><option>KG</option><option>GM</option><option>LTR</option><option>PACK</option></select></div>
    <div class="field"><label>Company / Brand</label><input id="imCompany"></div>
   </div>
   <div class="bill-buttons"><button class="btn primary" type="submit">Save Item</button><button class="btn" type="button" onclick="closeItemModal()">Cancel</button></div>
  </form>
 </div>
</div>

<script>
"use strict";
const STORE_KEY="shree_erp_purple_v2";
const $=id=>document.getElementById(id);
const money=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
let currentView="dashboard",billLines=[],editingBillType="retail",searchTerm="",editingPartyId=null;
function emptyData(){return {company:{name:"SHREE ERP",address:"",mobile:"",gstin:"",invoicePrefix:"SR"},items:[],parties:[],bills:[],receipts:[],payments:[],purchases:[]}}
function loadData(){
 let d;
 try{d=JSON.parse(localStorage.getItem(STORE_KEY)||"null")}catch(e){}
 if(!d||typeof d!=="object")d=emptyData();
 const base=emptyData();
 for(const k of Object.keys(base))if(d[k]===undefined||d[k]===null)d[k]=base[k];
 if(!Array.isArray(d.items))d.items=[];
 if(!Array.isArray(d.parties))d.parties=[];
 for(const k of ["bills","receipts","payments","purchases"])if(!Array.isArray(d[k]))d[k]=[];
 d.items=d.items.map(x=>({...x,id:x.id||uid(),pack:x.pack||x.packSize||"",batch:x.batch||x.batchNo||"",company:x.company||"",purchaseRate:Number(x.purchaseRate)||0,rate:Number(x.rate??x.saleRate)||0,tax:Number(x.tax??x.gst)||0,stock:Number(x.stock??x.openingStock)||0,unit:x.unit||"PCS"}));
 d.parties=d.parties.map(x=>({...x,id:x.id||uid(),name:x.name||"",type:x.type||"Customer",mobile:x.mobile||"",gstin:x.gstin||"",address:x.address||"",contact:x.contact||x.contactPerson||"",drug:x.drug||x.drugLicence||""}));
 return d;
}
let db=loadData();
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(db))}
function go(view,el){
 currentView=view;
 document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.view===view));
 render();
}
function head(title,subtitle,actions=""){return `<div class="pagehead"><div><h2>${title}</h2><div class="sub">${subtitle||""}</div></div><div class="toolbar">${actions}</div></div>`}
function stat(label,value,icon){return `<div class="stat"><div class="slabel">${label}</div><div class="snum">${value}</div><div class="sicon">${icon}</div></div>`}
function table(headers,rows,empty="কোনও তথ্য নেই"){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${headers.length}">${empty}</td></tr>`}</tbody></table></div>`}
function render(){
 const app=$("app");
 const views={dashboard:renderDashboard,items:renderItems,parties:renderParties,retail:()=>renderBill("retail"),wholesale:()=>renderBill("wholesale"),purchase:renderPurchase,receipt:()=>renderMoney("receipt"),payment:()=>renderMoney("payment"),reports:renderReports,company:renderCompany,settings:renderSettings};
 app.innerHTML=(views[currentView]||renderDashboard)();
}
function renderDashboard(){
 const sales=db.bills.reduce((s,b)=>s+(Number(b.total)||0),0);
 const stockValue=db.items.reduce((s,i)=>s+(Number(i.stock)||0)*(Number(i.purchaseRate)||0),0);
 const todaySales=db.bills.filter(b=>b.date===today()).reduce((s,b)=>s+(Number(b.total)||0),0);
 return head("Business Dashboard","Welcome to SHREE ERP","<button class='btn primary' onclick=\"go('retail')\">＋ New Retail Bill</button><button class='btn' onclick=\"go('items')\">＋ Add Item</button>")+
 `<div class="stats">${stat("Total Sales",money(sales),"🧾")}${stat("Today's Sales",money(todaySales),"📈")}${stat("Total Products",db.items.length,"📦")}${stat("Stock Value",money(stockValue),"🏷️")}</div>
 <div class="panel"><h3>Quick Access</h3><div class="quickgrid">
 <button class="quick" onclick="go('retail')"><span>🧾</span><b>Retail Billing</b></button>
 <button class="quick" onclick="go('wholesale')"><span>📦</span><b>Wholesale Billing</b></button>
 <button class="quick" onclick="openItemModal()"><span>🧴</span><b>New Item</b></button>
 <button class="quick" onclick="openPartyModal()"><span>👤</span><b>New Customer (F2)</b></button>
 <button class="quick" onclick="go('purchase')"><span>🛒</span><b>Stock Purchase</b></button>
 <button class="quick" onclick="go('receipt')"><span>💵</span><b>Money Receipt</b></button>
 <button class="quick" onclick="go('reports')"><span>📊</span><b>Reports</b></button>
 <button class="quick" onclick="backupData()"><span>⬇️</span><b>Backup Data</b></button></div></div>
 <div class="panel"><h3>Recent Bills</h3>${table(["Bill No","Date","Customer","Type","Payment","Amount"],db.bills.slice().reverse().slice(0,8).map(b=>`<tr><td>${esc(b.no)}</td><td>${esc(b.date)}</td><td>${esc(b.customerName||"Cash Customer")}</td><td><span class="pill">${esc(b.type||"Retail")}</span></td><td>${esc(b.payment||"Cash")}</td><td>${money(b.total)}</td></tr>`).join(""))}</div>`;
}
function renderItems(){
 let list=db.items.filter(i=>(i.name+" "+i.code+" "+i.company+" "+i.batch).toLowerCase().includes(searchTerm.toLowerCase()));
 return head("Item Master","Manage products, rates, tax, batch and stock",`<button class="btn primary" onclick="openItemModal()">＋ Add Item</button><button class="btn" onclick="exportCSV('items')">Export CSV</button>`)+
 `<div class="panel"><div class="toolbar"><input placeholder="Search item / code / batch..." value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()"><span class="pill">${list.length} Items</span></div>${table(["Product","Code","Pack","Batch","Company","Rate","GST","Stock","Unit","Action"],list.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td>${esc(i.code)}</td><td>${esc(i.pack)}</td><td>${esc(i.batch)}</td><td>${esc(i.company)}</td><td>${money(i.rate)}</td><td>${Number(i.tax)||0}%</td><td>${Number(i.stock)||0}</td><td>${esc(i.unit)}</td><td><button class="btn small" onclick="editItem('${i.id}')">Edit</button> <button class="btn small red" onclick="deleteItem('${i.id}')">Delete</button></td></tr>`).join(""))}</div>`;
}
function openItemModal(id){
 const i=db.items.find(x=>x.id===id)||{};
 $("itemForm").reset();$("itemEditId").value=id||"";
 $("itemModalTitle").textContent=id?"Edit Item":"Add New Item";
 $("imName").value=i.name||"";$("imCode").value=i.code||"";
 $("imPack").value=i.pack||"";$("imBatch").value=i.batch||"";
 $("imRate").value=i.rate??0;$("imPurchaseRate").value=i.purchaseRate??0;
 $("imTax").value=i.tax??0;$("imStock").value=i.stock??0;
 $("imUnit").value=i.unit||"PCS";$("imCompany").value=i.company||"";
 $("itemModal").classList.add("show");setTimeout(()=>$("imName").focus(),60);
}
function closeItemModal(){$("itemModal").classList.remove("show")}
function editItem(id){openItemModal(id)}
function deleteItem(id){if(!confirm("এই item delete করবেন?"))return;db.items=db.items.filter(i=>i.id!==id);save();render()}
$("itemForm").addEventListener("submit",e=>{
 e.preventDefault();const id=$("itemEditId").value,old=db.items.find(i=>i.id===id);
 const item={id:id||uid(),name:$("imName").value.trim(),code:$("imCode").value.trim(),pack:$("imPack").value.trim(),batch:$("imBatch").value.trim(),rate:Number($("imRate").value)||0,purchaseRate:Number($("imPurchaseRate").value)||0,tax:Number($("imTax").value)||0,stock:Number($("imStock").value)||0,unit:$("imUnit").value,company:$("imCompany").value.trim()};
 if(old)Object.assign(old,item);else db.items.push(item);
 save();closeItemModal();render();
});
function renderParties(){
 const list=db.parties.filter(p=>(p.name+" "+p.mobile+" "+p.gstin+" "+p.address).toLowerCase().includes(searchTerm.toLowerCase()));
 return head("Party Master","Customers and suppliers",`<button class="btn primary" onclick="openPartyModal()">＋ New Party (F2)</button><button class="btn" onclick="exportCSV('parties')">Export CSV</button>`)+
 `<div class="panel"><div class="toolbar"><input placeholder="Search party / mobile..." value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()"><span class="pill">${list.length} Parties</span></div>${table(["Name","Type","Mobile","GSTIN / Reg No","Address","Action"],list.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.type)}</td><td>${esc(p.mobile)}</td><td>${esc(p.gstin)}</td><td>${esc(p.address)}</td><td><button class="btn small" onclick="openPartyModal('${p.id}')">Edit (F3)</button> <button class="btn small red" onclick="deleteParty('${p.id}')">Delete</button></td></tr>`).join(""))}</div>`;
}
function openPartyModal(id){
 const p=db.parties.find(x=>x.id===id)||{};
 $("partyForm").reset();$("partyEditId").value=id||"";
 $("partyModalTitle").textContent=id?"Edit Party (F3)":"New Customer (F2)";
 $("pmName").value=p.name||"";$("pmType").value=p.type||"Customer";
 $("pmMobile").value=p.mobile||"";$("pmGstin").value=p.gstin||"";
 $("pmContact").value=p.contact||"";$("pmDrug").value=p.drug||"";
 $("pmAddress").value=p.address||"";
 $("partyModal").classList.add("show");setTimeout(()=>$("pmName").focus(),60);
}
function closePartyModal(){$("partyModal").classList.remove("show")}
function deleteParty(id){if(!confirm("এই party delete করবেন?"))return;db.parties=db.parties.filter(p=>p.id!==id);save();render()}
$("partyForm").addEventListener("submit",e=>{
 e.preventDefault();const id=$("partyEditId").value,old=db.parties.find(p=>p.id===id);
 const p={id:id||uid(),name:$("pmName").value.trim(),type:$("pmType").value,mobile:$("pmMobile").value.trim(),gstin:$("pmGstin").value.trim(),contact:$("pmContact").value.trim(),drug:$("pmDrug").value.trim(),address:$("pmAddress").value.trim()};
 if(old)Object.assign(old,p);else db.parties.push(p);
 save();closePartyModal();render();
});
function partyOptions(selected=""){
 return `<option value="">-- Cash Customer / Select Party --</option>`+db.parties.filter(p=>p.type!=="Supplier").map(p=>`<option value="${p.id}" ${p.id===selected?"selected":""}>${esc(p.name)}${p.mobile?" - "+esc(p.mobile):""}</option>`).join("");
}
function billNo(type){
 const prefix=type==="retail"?"SR":"SW";
 const arr=db.bills.filter(b=>b.type===type);
 return prefix+"-"+String(arr.length+1).padStart(5,"0");
}
function renderBill(type){
 editingBillType=type;
 if(!billLines.length)billLines=[newLine()];
 const title=type==="retail"?"Bill-Retail":"Bill-Wholesale";
 return head(title,"MARG-style multi-product billing • F2 Customer • F3 Edit Customer",`<button class="btn" onclick="openPartyModal()">＋ Customer (F2)</button><button class="btn" onclick="resetBill()">New Bill (Esc)</button>`)+
 `<div class="notice">কোনও product বেছে নিলে Item Master থেকে Pack, Batch, Rate ও GST auto-fill হবে। এক বিলে একাধিক product যোগ করতে পারবেন।</div>
 <div class="panel"><h3>Bill Information</h3>
 <div class="bill-top">
  <div class="field"><label>Bill No</label><input id="billNo" value="${esc(billNo(type))}"></div>
  <div class="field"><label>Cash / Credit</label><select id="billPayment"><option>Cash</option><option>Credit</option><option>UPI</option><option>Card</option><option>Bank</option></select></div>
  <div class="field"><label>Date</label><input id="billDate" type="date" value="${today()}"></div>
 </div>
 <div class="bill-customer">
  <div class="field"><label>Name (Customer)</label><select id="billParty" onchange="selectBillParty()">${partyOptions()}</select></div>
  <div class="field"><label>Address</label><input id="billAddress" placeholder="Customer address"></div>
 </div>
 <div class="bill-customer second">
  <div class="field"><label>Mob No</label><input id="billMobile" placeholder="Mobile number"></div>
  <div class="field"><label>Reg No / GSTIN</label><input id="billGstin" placeholder="GSTIN / Registration"></div>
 </div>
 </div>
 <div class="panel"><div class="pagehead"><div><h3>Product Details</h3><div class="sub">Product | Pack | Batch | Qty | Rate | Tax | Amount</div></div><button class="btn primary" onclick="addBillLine()">＋ Add Product Row</button></div>
 <div class="tablewrap"><table class="bill-grid"><thead><tr><th>#</th><th>Product</th><th>Pack</th><th>Batch</th><th>Qty</th><th>Rate ₹</th><th>Tax %</th><th>Amount ₹</th><th></th></tr></thead><tbody id="billRows">${billLines.map((l,i)=>billRow(l,i)).join("")}</tbody></table></div>
 <div class="bill-summary"><div class="summary-box"><div class="sumrow"><span>Subtotal</span><b id="sumSub">₹0.00</b></div><div class="sumrow"><span>GST / Tax</span><b id="sumTax">₹0.00</b></div><div class="sumrow total"><span>Net Amount</span><span id="sumTotal">₹0.00</span></div></div></div>
 <div class="bill-buttons"><button class="btn green" onclick="saveBill()">✓ Save Bill</button><button class="btn primary" onclick="saveBill(true)">Save & New</button><button class="btn" onclick="resetBill()">Clear / New Bill (Esc)</button></div>
 </div>
 <div class="panel"><h3>Recent ${type==="retail"?"Retail":"Wholesale"} Bills</h3>${table(["Bill No","Date","Customer","Items","Payment","Total"],db.bills.filter(b=>b.type===type).slice().reverse().slice(0,10).map(b=>`<tr><td>${esc(b.no)}</td><td>${esc(b.date)}</td><td>${esc(b.customerName||"Cash Customer")}</td><td>${(b.lines||[]).length||1}</td><td>${esc(b.payment)}</td><td><b>${money(b.total)}</b></td></tr>`).join(""))}</div>`;
}
function newLine(){return {itemId:"",pack:"",batch:"",qty:1,rate:0,tax:0,amount:0}}
function billRow(l,i){
 const opts=`<option value="">-- Select Product --</option>`+db.items.map(it=>`<option value="${it.id}" ${it.id===l.itemId?"selected":""}>${esc(it.name)}${it.code?" ("+esc(it.code)+")":""}</option>`).join("");
 return `<tr>
 <td>${i+1}</td>
 <td><select class="product-select" data-line="${i}" data-key="itemId" onchange="changeBillItem(${i},this.value)">${opts}</select></td>
 <td><input data-line="${i}" data-key="pack" value="${esc(l.pack)}" onchange="changeLine(${i},'pack',this.value)"></td>
 <td><input data-line="${i}" data-key="batch" value="${esc(l.batch)}" onchange="changeLine(${i},'batch',this.value)"></td>
 <td><input class="num" data-line="${i}" data-key="qty" type="number" min="0" step=".001" value="${l.qty}" onchange="changeLine(${i},'qty',this.value)" oninput="changeLine(${i},'qty',this.value)"></td>
 <td><input class="num" data-line="${i}" data-key="rate" type="number" min="0" step=".01" value="${l.rate}" onchange="changeLine(${i},'rate',this.value)" oninput="changeLine(${i},'rate',this.value)"></td>
 <td><input class="num" data-line="${i}" data-key="tax" type="number" min="0" step=".01" value="${l.tax}" onchange="changeLine(${i},'tax',this.value)" oninput="changeLine(${i},'tax',this.value)"></td>
 <td class="amount-cell" id="lineAmount${i}">${money(lineAmount(l))}</td>
 <td class="delcell"><button class="btn small red" onclick="removeBillLine(${i})">×</button></td></tr>`;
}
function lineAmount(l){return (Number(l.qty)||0)*(Number(l.rate)||0)}
function lineTax(l){return lineAmount(l)*(Number(l.tax)||0)/100}
function changeBillItem(index,id){
 const it=db.items.find(x=>x.id===id);
 billLines[index].itemId=id;
 if(it){billLines[index].pack=it.pack||"";billLines[index].batch=it.batch||"";billLines[index].rate=Number(it.rate)||0;billLines[index].tax=Number(it.tax)||0}
 renderBillRows();
}
function changeLine(i,key,val){if(!billLines[i])return;billLines[i][key]=["qty","rate","tax"].includes(key)?(Number(val)||0):val;updateBillTotals()}
function renderBillRows(){const body=$("billRows");if(body)body.innerHTML=billLines.map((l,i)=>billRow(l,i)).join("");updateBillTotals()}
function addBillLine(){billLines.push(newLine());renderBillRows();const els=document.querySelectorAll('#billRows select.product-select');if(els.length)els[els.length-1].focus()}
function removeBillLine(i){if(billLines.length===1){billLines=[newLine()]}else billLines.splice(i,1);renderBillRows()}
function updateBillTotals(){
 let sub=0,tax=0;
 billLines.forEach((l,i)=>{sub+=lineAmount(l);tax+=lineTax(l);const cell=$("lineAmount"+i);if(cell)cell.textContent=money(lineAmount(l))});
 if($("sumSub"))$("sumSub").textContent=money(sub);
 if($("sumTax"))$("sumTax").textContent=money(tax);
 if($("sumTotal"))$("sumTotal").textContent=money(sub+tax);
}
function selectBillParty(){
 const p=db.parties.find(x=>x.id===$("billParty").value);
 if(!p)return;
 $("billAddress").value=p.address||"";$("billMobile").value=p.mobile||"";$("billGstin").value=p.gstin||"";
}
function resetBill(){
 billLines=[newLine()];render();
}
function saveBill(saveNew=false){
 const lines=billLines.filter(l=>l.itemId&&Number(l.qty)>0);
 if(!lines.length){alert("কমপক্ষে একটি product এবং Qty দিন।");return}
 for(const l of lines){const it=db.items.find(i=>i.id===l.itemId);if(!it){alert("একটি product আর পাওয়া যাচ্ছে না।");return}if(Number(it.stock)<Number(l.qty)){if(!confirm(`${it.name}: stock ${it.stock}, bill quantity ${l.qty}। তবুও save করবেন?`))return}}
 const party=db.parties.find(p=>p.id===$("billParty").value);
 const sub=lines.reduce((s,l)=>s+lineAmount(l),0);
 const tax=lines.reduce((s,l)=>s+lineTax(l),0);
 const bill={id:uid(),type:editingBillType,no:$("billNo").value.trim()||billNo(editingBillType),date:$("billDate").value||today(),payment:$("billPayment").value,partyId:party?.id||"",customerName:party?.name||"Cash Customer",address:$("billAddress").value,mobile:$("billMobile").value,gstin:$("billGstin").value,lines:lines.map(l=>({...l,qty:Number(l.qty)||0,rate:Number(l.rate)||0,tax:Number(l.tax)||0,amount:lineAmount(l)})),subtotal:sub,tax,total:sub+tax};
 db.bills.push(bill);
 lines.forEach(l=>{const it=db.items.find(i=>i.id===l.itemId);if(it)it.stock=(Number(it.stock)||0)-(Number(l.qty)||0)});
 save();
 alert("Bill saved successfully! Total: "+money(bill.total));
 if(saveNew){billLines=[newLine()];render()}else{billLines=[newLine()];render()}
}
function renderPurchase(){
 return head("Purchase / Stock In","Purchase entry and stock update",`<button class="btn" onclick="go('items')">Item Master</button>`)+
 `<div class="panel"><h3>New Purchase Entry</h3><form id="purchaseForm">
 <div class="formrow"><div class="field"><label>Purchase No</label><input id="purNo" value="PUR-${String(db.purchases.length+1).padStart(5,"0")}"></div><div class="field"><label>Date</label><input id="purDate" type="date" value="${today()}"></div><div class="field"><label>Supplier</label><select id="purParty">${`<option value="">Select Supplier</option>`+db.parties.filter(p=>p.type!=="Customer").map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div></div>
 <div class="formrow"><div class="field"><label>Product</label><select id="purItem" required>${`<option value="">Select Item</option>`+db.items.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join("")}</select></div><div class="field"><label>Quantity</label><input id="purQty" type="number" min=".001" step=".001" value="1" required></div><div class="field"><label>Purchase Rate ₹</label><input id="purRate" type="number" min="0" step=".01" value="0" required></div></div>
 <div class="bill-buttons"><button class="btn primary">Save Purchase & Add Stock</button></div></form></div>
 <div class="panel"><h3>Purchase History</h3>${table(["Purchase No","Date","Supplier","Product","Qty","Rate","Total"],db.purchases.slice().reverse().map(p=>`<tr><td>${esc(p.no)}</td><td>${esc(p.date)}</td><td>${esc(p.supplierName)}</td><td>${esc(p.itemName)}</td><td>${p.qty}</td><td>${money(p.rate)}</td><td>${money(p.total)}</td></tr>`).join(""))}</div>`;
}
document.addEventListener("change",e=>{if(e.target.id==="purItem"){const it=db.items.find(i=>i.id===e.target.value);if(it)$("purRate").value=it.purchaseRate||it.rate||0}});
document.addEventListener("submit",e=>{
 if(e.target.id!=="purchaseForm")return;e.preventDefault();
 const it=db.items.find(i=>i.id===$("purItem").value);if(!it){alert("Product select করুন");return}
 const party=db.parties.find(p=>p.id===$("purParty").value);
 const qty=Number($("purQty").value)||0,rate=Number($("purRate").value)||0;
 if(qty<=0){alert("সঠিক quantity দিন");return}
 it.stock=(Number(it.stock)||0)+qty;it.purchaseRate=rate;
 db.purchases.push({id:uid(),no:$("purNo").value,date:$("purDate").value||today(),partyId:party?.id||"",supplierName:party?.name||"Supplier",itemId:it.id,itemName:it.name,qty,rate,total:qty*rate});
 save();alert("Purchase saved; stock updated.");render();
});
function renderMoney(type){
 const arr=db[type+"s"]||[],isReceipt=type==="receipt";
 const title=isReceipt?"Receipt Entry":"Payment Entry";
 return head(title,isReceipt?"Customer থেকে টাকা নেওয়া":"Supplier / expense payment",`<button class="btn" onclick="go('parties')">Party Master</button>`)+
 `<div class="panel"><h3>${title}</h3><form id="moneyForm" data-type="${type}">
 <div class="formrow"><div class="field"><label>Voucher No</label><input id="moneyNo" value="${(isReceipt?"REC-":"PAY-")+String(arr.length+1).padStart(5,"0")}"></div><div class="field"><label>Date</label><input id="moneyDate" type="date" value="${today()}"></div><div class="field"><label>Party</label><select id="moneyParty"><option value="">Select Party</option>${db.parties.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div></div>
 <div class="formrow two"><div class="field"><label>Amount ₹</label><input id="moneyAmount" type="number" min=".01" step=".01" required></div><div class="field"><label>Payment Mode</label><select id="moneyMode"><option>Cash</option><option>UPI</option><option>Bank</option><option>Card</option><option>Other</option></select></div></div>
 <div class="field"><label>Narration</label><input id="moneyNote" placeholder="Details (optional)"></div><div class="bill-buttons"><button class="btn primary">Save Voucher</button></div></form></div>
 <div class="panel"><h3>${title} History</h3>${table(["Voucher","Date","Party","Mode","Narration","Amount"],arr.slice().reverse().map(r=>`<tr><td>${esc(r.no)}</td><td>${esc(r.date)}</td><td>${esc(r.partyName)}</td><td>${esc(r.mode)}</td><td>${esc(r.note)}</td><td>${money(r.amount)}</td></tr>`).join(""))}</div>`;
}
document.addEventListener("submit",e=>{
 if(!["receipt","payment"].includes(e.target.dataset.type))return;
 e.preventDefault();const type=e.target.dataset.type,p=db.parties.find(x=>x.id===$("moneyParty").value),amount=Number($("moneyAmount").value)||0;
 if(amount<=0){alert("Amount দিন");return}
 db[type+"s"].push({id:uid(),no:$("moneyNo").value,date:$("moneyDate").value||today(),partyId:p?.id||"",partyName:p?.name||"Cash / Other",amount,mode:$("moneyMode").value,note:$("moneyNote").value});
 save();alert("Voucher saved");render();
});
function renderReports(){
 const sales=db.bills.reduce((s,b)=>s+(Number(b.total)||0),0);
 const purchase=db.purchases.reduce((s,p)=>s+(Number(p.total)||0),0);
 return head("Report Centre","Sales, stock and transaction summary",`<button class="btn" onclick="exportCSV('bills')">Export Bills CSV</button><button class="btn" onclick="backupData()">Backup JSON</button>`)+
 `<div class="stats">${stat("Total Bills",db.bills.length,"🧾")}${stat("Sales Total",money(sales),"📈")}${stat("Purchase Total",money(purchase),"🛒")}${stat("Low Stock (≤5)",db.items.filter(i=>Number(i.stock)<=5).length,"⚠️")}</div>
 <div class="panel"><h3>Sales Register</h3>${table(["Bill No","Date","Customer","Type","Items","Subtotal","Tax","Total"],db.bills.slice().reverse().map(b=>`<tr><td>${esc(b.no)}</td><td>${esc(b.date)}</td><td>${esc(b.customerName)}</td><td>${esc(b.type)}</td><td>${(b.lines||[]).length}</td><td>${money(b.subtotal??b.total)}</td><td>${money(b.tax)}</td><td><b>${money(b.total)}</b></td></tr>`).join(""))}</div>
 <div class="panel"><h3>Stock Report</h3>${table(["Product","Code","Batch","Stock","Unit","Sale Rate","Stock Value"],db.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.code)}</td><td>${esc(i.batch)}</td><td>${i.stock}</td><td>${esc(i.unit)}</td><td>${money(i.rate)}</td><td>${money((Number(i.stock)||0)*(Number(i.purchaseRate)||0))}</td></tr>`).join(""))}</div>`;
}
function renderCompany(){
 const c=db.company;
 return head("Company Profile","Configure business identity and invoice details")+
 `<div class="panel"><h3>Company Details</h3><form id="companyForm">
 <div class="formrow two"><div class="field"><label>Company / Shop Name</label><input id="coName" value="${esc(c.name)}" required></div><div class="field"><label>Mobile</label><input id="coMobile" value="${esc(c.mobile)}"></div></div>
 <div class="formrow two"><div class="field"><label>GSTIN</label><input id="coGstin" value="${esc(c.gstin)}"></div><div class="field"><label>Invoice Prefix</label><input id="coPrefix" value="${esc(c.invoicePrefix||"SR")}"></div></div>
 <div class="field"><label>Address</label><textarea id="coAddress" rows="3">${esc(c.address)}</textarea></div><div class="bill-buttons"><button class="btn primary">Save Company Details</button></div></form></div>`;
}
document.addEventListener("submit",e=>{
 if(e.target.id!=="companyForm")return;e.preventDefault();
 db.company={name:$("coName").value.trim(),mobile:$("coMobile").value.trim(),gstin:$("coGstin").value.trim(),invoicePrefix:$("coPrefix").value.trim(),address:$("coAddress").value.trim()};
 save();alert("Company details saved");render();
});
function renderSettings(){
 return head("Settings","Local data management and backup")+
 `<div class="panel"><h3>Backup & Restore</h3><p class="sub">Backup JSON ফাইল ডাউনলোড করে রাখুন। Restore করলে বর্তমান ডেটা বদলে যাবে।</p><div class="bill-buttons"><button class="btn primary" onclick="backupData()">⬇ Download Full Backup</button><label class="btn">⬆ Restore Backup<input type="file" accept=".json,application/json" style="display:none" onchange="restoreData(this)"></label></div></div>
 <div class="panel"><h3>Data Overview</h3>${table(["Data Type","Count"],[["Items",db.items.length],["Parties",db.parties.length],["Bills",db.bills.length],["Purchases",db.purchases.length],["Receipts",db.receipts.length],["Payments",db.payments.length]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join(""))}</div>
 <div class="panel"><h3>Danger Zone</h3><p class="sub">Demo data মুছে ফেললে এই browser-এর ERP data মুছে যাবে। আগে backup নিন।</p><button class="btn red" onclick="clearData()">Clear All ERP Data</button></div>`;
}
function backupData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="shree-erp-backup-"+today()+".json";a.click();URL.revokeObjectURL(url);
}
function restoreData(input){
 const file=input.files?.[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!d||!Array.isArray(d.items)||!Array.isArray(d.parties))throw Error("Invalid");if(!confirm("বর্তমান data backup দিয়ে replace করবেন?"))return;db={...emptyData(),...d};save();alert("Backup restored");render()}catch(e){alert("Backup file সঠিক নয়।")}};
 reader.readAsText(file);
}
function clearData(){
 if(!confirm("সতর্কতা: সব ERP data মুছে যাবে। এগোবেন?"))return;
 if(!confirm("শেষবার নিশ্চিত করুন — আগে backup নিয়েছেন?"))return;
 db=emptyData();save();searchTerm="";billLines=[newLine()];go("dashboard");
}
function exportCSV(kind){
 const rows=kind==="items"?db.items:kind==="parties"?db.parties:db.bills;
 if(!rows.length){alert("Export করার data নেই");return}
 const flat=rows.map(r=>kind==="bills"?{billNo:r.no,date:r.date,customer:r.customerName,type:r.type,payment:r.payment,subtotal:r.subtotal,tax:r.tax,total:r.total}:r);
 const keys=[...new Set(flat.flatMap(o=>Object.keys(o).filter(k=>typeof o[k]!=="object")))];
 const csv=[keys.join(","),...flat.map(o=>keys.map(k=>`"${String(o[k]??"").replace(/"/g,'""')}"`).join(","))].join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="shree-erp-"+kind+".csv";a.click();URL.revokeObjectURL(a.href);
}
function globalSearch(v){
 searchTerm=v;
 if(!v.trim())return;
 const q=v.toLowerCase();
 if(db.items.some(i=>(i.name+" "+i.code).toLowerCase().includes(q)))go("items");
 else if(db.parties.some(p=>(p.name+" "+p.mobile).toLowerCase().includes(q)))go("parties");
}
document.addEventListener("keydown",e=>{
 const modalParty=$("partyModal").classList.contains("show");
 const modalItem=$("itemModal").classList.contains("show");
 if(e.key==="Escape"){
  if(modalParty)closePartyModal();else if(modalItem)closeItemModal();else if(["retail","wholesale"].includes(currentView))resetBill();
  return;
 }
 if(modalParty||modalItem)return;
 if(e.key==="F2"){e.preventDefault();openPartyModal();return}
 if(e.key==="F3"){e.preventDefault();if(currentView==="retail"||currentView==="wholesale"){const id=$("billParty")?.value;if(id)openPartyModal(id);else openPartyModal()}else openPartyModal();return}
 if(e.key==="Enter"&&["retail","wholesale"].includes(currentView)){
  const el=e.target;
  if(el.matches("input,select")&&!el.matches("button")){
   const fields=[...document.querySelectorAll("#app input:not([readonly]),#app select,#app button")].filter(x=>!x.disabled&&x.offsetParent!==null);
   const idx=fields.indexOf(el);if(idx>=0&&fields[idx+1]){e.preventDefault();fields[idx+1].focus()}
  }
 }
});
function init(){
 billLines=[newLine()];
 if(!localStorage.getItem(STORE_KEY))save();
 render();
}
init();
</script>
</body>
</html>
